[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
inject_facts_as_vars = False
deprecation_warnings = False

# Performance optimizations
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400
callbacks_enabled = profile_tasks

# Output formatting (ansible-core 2.13+)
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True

# Reduce internal polling interval for faster async operations
internal_poll_interval = 0.001
# Allow playbook to continue on errors (handled per-task)
any_errors_fatal = False

# Mitogen strategy for 40-70% speed improvement
# Install with: pip install mitogen ansible-mitogen
# Automatically enabled in CI via ANSIBLE_STRATEGY env var
strategy = mitogen_linear

[ssh_connection]
# SSH pipelining - major speed improvement
pipelining = True
# Persistent SSH connections - increased persistence for batch operations
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey -o ServerAliveInterval=30
# Reduce SSH connection time
control_path_dir = /tmp/ansible_ssh_control
# Transfer optimizations
transfer_method = smart
retries = 2

[privilege_escalation]
become = True
become_method = sudo
become_user = root
