---
# Backup-to-Ugreen keypair
# ============================================================================
# One keypair, generated once here (nuc), consumed by every backup-source host
# (mljr via roles/backup, nas via roles/unraid-backup) and authorized on
# ugreen for nothing but SFTP into a chrooted directory - see
# roles/backup-remote-target. Same cross-play hostvars pattern
# roles/healthreport already uses for the facts-endpoint key.
# ============================================================================

- name: Ensure the backup-remote key directory exists
  ansible.builtin.file:
    path: /opt/backup-remote/ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the backup-to-ugreen keypair
  community.crypto.openssh_keypair:
    path: /opt/backup-remote/ssh/id_ed25519
    type: ed25519
    comment: homelab-backup-to-ugreen
    owner: root
    group: root
    mode: "0600"
    regenerate: never
  register: backup_remote_key

- name: Read the private key so it can cross to other hosts via hostvars
  ansible.builtin.slurp:
    src: /opt/backup-remote/ssh/id_ed25519
  register: backup_remote_privkey_raw
  when: not ansible_check_mode

- name: Publish the keypair for other backup-source hosts and for ugreen
  ansible.builtin.set_fact:
    backup_remote_pubkey: "{{ backup_remote_key.public_key | default('') }}"
    backup_remote_privkey: >-
      {{ (backup_remote_privkey_raw.content | b64decode)
         if (backup_remote_privkey_raw.content is defined) else '' }}
