---
# Keycloak role defaults

# Installation paths
keycloak_install_path: "{{ base_path }}/keycloak"

# Keycloak configuration
keycloak_realm: "homelab"
keycloak_client_id: "oauth2-proxy"
keycloak_admin_user: "admin"
keycloak_hostname: "auth.mljr.eu"
keycloak_port: 9732

# Internal URL for API calls (localhost since we run on the same host)
keycloak_internal_url: "http://localhost:{{ keycloak_port }}"

# Health check configuration
keycloak_health_timeout: 300  # 5 minutes total
keycloak_health_delay: 5      # seconds between retries

# Client configuration
keycloak_redirect_uris:
  - "https://*.mljr.eu/oauth2/callback"
keycloak_web_origins:
  - "https://*.mljr.eu"
keycloak_post_logout_uris: "https://*.mljr.eu/*"
