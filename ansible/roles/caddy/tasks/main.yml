---
- name: Install Caddy (Rocky/RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  block:
    - name: Install DNF plugins
      ansible.builtin.dnf:
        name: 'dnf-command(copr)'
        state: present

    - name: Enable Caddy COPR
      ansible.builtin.command: dnf copr enable -y @caddy/caddy
      args:
        creates: >-
          /etc/yum.repos.d/
          _copr:copr.fedorainfracloud.org:group_caddy:caddy.repo

    - name: Install Caddy
      ansible.builtin.dnf:
        name: caddy
        state: present

- name: Install Caddy (Debian/Ubuntu)
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: true

    - name: Download Caddy GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /tmp/caddy.gpg
        mode: '0644'

    - name: Dearmor Caddy GPG key
      ansible.builtin.shell: >-
        set -o pipefail &&
        gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        /tmp/caddy.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        executable: /bin/bash

    - name: Download Caddy repository configuration
      ansible.builtin.get_url:
        url: >-
          https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
        dest: /etc/apt/sources.list.d/caddy-stable.list
        mode: '0644'

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy
  loop:
    - "{{ base_path }}/caddy"
    - "{{ base_path }}/caddy/site"

- name: Create Caddy log directory
  ansible.builtin.file:
    path: "{{ log_path }}/caddy"
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy
    setype: var_log_t

- name: Ensure Caddy can write to log directory (SELinux)
  ansible.builtin.command:
    cmd: restorecon -Rv {{ log_path }}/caddy
  changed_when: false
  failed_when: false
  when: ansible_selinux.status is defined and ansible_selinux.status == 'enabled'

- name: Determine basicauth-enabled services
  ansible.builtin.set_fact:
    basicauth_enabled_services: >-
      {%- set result = [] -%}
      {%- for service in (services | default([])) -%}
        {%- if service.enabled | default(true) and (service.caddy_auth | default('')) == 'basicauth' -%}
          {%- set _ = result.append(service) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Validate that all service hosts exist in inventory
  ansible.builtin.assert:
    that:
      - service.host is defined
      - service.host in hostvars
    fail_msg: >-
      Service '{{ service.name | default('unknown') }}' references host '{{ service.host | default('unset') }}'
      which is not present in the inventory. Fix 'services' in group_vars or add the host to inventory.
  loop: "{{ services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name | default('unknown') }}"
  when: service.enabled | default(true)

- name: Validate Caddy basicauth secrets when used
  ansible.builtin.assert:
    that:
      - secrets is defined
      - secrets.caddy is defined
      - (secrets.caddy.auth_user | default('') | length) > 0
      - (secrets.caddy.auth_hash | default('') | length) > 0
    fail_msg: >-
      One or more services use 'caddy_auth: basicauth' but Caddy auth secrets are missing.
      Set CADDY_AUTH_USER and CADDY_AUTH_PASSWORD_HASH in the environment used for Ansible.
  when: (basicauth_enabled_services | default([]) | length) > 0

- name: Generate Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ config_path }}/caddy/Caddyfile"
    owner: caddy
    group: caddy
    mode: '0644'
  notify: Reload Caddy

- name: Generate index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ base_path }}/caddy/site/index.html"
    owner: caddy
    group: caddy
    mode: '0644'

- name: Ensure Caddy service is running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

- name: Check for conflicting web servers
  ansible.builtin.service_facts:

- name: Stop conflicting web servers
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - httpd
    - nginx
    - apache2
  when: >-
    (item + '.service') in ansible_facts.services or
    item in ansible_facts.services
  failed_when: false

- name: Remove legacy Caddy container
  community.docker.docker_container:
    name: caddy
    state: absent
    force_kill: true
  failed_when: false
