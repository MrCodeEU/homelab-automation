---
- name: Install Caddy (Rocky/RedHat)
  block:
    - name: Install DNF plugins
      dnf:
        name: 'dnf-command(copr)'
        state: present

    - name: Enable Caddy COPR
      command: dnf copr enable -y @caddy/caddy
      args:
        creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:group_caddy:caddy.repo

    - name: Install Caddy
      dnf:
        name: caddy
        state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Install Caddy (Debian/Ubuntu)
  block:
    - name: Install prerequisites
      apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: yes

    - name: Add Caddy GPG key
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy repository
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
      args:
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Caddy
      apt:
        name: caddy
        state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Create Caddy directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy
  loop:
    - /opt/caddy
    - /opt/caddy/site
    - /opt/caddy/logs

- name: Generate Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: caddy
    group: caddy
    mode: '0644'
  notify: Reload Caddy

- name: Generate index.html
  template:
    src: index.html.j2
    dest: /opt/caddy/site/index.html
    owner: caddy
    group: caddy
    mode: '0644'

- name: Ensure Caddy service is running
  service:
    name: caddy
    state: started
    enabled: yes

- name: Check for conflicting web servers
  service_facts:

- name: Stop conflicting web servers
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - httpd
    - nginx
    - apache2
  when: "(item + '.service') in ansible_facts.services or item in ansible_facts.services"
  ignore_errors: yes

- name: Remove legacy Caddy container
  docker_container:
    name: caddy
    state: absent
    force_kill: yes
  ignore_errors: yes

