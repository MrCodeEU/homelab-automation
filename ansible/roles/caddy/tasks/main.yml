---
# Caddy Role - Rocky Linux only
# ============================================================================

- name: Install DNF plugins
  ansible.builtin.dnf:
    name: 'dnf-command(copr)'
    state: present

- name: Enable Caddy COPR
  ansible.builtin.command: dnf copr enable -y @caddy/caddy
  args:
    creates: >-
      /etc/yum.repos.d/
      _copr:copr.fedorainfracloud.org:group_caddy:caddy.repo

# Prioritise COPR over EPEL so we always get the latest Caddy, not the older EPEL build
- name: Set COPR repo priority higher than EPEL
  community.general.ini_file:
    path: "/etc/yum.repos.d/\
      _copr:copr.fedorainfracloud.org:group_caddy:caddy.repo"
    section: "copr:copr.fedorainfracloud.org:group_caddy:caddy"
    option: priority
    value: "1"
    mode: '0644'

- name: Install / upgrade Caddy to latest version
  ansible.builtin.dnf:
    name: caddy
    state: latest
  notify: Reload Caddy

- name: Check for conflicting web servers
  ansible.builtin.service_facts:

- name: Stop conflicting web servers
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - httpd
    - nginx
    - apache2
  when: >-
    (item + '.service') in ansible_facts.services or
    item in ansible_facts.services
  failed_when: false

- name: Remove legacy Caddy container
  community.docker.docker_container:
    name: caddy
    state: absent
    force_kill: true
  failed_when: false

- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Open HTTP port in firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Open HTTPS port in firewall
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy
  loop:
    - "{{ base_path }}/caddy"
    - "{{ base_path }}/caddy/site"
    - "/etc/caddy/conf.d"

- name: Create Caddy log directory
  ansible.builtin.file:
    path: "{{ log_path }}/caddy"
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy

- name: Ensure setgid bit is set so new files inherit caddy group
  ansible.builtin.file:
    path: "{{ log_path }}/caddy"
    state: directory
    mode: '2755'

- name: Set ACL on Caddy log directory so caddy user always has permissions
  ansible.posix.acl:
    path: "{{ log_path }}/caddy"
    entity: caddy
    etype: user
    permissions: rwx
    state: present

- name: Set default ACL on Caddy log directory so new files are accessible
  ansible.posix.acl:
    path: "{{ log_path }}/caddy"
    entity: caddy
    etype: user
    permissions: rwx
    default: true
    state: present

- name: Ensure existing log files have correct permissions
  ansible.builtin.shell: |
    chown -R caddy:caddy {{ log_path }}/caddy
    chmod -R 0755 {{ log_path }}/caddy
    setfacl -R -m u:caddy:rwx,m:rwx {{ log_path }}/caddy
    setfacl -d -m u:caddy:rwx,m:rwx {{ log_path }}/caddy
  changed_when: false
  failed_when: false
  # Note: Using shell here to fix permissions on existing files
  # log_path is a trusted variable from group_vars

- name: Set SELinux file context policy for Caddy logs
  community.general.sefcontext:
    target: "{{ log_path }}/caddy(/.*)?"
    setype: httpd_log_t
    state: present
  when: ansible_selinux.status is defined and ansible_selinux.status == 'enabled'

- name: Apply SELinux context to Caddy log directory
  ansible.builtin.command:
    cmd: restorecon -Rv {{ log_path }}/caddy
  changed_when: false
  failed_when: false
  when: ansible_selinux.status is defined and ansible_selinux.status == 'enabled'

- name: Determine basicauth-enabled services
  ansible.builtin.set_fact:
    basicauth_enabled_services: >-
      {%- set result = [] -%}
      {%- for service in (services | default([])) -%}
        {%- if service.enabled | default(true) and (service.caddy_auth | default('')) == 'basicauth' -%}
          {%- set _ = result.append(service) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Validate that all service hosts exist in inventory
  ansible.builtin.assert:
    that:
      - service.host is defined
      - service.host in hostvars
    fail_msg: >-
      Service '{{ service.name | default('unknown') }}' references host '{{ service.host | default('unset') }}'
      which is not present in the inventory. Fix 'services' in group_vars or add the host to inventory.
  loop: "{{ services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name | default('unknown') }}"
  when: service.enabled | default(true)

- name: Validate Caddy basicauth secrets when used
  ansible.builtin.assert:
    that:
      - secrets is defined
      - secrets.caddy is defined
      - (secrets.caddy.auth_user | default('') | length) > 0
      - (secrets.caddy.auth_hash | default('') | length) > 0
    fail_msg: >-
      One or more services use 'caddy_auth: basicauth' but Caddy auth secrets are missing.
      Set CADDY_AUTH_USER and CADDY_AUTH_PASSWORD_HASH in the environment used for Ansible.
  when: (basicauth_enabled_services | default([]) | length) > 0

- name: Create systemd override directory for Caddy
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: '0755'

- name: Install Caddy systemd override for Tailscale DNS
  ansible.builtin.template:
    src: caddy-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    mode: '0644'
  register: caddy_override_changed

- name: Reload systemd daemon if override changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: caddy_override_changed is changed

- name: Restart Caddy if systemd override changed
  when: caddy_override_changed is changed
  block:
    - name: Attempt to restart Caddy service
      ansible.builtin.service:
        name: caddy
        state: restarted

  rescue:
    - name: Get Caddy service status
      ansible.builtin.command: systemctl status caddy.service
      register: caddy_status
      failed_when: false
      changed_when: false

    - name: Get Caddy journal logs
      ansible.builtin.command: journalctl -xeu caddy.service -n 50 --no-pager
      register: caddy_journal
      failed_when: false
      changed_when: false

    - name: Display Caddy service status
      ansible.builtin.debug:
        msg: "{{ caddy_status.stdout_lines }}"

    - name: Display Caddy journal logs
      ansible.builtin.debug:
        msg: "{{ caddy_journal.stdout_lines }}"

    - name: Fail with detailed error message
      ansible.builtin.fail:
        msg: |
          Caddy failed to restart after systemd override change.
          See the systemctl status and journalctl output above for details.

- name: Generate shared Caddy snippets (auth macros)
  ansible.builtin.template:
    src: snippets.caddy.j2
    dest: /etc/caddy/conf.d/000-snippets.caddy
    owner: caddy
    group: caddy
    mode: '0644'
  notify: Reload Caddy

- name: Build list of enabled service names for Caddy
  ansible.builtin.set_fact:
    caddy_service_names: >-
      {%- set names = [] -%}
      {%- for service in (services | default([])) -%}
        {%- if service.enabled | default(true) and service.domain is defined -%}
          {%- set _ = names.append(service.name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ names }}

- name: Compute Caddy services checksum
  ansible.builtin.set_fact:
    caddy_services_hash: >-
      {{ (services | to_json + lookup('file', role_path + '/templates/service_snippet.caddy.j2')) | hash('sha256') }}

- name: Find existing Caddy snippet files
  ansible.builtin.find:
    paths: /etc/caddy/conf.d
    patterns: "*.caddy"
    excludes: "000-snippets.caddy"
  register: existing_snippets

- name: Build Caddy snippet reconciliation state
  ansible.builtin.set_fact:
    caddy_existing_service_names: "{{ existing_snippets.files | default([]) | map(attribute='path') | map('basename') | map('regex_replace', '\\.caddy$', '') | list }}"
    caddy_orphaned_service_names: "{{ (existing_snippets.files | default([]) | map(attribute='path') | map('basename') | map('regex_replace', '\\.caddy$', '') | list) | difference(caddy_service_names) }}"
    caddy_missing_service_names: "{{ caddy_service_names | difference(existing_snippets.files | default([]) | map(attribute='path') | map('basename') | map('regex_replace', '\\.caddy$', '') | list) }}"

- name: Remove orphaned Caddy snippet files
  ansible.builtin.file:
    path: "/etc/caddy/conf.d/{{ item }}.caddy"
    state: absent
  loop: "{{ caddy_orphaned_service_names }}"
  loop_control:
    label: "{{ item }}.caddy"
  notify: Reload Caddy

- name: Read stored Caddy services checksum
  ansible.builtin.slurp:
    src: /etc/caddy/conf.d/.services-checksum
  register: caddy_stored_checksum
  failed_when: false

- name: Set Caddy snippets stale flag
  ansible.builtin.set_fact:
    caddy_snippets_stale: >-
      {{ (force_regen_caddy | default(false) | bool) or
         (caddy_stored_checksum.failed | default(true)) or
         ((caddy_stored_checksum.content | default('') | b64decode | trim) != caddy_services_hash) or
         (caddy_missing_service_names | length > 0) }}

- name: Regenerate Caddy service snippets
  when: caddy_snippets_stale | bool
  block:
    - name: Ensure service log files exist with correct permissions (Production)
      ansible.builtin.file:
        path: "{{ log_path }}/caddy/{{ item.name }}.log"
        state: touch
        owner: caddy
        group: caddy
        mode: '0644'
        modification_time: preserve
        access_time: preserve
      loop: "{{ services | default([]) }}"
      when: item.enabled | default(true) and item.domain is defined
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure service log files exist with correct permissions (Staging)
      ansible.builtin.file:
        path: "{{ log_path }}/caddy/{{ item.name }}-staging.log"
        state: touch
        owner: caddy
        group: caddy
        mode: '0644'
        modification_time: preserve
        access_time: preserve
      loop: "{{ services | default([]) }}"
      when: >
        item.enabled | default(true) and 
        item.domain is defined and 
        is_staging_deployment | default(false)
      loop_control:
        label: "{{ item.name }}-staging"

    - name: Generate per-service Caddy snippet files
      ansible.builtin.template:
        src: service_snippet.caddy.j2
        dest: "/etc/caddy/conf.d/{{ service.name }}.caddy"
        owner: caddy
        group: caddy
        mode: '0644'
      loop: "{{ services | default([]) }}"
      loop_control:
        loop_var: service
        label: "{{ service.name }}"
      when: service.enabled | default(true) and service.domain is defined
      notify: Reload Caddy

    - name: Assert no generated snippet is empty
      ansible.builtin.shell: |
        fail=0
        for svc in {{ caddy_service_names | join(' ') }}; do
          f="/etc/caddy/conf.d/${svc}.caddy"
          if [ -f "$f" ] && [ ! -s "$f" ]; then
            echo "EMPTY: $f"
            fail=1
          fi
        done
        exit $fail
      register: snippet_empty_check
      changed_when: false
      failed_when: snippet_empty_check.rc != 0

    - name: Save Caddy services checksum
      ansible.builtin.copy:
        content: "{{ caddy_services_hash }}"
        dest: /etc/caddy/conf.d/.services-checksum
        owner: caddy
        group: caddy
        mode: '0644'

- name: Generate Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ config_path }}/caddy/Caddyfile"
    owner: caddy
    group: caddy
    mode: '0644'
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload Caddy
  register: caddyfile_changed

- name: Display Caddyfile preview
  ansible.builtin.shell: head -50 {{ config_path }}/caddy/Caddyfile
  register: caddyfile_preview
  changed_when: false
  when: caddyfile_changed is changed

- name: Show Caddyfile content
  ansible.builtin.debug:
    msg: "{{ caddyfile_preview.stdout_lines }}"
  when: caddyfile_changed is changed

- name: Generate index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ base_path }}/caddy/site/index.html"
    owner: caddy
    group: caddy
    mode: '0644'

- name: Ensure Caddy service is running
  block:
    - name: Start Caddy service
      ansible.builtin.service:
        name: caddy
        state: started
        enabled: true

  rescue:
    - name: Get Caddy service status after start failure
      ansible.builtin.command: systemctl status caddy.service
      register: caddy_start_status
      failed_when: false
      changed_when: false

    - name: Get Caddy journal logs after start failure
      ansible.builtin.command: journalctl -xeu caddy.service -n 50 --no-pager
      register: caddy_start_journal
      failed_when: false
      changed_when: false

    - name: Display Caddy service status after start failure
      ansible.builtin.debug:
        msg: "{{ caddy_start_status.stdout_lines }}"

    - name: Display Caddy journal logs after start failure
      ansible.builtin.debug:
        msg: "{{ caddy_start_journal.stdout_lines }}"

    - name: Fail with detailed start error message
      ansible.builtin.fail:
        msg: |
          Caddy failed to start.
          See the systemctl status and journalctl output above for details.

# Quick port check with reduced timeout
- name: Wait for Caddy to be ready
  ansible.builtin.wait_for:
    port: 443
    host: 0.0.0.0
    timeout: 15
    delay: 1
  ignore_errors: true
  register: caddy_https_check

# Combined health check - verify Caddy is working
- name: Verify Caddy is serving requests
  ansible.builtin.uri:
    url: "https://deploy.{{ domain }}"
    validate_certs: false
    return_content: false
    status_code: [200, 301, 302]
    timeout: 5
  register: caddy_deploy_test
  ignore_errors: true
  changed_when: false
  retries: 2
  delay: 2
  until: caddy_deploy_test is succeeded

# Consolidated diagnostics - only run on failure
- name: Gather Caddy diagnostics on failure
  when: caddy_deploy_test is failed
  block:
    - name: Check Caddy ports and status
      ansible.builtin.shell: |
        echo "=== Caddy Ports ==="
        ss -tlnp | grep caddy || echo "No Caddy processes listening"
        echo ""
        echo "=== Service Status ==="
        systemctl status caddy --no-pager -l 2>&1 | head -20
        echo ""
        echo "=== Recent Errors ==="
        journalctl -u caddy -n 20 --no-pager | grep -i "error\|fail\|refused" || echo "No errors found"
      register: caddy_diagnostics
      changed_when: false
      failed_when: false

    - name: Display Caddy diagnostics
      ansible.builtin.debug:
        msg: "{{ caddy_diagnostics.stdout }}"

- name: Fail if Caddy is completely broken
  ansible.builtin.fail:
    msg: "Caddy failed to start or serve requests. Check diagnostics above."
  when:
    - caddy_https_check is failed
    - caddy_deploy_test is failed
