---
- name: Install Caddy (Rocky/RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  block:
    - name: Install DNF plugins
      ansible.builtin.dnf:
        name: 'dnf-command(copr)'
        state: present

    - name: Enable Caddy COPR
      ansible.builtin.command: dnf copr enable -y @caddy/caddy
      args:
        creates: >-
          /etc/yum.repos.d/
          _copr:copr.fedorainfracloud.org:group_caddy:caddy.repo

    - name: Install Caddy
      ansible.builtin.dnf:
        name: caddy
        state: present

- name: Install Caddy (Debian/Ubuntu)
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: true

    - name: Download Caddy GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /tmp/caddy.gpg
        mode: '0644'

    - name: Dearmor Caddy GPG key
      ansible.builtin.shell: >-
        set -o pipefail &&
        gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        /tmp/caddy.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        executable: /bin/bash

    - name: Download Caddy repository configuration
      ansible.builtin.get_url:
        url: >-
          https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
        dest: /etc/apt/sources.list.d/caddy-stable.list
        mode: '0644'

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy
  loop:
    - /opt/caddy
    - /opt/caddy/site

- name: Create Caddy log directory
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    mode: '0755'
    owner: caddy
    group: caddy
    setype: var_log_t

- name: Ensure Caddy can write to log directory (SELinux)
  ansible.builtin.command:
    cmd: restorecon -Rv /var/log/caddy
  changed_when: false
  failed_when: false
  when: ansible_selinux.status is defined and ansible_selinux.status == 'enabled'

- name: Generate Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: caddy
    group: caddy
    mode: '0644'
  notify: Reload Caddy

- name: Generate index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /opt/caddy/site/index.html
    owner: caddy
    group: caddy
    mode: '0644'

- name: Ensure Caddy service is running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

- name: Check for conflicting web servers
  ansible.builtin.service_facts:

- name: Stop conflicting web servers
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - httpd
    - nginx
    - apache2
  when: >-
    (item + '.service') in ansible_facts.services or
    item in ansible_facts.services
  failed_when: false

- name: Remove legacy Caddy container
  community.docker.docker_container:
    name: caddy
    state: absent
    force_kill: true
  failed_when: false
