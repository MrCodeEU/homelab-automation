---
- name: Reload Caddy
  ansible.builtin.command: timeout 30 systemctl reload caddy
  register: caddy_reload_result
  changed_when: caddy_reload_result.rc == 0
  failed_when: false
  async: 45
  poll: 5

- name: Verify Caddy reloaded successfully
  block:
    - name: Check if Caddy is active
      ansible.builtin.command: systemctl is-active caddy
      register: caddy_active_check
      changed_when: false
      failed_when: caddy_active_check.rc != 0
      retries: 3
      delay: 2

    - name: Display Caddy reload status
      ansible.builtin.debug:
        msg: "Caddy service reloaded and is {{ caddy_active_check.stdout }}"

  rescue:
    - name: Get Caddy service status after reload failure
      ansible.builtin.command: systemctl status caddy.service
      register: caddy_reload_status
      failed_when: false
      changed_when: false

    - name: Get Caddy journal logs after reload failure
      ansible.builtin.command: journalctl -xeu caddy.service -n 50 --no-pager
      register: caddy_reload_journal
      failed_when: false
      changed_when: false

    - name: Display Caddy service status after reload failure
      ansible.builtin.debug:
        msg: "{{ caddy_reload_status.stdout_lines }}"

    - name: Display Caddy journal logs after reload failure
      ansible.builtin.debug:
        msg: "{{ caddy_reload_journal.stdout_lines }}"

    - name: Fail with detailed reload error message
      ansible.builtin.fail:
        msg: |
          Caddy failed to reload successfully.
          See the systemctl status and journalctl output above for details.

  listen: Reload Caddy
