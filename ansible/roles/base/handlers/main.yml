---
- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

- name: Reload systemd and restart cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    daemon_reload: true
    state: restarted

# Picks up Storage=persistent. Restarting journald is safe: clients reconnect,
# and the volatile journal in /run is flushed to /var/log/journal on the way.
- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  listen: Restart journald

# Storage=persistent alone does not move an already-running volatile journal:
# journald keeps writing to /run until something flushes it. nuc sat with the
# directory present, the drop-in read and the SELinux context correct, and still
# had 119MB in /run and nothing in /var/log/journal until this ran.
- name: Flush the runtime journal into persistent storage
  ansible.builtin.command: journalctl --flush
  changed_when: false
  listen: Restart journald
