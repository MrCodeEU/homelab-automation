---
# Base role - System packages and Docker installation (Rocky Linux)
# ============================================================================

# ============================================================================
# System Packages
# ============================================================================

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined

- name: Upgrade all installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Install EPEL Release
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - acl
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
      - yum-utils
    state: present
    update_cache: true

# ============================================================================
# Retired: fail2ban (superseded by CrowdSec)
# ============================================================================
# CrowdSec + the nftables bouncer do this job now. The leftover fail2ban unit
# sat in a failed state on mljr from 2026-05-19 while disabled, which is
# exactly the kind of noise the health report would report forever.

- name: Stop and disable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: stopped
    enabled: false
  failed_when: false

# DANGER: do not replace this with ansible.builtin.dnf.
# /etc/dnf/dnf.conf sets clean_requirements_on_remove=True, so a plain removal
# of fail2ban also takes firewalld, firewalld-filesystem, python3-firewall,
# ipset and python3-nftables with it as "unused dependencies". firewalld is
# active on mljr and owns a live nftables table, so that would drop the
# firewall on the public host. --noautoremove keeps the transaction to the
# fail2ban packages themselves.
- name: Find installed fail2ban packages
  ansible.builtin.shell: rpm -qa 'fail2ban*' --qf '%{NAME}\n'
  register: fail2ban_pkgs
  changed_when: false
  failed_when: false

- name: Remove fail2ban packages
  ansible.builtin.command:
    argv: "{{ ['dnf', 'remove', '-y', '--noautoremove'] + fail2ban_pkgs.stdout_lines }}"
  when: fail2ban_pkgs.stdout_lines | default([]) | length > 0
  register: fail2ban_removed
  changed_when: fail2ban_removed.rc == 0

# Fail loudly rather than leave a public host without a firewall if the
# transaction above ever takes more than it should.
- name: Verify firewalld survived the fail2ban removal
  ansible.builtin.command: rpm -q firewalld
  register: firewalld_present
  changed_when: false
  failed_when: firewalld_present.rc != 0
  when: fail2ban_removed is changed

# A unit that was failed when it was removed stays in systemd's failed list
# until it is explicitly reset.
- name: Clear the stale fail2ban failed state
  ansible.builtin.command: systemctl reset-failed fail2ban.service
  changed_when: false
  failed_when: false

- name: Remove leftover fail2ban configuration
  ansible.builtin.file:
    path: /etc/fail2ban
    state: absent
  when: fail2ban_removed is changed

# ============================================================================
# Swapfile (optional per host)
# ============================================================================

- name: Check active swap devices
  ansible.builtin.command: swapon --show --noheadings --raw --output NAME
  register: active_swap_devices
  changed_when: false
  failed_when: false
  check_mode: false
  when: swap_enabled | default(false) | bool
  tags:
    - swap

- name: Check swapfile
  ansible.builtin.stat:
    path: "{{ swap_file_path | default('/swapfile') }}"
  register: swap_file
  when: swap_enabled | default(false) | bool
  tags:
    - swap

- name: Create swapfile
  ansible.builtin.command: >-
    fallocate -l {{ swap_file_size_mb | default(2048) | int }}M
    {{ swap_file_path | default('/swapfile') }}
  args:
    creates: "{{ swap_file_path | default('/swapfile') }}"
  register: swapfile_create
  when:
    - swap_enabled | default(false) | bool
    - not swap_file.stat.exists
  tags:
    - swap

- name: Set swapfile permissions
  ansible.builtin.file:
    path: "{{ swap_file_path | default('/swapfile') }}"
    owner: root
    group: root
    mode: "0600"
  when: swap_enabled | default(false) | bool
  tags:
    - swap

- name: Format swapfile
  ansible.builtin.command: "mkswap {{ swap_file_path | default('/swapfile') }}"
  when:
    - swap_enabled | default(false) | bool
    - swapfile_create is changed
  tags:
    - swap

- name: Persist swapfile
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swap_file_path | default('/swapfile') | regex_escape }}\\s+"
    line: "{{ swap_file_path | default('/swapfile') }} none swap sw 0 0"
    state: present
  when: swap_enabled | default(false) | bool
  tags:
    - swap

- name: Enable swapfile
  ansible.builtin.command: "swapon {{ swap_file_path | default('/swapfile') }}"
  register: swapfile_enable
  changed_when: swapfile_enable.rc == 0
  failed_when:
    - swapfile_enable.rc != 0
    - "'Device or resource busy' not in (swapfile_enable.stderr | default(''))"
  when:
    - swap_enabled | default(false) | bool
    - swap_file_path | default('/swapfile') not in active_swap_devices.stdout_lines
  tags:
    - swap

# ============================================================================
# Docker Installation
# ============================================================================

- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker
  when: docker_check.rc != 0
  block:
    - name: Add Docker repository
      ansible.builtin.command: >-
        yum-config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Docker Python SDK
  ansible.builtin.package:
    name: python3-docker
    state: present
  register: docker_python_pkg
  failed_when: false

- name: Install Docker Python SDK (pip fallback)
  ansible.builtin.pip:
    name: docker
    state: present
  when: docker_python_pkg is failed

# ============================================================================
# Docker Hub Login (prevents 401 errors and anonymous rate limits)
# ============================================================================

- name: Log in to Docker Hub
  community.docker.docker_login:
    registry_url: https://index.docker.io/v1/
    username: "{{ secrets.dockerhub.username }}"
    password: "{{ secrets.dockerhub.password }}"
    reauthorize: true
  when:
    - secrets.dockerhub.username | default('') | length > 0
    - secrets.dockerhub.password | default('') | length > 0
  no_log: true

# ============================================================================
# Firewall Configuration (Tailscale internal network)
# ============================================================================

- name: Ensure firewalld is installed and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

# Use the 'trusted' zone for Tailscale traffic (allows all connections)
- name: Add Tailscale network to trusted zone
  ansible.posix.firewalld:
    zone: trusted
    source: 100.64.0.0/10
    state: enabled
    permanent: true
    immediate: true

# ============================================================================
# SSH deception cutover (mljr only): scope real sshd to Tailscale+loopback,
# free the public interface's port 22 for a tarpit (Endlessh), and keep a
# break-glass port reachable directly in case Tailscale itself is ever down.
# ============================================================================

- name: Open break-glass SSH port in firewalld public zone
  ansible.posix.firewalld:
    zone: public
    port: "{{ ssh_breakglass_port }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: public_ip is defined and ssh_breakglass_port is defined

- name: Label break-glass SSH port for SELinux
  community.general.seport:
    ports: "{{ ssh_breakglass_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when: public_ip is defined and ssh_breakglass_port is defined

- name: Scope sshd ListenAddress (Tailscale + loopback + break-glass port)
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK - ssh honeypot cutover"
    block: |
      ListenAddress {{ tailscale_ip }}:22
      ListenAddress 127.0.0.1:22
      ListenAddress {{ public_ip }}:{{ ssh_breakglass_port }}
    validate: /usr/sbin/sshd -t -f %s
  when: public_ip is defined and ssh_breakglass_port is defined
  notify: Reload sshd

# ============================================================================
# Cockpit break-glass console (mljr only): loopback-only, fronted by Caddy's
# cockpit.mljr.eu vhost (Authelia-gated) - never exposed on the public
# interface directly.
# ============================================================================

- name: Scope Cockpit socket to loopback only
  ansible.builtin.copy:
    dest: /etc/systemd/system/cockpit.socket.d/override.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream=127.0.0.1:9090
    mode: "0644"
  when: cockpit_console_enabled | default(false) | bool
  notify: Reload systemd and restart cockpit socket

- name: Configure Cockpit for reverse-proxy origins
  ansible.builtin.copy:
    dest: /etc/cockpit/cockpit.conf
    content: |
      [WebService]
      Origins = https://cockpit.{{ domain }} wss://cockpit.{{ domain }}
      ProtocolHeader = X-Forwarded-Proto
    mode: "0644"
  when: cockpit_console_enabled | default(false) | bool
  notify: Reload systemd and restart cockpit socket

- name: Enable Cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  when: cockpit_console_enabled | default(false) | bool

- name: Remove direct public firewalld allowance for Cockpit
  ansible.posix.firewalld:
    zone: public
    service: cockpit
    state: disabled
    permanent: true
    immediate: true
  when: cockpit_console_enabled | default(false) | bool

# ============================================================================
# Docker Prune (weekly maintenance or explicit prune tag)
# ============================================================================

- name: Prune unused Docker objects
  community.docker.docker_prune:
    containers: "{{ docker_prune_containers | default(true) | bool }}"
    images: "{{ docker_prune_images | default(true) | bool }}"
    networks: "{{ docker_prune_networks | default(false) | bool }}"
    volumes: "{{ docker_prune_volumes | default(false) | bool }}"
    builder_cache: "{{ docker_prune_builder_cache | default(true) | bool }}"
    timeout: "{{ docker_prune_timeout | default(600) | int }}"
  register: docker_prune_result
  failed_when:
    - docker_prune_fail_deployment | default(false) | bool
    - docker_prune_result is failed
  when: docker_prune_enabled | default(false) | bool
  tags:
    - prune

- name: Report Docker prune maintenance issue
  ansible.builtin.debug:
    msg: >-
      Docker prune did not complete on {{ inventory_hostname }} within
      {{ docker_prune_timeout | default(600) }}s: {{ docker_prune_result.msg | default('unknown error') }}
  when:
    - docker_prune_enabled | default(false) | bool
    - docker_prune_result is defined
    - docker_prune_result.msg is defined
    - docker_prune_result.msg | length > 0
  tags:
    - prune

# ============================================================================
# Persistent journald
# ============================================================================
# Without /var/log/journal, `Storage=auto` keeps logs in /run and every reboot
# erases them. That is how the evidence for nuc's unexplained 2026-08-02 reboot
# was lost - it had to be reconstructed from dnf history afterwards. It matters
# more now that this role can reboot hosts deliberately: a reboot that eats its
# own explanation is not a good trade.
#
# Storage is set explicitly rather than relying on `auto` detecting the
# directory. nuc had the directory, with correct ownership, and journald was
# still writing 119MB to /run - auto only makes that decision at startup.
- name: Ensure the persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

# A drop-in rather than an edit of journald.conf, because the two hosts do not
# agree on where that file is: Rocky 9 (mljr) ships /etc/systemd/journald.conf,
# Rocky 10 (nuc) ships only /usr/lib/systemd/journald.conf and expects drop-ins.
# Editing the /etc path would have worked on mljr and silently done nothing on
# nuc, which is the failure this task exists to prevent in the first place.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make journald storage persistent
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-persistent.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/base).
      # Without this, Storage=auto keeps logs in /run and a reboot erases them.
      [Journal]
      Storage=persistent
  notify: Restart journald

# ============================================================================
# Gated reboot
# ============================================================================
# Packages are updated on every deploy ("Upgrade all installed packages" above),
# but nothing ever rebooted, so kernel fixes sat installed-and-not-running
# indefinitely. mljr spent 15 weeks that way and reported 94 pending advisories
# that were in fact one missing reboot - rebooting cleared all 94 at once.
#
# Deliberately opt-in per host and off by default: this reboots a machine. It is
# also gated on `needs-restarting -r`, so a host with nothing to activate is
# never restarted just because the timer fired.
#
# Intended trigger is the weekly scheduled deploy rather than every push, which
# is why the workflow passes reboot_if_needed=true only when
# github.event_name == 'schedule'.
- name: Check whether a reboot is required to activate installed updates
  ansible.builtin.command: needs-restarting -r
  register: base_needs_restarting
  changed_when: false
  # rc 0 = no reboot needed, 1 = reboot needed, 127 = tool absent (Unraid).
  # Anything else means "do not know", and not knowing must not mean rebooting.
  failed_when: false
  when:
    - reboot_if_needed | default(false) | bool
    - reboot_enabled | default(true) | bool
  tags:
    - reboot

- name: Reboot to activate installed updates
  ansible.builtin.reboot:
    msg: "Rebooting to activate installed kernel/library updates (Ansible)"
    # Generous: mljr runs 41 containers and mailcow is slow to come back.
    reboot_timeout: 900
    post_reboot_delay: 30
    # Proves the host is genuinely back rather than merely answering ping.
    test_command: systemctl is-system-running --wait
  when:
    - reboot_if_needed | default(false) | bool
    - reboot_enabled | default(true) | bool
    - base_needs_restarting is defined
    - base_needs_restarting.rc is defined
    - base_needs_restarting.rc == 1
  tags:
    - reboot

- name: Report reboot decision
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {% if base_needs_restarting.rc | default(-1) == 1 %}rebooted to activate updates
      {% elif base_needs_restarting.rc | default(-1) == 0 %}no reboot needed
      {% else %}reboot state unknown (needs-restarting rc={{ base_needs_restarting.rc | default('n/a') }}) - not rebooting
      {% endif %}
  when:
    - reboot_if_needed | default(false) | bool
    - reboot_enabled | default(true) | bool
  tags:
    - reboot
