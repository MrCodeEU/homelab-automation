---
# Base role - System packages and Docker installation (Rocky Linux)
# ============================================================================

# ============================================================================
# System Packages
# ============================================================================

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined

- name: Upgrade all installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Install EPEL Release
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - acl
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
      - yum-utils
    state: present
    update_cache: true

# ============================================================================
# Docker Installation
# ============================================================================

- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker
  when: docker_check.rc != 0
  block:
    - name: Add Docker repository
      ansible.builtin.command: >-
        yum-config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Docker Python SDK
  ansible.builtin.package:
    name: python3-docker
    state: present
  register: docker_python_pkg
  failed_when: false

- name: Install Docker Python SDK (pip fallback)
  ansible.builtin.pip:
    name: docker
    state: present
  when: docker_python_pkg is failed

# ============================================================================
# Docker Hub Login (prevents 401 errors and anonymous rate limits)
# ============================================================================

- name: Log in to Docker Hub
  community.docker.docker_login:
    registry_url: https://index.docker.io/v1/
    username: "{{ secrets.dockerhub.username }}"
    password: "{{ secrets.dockerhub.password }}"
    reauthorize: true
  when:
    - secrets.dockerhub.username | default('') | length > 0
    - secrets.dockerhub.password | default('') | length > 0
  no_log: true

# ============================================================================
# Firewall Configuration (Tailscale internal network)
# ============================================================================

- name: Ensure firewalld is installed and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

# Use the 'trusted' zone for Tailscale traffic (allows all connections)
- name: Add Tailscale network to trusted zone
  ansible.posix.firewalld:
    zone: trusted
    source: 100.64.0.0/10
    state: enabled
    permanent: true
    immediate: true

# ============================================================================
# Docker Prune (weekly maintenance or explicit prune tag)
# ============================================================================

- name: Prune unused Docker objects
  community.docker.docker_prune:
    containers: "{{ docker_prune_containers | default(true) | bool }}"
    images: "{{ docker_prune_images | default(true) | bool }}"
    networks: "{{ docker_prune_networks | default(false) | bool }}"
    volumes: "{{ docker_prune_volumes | default(false) | bool }}"
    builder_cache: "{{ docker_prune_builder_cache | default(true) | bool }}"
  when: docker_prune_enabled | default(false) | bool
  tags:
    - prune
