---
# Base role - System packages and Docker installation
# Combines common and docker setup with idempotent checks

# ============================================================================
# System Packages
# ============================================================================

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined

- name: Install EPEL Release (Rocky/RHEL)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Install base packages (Rocky/RHEL)
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
      - yum-utils
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install base packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

# ============================================================================
# Docker Installation
# ============================================================================

- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker (Rocky/RHEL)
  when:
    - ansible_facts['os_family'] == "RedHat"
    - docker_check.rc != 0
  block:
    - name: Add Docker repository
      ansible.builtin.command: >-
        yum-config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

- name: Install Docker (Debian/Ubuntu)
  when:
    - ansible_facts['os_family'] == "Debian"
    - docker_check.rc != 0
  block:
    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg | \
          gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
        executable: /bin/bash

    - name: Add Docker repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} \
          {{ ansible_facts['distribution_release'] }} stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list
        executable: /bin/bash

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Docker Python SDK (system package)
  ansible.builtin.package:
    name: python3-docker
    state: present
  register: docker_python_pkg
  failed_when: false

- name: Install Docker Python SDK (pip with venv fallback)
  when: docker_python_pkg is failed
  block:
    - name: Create virtual environment for Ansible
      ansible.builtin.pip:
        name:
          - docker
          - docker-compose
        virtualenv: /opt/ansible-venv
        virtualenv_command: python3 -m venv
        state: present
      register: docker_venv_install
      failed_when: false

    - name: Install Docker Python SDK (pip system-wide fallback)
      ansible.builtin.pip:
        name: docker
        state: present
      when: docker_venv_install is failed
      # Note: This may require pip installed via OS package manager

# ============================================================================
# Docker Prune (only when explicitly tagged)
# ============================================================================

- name: Prune unused Docker objects
  community.docker.docker_prune:
    containers: true
    images: true
    networks: false
    volumes: false
    builder_cache: true
  tags:
    - prune
    - never
