---
# Grafana Alloy Role - host, Docker, and log telemetry for Grafana LGTM

# The docker_container module below runs on the target and needs the Python
# docker SDK there. Rocky hosts get python3-docker from roles/base (dnf), but
# that role never targets ugreen - installing it here too makes this role
# self-contained rather than depending on base having run first, and the
# package name is identical on apt and dnf so this needs no OS branching.
- name: Ensure the Python docker SDK is present
  ansible.builtin.package:
    name: python3-docker
    state: present
  register: grafana_alloy_docker_sdk_pkg
  failed_when: false

# Mirrors roles/base's pip-fallback pattern for consistency. On ugreen apt has
# python3-docker (the package task above succeeds for real there); on nuc
# (Rocky 10) dnf does not, same as roles/base's own dnf attempt - and nuc has
# no pip either, so this fallback cannot install anything there either. It
# stays a no-op safety net rather than a real fix for nuc; Alloy has run there
# all week regardless, so community.docker does not appear to need the SDK for
# what this role does.
- name: Ensure the Python docker SDK is present (pip fallback)
  ansible.builtin.pip:
    name: docker
    state: present
  when: grafana_alloy_docker_sdk_pkg is failed

- name: Set Grafana telemetry endpoints
  ansible.builtin.set_fact:
    grafana_prometheus_remote_write_url: "http://{{ hostvars['nuc']['tailscale_ip'] }}:19090/api/v1/write"
    grafana_loki_push_url: "http://{{ hostvars['nuc']['tailscale_ip'] }}:3100/loki/api/v1/push"

- name: Create Grafana Alloy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/grafana-alloy
    - /opt/grafana-alloy/data

- name: Generate Grafana Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /opt/grafana-alloy/config.alloy
    mode: '0644'
  notify: Restart Grafana Alloy

- name: Deploy Grafana Alloy container
  community.docker.docker_container:
    name: grafana-alloy
    image: grafana/alloy:latest
    state: started
    restart_policy: unless-stopped
    pull: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    network_mode: host
    pid_mode: host
    user: root
    # Read-only access to the SCSI/SATA (major 8) and NVMe (major 259) block
    # device classes - needed for the btrfs collector's ioctls now that
    # /dev is bind-mounted above. A plain bind mount doesn't bypass Docker's
    # device cgroup controller, this is the actual permission grant; kept
    # read-only ("r" only, no "w"/"m") and scoped to two device classes
    # rather than --privileged.
    device_cgroup_rules:
      - "b 8:* r"
      - "b 259:* r"
    volumes:
      - /opt/grafana-alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /opt/grafana-alloy/data:/var/lib/alloy/data
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /sys:/sys:ro
      - "{{ grafana_alloy_docker_root }}:{{ grafana_alloy_docker_root }}:ro"
      - /dev/disk:/dev/disk:ro
      # Read-only device nodes for the btrfs collector's ioctls (BTRFS_IOC_FS_INFO
      # etc.) - stat-ing the symlinks under /dev/disk alone isn't enough, the
      # collector needs the actual block special files. device_cgroup_rules
      # below grants the matching cgroup permission (bind-mounting alone
      # doesn't bypass Docker's device cgroup controller).
      - /dev:/dev:ro
      # Read-only D-Bus socket for the systemd collector (ListUnits etc. only
      # - see the "systemd collector" comment in config.alloy.j2 for why this
      # doesn't meaningfully raise this container's existing trust level).
      - /run/systemd/private:/run/systemd/private:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cadvisor asks containerd about image layers for every container it
      # discovers. Without this socket it cannot, and logs one error per
      # container per scan:
      #   "Failed to create existing container: /system.slice/docker-<id>.scope:
      #    unable to create containerd client for overlayfs storage driver"
      # That was ~2,400 error lines an hour on mljr and nuc - the single largest
      # log source on either host - for metrics cadvisor then silently omits.
      # Read-only: cadvisor only queries.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    labels:
      homelab.managed: "true"
      homelab.component: "standalone-container"
      homelab.name: "grafana-alloy"
