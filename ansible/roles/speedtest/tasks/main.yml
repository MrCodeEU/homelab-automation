---
- name: Generate SSH key pair for Speedtest
  community.crypto.openssh_keypair:
    path: "/tmp/speedtest_id_rsa"
    type: rsa
    size: 2048
    state: present
    force: false
  delegate_to: localhost
  register: speedtest_key
  run_once: true

- name: Authorize Speedtest key on managed hosts
  ansible.posix.authorized_key:
    user: "{{ hostvars[item].ansible_user | default('root') }}"
    state: present
    key: "{{ speedtest_key.public_key }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['managed'] }}"
  loop_control:
    label: "{{ item }}"
  run_once: true
  register: key_auth_results

- name: Report key authorization failures
  ansible.builtin.debug:
    msg: "WARNING: Failed to authorize SSH key on {{ item.item }}: {{ item.msg | default('unknown error') }}"
  loop: "{{ key_auth_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when: item.failed | default(false)
  run_once: true

- name: Create speedtest directory
  file:
    path: "{{ base_path }}/speedtest"
    state: directory
    mode: '0755'

- name: Copy speedtest service files
  synchronize:
    src: "{{ playbook_dir }}/../../services/speedtest/"
    dest: "{{ base_path }}/speedtest/"
    recursive: yes
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"

- name: Read private key from generated file
  ansible.builtin.slurp:
    src: "/tmp/speedtest_id_rsa"
  delegate_to: localhost
  register: speedtest_private_key_file
  run_once: true

- name: Copy Private Key to destination
  copy:
    content: "{{ speedtest_private_key_file.content | b64decode }}"
    dest: "{{ base_path }}/speedtest/id_rsa"
    mode: '0600'
    owner: root
    group: root

- name: Start Speedtest Service
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/speedtest"
    state: present
    pull: always
  register: compose_result

- name: Wait for Speedtest API
  uri:
    url: "http://localhost:8089/api/devices"
    method: GET
    status_code: 200
  register: api_check
  until: api_check.status == 200
  retries: 20
  delay: 5

- name: Get existing Speedtest devices
  uri:
    url: "http://localhost:8089/api/devices"
    method: GET
    return_content: yes
  register: existing_devices
  failed_when: false

- name: Parse existing devices
  ansible.builtin.set_fact:
    existing_device_list: "{{ existing_devices.json | default([]) }}"
  when: existing_devices.status == 200

- name: Set empty device list on API failure
  ansible.builtin.set_fact:
    existing_device_list: []
  when: existing_devices.status != 200

- name: Add or Update Devices in Speedtest
  uri:
    url: "http://localhost:8089/api/devices{{ '/' ~ (existing_device_list | selectattr('name', 'equalto', item) | map(attribute='id') | first) if (existing_device_list | selectattr('name', 'equalto', item) | list | length > 0) else '' }}"
    method: "{{ 'PUT' if (existing_device_list | selectattr('name', 'equalto', item) | list | length > 0) else 'POST' }}"
    body_format: json
    body:
      name: "{{ item }}"
      hostname: "{{ hostvars[item].tailscale_ip }}"
      ssh_user: "{{ hostvars[item].ansible_user | default('root') }}"
      ssh_port: 22
      ip: "{{ hostvars[item].tailscale_ip }}"
    status_code: [200, 201]
  loop: "{{ groups['managed'] }}"
  loop_control:
    label: "{{ item }}"
  ignore_errors: true
