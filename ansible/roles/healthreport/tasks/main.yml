---
# Health report agent - host-side state
# ============================================================================
# Runs on the orchestrator (nuc) and must execute before host-facts-endpoint on
# the other hosts, because it publishes the public key those hosts authorize.
# ============================================================================

- name: Create health report directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ healthreport_root }}"
      mode: "0755"
    # Facts history and the seen-sets that make the day-over-day diff possible.
    - path: "{{ healthreport_state_dir }}"
      mode: "0755"
    - path: "{{ healthreport_state_dir }}/history"
      mode: "0755"
    - path: "{{ healthreport_state_dir }}/seen"
      mode: "0755"
    - path: "{{ healthreport_ssh_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

# Restricted to a forced command on the remote side, but still treated as a
# real private key: root-owned, 0600, and excluded from the pCloud backup.
- name: Generate the health report SSH keypair
  community.crypto.openssh_keypair:
    path: "{{ healthreport_key_path }}"
    type: ed25519
    comment: homelab-healthreport
    owner: root
    group: root
    mode: "0600"
    regenerate: never
  register: healthreport_key

- name: Publish the public key for host-facts-endpoint
  ansible.builtin.set_fact:
    healthreport_pubkey: "{{ healthreport_key.public_key }}"
