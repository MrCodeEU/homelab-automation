---
- name: Create Glance directories
  file:
    path: /opt/glance
    state: directory
    mode: '0755'

- name: Generate Glance config
  template:
    src: glance.yml.j2
    dest: /opt/glance/glance.yml
  notify: Restart Glance

- name: Ensure Glance container is running
  docker_container:
    name: glance
    image: glanceapp/glance
    restart_policy: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/glance/glance.yml:/app/glance.yml
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
