---
- name: Check for legacy Glance docker-compose file
  ansible.builtin.stat:
    path: /opt/glance/docker-compose.yml
  register: glance_compose

- name: Tear down legacy Glance docker-compose
  ansible.builtin.command: docker compose down
  args:
    chdir: /opt/glance
  when: glance_compose.stat.exists
  changed_when: true
  failed_when: false

- name: Remove legacy Glance docker-compose file
  ansible.builtin.file:
    path: /opt/glance/docker-compose.yml
    state: absent
  when: glance_compose.stat.exists

- name: Force remove existing Glance container
  community.docker.docker_container:
    name: glance
    state: absent
    force_kill: true
  failed_when: false

- name: Create Glance directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/glance
    - /opt/glance/config

- name: Generate Glance config
  ansible.builtin.template:
    src: glance.yml.j2
    dest: /opt/glance/config/glance.yml
    mode: '0644'
  notify: Restart Glance

- name: Ensure Glance container is running
  community.docker.docker_container:
    name: glance
    image: glanceapp/glance
    restart_policy: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - /opt/glance/config:/app/config
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
