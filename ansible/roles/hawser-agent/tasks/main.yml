---
# Hawser Agent Role - Lightweight Docker agent for Dockhand remote management
# ============================================================================
# Hawser (Standard mode): agent listens on Tailscale IP, central Dockhand
# instance (on Unraid/NAS) connects inbound to manage Docker on this host.
#
# Architecture:
#   - Agent runs on each rocky host, listens on {{ hawser_port }}
#   - Dockhand on NAS ({{ hostvars['nas']['tailscale_ip'] }}) connects to agents
#   - Bound to Tailscale interface only — no public exposure
#
# After deployment: add each host as a node in the Dockhand web UI:
#   mljr: {{ hostvars['mljr']['tailscale_ip'] }}:{{ hawser_port }}
#   nuc:  {{ hostvars['nuc']['tailscale_ip'] }}:{{ hawser_port }}
# ============================================================================

- name: Download Hawser install script
  ansible.builtin.get_url:
    url: "{{ hawser_install_script }}"
    dest: /tmp/hawser-install.sh
    mode: '0755'
    force: false
  when: not ansible_check_mode

- name: Install Hawser agent
  ansible.builtin.command: bash /tmp/hawser-install.sh
  args:
    creates: "{{ hawser_binary }}"
  when: not ansible_check_mode
  register: hawser_install

- name: Ensure systemd drop-in directory for hawser exists
  ansible.builtin.file:
    path: /etc/systemd/system/hawser.service.d
    state: directory
    mode: '0755'

- name: Configure Hawser port and bind address
  ansible.builtin.copy:
    dest: /etc/systemd/system/hawser.service.d/override.conf
    mode: '0644'
    content: |
      [Service]
      Environment=HAWSER_PORT={{ hawser_port }}
      Environment=HAWSER_BIND_ADDRESS={{ tailscale_ip }}
  notify: restart hawser

- name: Open Hawser port in firewall (Tailscale zone only)
  ansible.posix.firewalld:
    port: "{{ hawser_port }}/tcp"
    zone: trusted
    permanent: true
    immediate: true
    state: enabled

- name: Enable and start Hawser agent
  ansible.builtin.systemd:
    name: hawser
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Display Hawser agent status
  ansible.builtin.debug:
    msg: |
      Hawser agent deployed on {{ inventory_hostname }}
      Connect from Dockhand UI: {{ tailscale_ip }}:{{ hawser_port }}
