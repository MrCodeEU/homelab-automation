---
# Unraid bootstrap
# ============================================================================
# Unraid's root filesystem is a tmpfs rebuilt from /boot/config at every boot,
# so anything Ansible writes to /usr/local/bin or /opt is gone after a reboot
# and compose projects never come back up on their own.
#
# This role prepares the array-side layout and installs a User Scripts entry
# that runs at array start to restore the tmpfs-side state.
# ============================================================================

- name: Read Unraid array state
  ansible.builtin.command: mdcmd status
  register: unraid_mdcmd
  changed_when: false
  check_mode: false

- name: Require a started array before touching /mnt/user
  ansible.builtin.assert:
    that:
      - "'mdState=STARTED' in unraid_mdcmd.stdout"
    fail_msg: >-
      Unraid array on {{ inventory_hostname }} is not STARTED. /mnt/user is not
      mounted, so deploying would write into the tmpfs root and be lost on
      reboot. Start the array and re-run.
    quiet: true

- name: Ensure the managed compose root exists on the array
  ansible.builtin.file:
    path: "{{ unraid_base_path }}"
    state: directory
    mode: "0755"

# Executables live on the array because /usr/local/bin is tmpfs. The bootstrap
# script re-links them into PATH at array start.
- name: Ensure the persistent bin directory exists on the array
  ansible.builtin.file:
    path: "{{ unraid_base_path }}/bin"
    state: directory
    mode: "0755"

# Registry credentials must survive the tmpfs rebuild. The services role logs
# in with DOCKER_CONFIG pointed here; the bootstrap script links /root/.docker
# at array start so compose pulls keep working outside an Ansible run.
- name: Ensure the persistent docker config directory exists on the array
  ansible.builtin.file:
    path: "{{ unraid_base_path }}/.docker"
    state: directory
    mode: "0700"

- name: Ensure the User Scripts directory for the bootstrap script exists
  ansible.builtin.file:
    path: "{{ unraid_userscripts_path }}/scripts/{{ unraid_bootstrap_script_name }}"
    state: directory
    mode: "0755"

- name: Install the array-start bootstrap script
  ansible.builtin.template:
    src: bootstrap.sh.j2
    dest: "{{ unraid_userscripts_path }}/scripts/{{ unraid_bootstrap_script_name }}/script"
    mode: "0755"

- name: Install the User Scripts metadata
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ unraid_userscripts_path }}/scripts/{{ unraid_bootstrap_script_name }}/{{ item.file }}"
    mode: "0644"
  loop:
    - file: name
      content: "{{ unraid_bootstrap_script_name }}"
    - file: description
      content: >-
        Managed by Ansible (roles/unraid-bootstrap). Restores Ansible-managed
        compose projects and helper binaries after the tmpfs root is rebuilt.
  loop_control:
    label: "{{ item.file }}"

# schedule.json is shared with UI-created entries, so it must be merged rather
# than overwritten or every other user script loses its schedule.
- name: Read the existing User Scripts schedule
  ansible.builtin.slurp:
    src: "{{ unraid_userscripts_path }}/schedule.json"
  register: unraid_schedule_raw
  failed_when: false

# `backup: true` cannot be used here: the Unraid boot flash is vfat, and
# Ansible's backup filenames embed a timestamp containing colons, which vfat
# rejects with EINVAL. Keep a single fixed-name copy instead.
- name: Back up the existing User Scripts schedule
  ansible.builtin.copy:
    src: "{{ unraid_userscripts_path }}/schedule.json"
    dest: "{{ unraid_userscripts_path }}/schedule.json.ansible-bak"
    remote_src: true
    mode: "0644"
  when: unraid_schedule_raw.content is defined

- name: Merge the bootstrap entry into the schedule and drop retired entries
  ansible.builtin.copy:
    content: "{{ unraid_schedule_merged | to_nice_json(indent=4) }}\n"
    dest: "{{ unraid_userscripts_path }}/schedule.json"
    mode: "0644"
  vars:
    unraid_schedule_existing: >-
      {{ (unraid_schedule_raw.content | b64decode | from_json)
         if (unraid_schedule_raw.content is defined) else {} }}
    unraid_bootstrap_script_path: >-
      {{ unraid_userscripts_path }}/scripts/{{ unraid_bootstrap_script_name }}/script
    unraid_retired_script_paths: >-
      {{ unraid_retired_scripts
         | map('regex_replace', '^(.*)$', unraid_userscripts_path ~ '/scripts/\1/script')
         | list }}
    unraid_schedule_kept: >-
      {{ dict(unraid_schedule_existing.items()
              | rejectattr('0', 'in', unraid_retired_script_paths)) }}
    unraid_schedule_merged: >-
      {{ unraid_schedule_kept | combine({
           unraid_bootstrap_script_path: {
             'script': unraid_bootstrap_script_path,
             'frequency': unraid_bootstrap_frequency,
             'id': 'schedule' ~ (unraid_bootstrap_script_name | regex_replace('[^A-Za-z0-9]', '')),
             'custom': ''
           }
         }) }}

# Retired User Scripts. "GHCR Auth" stored a plaintext GitHub PAT on the boot
# flash; registry login now happens in roles/services from the vault-held token.
# Removing the file does not revoke the leaked token - rotate it separately.
- name: Remove retired User Scripts from the flash
  ansible.builtin.file:
    path: "{{ unraid_userscripts_path }}/scripts/{{ item }}"
    state: absent
  loop: "{{ unraid_retired_scripts }}"
