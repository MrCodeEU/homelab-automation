---
# Where Ansible-managed compose projects live on the array.
# Overridden per-group in inventory/group_vars/unraid.yml.
unraid_base_path: "{{ base_path | default('/mnt/user/appdata/homelab') }}"

# Persistent config on the boot flash. Restored into the tmpfs root at boot.
unraid_persist_path: /boot/config

# User Scripts plugin paths.
unraid_userscripts_path: "{{ unraid_persist_path }}/plugins/user.scripts"
unraid_bootstrap_script_name: homelab-compose-up

# Legacy User Scripts entries superseded by Ansible. These are removed from the
# flash along with their schedule.json entry.
#
# "GHCR Auth" held a plaintext classic GitHub PAT on the boot flash. GHCR login
# is now done by roles/services using the vault-held token over stdin.
unraid_retired_scripts:
  - GHCR Auth

# "start" == "At Startup of Array" in the User Scripts plugin.
# Values: disabled | hourly | daily | weekly | monthly | start | stop | boot | custom
unraid_bootstrap_frequency: start
