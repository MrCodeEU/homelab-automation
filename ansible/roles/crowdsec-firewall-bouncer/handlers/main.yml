---
- name: Restart CrowdSec firewall bouncer
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: restarted
  when: not ansible_check_mode
  failed_when: false
  register: bouncer_restart
- name: Warn if bouncer restart failed
  ansible.builtin.debug:
    msg: "WARNING: crowdsec-firewall-bouncer restart failed — check API key in vault matches registered bouncer key"
  when:
    - not ansible_check_mode
    - bouncer_restart.failed | default(false)
