---
# CrowdSec firewall bouncer - host-level remediation on the public ingress host.

- name: Validate CrowdSec firewall bouncer secret
  ansible.builtin.assert:
    that:
      - secrets.crowdsec.firewall_bouncer_key | default('') | length > 0
    fail_msg: >-
      CROWDSEC_FIREWALL_BOUNCER_KEY is required when
      crowdsec_firewall_bouncer_enabled=true.
    quiet: true
  no_log: true

- name: Wait for Dockerized CrowdSec local API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8088
    timeout: 60
  when: not ansible_check_mode

- name: Configure CrowdSec package repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/crowdsec_crowdsec.repo
    mode: '0644'
    content: |
      [crowdsec_crowdsec]
      name=crowdsec_crowdsec
      baseurl=https://packagecloud.io/crowdsec/crowdsec/rpm_any/rpm_any/$basearch
      repo_gpgcheck=1
      gpgcheck=1
      enabled=1
      gpgkey=https://packagecloud.io/crowdsec/crowdsec/gpgkey
             https://packagecloud.io/crowdsec/crowdsec/gpgkey/crowdsec-crowdsec-EDE2C695EC9A5A5C.pub.gpg
             https://packagecloud.io/crowdsec/crowdsec/gpgkey/crowdsec-crowdsec-C822EDD6B39954A1.pub.gpg
             https://packagecloud.io/crowdsec/crowdsec/gpgkey/crowdsec-crowdsec-FED78314A2468CCF.pub.gpg
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=3600

- name: Install CrowdSec nftables firewall bouncer
  ansible.builtin.dnf:
    name: crowdsec-firewall-bouncer-nftables
    state: present
    update_cache: true

- name: Ensure CrowdSec bouncer config directory exists
  ansible.builtin.file:
    path: /etc/crowdsec/bouncers
    state: directory
    mode: '0750'

- name: Configure CrowdSec firewall bouncer
  ansible.builtin.template:
    src: crowdsec-firewall-bouncer.yaml.j2
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    mode: '0600'
  no_log: true
  notify: Restart CrowdSec firewall bouncer

- name: Ensure CrowdSec firewall bouncer is enabled and running
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Apply CrowdSec firewall bouncer config
  ansible.builtin.meta: flush_handlers

- name: Verify CrowdSec firewall bouncer is active
  when: not ansible_check_mode
  block:
    - name: Wait for CrowdSec firewall bouncer to become active
      ansible.builtin.command: >-
        systemctl show crowdsec-firewall-bouncer
        --property=ActiveState
        --property=SubState
        --value
      register: crowdsec_firewall_bouncer_state
      changed_when: false
      failed_when: false
      until: >-
        (crowdsec_firewall_bouncer_state.stdout_lines | default([]) | first | default(''))
        == 'active'
      retries: 30
      delay: 5

  rescue:
    - name: Capture CrowdSec firewall bouncer service status
      ansible.builtin.command: systemctl status crowdsec-firewall-bouncer --no-pager --full
      register: crowdsec_firewall_bouncer_status
      changed_when: false
      failed_when: false

    - name: Capture recent CrowdSec firewall bouncer logs
      ansible.builtin.command: journalctl -u crowdsec-firewall-bouncer -n 80 --no-pager
      register: crowdsec_firewall_bouncer_journal
      changed_when: false
      failed_when: false

    - name: Fail when CrowdSec firewall bouncer is not active
      ansible.builtin.fail:
        msg: |
          crowdsec-firewall-bouncer did not become active after 150 seconds.

          Last observed state:
          {{ crowdsec_firewall_bouncer_state.stdout | default('unknown') }}

          systemctl status:
          {{ crowdsec_firewall_bouncer_status.stdout | default('unavailable') }}

          Recent journal:
          {{ crowdsec_firewall_bouncer_journal.stdout | default('unavailable') }}
