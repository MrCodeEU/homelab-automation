---
# Host facts endpoint
# ============================================================================
# Installs a read-only facts script and an SSH key restricted to running only
# that script, so the health report on nuc can read state that is otherwise
# loopback-bound (CrowdSec LAPI), root-only (nftables) or not a network
# resource at all (Unraid array/SMART state).
#
# The key grants exactly one capability: run this script. It takes no
# arguments and ignores SSH_ORIGINAL_COMMAND, so there is nothing to inject.
# ============================================================================

- name: Set per-host script destination
  ansible.builtin.set_fact:
    host_facts_dest: >-
      {{ host_facts_unraid_bin_path
         if inventory_hostname in (groups['unraid'] | default([]))
         else host_facts_bin_path }}

- name: Ensure the array-side bin directory exists (Unraid)
  ansible.builtin.file:
    path: "{{ host_facts_unraid_bin_path | dirname }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in (groups['unraid'] | default([]))

- name: Install the facts script
  ansible.builtin.template:
    src: homelab-facts.py.j2
    dest: "{{ host_facts_dest }}"
    owner: root
    group: root
    mode: "0755"

# /usr/local/bin is tmpfs on Unraid. The symlink is recreated at array start by
# roles/unraid-bootstrap; this makes it usable immediately after a deploy too.
- name: Link the facts script into PATH (Unraid)
  ansible.builtin.file:
    src: "{{ host_facts_unraid_bin_path }}"
    dest: "{{ host_facts_bin_path }}"
    state: link
    force: true
  when: inventory_hostname in (groups['unraid'] | default([]))

# The key can only be installed when the healthreport role has run on the
# client host in this same invocation. Under `--limit nas` that play is
# filtered out, which is a legitimate staged rollout rather than an error:
# install the script now and authorize the key on a later full run.
- name: Check whether the client public key is available
  ansible.builtin.set_fact:
    host_facts_pubkey: "{{ hostvars[host_facts_client_host]['healthreport_pubkey'] | default('') }}"

- name: Warn when the key cannot be installed yet
  ansible.builtin.debug:
    msg: >-
      Skipping the authorized_key step: healthreport_pubkey is not set on
      {{ host_facts_client_host }}. Include {{ host_facts_client_host }} in the
      run (or drop --limit) to finish wiring the facts endpoint.
  when: host_facts_pubkey | length == 0

- name: Authorize the health report key for the facts command only
  when: host_facts_pubkey | length > 0
  ansible.posix.authorized_key:
    user: root
    key: "{{ hostvars[host_facts_client_host]['healthreport_pubkey'] }}"
    key_options: >-
      restrict,from="{{ hostvars[host_facts_client_host]['tailscale_ip'] }}",command="{{ host_facts_bin_path }}"
    comment: homelab-healthreport
    exclusive: false
    state: present

# Unraid rebuilds /root/.ssh from the flash at boot, so the live file alone
# would be lost on the next reboot.
- name: Ensure the persisted ssh directory exists (Unraid)
  ansible.builtin.file:
    path: "{{ host_facts_unraid_ssh_persist }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - inventory_hostname in (groups['unraid'] | default([]))
    - host_facts_pubkey | length > 0

- name: Copy the live authorized_keys onto the flash (Unraid)
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    dest: "{{ host_facts_unraid_ssh_persist }}/authorized_keys"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname in (groups['unraid'] | default([]))
    - host_facts_pubkey | length > 0
