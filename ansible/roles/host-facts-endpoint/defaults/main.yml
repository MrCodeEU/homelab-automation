---
# Host that is allowed to invoke the endpoint. Its Tailscale IP is pinned into
# the authorized_keys `from=` restriction.
host_facts_client_host: nuc

# Where the script lives. On Unraid /usr/local/bin is tmpfs, so the canonical
# copy sits on the array and unraid-bootstrap re-links it at array start.
host_facts_bin_path: /usr/local/bin/homelab-facts
host_facts_unraid_bin_path: "{{ base_path }}/bin/homelab-facts"

# ugreen's root is a writable overlay (mmcblk0p7, real ext4, not tmpfs), so
# unlike Unraid this has not been observed to wipe /usr/local/bin. But it is
# also unconfirmed to survive a vendor OS update, which can reasonably reset
# an overlay to match a new base image. Storing the canonical copy on the
# storage pool costs nothing and means that if it ever does happen, the next
# deploy re-creates the symlink rather than needing the same live rescue
# Unraid needed on 2026-08-01.
host_facts_ugreen_bin_path: "{{ base_path }}/bin/homelab-facts"

# Unraid restores /root/.ssh from here at boot.
host_facts_unraid_ssh_persist: /boot/config/ssh/root

# Backup destinations to report capacity for (Unraid only - it is the host that
# owns the rclone config and the backup share).
#
# Reported so a full destination is visible before it bites: the report could
# previously say a backup succeeded without saying the target was nearly out of
# space, and "succeeded" stops meaning much at 100%. `rclone about` is a single
# API call per remote, no listing, so this is cheap.
#
# wd-cloud is included deliberately even though it has no quota API - it is
# reported as "quota unsupported", which is honestly different from "0 free".
facts_backup_remotes:
  - pcloud
  - wd-cloud
facts_backup_paths:
  - /mnt/user/backup
  # The pool that now holds appdata, docker and system (moved off the failing
  # Intenso on 2026-08-04) and, from 2026-08-05, the Nextcloud borg repo. It is
  # where every container's live state sits, so it filling up is an outage, not
  # a capacity note - but nothing was watching it: the old `cache` pool was only
  # covered incidentally via /var/lib/docker in host_metrics.
  - /mnt/fastpool
