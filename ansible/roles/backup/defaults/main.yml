---
# Backup role defaults

# rclone configuration
backup_rclone_config_path: /root/.config/rclone
backup_remote_name: pcloud
backup_remote_path: "homelab-backup/{{ inventory_hostname }}"

# Local backup staging directory
backup_local_path: /opt/backups

# Backup schedule (systemd timer format)
backup_schedule: "*-*-* 03:00:00"  # Daily at 3 AM

# Retention policy (days to keep old backups)
backup_retention_days: 30

# Wall-clock cap per rsync/rclone call (rclone syntax, e.g. "20m"). Bounds a
# single slow or hung item so it can't consume the whole systemd
# TimeoutStartSec and take every service queued after it down too.
backup_item_timeout: "40m"

# pCloud OAuth token (from environment)
# To get token: run `rclone config` interactively, copy the token JSON
backup_pcloud_token: "{{ secrets.backup.pcloud_token | default('') }}"

# Auto-detect Docker volumes for backup
backup_auto_detect_volumes: true

# Services with backup definitions
# Each service can define:
#   - backup_paths: list of local paths to backup
#   - backup_volumes: list of Docker volume names
#   - backup_pre_hook: command to run before backup (e.g., database dump)
#   - backup_post_hook: command to run after backup
#   - backup_critical: if true, backup failure is fatal
#   - backup_wd_cloud: defaults to true (2026-08-14) - every service's total
#     backup volume is negligible against WD Cloud's free space, so it gets
#     the same "every existing backup, best-effort" treatment ugreen already
#     had. Set to false on a service to opt out.
backup_service_configs:
  authelia:
    backup_paths:
      - "{{ authelia_config_path | default('/opt/authelia') }}"
    backup_volumes:
      - authelia_redis_data
    backup_critical: true

  mailcow:
    backup_volumes:
      - mailcowdockerized_vmail-vol-1
      - mailcowdockerized_mysql-vol-1
    backup_pre_hook: |
      cd {{ mailcow_install_path | default('/opt/mailcow-dockerized') }} && \
      set -a && . ./mailcow.conf && set +a && \
      mkdir -p /opt/backups/mailcow-dumps && \
      docker compose exec -T mysql-mailcow mysqldump -u"$DBUSER" -p"$DBPASS" "$DBNAME" > /opt/backups/mailcow-dumps/mailcow.sql
    backup_post_hook: |
      rm -rf /opt/backups/mailcow-dumps
    backup_paths:
      - /opt/backups/mailcow-dumps
      - "{{ mailcow_install_path | default('/opt/mailcow-dockerized') }}/data"
    backup_critical: true

  kuma:
    backup_volumes:
      - kuma_uptime-kuma-data
    backup_critical: false

  ntfy:
    backup_volumes:
      - ntfy_ntfy-data
      - ntfy_ntfy-cache
    backup_critical: false

  # Was backup_paths: [/opt/bichon/data], which never existed - bichon writes
  # to a named Docker volume, not a bind mount. Confirmed via
  # `docker inspect bichon`: the volume is compose-project-prefixed
  # (bichon-data -> bichon_bichon-data), same convention docker_compose_v2
  # applies to every service here.
  bichon:
    backup_volumes:
      - bichon_bichon-data
    backup_critical: false

  # Added 2026-08-01. Before this, 6 of 34 deployed services had any backup at
  # all, and the ones below hold state that exists nowhere else. All container
  # backups together occupy 1.1 GiB on pCloud, so coverage was never a storage
  # question - these were simply never added.
  #
  # The two Postgres-backed services get a dump hook rather than a raw copy of
  # the data directory: archiving a running Postgres is what produced three
  # consecutive weeks of failed appdata backups on the NAS (tar caught
  # pg_internal.init changing mid-read). pg_dump gives a consistent snapshot,
  # and the volume is kept as well so a dump failure is not a total loss.

  # Self-hosted Git: repositories, issues, CI config, and the mirror target for
  # the user's own code. It had no backup of its own.
  forgejo:
    backup_volumes:
      - forgejo-data
      - forgejo-db-data
    # Dumped into a directory, not a bare file: backup_paths entries are
    # rclone-synced, and `rclone sync` takes a directory as its source.
    backup_pre_hook: |
      mkdir -p /opt/backups/forgejo-dumps && \
      docker exec forgejo-db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
        > /opt/backups/forgejo-dumps/forgejo.sql
    backup_paths:
      - /opt/backups/forgejo-dumps
    backup_post_hook: |
      rm -rf /opt/backups/forgejo-dumps
    # Restoring backup_paths only puts the .sql file back on disk - it does
    # NOT load it into Postgres. This only works if forgejo-db is already
    # running (the normal case: restoring one service's data after loss,
    # not a from-scratch install where Backup Setup runs before Docker
    # Services brings the container up at all).
    restore_post_hook: |
      for i in $(seq 1 30); do
        docker exec forgejo-db pg_isready > /dev/null 2>&1 && break
        sleep 2
      done
      docker exec -i forgejo-db sh -c 'psql -U "$POSTGRES_USER" "$POSTGRES_DB"' \
        < /opt/backups/forgejo-dumps/forgejo.sql
    backup_critical: true

  # Archived mail from Gmail/Outlook/Tuta - the whole point of the service is
  # to be the one durable copy, so this can't be the one thing left
  # unreconstructible. DataProtection-Keys is what decrypts stored IMAP/OAuth
  # credentials at rest - losing it without the DB dump alongside it means
  # every account has to be re-added from scratch even if the mail itself
  # survives.
  mail-archiver:
    backup_volumes:
      - mail-archiver_mail-archiver-dp-keys
    backup_pre_hook: |
      mkdir -p /opt/backups/mail-archiver-dumps && \
      docker exec mail-archiver-db sh -c 'pg_dump -U mailuser MailArchiver' \
        > /opt/backups/mail-archiver-dumps/mail-archiver.sql
    backup_paths:
      - /opt/backups/mail-archiver-dumps
    backup_post_hook: |
      rm -rf /opt/backups/mail-archiver-dumps
    # Same restore-ordering caveat as forgejo/umami/nocturne below - only
    # works once mail-archiver-db is actually running.
    restore_post_hook: |
      for i in $(seq 1 30); do
        docker exec mail-archiver-db pg_isready > /dev/null 2>&1 && break
        sleep 2
      done
      docker exec -i mail-archiver-db psql -U mailuser MailArchiver \
        < /opt/backups/mail-archiver-dumps/mail-archiver.sql
    backup_critical: true

  # Analytics history: years of it, and not reconstructible from anything else.
  umami:
    backup_volumes:
      - umami_umami-db-data
    backup_pre_hook: |
      mkdir -p /opt/backups/umami-dumps && \
      docker exec umami-db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
        > /opt/backups/umami-dumps/umami.sql
    backup_paths:
      - /opt/backups/umami-dumps
    backup_post_hook: |
      rm -rf /opt/backups/umami-dumps
    restore_post_hook: |
      for i in $(seq 1 30); do
        docker exec umami-db pg_isready > /dev/null 2>&1 && break
        sleep 2
      done
      docker exec -i umami-db sh -c 'psql -U "$POSTGRES_USER" "$POSTGRES_DB"' \
        < /opt/backups/umami-dumps/umami.sql
    backup_critical: false

  # Dashboards, datasources, and the observability history behind them.
  #
  # The time series were initially left out as "regenerable", which is wrong:
  # they regenerate only going forward. Losing them loses the past, and at
  # 2.8G + 1.7G against 2.2 TiB free on pCloud there is no reason to.
  #
  # Copied live rather than snapshotted, which is a deliberate trade. Loki's
  # chunks are immutable once flushed and VictoriaMetrics tolerates a
  # crash-consistent copy; the alternative is VM's snapshot API, which writes
  # the snapshot inside the same volume and would roughly double it during the
  # run. For monitoring history that is not a worthwhile trade - but it does
  # mean these two restore to "as if the host lost power", not to a clean
  # point-in-time.
  grafana:
    backup_volumes:
      - grafana-data
      - victoriametrics-data
      - loki-data
    backup_critical: false

  # The user's own application database. Unlike forgejo and umami, this one
  # sets --auth-local=scram-sha-256, so pg_dump needs a password even over the
  # local socket - taken from the container's own environment rather than
  # duplicated into the vault.
  nocturne:
    backup_volumes:
      - nocturne_nocturne-postgres-data
    backup_pre_hook: |
      mkdir -p /opt/backups/nocturne-dumps && \
      docker exec nocturne-postgres sh -c \
        'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
        > /opt/backups/nocturne-dumps/nocturne.sql
    backup_paths:
      - /opt/backups/nocturne-dumps
    backup_post_hook: |
      rm -rf /opt/backups/nocturne-dumps
    restore_post_hook: |
      for i in $(seq 1 30); do
        docker exec nocturne-postgres pg_isready > /dev/null 2>&1 && break
        sleep 2
      done
      docker exec -i nocturne-postgres sh -c \
        'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" "$POSTGRES_DB"' \
        < /opt/backups/nocturne-dumps/nocturne.sql
    backup_critical: false

  # Subscriber list.
  newsletter:
    backup_volumes:
      - newsletter_newsletter-data
    backup_critical: true

  # Analytics history derived from Caddy logs, which rotate away - so this is
  # not reproducible after the fact.
  goaccess:
    backup_volumes:
      - goaccess_goaccess-data
      - goaccess_goaccess-report
    backup_critical: false

  # Local decisions plus the machine credentials that register this instance
  # with the central API. Re-registerable, but tedious.
  crowdsec:
    backup_volumes:
      - crowdsec-config
      - crowdsec-data
      - crowdsec-web-ui-data
    backup_critical: false

  # glance is deliberately absent: it only keeps /opt/glance/config, which
  # Ansible templates from the repo, so there is no state to back up.
