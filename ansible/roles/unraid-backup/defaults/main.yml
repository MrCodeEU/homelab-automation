---
# Unraid rclone backup
# ============================================================================
# Unraid already has rclone installed and a working [pcloud] remote
# (/root/.config/rclone/rclone.conf, set up manually). This role does not
# touch that config - it only replaces the manual User Scripts entry that
# drives it with an Ansible-managed one, and extends coverage.
# ============================================================================

# Role-scoped in unraid-bootstrap's own defaults, so redefined here from the
# same group-level unraid_persist_path rather than depending on another
# role's defaults being visible.
unraid_userscripts_path: "{{ unraid_persist_path }}/plugins/user.scripts"
unraid_backup_script_name: nas-backup

unraid_backup_log_path: "{{ base_path }}/backup/logs"
unraid_backup_script_path: "{{ base_path }}/backup/backup.sh"

# "start" is wrong here (that means "at array startup"); this needs a real
# daily schedule, same slot the manual script already used.
unraid_backup_frequency: daily

# Each entry syncs one local path to one rclone remote path with `rclone
# sync`. The Fotos/Fotos -> pcloud:Fotos pairing is unchanged from the manual
# script that has been running since before this repo touched Unraid -
# changing the destination would force a full 588GB re-upload for no reason.
# The other Fotos subfolders were never covered; new pcloud paths for them,
# matching the existing pcloud:Fotos naming rather than inventing a new tree.
unraid_backup_paths:
  - src: /mnt/user/Fotos/Fotos
    dest: "pcloud:Fotos"
  - src: "/mnt/user/Fotos/Videos"
    dest: "pcloud:Fotos-Videos"
  - src: "/mnt/user/Fotos/Wichtiges Scans Adressen"
    dest: "pcloud:Fotos-Wichtiges-Scans-Adressen"

# Retired: the manual "rclone backup" User Script this role replaces.
unraid_backup_retired_scripts:
  - "rclone backup"
