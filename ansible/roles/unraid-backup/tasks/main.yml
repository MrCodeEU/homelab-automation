---
# Unraid rclone backup
# ============================================================================
# Replaces the manual "rclone backup" User Script with an Ansible-managed
# equivalent (same retirement pattern as GHCR Auth in unraid-bootstrap), and
# extends it to cover Fotos subfolders the manual script never touched.
#
# Does not configure rclone itself: /root/.config/rclone/rclone.conf was set
# up manually and already has a working [pcloud] remote. Touching that is out
# of scope - this role only owns the schedule and the path list.
# ============================================================================

- name: Ensure the backup log directory exists on the array
  ansible.builtin.file:
    path: "{{ unraid_backup_log_path }}"
    state: directory
    mode: "0755"

- name: Ensure the User Scripts directory for the backup script exists
  ansible.builtin.file:
    path: "{{ unraid_userscripts_path }}/scripts/{{ unraid_backup_script_name }}"
    state: directory
    mode: "0755"

- name: Install the backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ unraid_userscripts_path }}/scripts/{{ unraid_backup_script_name }}/script"
    mode: "0755"

- name: Install the User Scripts metadata
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ unraid_userscripts_path }}/scripts/{{ unraid_backup_script_name }}/{{ item.file }}"
    mode: "0644"
  loop:
    - file: name
      content: "{{ unraid_backup_script_name }}"
    - file: description
      content: >-
        Managed by Ansible (roles/unraid-backup). rclone sync to pCloud.
        Replaces the manually-created "rclone backup" script.
  loop_control:
    label: "{{ item.file }}"

# schedule.json is shared with UI-created and other Ansible-managed entries
# (unraid-bootstrap's own script), so it must be merged, never overwritten.
- name: Read the existing User Scripts schedule
  ansible.builtin.slurp:
    src: "{{ unraid_userscripts_path }}/schedule.json"
  register: unraid_backup_schedule_raw
  failed_when: false

- name: Merge the backup entry into the schedule and drop the retired script
  ansible.builtin.copy:
    content: "{{ unraid_backup_schedule_merged | to_nice_json(indent=4) }}\n"
    dest: "{{ unraid_userscripts_path }}/schedule.json"
    mode: "0644"
  vars:
    unraid_backup_schedule_existing: >-
      {{ (unraid_backup_schedule_raw.content | b64decode | from_json)
         if (unraid_backup_schedule_raw.content is defined) else {} }}
    unraid_backup_script_path: >-
      {{ unraid_userscripts_path }}/scripts/{{ unraid_backup_script_name }}/script
    unraid_backup_retired_paths: >-
      {{ unraid_backup_retired_scripts
         | map('regex_replace', '^(.*)$', unraid_userscripts_path ~ '/scripts/\1/script')
         | list }}
    unraid_backup_schedule_kept: >-
      {{ dict(unraid_backup_schedule_existing.items()
              | rejectattr('0', 'in', unraid_backup_retired_paths)) }}
    unraid_backup_schedule_merged: >-
      {{ unraid_backup_schedule_kept | combine({
           unraid_backup_script_path: {
             'script': unraid_backup_script_path,
             'frequency': unraid_backup_frequency,
             'id': 'schedule' ~ (unraid_backup_script_name | regex_replace('[^A-Za-z0-9]', '')),
             'custom': ''
           }
         }) }}

# Removing the file does not delete anything it already synced to pCloud -
# rclone.conf and remote content are untouched.
- name: Remove the retired manual backup script from the flash
  ansible.builtin.file:
    path: "{{ unraid_userscripts_path }}/scripts/{{ item }}"
    state: absent
  loop: "{{ unraid_backup_retired_scripts }}"
