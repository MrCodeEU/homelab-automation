---
# Backup dashboard - host-side state (nuc only)
# ============================================================================
# The collector and web containers are compose services deployed by
# roles/services; this role only owns the state that must outlive them
# (rendered catalog + snapshot state) - same pattern as roles/healthreport.
# ============================================================================

- name: Create backup dashboard directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(backup_dashboard_uid) }}"
    group: "{{ item.owner | default(backup_dashboard_uid) }}"
    mode: "{{ item.mode }}"
  loop:
    # The root stays root-owned; only what the container must write does not.
    - path: "{{ backup_dashboard_root }}"
      mode: "0755"
      owner: root
    - path: "{{ backup_dashboard_state_dir }}"
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

# The catalog itself is root-owned/read-only from the container's point of
# view - the collector only ever reads it, never writes it - so it does not
# need the unprivileged uid like the state directory above.
- name: Render the backup catalog
  ansible.builtin.template:
    src: backup_catalog.json.j2
    dest: "{{ backup_dashboard_root }}/backup_catalog.json"
    owner: root
    group: root
    mode: "0644"
