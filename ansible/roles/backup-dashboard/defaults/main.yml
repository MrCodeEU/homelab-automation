---
# Host-side layout for the backup dashboard collector. The collector and web
# containers are compose services deployed by roles/services; this role only
# owns the state that must outlive them and the rendered catalog.
# NOT under /opt/<service>: the services role rsyncs into that path with
# delete: true, which wipes anything it does not know about - same reasoning
# as roles/healthreport.
backup_dashboard_root: /var/lib/backup-dashboard
backup_dashboard_state_dir: "{{ backup_dashboard_root }}/state"

# The container runs unprivileged as this uid (see services/backup-dashboard/
# Dockerfile). The state directory must be owned by it, or the collector
# cannot write the snapshot/rendered page.
backup_dashboard_uid: 10002
