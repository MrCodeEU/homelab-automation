---
- name: Install Docker (Rocky/RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  block:
    - name: Install yum-utils
      ansible.builtin.dnf:
        name: yum-utils
        state: present

    - name: Add Docker repo
      ansible.builtin.command: >-
        yum-config-manager --add-repo
        https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Install Docker (Debian/Ubuntu)
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: >-
          https://download.docker.com/linux/{{
          ansible_facts['distribution'] | lower }}/gpg
        dest: /tmp/docker.gpg
        mode: '0644'

    - name: Dearmor Docker GPG key
      ansible.builtin.shell: >-
        set -o pipefail &&
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
        executable: /bin/bash

    - name: Set permissions for GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.shell: >-
        set -o pipefail &&
        echo "deb [arch=$(dpkg --print-architecture)
        signed-by=/etc/apt/keyrings/docker.gpg]
        https://download.docker.com/linux/{{
        ansible_facts['distribution'] | lower }} $(lsb_release -cs) stable" |
        tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list
        executable: /bin/bash

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Install Docker Python library
  ansible.builtin.pip:
    name: docker
    state: present

- name: Prune unused Docker objects
  community.docker.docker_prune:
    containers: true
    images: true
    networks: true
    volumes: false  # Be careful with volumes
    builder_cache: true
  tags: prune
