---
authelia_version: "latest"
authelia_port: 9091
authelia_bind_addr: "127.0.0.1"
authelia_config_path: "{{ base_path }}/authelia"
authelia_jwt_secret: "{{ secrets.authelia.jwt_secret }}"
authelia_session_secret: "{{ secrets.authelia.session_secret }}"
authelia_storage_encryption_key: "{{ secrets.authelia.storage_encryption_key }}"
authelia_default_redirection_url: "https://{{ domain }}"
