---
- name: Ensure Authelia directory exists
  file:
    path: "{{ authelia_config_path }}"
    state: directory
    mode: '0755'

- name: Ensure db.sqlite3 exists as a file (prevents Docker from creating it as a directory)
  ansible.builtin.file:
    path: "{{ authelia_config_path }}/db.sqlite3"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Generate Authelia admin password hash
  ansible.builtin.shell:
    cmd: >
      docker run --rm authelia/authelia:latest
      authelia crypto hash generate argon2 --password "{{ secrets.authelia.admin_password }}"
      | grep 'Digest:' | awk '{print $2}'
  register: authelia_hash_result
  changed_when: false
  no_log: true

- name: Set password hash fact
  ansible.builtin.set_fact:
    authelia_admin_password_hash: "{{ authelia_hash_result.stdout | trim }}"
  no_log: true

- name: Copy Authelia configuration
  template:
    src: configuration.yml.j2
    dest: "{{ authelia_config_path }}/configuration.yml"
    mode: '0600'
  notify: Restart Authelia

- name: Copy Authelia users database
  template:
    src: users_database.yml.j2
    dest: "{{ authelia_config_path }}/users_database.yml"
    mode: '0600'
    force: no
  notify: Restart Authelia

- name: Create Authelia Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ authelia_config_path }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Authelia

- name: Ensure Authelia service is running
  community.docker.docker_compose_v2:
    project_src: "{{ authelia_config_path }}"
    state: present
    pull: always
