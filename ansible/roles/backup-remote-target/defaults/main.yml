---
# Ugreen as an on-prem backup target.
#
# The sftp user is shell-less and password-locked; its real system home is
# backup_remote_data_dir, which is also what Tailscale SSH uses directly for
# the connections that actually happen in practice (see the long comment in
# tasks/main.yml). The sshd Match block additionally chroots it there for the
# rare non-Tailscale path.
backup_remote_user: rclone-backup
# sshd requires the chroot root itself to be owned by root and not
# group/world-writable; the user's actual write target is a subdirectory of
# it that the user DOES own.
backup_remote_chroot: /volume1/homelab-backups
backup_remote_data_dir: "{{ backup_remote_chroot }}/data"
