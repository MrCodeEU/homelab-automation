---
# Services Role - Docker Compose deployment with staging support
# ============================================================================

# Validate service configuration
- name: Validate service definitions
  ansible.builtin.assert:
    that:
      - service.name is defined
      - service.name | length > 0
      - service.host is defined
      - service.host | length > 0
      # Port validation: required unless port is 0 (no web UI, e.g., notification services)
      - service.port is defined
      - (service.port | int == 0) or (service.port | int > 0 and service.port | int < 65536)
    fail_msg: >-
      Service validation failed for {{ service.name | default('unknown') }}:
      Required fields: name, host, port (0 for no UI, or 1-65535)
    quiet: true
  loop: "{{ services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name | default('unknown') }}"
  when: service.enabled | default(true)

# Login to Docker Hub (avoid rate limits for Docker Hub images)
- name: Login to Docker Hub
  community.docker.docker_login:
    username: "{{ secrets.dockerhub.username }}"
    password: "{{ secrets.dockerhub.password }}"
  when:
    - not ansible_check_mode
    - secrets.dockerhub.username | default('') | length > 0
    - secrets.dockerhub.password | default('') | length > 0
  no_log: true
  failed_when: false

# Login to GitHub Container Registry for private images
- name: Login to GitHub Container Registry
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ secrets.github.username }}"
    password: "{{ secrets.github.token }}"
  when:
    - not ansible_check_mode
    - secrets.github.username | default('') | length > 0
    - secrets.github.token | default('') | length > 0
  no_log: true
  failed_when: false

# Network connectivity check for container registries
- name: Check network connectivity to ghcr.io
  ansible.builtin.uri:
    url: https://ghcr.io/v2/
    method: HEAD
    status_code: [200, 401]  # 401 is expected (requires auth), proves connectivity
    timeout: 10
  register: ghcr_connectivity
  retries: 3
  delay: 5
  until: ghcr_connectivity is success
  when: not ansible_check_mode
  failed_when: false

- name: Warn if ghcr.io is unreachable
  ansible.builtin.debug:
    msg: "WARNING: ghcr.io connectivity check failed. Image pulls may fail."
  when:
    - not ansible_check_mode
    - ghcr_connectivity is defined
    - ghcr_connectivity is failed

# Build list of services for this host
- name: Filter services for this host
  ansible.builtin.set_fact:
    host_services: >-
      {%- set result = [] -%}
      {%- for service in services -%}
        {%- if service.host == inventory_hostname 
               and service.enabled | default(true) 
               and service.managed | default(true) 
               and not service.skip_deploy | default(false) -%}
          {%- if changed_services is defined and changed_services != 'all' -%}
            {%- if service.name in changed_services.split(',') -%}
              {%- set _ = result.append(service) -%}
            {%- endif -%}
          {%- else -%}
            {%- set _ = result.append(service) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Display deployment scope
  ansible.builtin.debug:
    msg: >-
      {{ 'Targeted deployment: ' if changed_services is defined and changed_services != 'all' else 'Full deployment: ' }}
      Deploying {{ host_services | length }} service{{ 's' if host_services | length != 1 else '' }}: 
      {{ host_services | map(attribute='name') | join(', ') if host_services | length > 0 else 'none' }}

- name: Validate required service secrets for this host
  ansible.builtin.assert:
    that:
      - >-
        service.name != 'grafana' or
        (secrets.grafana.admin_password | default('') | length > 0)
      - >-
        service.name != 'crowdsec' or
        (secrets.crowdsec.web_ui_password | default('') | length > 0)
    fail_msg: >-
      Missing required secret for {{ service.name }}.
      Required: {{
        'GRAFANA_ADMIN_PASSWORD' if service.name == 'grafana'
        else 'CROWDSEC_WEB_UI_PASSWORD'
      }}
    quiet: true
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  when:
    - not ansible_check_mode
    - service.name in ['grafana', 'crowdsec']

# ============================================================================
# Cleanup (Remove services no longer assigned to this host)
# ============================================================================

- name: Cleanup orphaned services
  ansible.builtin.include_tasks: cleanup_orphaned.yml
  when: cleanup_enabled | default(true) | bool

# ============================================================================
# Production Deployment
# ============================================================================

- name: Prepare production services
  ansible.builtin.include_tasks: prepare_service.yml
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  vars:
    is_staging: false
    deploy_path: "{{ base_path }}/{{ service.name }}"

# Pull images with retry logic to handle transient network failures
- name: Pull production service images (with retry)
  community.docker.docker_compose_v2_pull:
    project_src: "{{ base_path }}/{{ service.name }}"
    policy: always  # Always pull to get newest version
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: pull_result
  retries: 3
  delay: 10
  until: pull_result is success
  when: not ansible_check_mode
  failed_when: false  # Don't fail - let compose try anyway

- name: Deploy production services
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/{{ service.name }}"
    state: present
    pull: never  # Images already pulled above with retry logic
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: deploy_results
  when: not ansible_check_mode
  failed_when: false  # Don't fail the play - collect errors instead
  vars:
    mitogen_task_isolation: fork  # Required: Mitogen transport breaks community.docker tasks

# ============================================================================
# Post-Deploy Hooks (Production)
# ============================================================================

# Validate: warn if any hook script exists in the repo but is not registered.
# This catches the "I added a hook but forgot to update post_deploy_hook_services" mistake.
- name: Find all post-deploy hooks in repo (validation)
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../services"
    patterns: "post-deploy.sh"
    recurse: true
  register: all_hook_files
  when: not ansible_check_mode

- name: Warn about hooks not registered in post_deploy_hook_services
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg: >-
      WARNING: Unregistered post-deploy hook: {{ item.path }}
      — service '{{ item.path | dirname | dirname | basename }}'
      is not in post_deploy_hook_services. Add it to all.yml or the hook will be skipped!
  loop: "{{ all_hook_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - not ansible_check_mode
    - (item.path | dirname | dirname | basename) not in (post_deploy_hook_services | default([]))
  run_once: true

# Determine which deployed services on this host have registered hooks
- name: Filter host services with registered post-deploy hooks
  ansible.builtin.set_fact:
    hook_services: >-
      {%- set result = [] -%}
      {%- for service in host_services -%}
        {%- if service.name in (post_deploy_hook_services | default([])) -%}
          {%- set _ = result.append(service) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  when: not ansible_check_mode

- name: Run post-deploy hooks (production)
  ansible.builtin.shell: |
    set -e
    export SERVICE_NAME="{{ service.name }}"
    export SERVICE_PATH="{{ base_path }}/{{ service.name }}"
    source {{ base_path }}/{{ service.name }}/.env 2>/dev/null || true
    bash {{ base_path }}/{{ service.name }}/hooks/post-deploy.sh "{{ service.name }}" "{{ base_path }}/{{ service.name }}"
  args:
    executable: /bin/bash
    chdir: "{{ base_path }}/{{ service.name }}"
  loop: "{{ hook_services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  when:
    - not ansible_check_mode
    - hook_services | default([]) | length > 0
  register: post_deploy_results
  changed_when: "'SUCCESS' in post_deploy_results.stdout | default('') or 'CHANGED' in post_deploy_results.stdout | default('')"
  failed_when: false  # Don't fail deployment if hook fails
  async: 600  # 10 minute timeout for hooks
  poll: 0

- name: Wait for post-deploy hooks to complete
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ post_deploy_results.results | default([]) }}"
  loop_control:
    label: "{{ item.service.name | default('unknown') }}"
  register: hook_job_result
  until: hook_job_result.finished
  retries: 60
  delay: 10
  when:
    - not ansible_check_mode
    - item.ansible_job_id is defined
  failed_when: false

- name: Display post-deploy hook results
  ansible.builtin.debug:
    msg: |
      Post-deploy hook for {{ ((item.item.service | default(item.item.item)) | default({'name': 'unknown'})).name }}:
      {% if item.rc | default(0) == 0 %}SUCCESS{% else %}FAILED (rc={{ item.rc }}){% endif %}
      
      {{ item.stdout_lines | default([]) | join('\n') }}
  loop: "{{ hook_job_result.results | default([]) }}"
  loop_control:
    label: "{{ ((item.item.service | default(item.item.item)) | default({'name': 'unknown'})).name }}"
  when:
    - not ansible_check_mode
    - item.finished | default(false)

- name: Collect failed post-deploy hooks
  ansible.builtin.set_fact:
    failed_hooks: >-
      {%- set failed = [] -%}
      {%- for result in hook_job_result.results | default([]) -%}
        {%- if result.finished | default(false) and result.rc | default(0) != 0 -%}
          {%- set _ = failed.append({
            'name': ((result.item.service | default(result.item.item)) | default({'name': 'unknown'})).name,
            'rc': result.rc,
            'stderr': result.stderr_lines | default([]) | join('\n') | truncate(200)
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ failed }}
  when: not ansible_check_mode

- name: Warn about failed post-deploy hooks
  ansible.builtin.debug:
    msg: |
      ⚠️  WARNING: {{ failed_hooks | length }} post-deploy hook(s) FAILED!
      ============================================================================
      {% for hook in failed_hooks %}
      Service: {{ hook.name }}
      Exit code: {{ hook.rc }}
      Error: {{ hook.stderr }}
      {% endfor %}
      ============================================================================
      Some services may not be fully configured. Check the logs above.
  when:
    - not ansible_check_mode
    - failed_hooks | default([]) | length > 0

- name: Fail if critical hooks failed (optional)
  ansible.builtin.fail:
    msg: |
      Post-deploy hook failed for critical service: {{ item.name }}
      Exit code: {{ item.rc }}
  loop: "{{ failed_hooks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - item.name in critical_hook_services | default([])

# ============================================================================
# Staging Deployment (only on staging_host when is_staging_deployment is true)
# ============================================================================

# Check for services with dev/ folders (auto-detect staging services)
- name: Check for dev folders in services
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../services/{{ item.name }}/dev"
  loop: "{{ services }}"
  loop_control:
    loop_var: item
    label: "{{ item.name }}"
  register: dev_folder_check
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - item.enabled | default(true)
    - item.managed | default(true)
    - not item.skip_deploy | default(false)

# Build list of ALL staging-enabled services (services with dev/ folder)
- name: Filter staging services
  ansible.builtin.set_fact:
    staging_services: >-
      {%- set result = [] -%}
      {%- for check in dev_folder_check.results | default([]) -%}
        {%- if check.stat.exists | default(false) and check.stat.isdir | default(false) -%}
          {%- set _ = result.append(check.item) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - dev_folder_check.results is defined

- name: Display staging services to deploy
  ansible.builtin.debug:
    msg: "Deploying {{ staging_services | length }} staging services on {{ inventory_hostname }}: {{ staging_services | map(attribute='name') | join(', ') }}"
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - staging_services | default([]) | length > 0

- name: Prepare staging services
  ansible.builtin.include_tasks: prepare_service.yml
  loop: "{{ staging_services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}-staging"
  vars:
    is_staging: true
    deploy_path: "{{ base_path }}/staging/{{ service.name }}"
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host

# Pull staging images with retry logic to handle transient network failures
- name: Pull staging service images (with retry)
  community.docker.docker_compose_v2_pull:
    project_src: "{{ base_path }}/staging/{{ service.name }}"
    policy: always  # Always pull to get newest version
  loop: "{{ staging_services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}-staging"
  register: staging_pull_result
  retries: 3
  delay: 10
  until: staging_pull_result is success
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - not ansible_check_mode
  failed_when: false  # Don't fail - let compose try anyway

- name: Deploy staging services
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/staging/{{ service.name }}"
    state: present
    pull: never  # Images already pulled above with retry logic
  loop: "{{ staging_services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}-staging"
  register: staging_deploy_results
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - not ansible_check_mode
  failed_when: false  # Don't fail the play - collect errors instead
  vars:
    mitogen_task_isolation: fork  # Required: Mitogen transport breaks community.docker tasks

# ============================================================================
# Health Checks (Parallel)
# ============================================================================

# Launch all health checks in parallel
- name: Check service health (async)
  ansible.builtin.uri:
    url: "http://localhost:{{ service.port }}"
    status_code: [200, 301, 302, 400, 401, 403]
    timeout: 5
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: health_check_async
  async: 30
  poll: 0
  failed_when: false
  when:
    - not ansible_check_mode
    - service.port is defined
    - service.port | int > 0  # Skip services without web UI

# Wait for all health checks to complete (single wait instead of sequential)
- name: Wait for health checks to complete
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ health_check_async.results | default([]) }}"
  loop_control:
    label: "{{ item.service.name | default('unknown') }}"
  register: health_check_results
  until: health_check_results.finished
  retries: 6
  delay: 2
  failed_when: false
  when:
    - not ansible_check_mode
    - item.ansible_job_id is defined

# Display consolidated health results
- name: Display health check summary
  ansible.builtin.debug:
    msg: |
      Service Health:
      {% for result in health_check_results.results | default([]) %}
      - {{ result.item.service.name | default('unknown') }}: {{ 'HEALTHY' if result.status | default(0) in [200, 301, 302, 400, 401, 403] else 'PENDING' }}
      {% endfor %}
  when:
    - not ansible_check_mode
    - health_check_results is defined

# ============================================================================
# Kuma Provisioning (only when services list has changed)
# ============================================================================

- name: Check if Kuma is deployed
  ansible.builtin.stat:
    path: "{{ base_path }}/kuma/docker-compose.yml"
  register: kuma_deployed

- name: Compute Kuma services checksum
  ansible.builtin.set_fact:
    kuma_services_hash: "{{ services | to_json | hash('sha256') }}"
  when:
    - not ansible_check_mode
    - kuma_deployed.stat.exists

- name: Read stored Kuma services checksum
  ansible.builtin.slurp:
    src: "{{ base_path }}/kuma/.services-checksum"
  register: kuma_stored_checksum
  failed_when: false
  when:
    - not ansible_check_mode
    - kuma_deployed.stat.exists
    - kuma_services_hash is defined

- name: Set Kuma provision needed flag
  ansible.builtin.set_fact:
    kuma_provision_needed: >-
      {{ (force_provision_kuma | default(false) | bool) or
         (kuma_stored_checksum.failed | default(true)) or
         ((kuma_stored_checksum.content | default('') | b64decode | trim) != kuma_services_hash) }}
  when:
    - not ansible_check_mode
    - kuma_deployed.stat.exists
    - kuma_services_hash is defined

- name: Run Kuma provisioning
  when:
    - not ansible_check_mode
    - kuma_deployed.stat.exists
    - secrets.kuma.username | default('') | length > 0
    - secrets.kuma.password | default('') | length > 0
    - kuma_provision_needed | default(true)
  block:
    - name: Create services.yml for Kuma
      vars:
        kuma_hosts: >-
          {{
            groups['all'] | map('extract', hostvars) | list | map('dict2items')
            | map('selectattr', 'key', 'in', ['inventory_hostname', 'ansible_host'])
            | map('items2dict') | list
          }}
      ansible.builtin.copy:
        content: "{{ {'services': services, 'hosts': kuma_hosts} | to_nice_yaml }}"
        dest: "{{ base_path }}/kuma/services.yml"
        mode: '0644'

    - name: Wait for Kuma to be ready
      ansible.builtin.uri:
        url: http://localhost:3001
        status_code: [200, 302]
      register: kuma_health
      retries: 12
      delay: 5
      until: kuma_health.status in [200, 302]
      failed_when: false

    - name: Install Kuma provisioning dependencies
      ansible.builtin.pip:
        name:
          - uptime-kuma-api-v2
          - pyyaml
        virtualenv: "{{ base_path }}/kuma/venv"
        virtualenv_command: python3 -m venv
        state: present
      register: kuma_deps_install
      when: kuma_health.status | default(0) in [200, 302]

    - name: Run Kuma provisioning script
      ansible.builtin.shell: |
        export KUMA_URL="http://localhost:3001"
        export KUMA_USERNAME="{{ secrets.kuma.username }}"
        export KUMA_PASSWORD="{{ secrets.kuma.password }}"
        {{ base_path }}/kuma/venv/bin/python3 {{ base_path }}/kuma/hooks/provision-kuma.py {{ base_path }}/kuma/services.yml
      args:
        executable: /bin/bash
      register: kuma_provision
      changed_when: "'Updated' in kuma_provision.stdout or 'Created' in kuma_provision.stdout"
      failed_when: false  # Don't block deployment if Kuma provisioning fails
      retries: 3
      delay: 5
      until: kuma_provision.rc == 0
      when:
        - kuma_health.status | default(0) in [200, 302]
        - kuma_deps_install is succeeded

    - name: Display Kuma provisioning result
      ansible.builtin.debug:
        msg: |
          {% if kuma_provision is defined %}
          {% if kuma_provision.rc == 0 %}
          ✓ Kuma provisioning succeeded
          {{ kuma_provision.stdout_lines | join('\n') }}
          {% else %}
          ⚠ Kuma provisioning failed (non-blocking):
          STDOUT:
          {{ kuma_provision.stdout_lines | default([]) | join('\n') }}
          {% if kuma_provision.stderr_lines | default([]) | length > 0 %}
          STDERR:
          {{ kuma_provision.stderr_lines | join('\n') }}
          {% endif %}
          Exit code: {{ kuma_provision.rc }}
          {% endif %}
          {% else %}
          Kuma provisioning skipped
          {% endif %}
      when: kuma_provision is defined

    - name: Save Kuma services checksum
      ansible.builtin.copy:
        content: "{{ kuma_services_hash }}"
        dest: "{{ base_path }}/kuma/.services-checksum"
        mode: '0644'
      when:
        - kuma_provision is defined
        - kuma_provision.rc | default(1) == 0

# ============================================================================
# Deployment Summary and Error Reporting
# ============================================================================

- name: Collect failed production deployments
  ansible.builtin.set_fact:
    failed_production_services: >-
      {%- set failed = [] -%}
      {%- for result in deploy_results.results | default([]) -%}
        {%- if result.failed | default(false) -%}
          {%- set service_name = result.service.name | default('unknown') -%}
          {%- set error_msg = result.msg | default('Deployment failed') -%}
          {%- set _ = failed.append({'name': service_name, 'error': error_msg}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ failed }}
  when:
    - not ansible_check_mode
    - deploy_results is defined

- name: Collect failed staging deployments
  ansible.builtin.set_fact:
    failed_staging_services: >-
      {%- set failed = [] -%}
      {%- for result in staging_deploy_results.results | default([]) -%}
        {%- if result.failed | default(false) -%}
          {%- set service_name = result.service.name | default('unknown') -%}
          {%- set error_msg = result.msg | default('Deployment failed') -%}
          {%- set _ = failed.append({'name': service_name, 'error': error_msg}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ failed }}
  when:
    - not ansible_check_mode
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - staging_deploy_results is defined

- name: Display deployment summary
  ansible.builtin.debug:
    msg: |
      ============================================================================
      DEPLOYMENT SUMMARY
      ============================================================================
      Production Services: {{ host_services | length }} total
      {% if failed_production_services | default([]) | length > 0 %}
      Failed: {{ failed_production_services | length }}
      {% for svc in failed_production_services %}
        - {{ svc.name }}: {{ svc.error | regex_replace('\n', ' ') | truncate(100) }}
      {% endfor %}
      {% else %}
      All production services deployed successfully!
      {% endif %}
      {% if is_staging_deployment | default(false) | bool and inventory_hostname == staging_host %}

      Staging Services: {{ staging_services | default([]) | length }} total (on {{ staging_host }})
      {% if failed_staging_services | default([]) | length > 0 %}
      Failed: {{ failed_staging_services | length }}
      {% for svc in failed_staging_services %}
        - {{ svc.name }}: {{ svc.error | regex_replace('\n', ' ') | truncate(100) }}
      {% endfor %}
      {% else %}
      All staging services deployed successfully!
      {% endif %}
      {% endif %}
      ============================================================================
  when: not ansible_check_mode

- name: Fail if critical services failed
  ansible.builtin.fail:
    msg: "Critical services failed to deploy: {{ failed_production_services | selectattr('name', 'in', critical_services) | map(attribute='name') | join(', ') }}"
  when:
    - not ansible_check_mode
    - critical_services | default([]) | length > 0
    - failed_production_services | default([]) | selectattr('name', 'in', critical_services) | list | length > 0
  vars:
    critical_services: ['caddy', 'kuma', 'ntfy']  # Services that must succeed for deployment to pass

- name: Fail if any staging services failed
  ansible.builtin.fail:
    msg: |
      Staging deployment failed!
      Failed services: {{ failed_staging_services | map(attribute='name') | join(', ') }}
      
      Errors:
      {% for svc in failed_staging_services %}
        - {{ svc.name }}: {{ svc.error }}
      {% endfor %}
  when:
    - not ansible_check_mode
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - failed_staging_services | default([]) | length > 0
