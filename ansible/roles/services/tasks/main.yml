---
# Services Role - Docker Compose deployment with staging support
# ============================================================================

# Login to GitHub Container Registry for private images
- name: Login to GitHub Container Registry
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ secrets.github.username }}"
    password: "{{ secrets.github.token }}"
  when:
    - secrets.github.username | length > 0
    - secrets.github.token | length > 0
  no_log: true
  failed_when: false

# Build list of services for this host
- name: Filter services for this host
  ansible.builtin.set_fact:
    host_services: >-
      {{ services
         | selectattr('enabled', 'defined')
         | selectattr('enabled')
         | selectattr('host', 'equalto', inventory_hostname)
         | rejectattr('managed', 'defined')
         | rejectattr('skip_deploy', 'defined')
         | list
         +
         services
         | selectattr('enabled', 'defined')
         | selectattr('enabled')
         | selectattr('host', 'equalto', inventory_hostname)
         | selectattr('managed', 'defined')
         | selectattr('managed')
         | rejectattr('skip_deploy', 'defined')
         | list }}

- name: Display services to deploy
  ansible.builtin.debug:
    msg: "Deploying {{ host_services | length }} services: {{ host_services | map(attribute='name') | join(', ') }}"

# ============================================================================
# Production Deployment
# ============================================================================

- name: Deploy production services
  ansible.builtin.include_tasks: deploy_service.yml
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  vars:
    is_staging: false
    deploy_path: "/opt/{{ service.name }}"
    service_port: "{{ service.port }}"

# ============================================================================
# Staging Deployment (only when is_staging_deployment is true)
# ============================================================================

- name: Deploy staging services
  ansible.builtin.include_tasks: deploy_service.yml
  loop: "{{ host_services | selectattr('staging', 'defined') | selectattr('staging') | list }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}-staging"
  vars:
    is_staging: true
    deploy_path: "/opt/staging/{{ service.name }}"
    service_port: "{{ service.port + staging_port_offset }}"
  when: is_staging_deployment | default(false)

# ============================================================================
# Kuma Provisioning (if Kuma is deployed)
# ============================================================================

- name: Check if Kuma is deployed
  ansible.builtin.stat:
    path: /opt/kuma/docker-compose.yml
  register: kuma_deployed

- name: Run Kuma provisioning
  when:
    - kuma_deployed.stat.exists
    - secrets.kuma.username | length > 0
    - secrets.kuma.password | length > 0
  block:
    - name: Create services.yml for Kuma
      ansible.builtin.copy:
        content: "{{ {'services': services} | to_nice_yaml }}"
        dest: /opt/kuma/services.yml
        mode: '0644'

    - name: Wait for Kuma to be ready
      ansible.builtin.uri:
        url: http://localhost:3001
        status_code: [200, 302]
      register: kuma_health
      retries: 12
      delay: 5
      until: kuma_health.status in [200, 302]
      failed_when: false

    - name: Run Kuma provisioning script
      ansible.builtin.shell: |
        export KUMA_URL="http://localhost:3001"
        export KUMA_USERNAME="{{ secrets.kuma.username }}"
        export KUMA_PASSWORD="{{ secrets.kuma.password }}"
        python3 -m pip install uptime-kuma-api-v2 pyyaml --quiet --break-system-packages 2>/dev/null || \
        python3 -m pip install uptime-kuma-api-v2 pyyaml --quiet
        python3 /opt/kuma/hooks/provision-kuma.py /opt/kuma/services.yml
      args:
        executable: /bin/bash
      register: kuma_provision
      failed_when: false
      when: kuma_health.status | default(0) in [200, 302]

    - name: Display Kuma provisioning result
      ansible.builtin.debug:
        msg: "{{ kuma_provision.stdout_lines | default(['Kuma provisioning skipped']) }}"
      when: kuma_provision is defined
