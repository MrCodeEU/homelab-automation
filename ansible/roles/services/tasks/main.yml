---
# Services Role - Docker Compose deployment with staging support
# ============================================================================

# Validate service configuration
- name: Validate service definitions
  ansible.builtin.assert:
    that:
      - service.name is defined
      - service.name | length > 0
      - service.host is defined
      - service.host | length > 0
      # Port validation: required unless port is 0 (no web UI, e.g., notification services)
      - service.port is defined
      - (service.port | int == 0) or (service.port | int > 0 and service.port | int < 65536)
    fail_msg: >-
      Service validation failed for {{ service.name | default('unknown') }}:
      Required fields: name, host, port (0 for no UI, or 1-65535)
    quiet: true
  loop: "{{ services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name | default('unknown') }}"
  when: service.enabled | default(true)

# Login to GitHub Container Registry for private images
- name: Login to GitHub Container Registry
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ secrets.github.username }}"
    password: "{{ secrets.github.token }}"
  when:
    - not ansible_check_mode
    - secrets.github.username | default('') | length > 0
    - secrets.github.token | default('') | length > 0
  no_log: true
  failed_when: false

# Build list of services for this host
- name: Filter services for this host
  ansible.builtin.set_fact:
    host_services: >-
      {%- set result = [] -%}
      {%- for service in services -%}
        {%- if service.host == inventory_hostname 
               and service.enabled | default(true) 
               and service.managed | default(true) 
               and not service.skip_deploy | default(false) -%}
          {%- set _ = result.append(service) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Display services to deploy
  ansible.builtin.debug:
    msg: "Deploying {{ host_services | length }} services: {{ host_services | map(attribute='name') | join(', ') }}"

# ============================================================================
# Production Deployment
# ============================================================================

- name: Prepare production services
  ansible.builtin.include_tasks: prepare_service.yml
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  vars:
    is_staging: false
    deploy_path: "{{ base_path }}/{{ service.name }}"

- name: Deploy production services (Async)
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/{{ service.name }}"
    state: present
    pull: always
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: deploy_results
  async: 300
  poll: 0
  when: not ansible_check_mode

- name: Wait for production services deployment
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ (deploy_results.results | default([])) }}"
  loop_control:
    label: "{{ ((item.service | default(item.item)) | default({'name': 'unknown'})).name }}"
  register: job_result
  until: job_result.finished
  retries: 30
  delay: 5
  when:
    - not ansible_check_mode
    - item.ansible_job_id is defined
  failed_when: false  # Don't fail the play - collect errors instead
  ignore_errors: true

# ============================================================================
# Staging Deployment (only on staging_host when is_staging_deployment is true)
# ============================================================================

# Check for services with dev/ folders (auto-detect staging services)
- name: Check for dev folders in services
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../services/{{ item.name }}/dev"
  loop: "{{ services }}"
  loop_control:
    loop_var: item
    label: "{{ item.name }}"
  register: dev_folder_check
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - item.enabled | default(true)
    - item.managed | default(true)
    - not item.skip_deploy | default(false)

# Build list of ALL staging-enabled services (services with dev/ folder)
- name: Filter staging services
  ansible.builtin.set_fact:
    staging_services: >-
      {%- set result = [] -%}
      {%- for check in dev_folder_check.results | default([]) -%}
        {%- if check.stat.exists | default(false) and check.stat.isdir | default(false) -%}
          {%- set _ = result.append(check.item) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - dev_folder_check.results is defined

- name: Display staging services to deploy
  ansible.builtin.debug:
    msg: "Deploying {{ staging_services | length }} staging services on {{ inventory_hostname }}: {{ staging_services | map(attribute='name') | join(', ') }}"
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - staging_services | default([]) | length > 0

- name: Prepare staging services
  ansible.builtin.include_tasks: prepare_service.yml
  loop: "{{ staging_services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}-staging"
  vars:
    is_staging: true
    deploy_path: "{{ base_path }}/staging/{{ service.name }}"
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host

- name: Deploy staging services (Async)
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/staging/{{ service.name }}"
    state: present
    pull: always
  loop: "{{ staging_services | default([]) }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}-staging"
  register: staging_deploy_results
  async: 300
  poll: 0
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - not ansible_check_mode

- name: Wait for staging services deployment
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ staging_deploy_results.results | default([]) }}"
  loop_control:
    label: "{{ ((item.service | default(item.item)) | default({'name': 'unknown'})).name }}-staging"
  register: staging_job_result
  until: staging_job_result.finished
  retries: 30
  delay: 5
  when:
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - not ansible_check_mode
    - item.ansible_job_id is defined
  failed_when: false  # Don't fail the play - collect errors instead
  ignore_errors: true

# ============================================================================
# Health Checks (Parallel)
# ============================================================================

# Launch all health checks in parallel
- name: Check service health (async)
  ansible.builtin.uri:
    url: "http://localhost:{{ service.port }}"
    status_code: [200, 301, 302, 400, 401, 403]
    timeout: 5
  loop: "{{ host_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  register: health_check_async
  async: 30
  poll: 0
  failed_when: false
  when:
    - not ansible_check_mode
    - service.port is defined
    - service.port | int > 0  # Skip services without web UI

# Wait for all health checks to complete (single wait instead of sequential)
- name: Wait for health checks to complete
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ health_check_async.results | default([]) }}"
  loop_control:
    label: "{{ item.service.name | default('unknown') }}"
  register: health_check_results
  until: health_check_results.finished
  retries: 6
  delay: 2
  failed_when: false
  when:
    - not ansible_check_mode
    - item.ansible_job_id is defined

# Display consolidated health results
- name: Display health check summary
  ansible.builtin.debug:
    msg: |
      Service Health:
      {% for result in health_check_results.results | default([]) %}
      - {{ result.item.service.name | default('unknown') }}: {{ 'HEALTHY' if result.status | default(0) in [200, 301, 302, 400, 401, 403] else 'PENDING' }}
      {% endfor %}
  when:
    - not ansible_check_mode
    - health_check_results is defined

# ============================================================================
# Kuma Provisioning (if Kuma is deployed)
# ============================================================================

- name: Check if Kuma is deployed
  ansible.builtin.stat:
    path: "{{ base_path }}/kuma/docker-compose.yml"
  register: kuma_deployed

- name: Run Kuma provisioning
  when:
    - not ansible_check_mode
    - kuma_deployed.stat.exists
    - secrets.kuma.username | default('') | length > 0
    - secrets.kuma.password | default('') | length > 0
  block:
    - name: Create services.yml for Kuma
      ansible.builtin.copy:
        content: "{{ {'services': services} | to_nice_yaml }}"
        dest: "{{ base_path }}/kuma/services.yml"
        mode: '0644'

    - name: Wait for Kuma to be ready
      ansible.builtin.uri:
        url: http://localhost:3001
        status_code: [200, 302]
      register: kuma_health
      retries: 12
      delay: 5
      until: kuma_health.status in [200, 302]
      failed_when: false

    - name: Install Kuma provisioning dependencies
      ansible.builtin.pip:
        name:
          - uptime-kuma-api-v2
          - pyyaml
        virtualenv: "{{ base_path }}/kuma/venv"
        virtualenv_command: python3 -m venv
        state: present
      register: kuma_deps_install
      when: kuma_health.status | default(0) in [200, 302]

    - name: Run Kuma provisioning script
      ansible.builtin.shell: |
        export KUMA_URL="http://localhost:3001"
        export KUMA_USERNAME="{{ secrets.kuma.username }}"
        export KUMA_PASSWORD="{{ secrets.kuma.password }}"
        {{ base_path }}/kuma/venv/bin/python3 {{ base_path }}/kuma/hooks/provision-kuma.py {{ base_path }}/kuma/services.yml
      args:
        executable: /bin/bash
      register: kuma_provision
      changed_when: "'Updated' in kuma_provision.stdout or 'Created' in kuma_provision.stdout"
      failed_when: false  # Don't block deployment if Kuma provisioning fails
      retries: 3
      delay: 5
      until: kuma_provision.rc == 0
      when:
        - kuma_health.status | default(0) in [200, 302]
        - kuma_deps_install is succeeded

    - name: Display Kuma provisioning result
      ansible.builtin.debug:
        msg: |
          {% if kuma_provision is defined %}
          {% if kuma_provision.rc == 0 %}
          ✓ Kuma provisioning succeeded
          {{ kuma_provision.stdout_lines | join('\n') }}
          {% else %}
          ⚠ Kuma provisioning failed (non-blocking):
          {{ kuma_provision.stdout_lines | join('\n') }}
          {% endif %}
          {% else %}
          Kuma provisioning skipped
          {% endif %}
      when: kuma_provision is defined

# ============================================================================
# Deployment Summary and Error Reporting
# ============================================================================

- name: Collect failed production deployments
  ansible.builtin.set_fact:
    failed_production_services: >-
      {%- set failed = [] -%}
      {%- for result in job_result.results | default([]) -%}
        {%- if result.failed | default(false) or result.msg is defined and 'Error' in result.msg -%}
          {%- set service_name = ((result.item.service | default(result.item.item)) | default({'name': 'unknown'})).name -%}
          {%- set error_msg = result.msg | default('Unknown error') -%}
          {%- set _ = failed.append({'name': service_name, 'error': error_msg}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ failed }}
  when:
    - not ansible_check_mode
    - job_result is defined

- name: Collect failed staging deployments
  ansible.builtin.set_fact:
    failed_staging_services: >-
      {%- set failed = [] -%}
      {%- for result in staging_job_result.results | default([]) -%}
        {%- if result.failed | default(false) or result.msg is defined and 'Error' in result.msg -%}
          {%- set service_name = ((result.item.service | default(result.item.item)) | default({'name': 'unknown'})).name -%}
          {%- set error_msg = result.msg | default('Unknown error') -%}
          {%- set _ = failed.append({'name': service_name, 'error': error_msg}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ failed }}
  when:
    - not ansible_check_mode
    - is_staging_deployment | default(false) | bool
    - inventory_hostname == staging_host
    - staging_job_result is defined

- name: Display deployment summary
  ansible.builtin.debug:
    msg: |
      ============================================================================
      DEPLOYMENT SUMMARY
      ============================================================================
      Production Services: {{ host_services | length }} total
      {% if failed_production_services | default([]) | length > 0 %}
      Failed: {{ failed_production_services | length }}
      {% for svc in failed_production_services %}
        - {{ svc.name }}: {{ svc.error | regex_replace('\n', ' ') | truncate(100) }}
      {% endfor %}
      {% else %}
      All production services deployed successfully!
      {% endif %}
      {% if is_staging_deployment | default(false) | bool and inventory_hostname == staging_host %}

      Staging Services: {{ staging_services | default([]) | length }} total (on {{ staging_host }})
      {% if failed_staging_services | default([]) | length > 0 %}
      Failed: {{ failed_staging_services | length }}
      {% for svc in failed_staging_services %}
        - {{ svc.name }}: {{ svc.error | regex_replace('\n', ' ') | truncate(100) }}
      {% endfor %}
      {% else %}
      All staging services deployed successfully!
      {% endif %}
      {% endif %}
      ============================================================================
  when: not ansible_check_mode

- name: Fail if critical services failed
  ansible.builtin.fail:
    msg: "Critical services failed to deploy: {{ failed_production_services | selectattr('name', 'in', critical_services) | map(attribute='name') | join(', ') }}"
  when:
    - not ansible_check_mode
    - critical_services | default([]) | length > 0
    - failed_production_services | default([]) | selectattr('name', 'in', critical_services) | list | length > 0
  vars:
    critical_services: ['caddy', 'kuma', 'ntfy']  # Services that must succeed for deployment to pass
