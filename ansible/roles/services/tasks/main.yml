---
- name: Ensure service directory exists
  file:
    path: "/opt/{{ item.name }}"
    state: directory
    mode: '0755'
  loop: "{{ services }}"
  when:
    - item.enabled | default(true)
    - item.managed | default(true)
    - inventory_hostname == item.host
    - item.name not in services_excluded_from_generic_deployment

- name: Copy docker-compose.yml
  template:
    src: "{{ playbook_dir }}/../../configs/{{ item.name }}/docker-compose.yml"
    dest: "/opt/{{ item.name }}/docker-compose.yml"
  loop: "{{ services }}"
  when:
    - item.enabled | default(true)
    - item.managed | default(true)
    - inventory_hostname == item.host
    - item.name not in services_excluded_from_generic_deployment
  ignore_errors: yes # Some services might not have a local config yet

- name: Create .env file with secrets
  template:
    src: env.j2
    dest: "/opt/{{ item.name }}/.env"
  loop: "{{ services }}"
  when:
    - item.enabled | default(true)
    - item.managed | default(true)
    - inventory_hostname == item.host
    - item.name not in services_excluded_from_generic_deployment
  vars:
    # Map secrets to template variables (renamed to avoid shadowing)
    nightscout_api_secret_var: "{{ nightscout_api_secret | default('') }}"
    link_up_username_var: "{{ link_up_username | default('') }}"
    link_up_password_var: "{{ link_up_password | default('') }}"
    nightscout_api_token_var: "{{ nightscout_api_token | default('') }}"
    nightscout_domain_var: "{{ nightscout_domain | default('') }}"
    bichon_encrypt_password_var: "{{ bichon_encrypt_password | default('') }}"

- name: Deploy service via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ item.name }}"
    state: present
  loop: "{{ services }}"
  when:
    - item.enabled | default(true)
    - item.managed | default(true)
    - inventory_hostname == item.host
    - item.name not in services_excluded_from_generic_deployment
    # Only run if docker-compose.yml exists
    - query('file', '/opt/' + item.name + '/docker-compose.yml')
