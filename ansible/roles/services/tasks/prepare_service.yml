---
# Prepare a single service (copy files, generate config)
# Variables: service, is_staging, deploy_path

- name: "{{ service.name }} - Ensure directory exists"
  ansible.builtin.file:
    path: "{{ deploy_path }}"
    state: directory
    mode: '0755'

# ============================================================================
# Sysctl Configuration (for services requiring kernel parameters)
# Supports both string ("key=value") and list (["key1=value1", "key2=value2"]) formats
# ============================================================================
- name: "{{ service.name }} - Configure sysctl requirements"
  ansible.posix.sysctl:
    name: "{{ item.split('=')[0] }}"
    value: "{{ item.split('=')[1] }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ [service.requires_sysctl] if service.requires_sysctl is string else service.requires_sysctl }}"
  loop_control:
    label: "{{ item }}"
  when:
    - service.requires_sysctl is defined
    - not ansible_check_mode

# Check for staging (dev/) or production service config
- name: "{{ service.name }} - Check for dev service config"
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../services/{{ service.name }}/dev/docker-compose.yml"
  register: dev_config
  when: is_staging | default(false)

- name: "{{ service.name }} - Check for production service config"
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../services/{{ service.name }}/docker-compose.yml"
  register: prod_config

# Determine source path: dev/ folder if staging and dev exists, otherwise root folder
- name: "{{ service.name }} - Set source path"
  ansible.builtin.set_fact:
    service_source_path: >-
      {{ playbook_dir }}/../../services/{{ service.name }}/{{
        'dev' if (is_staging | default(false) and dev_config.stat.exists | default(false))
        else ''
      }}/

- name: "{{ service.name }} - Log deployment type"
  ansible.builtin.debug:
    msg: "Deploying {{ service.name }} from {{ 'dev/' if (is_staging | default(false) and dev_config.stat.exists | default(false)) else 'production' }} config"

# ============================================================================
# Checksum-based skip: skip rsync + .env when nothing has changed
# ============================================================================
- name: "{{ service.name }} - Find service source files for checksum"
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ service_source_path }}"
    recurse: true
    file_type: file
    get_checksum: true
    follow: false
  register: service_source_files

- name: "{{ service.name }} - Compute source checksum"
  ansible.builtin.set_fact:
    prepare_source_hash: >-
      {{ (service | to_json +
          (service_source_files.files | default([]) | sort(attribute='path')
           | map(attribute='checksum') | join('')))
         | hash('sha256') }}

- name: "{{ service.name }} - Read stored prepare checksum"
  ansible.builtin.slurp:
    src: "{{ deploy_path }}/.prepare-checksum"
  register: prepare_stored_checksum
  failed_when: false

- name: "{{ service.name }} - Set prepare needed flag"
  ansible.builtin.set_fact:
    prepare_needed: >-
      {{ (force_redeploy | default(false) | bool) or
         (prepare_stored_checksum.failed | default(true)) or
         ((prepare_stored_checksum.content | default('') | b64decode | trim) != prepare_source_hash) }}

# Synchronize service files from determined source path
# Note: mitogen_task_isolation: fork is required because Mitogen doesn't handle synchronize correctly
#
# Skipped on ugreen: confirmed live (both via a PR check-mode run and by hand)
# that UGOS ships a patched rsync whose --server mode rejects every
# destination with "invalid path" - reproduced against /tmp, an existing
# subvolume, and the real deploy path alike, so it isn't about the path.
# `ug_start_server, check access user: 0, group: 0` in the output confirms
# it's UGOS's own access-control wrapper around --server mode, not a stock
# rsync error. SFTP (used by roles/backup-remote-target) is unaffected -
# this is specific to ad-hoc rsync-over-ssh.
- name: "{{ service.name }} - Synchronize service files"
  ansible.posix.synchronize:
    src: "{{ service_source_path }}"
    dest: "{{ deploy_path }}/"
    delete: true  # Remove files not in source to prevent stale configs
    recursive: true
    rsync_opts:
      - "--chmod=D0755,F0644"
      - "--exclude=.env"    # Don't delete .env file
      - "--exclude=venv/"   # Don't delete Python venv (created by hooks)
      - "--quiet"           # Reduce log verbosity
  delegate_to: localhost
  become: false  # Run as local user, not root (avoids permission issues with synchronize)
  vars:
    # Fork a subprocess for this task to bypass Mitogen (which breaks synchronize)
    mitogen_task_isolation: fork
  when:
    - prepare_needed | default(true) | bool
    - (is_staging | default(false) and dev_config.stat.exists | default(false)) or prod_config.stat.exists
    - inventory_hostname not in (groups['ugreen'] | default([]))

# ugreen equivalent: ansible.builtin.copy transfers over Ansible's own
# SFTP/SCP connection plugin, never invoking the remote rsync binary at all.
# Trade-off, accepted for now: no `delete: true` equivalent, so a file
# removed from the repo won't be removed from an already-deployed copy on
# ugreen. Acceptable for a small, single-purpose service directory; revisit
# if ugreen ever hosts something where stale files would matter.
- name: "{{ service.name }} - Copy service files (ugreen: rsync --server is blocked by UGOS)"
  ansible.builtin.copy:
    src: "{{ service_source_path }}/"
    dest: "{{ deploy_path }}/"
    mode: preserve
  when:
    - prepare_needed | default(true) | bool
    - (is_staging | default(false) and dev_config.stat.exists | default(false)) or prod_config.stat.exists
    - inventory_hostname in (groups['ugreen'] | default([]))
  # copy's pre-transfer stat over UGOS's SFTP has shown transient
  # "Input/output error" (seen 2026-07-29, deploy run 30480362979) - not a
  # real error, just the same flaky SFTP subsystem that already forced this
  # task to exist instead of synchronize. Retry rather than fail the whole
  # deploy over a blip.
  retries: 3
  delay: 5
  register: ugreen_copy_result
  until: ugreen_copy_result is not failed

# Generate .env file with secrets
- name: "{{ service.name }} - Generate .env file"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_path }}/.env"
    mode: '0600'
  vars:
    service_name: "{{ service.name }}"
    project_name: "{{ service.name if not is_staging else (service.name + '-staging') }}"
    image_tag: "latest"  # Default, can be overridden in docker-compose.yml
    # Caddy only runs on mljr and reaches other hosts over Tailscale (not localhost),
    # so loopback-only binding would cut off cross-host services. Default to loopback
    # when co-located with Caddy, otherwise bind to this host's own Tailscale interface
    # (still reachable from Caddy, no longer exposed on LAN/public interfaces).
    bind_addr: >-
      {{ service.public_bind | default(
           '127.0.0.1' if inventory_hostname == 'mljr'
           else hostvars[inventory_hostname]['tailscale_ip']
         ) }}
  no_log: true
  # Always regenerate .env — secrets change independently of service files

# Save checksum so we can skip this on next run if nothing changed
- name: "{{ service.name }} - Save prepare checksum"
  ansible.builtin.copy:
    content: "{{ prepare_source_hash }}"
    dest: "{{ deploy_path }}/.prepare-checksum"
    mode: '0600'
  when:
    - prepare_needed | default(true) | bool
    - not ansible_check_mode

# ============================================================================
# Pre-Deploy Hooks
# ============================================================================
- name: "{{ service.name }} - Check for pre-deploy hook"
  ansible.builtin.stat:
    path: "{{ deploy_path }}/hooks/pre-deploy.sh"
  register: pre_deploy_hook

- name: "{{ service.name }} - Run pre-deploy hook"
  ansible.builtin.shell: |
    set -e
    export SERVICE_NAME="{{ service.name }}"
    export SERVICE_PATH="{{ deploy_path }}"
    if [ -f {{ deploy_path }}/.env ]; then
      while IFS='=' read -r key value; do
        case "$key" in
          ''|\#*) continue ;;
        esac
        export "$key=$value"
      done < {{ deploy_path }}/.env
    fi
    bash {{ deploy_path }}/hooks/pre-deploy.sh "{{ service.name }}" "{{ deploy_path }}"
  args:
    executable: /bin/bash
    chdir: "{{ deploy_path }}"
  when:
    - not ansible_check_mode
    - pre_deploy_hook.stat.exists | default(false)
  register: pre_deploy_result
  changed_when: "'CHANGED' in pre_deploy_result.stdout | default('')"
  failed_when: pre_deploy_result.rc != 0
