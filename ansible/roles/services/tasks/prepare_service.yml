---
# Prepare a single service (copy files, generate config)
# Variables: service, is_staging, deploy_path, service_port

- name: "{{ service.name }} - Ensure directory exists"
  ansible.builtin.file:
    path: "{{ deploy_path }}"
    state: directory
    mode: '0755'

- name: "{{ service.name }} - Check for service config"
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../services/{{ service.name }}/docker-compose.yml"
  register: service_config

- name: "{{ service.name }} - Synchronize service files"
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../services/{{ service.name }}/"
    dest: "{{ deploy_path }}/"
    delete: false
    recursive: true
    rsync_opts:
      - "--chmod=D0755,F0644"
  delegate_to: localhost
  when: service_config.stat.exists

- name: "{{ service.name }} - Update port mappings for staging"
  ansible.builtin.replace:
    path: "{{ deploy_path }}/docker-compose.yml"
    regexp: '(\s+- ")\d+(:{{ service.port }}.*")'
    replace: '\g<1>{{ service_port }}\g<2>'
  when:
    - service_config.stat.exists
    - is_staging | default(false)

- name: "{{ service.name }} - Generate .env file"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_path }}/.env"
    mode: '0600'
  vars:
    service_name: "{{ service.name }}"
  no_log: true
