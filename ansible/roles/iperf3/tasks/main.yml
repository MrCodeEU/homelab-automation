---
# iperf3 Role - Network performance testing server on all rocky hosts
# ============================================================================
# Runs an iperf3 server in a Docker container for bandwidth/latency testing
# between homelab nodes and from external clients.
#
# Usage (from any host with iperf3 installed):
#   iperf3 -c <host-tailscale-ip>          # TCP bandwidth test
#   iperf3 -c <host-tailscale-ip> -u       # UDP test
#   iperf3 -c <host-tailscale-ip> -R       # Reverse (server→client)
#   iperf3 -c <host-tailscale-ip> -t 30    # 30 second test
#
# Host IPs (Tailscale):
#   mljr: 100.100.20.1
#   nuc:  100.100.10.1
#   nas:  100.100.10.2
#
# Port: 5201 (TCP+UDP, Tailscale-only — not exposed to public internet)
# ============================================================================

- name: Ensure iperf3 directory exists
  ansible.builtin.file:
    path: "{{ base_path }}/iperf3"
    state: directory
    mode: '0755'

- name: Deploy iperf3 docker-compose
  ansible.builtin.copy:
    dest: "{{ base_path }}/iperf3/docker-compose.yml"
    mode: '0644'
    content: |
      services:
        iperf3:
          image: networkstatic/iperf3:latest
          container_name: iperf3
          restart: unless-stopped
          network_mode: host
          command: ["-s"]
          logging:
            driver: "json-file"
            options:
              max-size: "5m"
              max-file: "2"

# ugreen (UGOS/Debian) has no firewalld - nothing else in this repo manages
# its firewall either (backup-remote-target reuses the already-open port 22),
# and it is Tailscale-only the same way the rocky hosts are, so skipping this
# is consistent with the existing posture rather than a gap.
- name: Open iperf3 port in firewall (Tailscale zone only)
  ansible.posix.firewalld:
    port: "5201/tcp"
    zone: trusted
    permanent: true
    immediate: true
    state: enabled
  when: inventory_hostname not in groups['ugreen'] | default([])

- name: Open iperf3 UDP port in firewall (Tailscale zone only)
  ansible.posix.firewalld:
    port: "5201/udp"
    zone: trusted
    permanent: true
    immediate: true
    state: enabled
  when: inventory_hostname not in groups['ugreen'] | default([])

- name: Deploy iperf3 container
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/iperf3"
    state: present
    pull: always
  when: not ansible_check_mode
  register: iperf3_result

- name: Display iperf3 status
  ansible.builtin.debug:
    msg: |
      iperf3 server running on {{ inventory_hostname }} ({{ ansible_host }})
      Test with: iperf3 -c {{ hostvars[inventory_hostname]['tailscale_ip'] }}
  when: iperf3_result is changed or ansible_check_mode
