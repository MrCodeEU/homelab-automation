---
# HetrixTools Agent Configuration
# ============================================================================

# HetrixTools API token for agent registration
hetrixtools_api_token: "{{ lookup('env', 'HETRIXTOOLS_API_TOKEN') }}"

# Agent installation flags (0 = disabled, 1 = enabled)
# These flags control optional behaviors of the HetrixTools agent during install/runtime:
hetrixtools_check_type: 0              # 0 = use the agent's default/basic check type; 1 = enable extended/explicit check-type configuration
hetrixtools_server_type: 0             # 0 = do not override server type (let HetrixTools/agent defaults apply); 1 = explicitly set server type via this agent configuration
hetrixtools_collection_user: 0         # 0 = run data collection as the default system user; 1 = use a dedicated/collection-specific user account if configured
hetrixtools_custom_services: 0         # 0 = monitor only standard/default services; 1 = also monitor user-defined custom services
hetrixtools_disable_iptables: 0        # 0 = leave iptables firewall management unchanged; 1 = prevent the agent from modifying or depending on iptables
hetrixtools_disable_rpm: 0             # 0 = allow RPM-based package checks/operations; 1 = skip/disable RPM-related checks and operations
