---
# Beszel Agent Role - Deploys monitoring agent to all managed hosts
# ============================================================================
# The agent connects to the Beszel hub and reports system/container metrics.
#
# Required secrets:
#   - BESZEL_KEY: Public SSH key from the Beszel hub (Settings > Copy Public Key)
#
# The hub URL is constructed from the mljr host's Tailscale address.
# ============================================================================

- name: Set Beszel hub URL
  ansible.builtin.set_fact:
    beszel_hub_url: "http://{{ hostvars['mljr']['ansible_host'] }}:8090"

- name: Check if Beszel key is configured
  ansible.builtin.assert:
    that:
      - secrets.beszel.key | default('') | length > 0
    fail_msg: |
      Beszel public key not configured!

      To get the key:
      1. Deploy the Beszel hub first: ansible-playbook playbooks/site.yml --tags services --limit mljr
      2. Open https://monitor.mljr.eu and create an admin account
      3. Go to Settings > Copy Public Key
      4. Add BESZEL_KEY to your GitHub secrets or environment
    quiet: true
  when: not ansible_check_mode

- name: Ensure Beszel agent directory exists
  ansible.builtin.file:
    path: "{{ base_path }}/beszel-agent"
    state: directory
    mode: '0755'

- name: Deploy Beszel agent docker-compose
  ansible.builtin.copy:
    dest: "{{ base_path }}/beszel-agent/docker-compose.yml"
    mode: '0644'
    content: |
      services:
        beszel-agent:
          image: henrygd/beszel-agent:latest
          container_name: beszel-agent
          restart: unless-stopped
          network_mode: host
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
          environment:
            PORT: "45876"
            KEY: "{{ secrets.beszel.key }}"
            HUB_URL: "{{ beszel_hub_url }}"
            TOKEN: "{{ secrets.beszel.token }}"
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
  no_log: true

- name: Deploy Beszel agent
  community.docker.docker_compose_v2:
    project_src: "{{ base_path }}/beszel-agent"
    state: present
    pull: always
  when: not ansible_check_mode
  register: beszel_agent_result

- name: Display Beszel agent status
  ansible.builtin.debug:
    msg: |
      Beszel agent deployed on {{ inventory_hostname }}
      Hub URL: {{ beszel_hub_url }}

      {% if inventory_hostname != 'mljr' %}
      NOTE: You need to add this system in the Beszel hub UI:
      1. Open https://monitor.mljr.eu
      2. Click "Add System"
      3. Enter:
         - Name: {{ inventory_hostname }}
         - Host: {{ ansible_host }}
         - Port: 45876
      {% endif %}
  when: beszel_agent_result is changed or ansible_check_mode
