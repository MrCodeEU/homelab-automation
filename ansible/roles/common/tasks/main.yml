---
- name: Update cache and install packages (Rocky/RedHat)
  dnf:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == "RedHat"

- name: Update cache and install packages (Debian/Ubuntu)
  apt:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Cleanup legacy deployment artifacts
  file:
    path: /tmp/homelab-deploy
    state: absent
