---
# Common role - base package installation
# Optimized: Uses cache_valid_time to reduce update frequency

- name: Update cache and install packages (Rocky/RedHat)
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Update cache and install packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - unzip
      - jq
      - tar
      - lsof
      - python3
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600  # Only update cache if older than 1 hour
  when: ansible_facts['os_family'] == "Debian"

- name: Cleanup legacy deployment artifacts
  ansible.builtin.file:
    path: /tmp/homelab-deploy
    state: absent
  changed_when: false  # Don't report change for cleanup

