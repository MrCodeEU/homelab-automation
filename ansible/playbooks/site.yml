---
# Homelab Automation - Main Playbook
# ============================================================================
# Deploys and configures all services across managed hosts
#
# Host Groups:
#   - managed: Full Ansible deployment (base, docker, services)
#   - rocky: Rocky Linux servers (mljr=production, nuc=staging)
#   - unraid: Unraid NAS hosts
#   - proxy_only: Only used for Caddy configuration
#
# Role Targeting:
#   - base:     rocky (both)  - System packages and Docker
#   - backup:   rocky (both)  - Backup and restore
#   - services: rocky (both)  - Docker Compose (prod on mljr, staging on nuc)
#   - caddy:    mljr only     - Reverse proxy (main ingress)
#   - security: mljr only     - Fail2ban (nuc is Tailscale-only)
#   - glance:   mljr only     - Dashboard
#   - mailcow:  mljr only     - Mail server
# ============================================================================

# Gather facts from managed hosts only
# Note: proxy_only hosts are not SSH-reachable, they only define services for Caddy
- name: Gather Facts
  hosts: managed
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
    - date_time
  tags:
    - always

# ============================================================================
# Base Setup (Rocky Linux hosts only)
# ============================================================================
- name: Base Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - base
  roles:
    - base

# ============================================================================
# Security (all rocky hosts - fail2ban-ui only on mljr)
# ============================================================================
- name: Security Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - security
    - fail2ban
  roles:
    - fail2ban

# ============================================================================
# HetrixTools Agent (mljr only - external uptime monitoring)
# ============================================================================
- name: HetrixTools Monitoring Agent
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - monitoring
    - hetrixtools
  roles:
    - hetrixtools-agent

# ============================================================================
# Backup (before services to enable restore on fresh install)
# ============================================================================
- name: Backup Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - backup
  roles:
    - backup

# ============================================================================
# Services
# ============================================================================
- name: Glance Dashboard
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - glance
  roles:
    - glance

- name: Mailcow Mail Server
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - mailcow
  vars:
    mailcow_hostname: "{{ (services | selectattr('name', 'equalto', 'mailcow') | first).domain }}"
  roles:
    - mailcow

# ============================================================================
# Authelia Identity Provider (mljr only)
# ============================================================================
- name: Authelia Identity Provider
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - authelia
  roles:
    - authelia

- name: Docker Services
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
  roles:
    - services

# ============================================================================
# Speedtest Service (mljr only - orchestrator)
# ============================================================================
- name: Speedtest Service
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - speedtest
  roles:
    - speedtest

# ============================================================================
# Beszel Agent (all Rocky hosts - system monitoring)
# ============================================================================
- name: Beszel Monitoring Agent
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - beszel-agent
    - monitoring
  roles:
    - beszel-agent

# ============================================================================
# Dozzle Agent (mljr only - nuc runs main instance with local docker.sock)
# ============================================================================
- name: Dozzle Log Agent
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - dozzle-agent
    - monitoring
  roles:
    - dozzle-agent

# ============================================================================
# Caddy Reverse Proxy (mljr only - main ingress point)
# ============================================================================
- name: Caddy Setup
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - caddy
  roles:
    - caddy
