---
- name: Base Setup
  hosts: rocky:debian
  become: true
  roles:
    - common
    - docker

- name: Caddy Setup
  hosts: rocky
  become: true
  roles:
    - caddy

- name: Glance Setup
  hosts: mljr
  become: true
  roles:
    - glance

- name: Services Setup
  hosts: rocky:debian
  become: true
  roles:
    - services

- name: Unraid Setup
  hosts: unraid
  gather_facts: false
  roles:
    - unraid
