---
# Main site playbook - optimized for speed
# Uses free strategy for parallel execution where possible
#
# Host groups:
#   - rocky: Fully managed Rocky Linux servers
#   - unraid: Unraid NAS (managed via scripts)
#   - proxy_only: Hosts only used for Caddy reverse proxy (no SSH access)

# Gather facts first - from managed hosts and proxy_only (needed for Caddy template)
- name: Gather Facts
  hosts: rocky:unraid:proxy_only
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
  tags:
    - always
  tasks: []

- name: Base Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered above
  tags:
    - base
    - common
    - docker
  roles:
    - common
    - docker

- name: Caddy Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - caddy
  pre_tasks:
    - name: Build list of services for staging deployment
      ansible.builtin.set_fact:
        services_with_dev: "{{ (services | selectattr('staging', 'undefined') | map(attribute='name') | list) + (services | selectattr('staging', 'defined') | selectattr('staging') | map(attribute='name') | list) }}"
      when: is_staging_deployment | default(false)

    - name: Set empty list for production deployment
      ansible.builtin.set_fact:
        services_with_dev: []
      when: not (is_staging_deployment | default(false))
  roles:
    - caddy

- name: Security Setup
  hosts: rocky
  become: true
  gather_facts: false
  tags:
    - security
    - fail2ban
  roles:
    - fail2ban

- name: Glance Setup
  hosts: mljr
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - glance
  roles:
    - glance

- name: Mailcow Setup
  hosts: mljr
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - mailcow
  vars:
    mailcow_hostname: "{{ (services | selectattr('name', 'equalto', 'mailcow') | first).domain }}"
  roles:
    - mailcow

- name: Backup Setup
  hosts: mljr
  become: true
  gather_facts: false
  tags:
    - backup
  roles:
    - backup

- name: Services Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered above
  strategy: free  # Run tasks in parallel across hosts
  tags:
    - services
  roles:
    - services

- name: Unraid Setup
  hosts: unraid
  gather_facts: false
  tags:
    - unraid
  roles:
    - unraid
