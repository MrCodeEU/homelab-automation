---
# Main site playbook - optimized for speed
# Uses free strategy for parallel execution where possible

# Gather facts first - always runs regardless of tags
- name: Gather Facts
  hosts: all
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
  tags:
    - always
  tasks: []

- name: Base Setup
  hosts: rocky:debian
  become: true
  gather_facts: false  # Already gathered above
  tags:
    - base
    - common
    - docker
  roles:
    - common
    - docker

- name: Caddy Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - caddy
  roles:
    - caddy

- name: Security Setup
  hosts: rocky:debian
  become: true
  gather_facts: false
  tags:
    - security
    - fail2ban
  roles:
    - fail2ban

- name: Glance Setup
  hosts: mljr
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - glance
  roles:
    - glance

- name: Services Setup
  hosts: rocky:debian
  become: true
  gather_facts: false  # Already gathered in base setup
  strategy: free  # Run tasks in parallel across hosts
  tags:
    - services
  roles:
    - services

- name: Unraid Setup
  hosts: unraid
  gather_facts: false
  tags:
    - unraid
  roles:
    - unraid
