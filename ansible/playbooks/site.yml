---
# Main site playbook - optimized for speed
# Uses free strategy for parallel execution where possible
#
# Host groups:
#   - rocky: Fully managed Rocky Linux servers
#   - unraid: Unraid NAS (managed via scripts)
#   - proxy_only: Hosts only used for Caddy reverse proxy (no SSH access)

# Gather facts first - only from managed hosts
- name: Gather Facts
  hosts: rocky:unraid
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
  tags:
    - always
  tasks: []

- name: Base Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered above
  tags:
    - base
    - common
    - docker
  roles:
    - common
    - docker

- name: Caddy Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - caddy
  pre_tasks:
    - name: Check for dev configuration folders
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../configs/{{ item.name }}/dev"
      register: dev_config_check
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"
      when: env_suffix != ""

    - name: Build list of services with dev configs
      ansible.builtin.set_fact:
        services_with_dev: "{{ dev_config_check.results | default([]) | selectattr('stat', 'defined') | selectattr('stat.exists', 'equalto', true) | map(attribute='item.name') | list }}"
      when: env_suffix != ""

    - name: Set empty list if no dev environment
      ansible.builtin.set_fact:
        services_with_dev: []
      when: env_suffix == ""
  roles:
    - caddy

- name: Security Setup
  hosts: rocky
  become: true
  gather_facts: false
  tags:
    - security
    - fail2ban
  roles:
    - fail2ban

- name: Glance Setup
  hosts: mljr
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - glance
  roles:
    - glance

- name: Mailcow Setup
  hosts: mljr
  become: true
  gather_facts: false  # Already gathered in base setup
  tags:
    - mailcow
  vars:
    mailcow_hostname: "{{ (services | selectattr('name', 'equalto', 'mailcow') | first).domain }}"
  roles:
    - mailcow

- name: Backup Setup
  hosts: mljr
  become: true
  gather_facts: false
  tags:
    - backup
  roles:
    - backup

- name: Services Setup
  hosts: rocky
  become: true
  gather_facts: false  # Already gathered above
  strategy: free  # Run tasks in parallel across hosts
  tags:
    - services
  roles:
    - services

- name: Unraid Setup
  hosts: unraid
  gather_facts: false
  tags:
    - unraid
  roles:
    - unraid
