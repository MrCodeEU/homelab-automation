---
# Homelab Automation - Main Playbook
# ============================================================================
# Deploys and configures all services across managed hosts
#
# Host Groups:
#   - managed: Full Ansible deployment (base, docker, services)
#   - rocky: Rocky Linux servers (subset of managed)
#   - unraid: Unraid NAS hosts
#   - proxy_only: Only used for Caddy configuration
#
# Tags:
#   - base: System packages and Docker
#   - caddy: Reverse proxy configuration
#   - services: Docker Compose services
#   - backup: Backup and restore
#   - security: Fail2ban and security
#   - glance: Dashboard
#   - mailcow: Mail server
# ============================================================================

# Gather facts from managed hosts only
# Note: proxy_only hosts are not SSH-reachable, they only define services for Caddy
- name: Gather Facts
  hosts: managed
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
    - date_time
  tags:
    - always

# ============================================================================
# Base Setup (Rocky Linux hosts only)
# ============================================================================
- name: Base Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - base
  roles:
    - base

# ============================================================================
# Security
# ============================================================================
- name: Security Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - security
    - fail2ban
  roles:
    - fail2ban

# ============================================================================
# Backup (before services to enable restore on fresh install)
# ============================================================================
- name: Backup Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - backup
  roles:
    - backup

# ============================================================================
# Services
# ============================================================================
- name: Glance Dashboard
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - glance
  roles:
    - glance

- name: Mailcow Mail Server
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - mailcow
  vars:
    mailcow_hostname: "{{ (services | selectattr('name', 'equalto', 'mailcow') | first).domain }}"
  roles:
    - mailcow

- name: Docker Services
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
  roles:
    - services

# ============================================================================
# Caddy Reverse Proxy (always last)
# ============================================================================
- name: Caddy Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - caddy
  roles:
    - caddy
