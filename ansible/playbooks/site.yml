---
# Homelab Automation - Main Playbook
# ============================================================================
# Deploys and configures all services across managed hosts
#
# Host Groups:
#   - managed: Full Ansible deployment (base, docker, services)
#   - rocky: Rocky Linux servers (mljr=production, nuc=staging)
#   - unraid: Unraid NAS hosts
#   - proxy_only: Only used for Caddy configuration
#
# Role Targeting:
#   - base:     rocky (both)  - System packages and Docker
#   - backup:   rocky (both)  - Backup and restore
#   - services: rocky (both)  - Docker Compose (prod on mljr, staging on nuc)
#   - caddy:    mljr only     - Reverse proxy (main ingress)
#   - security: mljr only     - Fail2ban (nuc is Tailscale-only)
#   - glance:   mljr only     - Dashboard
#   - mailcow:  mljr only     - Mail server
# ============================================================================

# Gather facts from managed hosts only
# Note: proxy_only hosts are not SSH-reachable, they only define services for Caddy
- name: Gather Facts
  hosts: managed
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
    - date_time
  tags:
    - always

- name: Base Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - base
  roles:
    - base

# ============================================================================
# Container Reconciliation (remove retired standalone containers before deploy)
# ============================================================================
- name: Container Reconciliation
  hosts: managed
  become: true
  gather_facts: false
  strategy: free
  tags:
    - cleanup
    - services
    - monitoring
  roles:
    - container-reconcile

# ============================================================================
# HetrixTools Agent (mljr only - external uptime monitoring)
# ============================================================================
- name: HetrixTools Monitoring Agent
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - monitoring
    - hetrixtools
  roles:
    - hetrixtools-agent

# ============================================================================
# Backup (before services to enable restore on fresh install)
# ============================================================================
- name: Backup Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - backup
  roles:
    - backup

# ============================================================================
# Services
# ============================================================================
- name: Glance Dashboard
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - glance
  roles:
    - glance

- name: Mailcow Mail Server
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - mailcow
  vars:
    mailcow_hostname: "{{ (services | selectattr('name', 'equalto', 'mailcow') | first).domain }}"
  roles:
    - mailcow

# ============================================================================
# Authelia Identity Provider (mljr only)
# ============================================================================
- name: Authelia Identity Provider
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - authelia
  roles:
    - authelia

- name: Docker Services
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
  roles:
    - services

# ============================================================================
# CrowdSec Firewall Bouncer (mljr only - host-level enforcement)
# ============================================================================
- name: CrowdSec Firewall Bouncer
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - security
    - crowdsec
  roles:
    - role: crowdsec-firewall-bouncer
      when: crowdsec_firewall_bouncer_enabled | default(false) | bool

# ============================================================================
# Grafana Alloy Agent (Rocky hosts only - NAS/Unraid is managed manually)
# ============================================================================
- name: Grafana Alloy Telemetry Agent
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - grafana-alloy
    - monitoring
  roles:
    - grafana-alloy

# ============================================================================
# iperf3 (all Rocky hosts - network performance testing)
# ============================================================================
- name: iperf3 Network Test Server
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - iperf3
    - monitoring
  roles:
    - iperf3

# ============================================================================
# Hawser Agent (all rocky hosts - enables Dockhand remote Docker management)
# ============================================================================
- name: Hawser Docker Agent
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - hawser-agent
    - monitoring
  roles:
    - hawser-agent

# ============================================================================
# Homepage Data Sync (mljr only - syncs mljr-data site-data.json for homepage)
# ============================================================================
- name: Homepage Data Sync
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
    - homepage-data-sync
  roles:
    - homepage-data-sync

# ============================================================================
# Caddy Reverse Proxy (mljr only - main ingress point)
# ============================================================================
- name: Caddy Setup
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - caddy
  roles:
    - caddy
