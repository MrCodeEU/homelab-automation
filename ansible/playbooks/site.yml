---
# Homelab Automation - Main Playbook
# ============================================================================
# Deploys and configures all services across managed hosts
#
# Host Groups:
#   - managed: Full Ansible deployment (base, docker, services)
#   - rocky: Rocky Linux servers (mljr=production, nuc=staging)
#   - unraid: Unraid NAS hosts
#   - proxy_only: Only used for Caddy configuration
#
# Role Targeting:
#   - base:     rocky (both)  - System packages and Docker
#   - backup:   rocky (both)  - Backup and restore
#   - services: rocky (both)  - Docker Compose (prod on mljr, staging on nuc)
#   - caddy:    mljr only     - Reverse proxy (main ingress)
#   - security: mljr only     - Fail2ban (nuc is Tailscale-only)
#   - glance:   mljr only     - Dashboard
#   - mailcow:  mljr only     - Mail server
# ============================================================================

# Gather facts from managed hosts only
# Note: proxy_only hosts are not SSH-reachable, they only define services for Caddy
- name: Gather Facts
  hosts: managed
  gather_facts: true
  gather_subset:
    - min
    - os_family
    - distribution
    - service_mgr
    - date_time
  tags:
    - always

# ============================================================================
# Backup-to-Ugreen keypair (nuc only, runs before anything that consumes it)
# ============================================================================
# Backup Setup (below, rocky) and Unraid Services (unraid-backup) both read
# hostvars['nuc']['backup_remote_privkey'], so this must run before either.
# Placed right after fact-gathering rather than near Health Report Agent State
# (which also runs on nuc) because Backup Setup runs earlier in this file than
# that play does.
- name: Backup Remote Key
  hosts: nuc
  become: true
  gather_facts: false
  tags:
    - backup
    - services
  roles:
    - backup-remote-key

# ============================================================================
# Ugreen NAS - backup target (chrooted sftp user, sshd Match block)
# ============================================================================
- name: Backup Remote Target
  hosts: ugreen
  become: true
  gather_facts: false
  # ugreen is a backup *target*, never a source. When its filesystem died on
  # 2026-07-31 this play failed on "Operation not permitted" creating the chroot
  # root, which aborted the whole run before Caddy or Docker Services - so one
  # dead backup target took every other host's deploy with it. Skipped by flag
  # rather than removed, and unreachable is not fatal either.
  ignore_unreachable: true
  tags:
    - backup
    - services
    - ugreen
  roles:
    - role: backup-remote-target
      when: ugreen_enabled | default(true) | bool

# ============================================================================
# NAS Syncthing key (nas only, runs before Ugreen Services consumes it)
# ============================================================================
# Reads the NAS's existing Syncthing API key so syncthing-ugreen's post-deploy
# hook can provision the cluster join. Must run before the Ugreen Services
# play below - same cross-play hostvars pattern as Backup Remote Key.
- name: Syncthing NAS Key
  hosts: nas
  become: true
  gather_facts: false
  tags:
    - services
    - ugreen
  roles:
    - syncthing-nas-key

- name: Base Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - base
  roles:
    - base

# ============================================================================
# Container Reconciliation (remove retired standalone containers before deploy)
# ============================================================================
- name: Container Reconciliation
  # rocky only: container-reconcile uses community.docker.docker_container_info,
  # which needs the docker Python SDK. Unraid does not have it.
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - cleanup
    - services
    - monitoring
  roles:
    - container-reconcile

# ============================================================================
# HetrixTools Agent (mljr only - external uptime monitoring)
# ============================================================================
- name: HetrixTools Monitoring Agent
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - monitoring
    - hetrixtools
  roles:
    - hetrixtools-agent

# ============================================================================
# Backup (before services to enable restore on fresh install)
# ============================================================================
- name: Backup Setup
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - backup
  roles:
    - backup

# ============================================================================
# Services
# ============================================================================
- name: Glance Dashboard
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - glance
  roles:
    - glance

- name: Mailcow Mail Server
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - mailcow
  vars:
    mailcow_hostname: "{{ (services | selectattr('name', 'equalto', 'mailcow') | first).domain }}"
  roles:
    - mailcow

# ============================================================================
# Authelia Identity Provider (mljr only)
# ============================================================================
- name: Authelia Identity Provider
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - authelia
  roles:
    - authelia

# ============================================================================
# Health Report Agent - host-side state (nuc only)
# ============================================================================
# Must run before both the Docker Services play (the container mounts these
# directories) and the Host Facts Endpoint play (which authorizes the public
# key generated here).
- name: Health Report Agent State
  hosts: nuc
  become: true
  gather_facts: false
  tags:
    - services
    - healthreport
    - monitoring
  roles:
    - healthreport

# ============================================================================
# Host Facts Endpoint (all managed hosts)
# ============================================================================
# Read-only facts script plus a forced-command SSH key, so the agent on nuc can
# read CrowdSec, nftables and Unraid array state without opening a new port.
- name: Host Facts Endpoint
  hosts: managed
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
    - healthreport
    - monitoring
    - security
  roles:
    - host-facts-endpoint

- name: Docker Services
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
  roles:
    - services

# ============================================================================
# Unraid Services (nas - only catalog entries marked `managed: true`)
# ============================================================================
# The NAS is partially managed: most containers still belong to the Unraid UI.
# cleanup_enabled is forced false in group_vars/unraid.yml so orphan cleanup can
# never touch them. unraid-bootstrap must run first - it creates the array-side
# layout the services role deploys into.
- name: Unraid Services
  hosts: unraid
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
    - unraid
  roles:
    - unraid-bootstrap
    - unraid-backup
    - services

# ============================================================================
# Ugreen Services (real Debian, persistent root filesystem - no bootstrap
# role needed the way Unraid's tmpfs root requires one; base_path just needs
# to exist once)
# ============================================================================
- name: Ugreen Services
  hosts: ugreen
  become: true
  gather_facts: false
  ignore_unreachable: true
  tags:
    - services
    - ugreen
  pre_tasks:
    - name: Ensure base_path exists
      ansible.builtin.file:
        path: "{{ base_path }}"
        state: directory
        mode: "0755"
      when: ugreen_enabled | default(true) | bool
  roles:
    - role: services
      when: ugreen_enabled | default(true) | bool

# ============================================================================
# CrowdSec Firewall Bouncer (mljr only - host-level enforcement)
# ============================================================================
- name: CrowdSec Firewall Bouncer
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - security
    - crowdsec
  roles:
    - role: crowdsec-firewall-bouncer
      when: crowdsec_firewall_bouncer_enabled | default(false) | bool

# ============================================================================
# Grafana Alloy Agent (Rocky hosts only - NAS/Unraid is managed manually)
# ============================================================================
- name: Grafana Alloy Telemetry Agent
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - grafana-alloy
    - monitoring
  roles:
    - grafana-alloy

# ============================================================================
# iperf3 (all Rocky hosts - network performance testing)
# ============================================================================
- name: iperf3 Network Test Server
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - iperf3
    - monitoring
  roles:
    - iperf3

# ============================================================================
# Hawser Agent (all rocky hosts - enables Dockhand remote Docker management)
# ============================================================================
- name: Hawser Docker Agent
  hosts: rocky
  become: true
  gather_facts: false
  strategy: free
  tags:
    - hawser-agent
    - monitoring
  roles:
    - hawser-agent

# ============================================================================
# Homepage Data Sync (mljr only - syncs mljr-data site-data.json for homepage)
# ============================================================================
- name: Homepage Data Sync
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - services
    - homepage-data-sync
  roles:
    - homepage-data-sync

# ============================================================================
# Caddy Reverse Proxy (mljr only - main ingress point)
# ============================================================================
- name: Caddy Setup
  hosts: mljr
  become: true
  gather_facts: false
  strategy: free
  tags:
    - caddy
  roles:
    - caddy
