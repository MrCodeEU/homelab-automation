---
domain: "mljr.eu"
email: "admin@mljr.eu"
location: "Thaling, Austria"
dashboard_name: "Homelab Dashboard"
timezone: "Europe/Vienna"

# Environment suffix for staging deployments
# Empty for production (main branch), .dev for development (other branches)
env_suffix: "{{ lookup('env', 'ENV_SUFFIX') | default('', true) }}"

# Services managed by dedicated Ansible roles (excluded from generic
# services role)
services_excluded_from_generic_deployment:
  - glance
  - mailcow

services:
  - name: glance
    enabled: true
    domain: "dash.mljr.eu"
    port: 8080
    host: mljr
    description: "Main dashboard"
    icon: "mdi:view-dashboard"

  - name: nightscout
    enabled: true
    domain:
      - "nightscout.mljr.eu"
      - "ns.mljr.eu"
    port: 1337
    host: mljr
    description: "CGM Monitor"
    icon: "mdi:diabetes"

  - name: kuma
    enabled: true
    host: mljr
    skip_deploy: false
    domain: "uptime.mljr.eu"
    port: 3001
    description: "Uptime Monitoring"
    icon: "mdi:heart-pulse"

  - name: ntfy
    enabled: true
    host: mljr
    domain: "ntfy.mljr.eu"
    port: 2586
    description: "Push Notifications"
    icon: "mdi:bell-ring"

  - name: goaccess
    enabled: true
    domain: "logs.mljr.eu"
    port: 7890
    host: mljr
    description: "Access Logs"
    icon: "mdi:chart-bar"
    caddy_auth: "basicauth"

  - name: homeassistant
    enabled: true
    managed: false
    domain: "home.mljr.eu"
    port: 8123
    description: "Home Automation"
    icon: "mdi:home-assistant"
    host: pi

  - name: bichon
    enabled: true
    domain: "mail-archive.mljr.eu"
    port: 15630
    description: "Email archiver (Bichon)"
    icon: "mdi:email"
    host: mljr

  - name: mailcow
    enabled: true
    domain: "mail.mljr.eu"
    port: 8081
    description: "Mail Server"
    icon: "mdi:email-server"
    host: mljr

  - name: immich
    enabled: true
    domain: "immich.mljr.eu"
    port: 8080
    description: "Photo Management"
    icon: "mdi:image-multiple"
    host: nas

  - name: fail2ban-ui
    enabled: true
    domain: "security.mljr.eu"
    port: 5000
    host: mljr
    description: "Fail2ban Management UI"
    icon: "mdi:shield-lock"
    caddy_auth: "basicauth"

  - name: nas
    enabled: true
    domain: "nas.mljr.eu"
    port: 80
    description: "Nas UnRaid Management UI"
    icon: "mdi:server"
    host: nas

  - name: nextcloud
    enabled: true
    domain: "cloud.mljr.eu"
    port: 11000
    description: "Nextcloud Instance on Unraid NAS"
    icon: "mdi:cloud"
    host: nas

  - name: homeserver-ui
    enabled: true
    domain: "nuc.mljr.eu"
    port: 80
    description: "Home Server Management UI"
    icon: "mdi:server"
    host: homeserver

  - name: stats
    enabled: true
    domain: "stats.mljr.eu"
    port: 3000
    description: "Statistics Dashboard"
    icon: "mdi:chart-line"
    host: nas

  - name: dockge
    enabled: true
    domain: "dockge.mljr.eu"
    port: 5001
    description: "Docker Compose Manager"
    icon: "mdi:docker"
    host: mljr

  - name: homepage
    enabled: true
    domain: "mljr.eu"
    port: 8080
    description: "Personal Homepage"
    icon: "mdi:account-circle"
    host: mljr
    source: apps

  - name: deployment-status
    enabled: true
    domain: "deployment-status.mljr.eu"
    port: 8081
    description: "Deployment Status Page"
    icon: "mdi:information"
    host: mljr
    skip_deploy: true  # Handled by Caddy role

  - name: syncthing
    enabled: true
    domain: "sync.mljr.eu"
    port: 8384
    description: "File Synchronization"
    icon: "mdi:sync"
    host: nas

  - name: wud
    enabled: true
    domain: "wud.mljr.eu"
    port: 3000
    description: "What's Up Docker"
    icon: "mdi:docker"
    host: mljr

  - name: filebrowser
    enabled: true
    domain: "files.mljr.eu"
    port: 5687
    description: "File Browser"
    icon: "mdi:folder"
    host: nas

  - name: sonarqube
    enabled: true
    domain: "sonarqube.mljr.eu"
    port: 9000
    description: "Code Quality Analysis"
    icon: "mdi:code-braces"
    host: homeserver

  - name: projects
    enabled: true
    domain: "projects.mljr.eu"
    port: 3456
    description: "Project Management"
    icon: "mdi:clipboard-list"
    host: nas

  - name: grafana
    enabled: true
    domain: "grafana.mljr.eu"
    port: 3000
    description: "Metrics & Monitoring"
    icon: "mdi:chart-areaspline"
    host: monitoring

  - name: pairdrop
    enabled: true
    domain: "share.mljr.eu"
    port: 3054
    description: "File Sharing (PairDrop)"
    icon: "mdi:share-variant"
    host: nas

  - name: jenkins
    enabled: true
    domain: "jenkins.mljr.eu"
    port: 6857
    description: "CI/CD Automation"
    icon: "mdi:pipe"
    host: homeserver


# Secrets (injected via environment variables)
nightscout_api_secret: "{{ lookup('env', 'NIGHTSCOUT_API_SECRET') }}"
link_up_username: "{{ lookup('env', 'LINK_UP_USERNAME') }}"
link_up_password: "{{ lookup('env', 'LINK_UP_PASSWORD') }}"
nightscout_api_token: "{{ lookup('env', 'NIGHTSCOUT_API_TOKEN') }}"
nightscout_domain: "{{ lookup('env', 'NIGHTSCOUT_DOMAIN') }}"
bichon_encrypt_password: "{{ lookup('env', 'BICHON_ENCRYPT_PASSWORD') }}"
caddy_admin_hash: "{{ lookup('env', 'CADDY_AUTH_PASSWORD_HASH') }}"
caddy_auth_user: "{{ lookup('env', 'CADDY_AUTH_USER') }}"
kuma_username: "{{ lookup('env', 'KUMA_USERNAME') }}"
kuma_password: "{{ lookup('env', 'KUMA_PASSWORD') }}"
github_username: "{{ lookup('env', 'GITHUB_USERNAME') }}"
github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
