---
domain: "mljr.eu"
email: "admin@mljr.eu"
location: "Thaling, Austria"
dashboard_name: "Homelab Dashboard"
timezone: "Europe/London"

# Services managed by dedicated Ansible roles (excluded from generic
# services role)
services_excluded_from_generic_deployment:
  - glance

services:
  - name: glance
    enabled: true
    domain: "dash.mljr.eu"
    port: 8080
    host: mljr
    description: "Main dashboard"
    icon: "mdi:view-dashboard"

  - name: nightscout
    enabled: true
    domain:
      - "nightscout.mljr.eu"
      - "ns.mljr.eu"
    port: 1337
    host: mljr
    description: "CGM Monitor"
    icon: "mdi:diabetes"

  - name: kuma
    enabled: true
    host: mljr
    skip_deploy: false
    domain: "uptime.mljr.eu"
    port: 3001
    description: "Uptime Monitoring"
    icon: "mdi:heart-pulse"

  - name: ntfy
    enabled: true
    host: mljr
    domain: "ntfy.mljr.eu"
    port: 2586
    description: "Push Notifications"
    icon: "mdi:bell-ring"

  - name: goaccess
    enabled: true
    domain: "logs.mljr.eu"
    port: 7890
    host: mljr
    description: "Access Logs"
    icon: "mdi:chart-bar"
    caddy_auth: "basicauth"

  - name: homeassistant
    enabled: true
    managed: false
    domain: "home.mljr.eu"
    port: 8123
    description: "Home Automation"
    icon: "mdi:home-assistant"
    host: pi

  - name: bichon
    enabled: true
    domain: "mail-archive.mljr.eu"
    port: 15630
    description: "Email archiver (Bichon)"
    icon: "mdi:email"
    host: mljr

  - name: mailcow
    enabled: false
    domain: "mail.mljr.eu"
    port: 8081
    description: "Mail Server"
    icon: "mdi:email-server"
    host: mljr
    managed: false
