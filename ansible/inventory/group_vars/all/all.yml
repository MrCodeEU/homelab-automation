---
# Homelab Automation - Global Configuration
# ============================================================================

# Domain and general settings
domain: "mljr.eu"
email: "admin@mljr.eu"
timezone: "Europe/Vienna"
location: "Thaling, Austria"
dashboard_name: "Homelab Dashboard"

# Path configuration
base_path: "/opt"
config_path: "/etc"
log_path: "/var/log"
backup_path: "/opt/backups"

# Staging configuration
# Services with a dev/ subfolder automatically get deployed to staging_host
# when is_staging_deployment=true is set:
# - Domain prefix: <service>.dev.<domain> (e.g., nightscout.dev.mljr.eu)
# - Deployment path: /opt/staging/<service>
# - All staging services deploy to staging_host
# - Ports, tags, and other config are explicitly defined in dev/docker-compose.yml
staging_domain_prefix: "dev"
staging_host: "nuc"

# ============================================================================
# Services Configuration
# ============================================================================
# Each service can have:
#   name            - Service identifier (required)
#   enabled         - Whether to deploy (default: true)
#   domain          - Domain(s) for Caddy proxy (string or list)
#   port            - Internal port
#   host            - Target host from inventory
#   description     - Human-readable description
#   icon            - Material Design Icon for dashboard
#   managed         - If false, only configure Caddy (external service)
#   caddy_auth      - Authentication method: "basicauth" or "authelia" (SSO)
#   skip_deploy     - Skip generic deployment (uses dedicated role)
#   backup_critical - If true, restore this service on fresh install
#   https_backend   - If true, proxy to HTTPS with self-signed cert (e.g., mailcow)
#
# Staging environments:
#   - Create a dev/ subfolder in services/<name>/ with docker-compose.yml
#   - Service will auto-deploy to staging_host when is_staging_deployment=true
#   - Explicitly define ports, tags, and config in dev/docker-compose.yml
# ============================================================================

services:
  # Identity & Access Management
  - name: authelia
    enabled: true
    domain: "auth.mljr.eu"
    port: 9091
    host: mljr
    description: "Authelia SSO"
    icon: "mdi:shield-account"
    skip_deploy: true # Uses dedicated authelia role
    backup_critical: true

  # Dashboard
  - name: glance
    enabled: true
    domain: "dash.mljr.eu"
    port: 8080
    host: mljr
    description: "Main Dashboard"
    icon: "mdi:view-dashboard"
    skip_deploy: true  # Uses dedicated role

  # Health Monitoring
  - name: nightscout
    enabled: true
    domain:
      - "nightscout.mljr.eu"
      - "ns.mljr.eu"
    port: 1337
    host: nuc
    description: "CGM Monitor"
    icon: "mdi:diabetes"
    backup_critical: true  # Restore on fresh install

  - name: kuma
    enabled: true
    domain: "uptime.mljr.eu"
    port: 3001
    host: nuc
    description: "Uptime Monitoring"
    icon: "mdi:heart-pulse"
    backup_critical: true  # Restore on fresh install

  - name: signoz
    enabled: false  # Replaced by Grafana LGTM stack
    domain: "monitor.mljr.eu"
    port: 8080
    host: nuc
    description: "System & Application Observability (deprecated)"
    icon: "mdi:chart-line"

  - name: grafana
    enabled: true
    domain:
      - "monitor.mljr.eu"
      - "grafana.mljr.eu"
    port: 3000
    host: nuc
    description: "Metrics, Logs & Monitoring"
    icon: "mdi:chart-areaspline"
    caddy_auth: "authelia"

  # Notifications
  - name: ntfy
    enabled: true
    domain: "ntfy.mljr.eu"
    port: 2586
    host: mljr
    description: "Push Notifications"
    icon: "mdi:bell-ring"

  # Analytics & Logs
  - name: goaccess
    enabled: true
    domain: "logs.mljr.eu"
    port: 7890
    host: mljr
    description: "Access Logs"
    icon: "mdi:chart-bar"
    caddy_auth: "authelia"

  # External Services (proxy only)
  - name: homeassistant
    enabled: true
    managed: false
    domain: "home.mljr.eu"
    port: 8123
    host: homeassistant
    description: "Home Automation"
    icon: "mdi:home-assistant"

  # Email
  - name: bichon
    enabled: true
    domain: "mail-archive.mljr.eu"
    port: 15630
    host: nuc
    description: "Email Archiver"
    icon: "mdi:email"

  - name: mailcow
    enabled: true
    domain: "mail.mljr.eu"
    port: 8443
    host: mljr
    description: "Mail Server"
    icon: "mdi:email-server"
    skip_deploy: true  # Uses dedicated role
    backup_critical: true  # Restore on fresh install
    https_backend: true  # Backend uses HTTPS with self-signed cert

  # Security
  - name: fail2ban-ui
    enabled: true
    domain: "security.mljr.eu"
    port: 5000
    host: mljr
    description: "Security Monitor"
    icon: "mdi:shield-lock"
    caddy_auth: "authelia"

  - name: crowdsec
    enabled: true
    domain: "crowdsec.mljr.eu"
    port: 8089
    host: mljr
    description: "CrowdSec Security Intelligence"
    icon: "mdi:shield-search"
    caddy_auth: "authelia"

  # Container Management
  - name: dockge
    enabled: true
    domain: "dockge.mljr.eu"
    port: 5001
    host: mljr
    description: "Docker Manager"
    icon: "mdi:docker"

  - name: wud
    enabled: false  # Replaced by Diun (no UI, uses ntfy)
    domain: "wud.mljr.eu"
    port: 3000
    host: mljr
    description: "Docker Updates (deprecated)"
    icon: "mdi:update"

  - name: diun
    enabled: true
    managed: true
    port: 0  # No web UI - notification only via ntfy
    host: mljr
    description: "Docker Image Update Notifier"
    icon: "mdi:docker"

  - name: dozzle
    enabled: true
    domain: "docker.mljr.eu"
    port: 8085
    host: nuc
    description: "Docker Logs"
    icon: "mdi:text-box-search"
    caddy_auth: "authelia"

  # Personal
  - name: homepage
    enabled: true
    domain: "mljr.eu"
    port: 8082
    host: mljr
    staging: true
    description: "Personal Homepage (Go + Templ + HTMX)"
    icon: "mdi:account-circle"

  - name: ui-showcase
    enabled: true
    domain: "ui.mljr.eu"
    port: 8083
    host: mljr
    staging: true
    description: "mljr-ui Component Showcase"
    icon: "mdi:palette-swatch"

  # Network Testing
  - name: speedtest
    enabled: false
    domain: "speedtest.mljr.eu"
    port: 8089
    host: mljr
    description: "Internal Network Speed Test"
    icon: "mdi:speedometer"
    skip_deploy: true



  # NAS Services (Unraid)
  - name: nas
    enabled: true
    managed: false
    domain: "nas.mljr.eu"
    port: 80
    host: nas
    description: "NAS Management"
    icon: "mdi:server"

  - name: immich
    enabled: true
    managed: false
    domain: "immich.mljr.eu"
    port: 8080
    host: nas
    description: "Photo Management"
    icon: "mdi:image-multiple"
    caddy_extra_config: |
      @options method OPTIONS
      handle @options {
          header Access-Control-Allow-Origin "*"
          header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS"
          header Access-Control-Allow-Headers "X-Api-Key, User-Agent, Content-Type, Authorization"
          header Access-Control-Max-Age "1728000"
          respond 204
      }
      header Access-Control-Allow-Origin "*"
      header Access-Control-Allow-Headers "X-Api-Key, User-Agent, Content-Type, Authorization"

  - name: nextcloud
    enabled: true
    managed: false
    domain: "cloud.mljr.eu"
    port: 11000
    host: nas
    description: "Cloud Storage"
    icon: "mdi:cloud"

  - name: syncthing
    enabled: true
    managed: false
    domain: "sync.mljr.eu"
    port: 8384
    host: nas
    description: "File Sync"
    icon: "mdi:sync"
    https_backend: true  # Syncthing uses self-signed HTTPS

  - name: filerun
    enabled: true
    managed: false
    domain: "files.mljr.eu"
    port: 9200
    host: nas
    description: "Filerun server"
    icon: "mdi:cloud"

  - name: test-ocis
    enabled: true
    managed: false
    domain: "ocis.mljr.eu"
    port: 9201
    host: nas
    description: "test ocis against opencloud"
    icon: "mdi:cloud"
    https_backend: true


  - name: stats
    enabled: false
    managed: false
    domain: "stats.mljr.eu"
    port: 3000
    host: nas
    description: "Statistics"
    icon: "mdi:chart-line"

  - name: projects
    enabled: true
    managed: false
    domain: "projects.mljr.eu"
    port: 6528
    host: nas
    description: "Vikunja Projects and TODOs"
    icon: "mdi:clipboard-list"

  - name: pairdrop
    enabled: false
    managed: false
    domain: "share.mljr.eu"
    port: 3054
    host: nas
    description: "File Sharing"
    icon: "mdi:share-variant"

  # Home Server (NUC - will be Rocky Linux)
  # Disabled in favor of nuc-webui (Rocky Linux Cockpit on port 9090)
  - name: homeserver-ui
    enabled: false
    managed: false
    domain: "nuc.mljr.eu"
    port: 80
    host: nuc
    description: "Home Server (deprecated - use nuc-webui)"
    icon: "mdi:server"

  - name: sonarqube
    enabled: false
    managed: false
    domain: "sonarqube.mljr.eu"
    port: 9000
    host: nuc
    description: "Code Quality"
    icon: "mdi:code-braces"
    requires_sysctl: "vm.max_map_count=262144"

  # NUC Rocky WebUI
  - name: nuc-webui
    enabled: true
    managed: false
    domain: "nuc.mljr.eu"
    port: 9090
    host: nuc
    description: "NUC WebUI provided by Rocky"
    icon: "mdi:monitor-dashboard"
    https_backend: true  # Rocky Cockpit serves HTTPS on port 9090


  # Personal Projects
  - name: wordwiz
    enabled: true
    domain: "wordwiz.mljr.eu"
    port: 3601
    host: nuc
    description: "Word Wizard App"
    icon: "mdi:alphabetical-variant"

  - name: sudoku
    enabled: true
    domain: "sudoku.mljr.eu"
    port: 3602
    host: nuc
    description: "Sudoku Generator"
    icon: "mdi:grid"

  - name: gameoflife
    enabled: true
    domain: "gameoflife.mljr.eu"
    port: 3603
    host: nuc
    description: "Game of Life (Kotlin/WASM)"
    icon: "mdi:grain"

  - name: cglab
    enabled: true
    domain: "cglab.mljr.eu"
    port: 3604
    host: nuc
    description: "CG Lab WebGL Project"
    icon: "mdi:cube-outline"

  # Template for future services
  - name: service-template
    enabled: true
    domain: "template.mljr.eu"
    port: 8181
    host: nuc
    description: "Template Service"
    icon: "mdi:shape-outline"

# ============================================================================
# Role-specific variables
# ============================================================================

# Standalone Docker containers are managed by dedicated roles rather than the
# generic services role. The container-reconcile role removes known containers
# that are no longer expected on a host before new services and agents start.
homelab_standalone_containers:
  - name: grafana-alloy
    host_groups:
      - rocky
  - name: dozzle-agent
    hosts:
      - mljr
  - name: signoz-agent
    hosts: []  # Retired; kept here so reconciliation removes old deployments.

homelab_standalone_paths:
  - container: grafana-alloy
    path: /opt/grafana-alloy
    host_groups:
      - rocky
  - container: dozzle-agent
    path: /opt/dozzle-agent
    hosts:
      - mljr
  - container: signoz-agent
    path: /opt/signoz-agent
    host_groups:
      - rocky
      - unraid

# Services with post-deploy hooks (services/<name>/hooks/post-deploy.sh)
# IMPORTANT: When you add a new post-deploy.sh script to a service, you MUST
# also add that service name here — otherwise the hook will be silently skipped.
# This list replaces per-service stat checks and is validated at deploy time.
# Run `force_redeploy=true` to bypass the checksum cache after hook changes.
# TODO: NEED TO TEST THE BACKUP STRATEGY!!
post_deploy_hook_services:
  - crowdsec    # CrowdSec web UI machine registration
  - speedtest   # SSH key distribution to speedtest measurement targets
  - sonarqube   # Initial SonarQube admin password + project provisioning

# Backup configuration
backup_enabled: true
backup_schedule: "*-*-* 03:00:00"  # Daily at 3 AM (systemd calendar format)
backup_retention_days: 30
backup_remote_name: "pcloud"
backup_remote_path: "homelab-backups"
backup_local_path: "{{ backup_path }}"
backup_rclone_config_path: "/root/.config/rclone"
backup_auto_detect_volumes: true

# Mailcow configuration
mailcow_install_path: "{{ base_path }}/mailcow-dockerized"
mailcow_repo_url: "https://github.com/mailcow/mailcow-dockerized"
mailcow_version: "master"
mailcow_timezone: "{{ timezone }}"
mailcow_http_port: 8081
mailcow_https_port: 8443
mailcow_http_bind: "127.0.0.1"
mailcow_auto_update: false
