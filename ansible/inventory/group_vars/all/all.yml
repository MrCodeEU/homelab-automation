---
# Homelab Automation - Global Configuration
# ============================================================================

# Domain and general settings
domain: "mljr.eu"
email: "admin@mljr.eu"
timezone: "Europe/Vienna"
location: "Thaling, Austria"
dashboard_name: "Homelab Dashboard"

# Path configuration
base_path: "/opt"
config_path: "/etc"
log_path: "/var/log"
backup_path: "/opt/backups"

# Caddy log rotation. Per-service logs can grow quickly on public endpoints, so
# keep rotation bounded and avoid stale compression temp files piling up.
caddy_log_roll_size: 100mb
caddy_log_roll_keep: 3
caddy_log_roll_keep_for: 168h
caddy_log_roll_uncompressed: true

# Staging configuration
# Services with a dev/ subfolder automatically get deployed to staging_host
# when is_staging_deployment=true is set:
# - Domain prefix: <service>.dev.<domain> (e.g., nightscout.dev.mljr.eu)
# - Deployment path: /opt/staging/<service>
# - All staging services deploy to staging_host
# - Ports, tags, and other config are explicitly defined in dev/docker-compose.yml
staging_domain_prefix: "dev"
staging_host: "nuc"

crowdsec_firewall_bouncer_enabled: true

# Docker maintenance. The GitHub Actions weekly schedule enables this to keep
# image/runtime stores from filling small root filesystems. Volumes are not
# pruned here because they may contain service data.
docker_prune_enabled: false
docker_prune_images: true
docker_prune_containers: true
docker_prune_networks: false
docker_prune_volumes: false
docker_prune_builder_cache: true
docker_prune_timeout: 600
docker_prune_fail_deployment: false

# Optional swapfile management. This is enabled per host where useful; it is
# mainly a pressure-release valve for small VPS hosts running Docker workloads.
swap_enabled: false
swap_file_path: /swapfile
swap_file_size_mb: 2048

# ============================================================================
# Services Configuration
# ============================================================================
# Each service can have:
#   name            - Service identifier (required)
#   enabled         - Whether to deploy (default: true)
#   domain          - Domain(s) for Caddy proxy (string or list)
#   port            - Internal port
#   host            - Target host from inventory
#   description     - Human-readable description
#   icon            - Material Design Icon for dashboard
#   managed         - If false, only configure Caddy (external service)
#   caddy_auth      - Authentication method: "basicauth" or "authelia" (SSO)
#   skip_deploy     - Skip generic deployment (uses dedicated role)
#   backup_critical - If true, restore this service on fresh install
#   https_backend   - If true, proxy to HTTPS with self-signed cert (e.g., mailcow)
#
# Staging environments:
#   - Create a dev/ subfolder in services/<name>/ with docker-compose.yml
#   - Service will auto-deploy to staging_host when is_staging_deployment=true
#   - Explicitly define ports, tags, and config in dev/docker-compose.yml
# ============================================================================

services:
  # Identity & Access Management
  - name: authelia
    enabled: true
    domain: "auth.mljr.eu"
    port: 9091
    host: mljr
    description: "Authelia SSO"
    icon: "mdi:shield-account"
    skip_deploy: true # Uses dedicated authelia role
    backup_critical: true

  # Dashboard
  - name: glance
    enabled: true
    domain: "dash.mljr.eu"
    port: 8080
    host: mljr
    description: "Main Dashboard"
    icon: "mdi:view-dashboard"
    skip_deploy: true  # Uses dedicated role

  # Health Monitoring
  - name: nocturne
    enabled: true
    domain: "nc.mljr.eu"
    port: 8093
    host: nuc
    description: "Diabetes Management (Next-Gen)"
    icon: "mdi:moon-waning-crescent"

  - name: nightscout
    enabled: true
    domain:
      - "nightscout.mljr.eu"
      - "ns.mljr.eu"
    port: 1337
    host: nuc
    description: "CGM Monitor"
    icon: "mdi:diabetes"
    backup_critical: true  # Restore on fresh install

  - name: kuma
    enabled: true
    domain: "uptime.mljr.eu"
    port: 3001
    host: nuc
    description: "Uptime Monitoring"
    icon: "mdi:heart-pulse"
    backup_critical: true  # Restore on fresh install

  - name: grafana
    enabled: true
    domain:
      - "monitor.mljr.eu"
      - "grafana.mljr.eu"
    port: 3000
    host: nuc
    description: "Metrics, Logs & Monitoring"
    icon: "mdi:chart-areaspline"
    caddy_auth: "authelia"

  # Notifications
  - name: ntfy
    enabled: true
    domain: "ntfy.mljr.eu"
    port: 2586
    host: mljr
    description: "Push Notifications"
    icon: "mdi:bell-ring"

  # Analytics & Logs
  - name: goaccess
    enabled: true
    domain: "logs.mljr.eu"
    port: 7890
    host: mljr
    description: "Access Logs"
    icon: "mdi:chart-bar"
    caddy_auth: "authelia"

  # External Services (proxy only)
  - name: homeassistant
    enabled: true
    managed: false
    domain: "home.mljr.eu"
    port: 8123
    host: homeassistant
    description: "Home Automation"
    icon: "mdi:home-assistant"

  # Email
  - name: bichon
    enabled: true
    domain: "mail-archive.mljr.eu"
    port: 15630
    host: nuc
    description: "Email Archiver"
    icon: "mdi:email"

  - name: mailcow
    enabled: true
    domain: "mail.mljr.eu"
    port: 8443
    host: mljr
    description: "Mail Server"
    icon: "mdi:email-server"
    skip_deploy: true  # Uses dedicated role
    backup_critical: true  # Restore on fresh install
    https_backend: true  # Backend uses HTTPS with self-signed cert

  # Security
  - name: crowdsec
    enabled: true
    domain:
      - "crowdsec.mljr.eu"
      - "security.mljr.eu"
    port: 8089
    host: mljr
    description: "CrowdSec Security Intelligence"
    icon: "mdi:shield-search"
    caddy_auth: "authelia"

  # Container Management
  - name: diun
    enabled: true
    managed: true
    port: 0  # No web UI - notification only via ntfy
    host: mljr
    description: "Docker Image Update Notifier"
    icon: "mdi:docker"

  # Personal
  - name: homepage
    enabled: true
    domain: "mljr.eu"
    port: 8082
    host: mljr
    staging: true
    description: "Personal Homepage (Go + Templ + HTMX)"
    icon: "mdi:account-circle"
    caddy_extra_config: |
      handle_path /umami* {
          reverse_proxy nuc.tail33930.ts.net:3606
      }

  - name: umami
    enabled: true
    domain: "umami.mljr.eu"
    port: 3606
    host: nuc
    description: "Umami Analytics"
    icon: "mdi:chart-bar"

  - name: forgejo
    enabled: true
    domain:
      - "git.mljr.eu"
      - "forge.mljr.eu"
      - "fogrejo.mljr.eu"
    port: 3300
    host: nuc
    description: "Git Hosting"
    icon: "mdi:git"
    backup_critical: true

  - name: ui-showcase
    enabled: true
    domain: "ui.mljr.eu"
    port: 8083
    host: mljr
    staging: true
    description: "mljr-ui Component Showcase"
    icon: "mdi:palette-swatch"

  - name: regex
    enabled: true
    domain: "regex.mljr.eu"
    port: 8084
    host: mljr
    description: "Regex Lab — live PCRE tester (Go + Datastar)"
    icon: "mdi:regex"

  - name: cron
    enabled: true
    domain: "cron.mljr.eu"
    port: 8085
    host: mljr
    description: "Cron Explorer — cron expression parser & next-run previewer"
    icon: "mdi:timer-outline"

  - name: codec
    enabled: true
    domain: "codec.mljr.eu"
    port: 8086
    host: mljr
    description: "Codec — hash (MD5/SHA) + Base64/URL/HTML encode-decode"
    icon: "mdi:code-braces"

  - name: newsletter
    enabled: true
    domain: "newsletter.mljr.eu"
    port: 8087
    host: mljr
    description: "Newsletter — recurring friend-group newsletter (PocketBase + Go)"
    icon: "mdi:email-newsletter"
    backup_critical: true

  - name: weather-cli
    enabled: true
    domain: "weather-cli.mljr.eu"
    port: 8091
    host: mljr
    description: "Weather CLI - browser terminal weather dashboard"
    icon: "mdi:weather-partly-cloudy"

  # Network Testing
  - name: speedtest
    enabled: true
    domain: "speedtest.mljr.eu"
    port: 8090
    host: nuc
    description: "Netronome Network Monitor"
    icon: "mdi:speedometer"

  # NAS Services (Unraid)
  - name: nas
    enabled: true
    managed: false
    domain: "nas.mljr.eu"
    port: 80
    host: nas
    description: "NAS Management"
    icon: "mdi:server"

  - name: immich
    enabled: true
    managed: false
    domain: "immich.mljr.eu"
    port: 8080
    host: nas
    description: "Photo Management"
    icon: "mdi:image-multiple"
    caddy_extra_config: |
      @options method OPTIONS
      handle @options {
          header Access-Control-Allow-Origin "*"
          header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS"
          header Access-Control-Allow-Headers "X-Api-Key, User-Agent, Content-Type, Authorization"
          header Access-Control-Max-Age "1728000"
          respond 204
      }
      header Access-Control-Allow-Origin "*"
      header Access-Control-Allow-Headers "X-Api-Key, User-Agent, Content-Type, Authorization"

  - name: nextcloud
    enabled: true
    managed: false
    domain: "cloud.mljr.eu"
    port: 11000
    host: nas
    description: "Cloud Storage"
    icon: "mdi:cloud"
    caddy_suppress_default_proxy: true
    caddy_extra_config: |
      reverse_proxy __TARGET_HOST__:__TARGET_PORT__ {
          # Buffer upload bodies so slow mobile clients don't trickle into
          # Apache's mod_reqtimeout (body=20,MinRate=500) -> 408 storms.
          # Sized above the 10MB Nextcloud client chunk size.
          request_buffers 16m
          transport http {
              versions 1.1
          }
      }

  - name: dockhand
    enabled: true
    managed: false
    domain: "dockhand.mljr.eu"
    port: 3054
    host: nas
    description: "Docker Management"
    icon: "mdi:docker"
