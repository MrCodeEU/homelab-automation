---
# Secrets - Centralized secret lookups from environment variables
# These are injected via GitHub Actions or local environment
#
# Usage: Reference these variables in service configs via Jinja2
# Example: {{ secrets.nightscout.api_secret }}

secrets:
  # Nightscout / LibreLink
  nightscout:
    api_secret: "{{ lookup('env', 'NIGHTSCOUT_API_SECRET') }}"
    api_token: "{{ lookup('env', 'NIGHTSCOUT_API_TOKEN') }}"
    domain: "{{ lookup('env', 'NIGHTSCOUT_DOMAIN') }}"
  librelink:
    username: "{{ lookup('env', 'LINK_UP_USERNAME') }}"
    password: "{{ lookup('env', 'LINK_UP_PASSWORD') }}"

  # Caddy authentication (basicauth - legacy)
  caddy:
    auth_user: "{{ lookup('env', 'CADDY_AUTH_USER') | default('admin', true) }}"
    auth_hash: "{{ lookup('env', 'CADDY_AUTH_PASSWORD_HASH') }}"

  # Authelia SSO
  authelia:
    jwt_secret: "{{ lookup('env', 'AUTHELIA_JWT_SECRET') }}"
    session_secret: "{{ lookup('env', 'AUTHELIA_SESSION_SECRET') }}"
    storage_encryption_key: "{{ lookup('env', 'AUTHELIA_STORAGE_ENCRYPTION_KEY') }}"
    admin_password: "{{ lookup('env', 'AUTHELIA_ADMIN_PASSWORD') }}"

  # Keycloak SSO (deprecated)
  keycloak:
    admin_password: "{{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}"
    db_password: "{{ lookup('env', 'KEYCLOAK_DB_PASSWORD') }}"

  # OAuth2 Proxy (for Keycloak SSO - deprecated)
  oauth2_proxy:
    cookie_secret: "{{ lookup('env', 'OAUTH2_PROXY_COOKIE_SECRET') }}"
    client_id: "{{ lookup('env', 'OAUTH2_PROXY_CLIENT_ID') }}"
    client_secret: "{{ lookup('env', 'OAUTH2_PROXY_CLIENT_SECRET') }}"

  # Google OAuth (for Keycloak social login)
  google:
    client_id: "{{ lookup('env', 'GOOGLE_CLIENT_ID') }}"
    client_secret: "{{ lookup('env', 'GOOGLE_CLIENT_SECRET') }}"

  # Monitoring
  kuma:
    username: "{{ lookup('env', 'KUMA_USERNAME') }}"
    password: "{{ lookup('env', 'KUMA_PASSWORD') }}"

  # Beszel (System monitoring)
  beszel:
    key: "{{ lookup('env', 'BESZEL_KEY') }}"
    token: "{{ lookup('env', 'BESZEL_TOKEN') }}"

  # Email services
  bichon:
    encrypt_password: "{{ lookup('env', 'BICHON_ENCRYPT_PASSWORD') }}"

  # Sudoku external upload API
  sudoku:
    api_user: "{{ lookup('env', 'SUDOKU_API_USER') }}"
    api_password: "{{ lookup('env', 'SUDOKU_API_PASSWORD') }}"

  # Docker Hub (authenticated pulls to avoid rate limits)
  dockerhub:
    username: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    password: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"

  # GitHub (for private images)
  github:
    username: "{{ lookup('env', 'GITHUB_USERNAME') }}"
    token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

  # Backup
  backup:
    pcloud_token: "{{ lookup('env', 'PCLOUD_TOKEN') }}"

  # Monitoring - HetrixTools
  hetrixtools:
    api_token: "{{ lookup('env', 'HETRIXTOOLS_API_TOKEN') }}"

  # SonarQube
  sonarqube:
    db_password: "{{ lookup('env', 'SONARQUBE_DB_PASSWORD') }}"
    admin_password: "{{ lookup('env', 'SONARQUBE_ADMIN_PASSWORD') }}"

  # Dozzle (Docker log viewer)
  dozzle:
    # Remote agents format: name:host:port,name2:host2:port
    # Agents are deployed to all rocky hosts except nuc (where main instance runs)
    # Must use Tailscale IPs (not hostnames) as Dozzle requires valid IP addresses
    remote_agents: "mljr:100.100.20.1:7007"

  # SMTP (for services that need email notifications)
  smtp:
    host: "{{ lookup('env', 'SMTP_HOST') }}"
    port: "{{ lookup('env', 'SMTP_PORT') | default('587', true) }}"
    user: "{{ lookup('env', 'SMTP_USER') }}"
    password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
    from: "{{ lookup('env', 'SMTP_FROM') | default('notifications@mljr.eu', true) }}"
