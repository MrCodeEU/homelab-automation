---
# Secrets - Centralized secret lookups from environment variables
# These are injected via GitHub Actions or local environment
#
# Usage: Reference these variables in service configs via Jinja2
# Example: {{ secrets.nightscout.api_secret }}

secrets:
  # Nightscout / LibreLink
  nightscout:
    api_secret: "{{ lookup('env', 'NIGHTSCOUT_API_SECRET') }}"
    api_token: "{{ lookup('env', 'NIGHTSCOUT_API_TOKEN') }}"
    domain: "{{ lookup('env', 'NIGHTSCOUT_DOMAIN') }}"
  librelink:
    username: "{{ lookup('env', 'LINK_UP_USERNAME') }}"
    password: "{{ lookup('env', 'LINK_UP_PASSWORD') }}"

  # Caddy authentication
  caddy:
    auth_user: "{{ lookup('env', 'CADDY_AUTH_USER') | default('admin', true) }}"
    auth_hash: "{{ lookup('env', 'CADDY_AUTH_PASSWORD_HASH') }}"

  # Monitoring
  kuma:
    username: "{{ lookup('env', 'KUMA_USERNAME') }}"
    password: "{{ lookup('env', 'KUMA_PASSWORD') }}"

  # Email services
  bichon:
    encrypt_password: "{{ lookup('env', 'BICHON_ENCRYPT_PASSWORD') }}"

  # GitHub (for private images)
  github:
    username: "{{ lookup('env', 'GITHUB_USERNAME') }}"
    token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

  # Backup
  backup:
    pcloud_token: "{{ lookup('env', 'PCLOUD_TOKEN') }}"
