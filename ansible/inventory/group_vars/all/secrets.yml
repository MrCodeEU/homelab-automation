---
# Secrets — maps vault variables into the secrets.* namespace used by roles.
# All values come from ansible-vault (vault.yml). No env var lookups.
#
# Edit secrets: ansible-vault edit ansible/inventory/group_vars/all/vault.yml

secrets:
  nocturne:
    instance_key: "{{ vault_nocturne_instance_key | default('') }}"
    base_domain: "{{ vault_nocturne_base_domain | default('nc.mljr.eu') }}"
    postgres_password: "{{ vault_nocturne_postgres_password | default('') }}"
    postgres_app_password: "{{ vault_nocturne_postgres_app_password | default('') }}"
    postgres_migrator_password: "{{ vault_nocturne_postgres_migrator_password | default('') }}"
    postgres_web_password: "{{ vault_nocturne_postgres_web_password | default('') }}"

  caddy:
    auth_user: "{{ vault_caddy_auth_user | default('admin') }}"
    auth_hash: "{{ vault_caddy_auth_hash | default('') }}"

  authelia:
    jwt_secret: "{{ vault_authelia_jwt_secret | default('') }}"
    session_secret: "{{ vault_authelia_session_secret | default('') }}"
    storage_encryption_key: "{{ vault_authelia_storage_encryption_key | default('') }}"
    admin_password: "{{ vault_authelia_admin_password | default('') }}"
    google_client_id: "{{ vault_google_client_id | default('') }}"
    google_client_secret: "{{ vault_google_client_secret | default('') }}"

  kuma:
    username: "{{ vault_kuma_username | default('admin') }}"
    password: "{{ vault_kuma_password | default('') }}"
    api_key: "{{ vault_kuma_api_key | default('') }}"

  homeassistant:
    token: "{{ vault_homeassistant_token | default('') }}"

  # Notification bus. Consumed by the backup role, diun and the health report.
  # Until this block existed, backup notifications silently fell through to a
  # local log line (see roles/backup/templates/backup.sh.j2).
  ntfy:
    url: "{{ vault_ntfy_url | default('https://ntfy.mljr.eu') }}"
    topic: "{{ vault_ntfy_topic | default('backup') }}"
    token: "{{ vault_ntfy_token | default('') }}"

  healthreport:
    ntfy_topic: "{{ vault_healthreport_ntfy_topic | default('homelab-health') }}"
    email_to: "{{ vault_healthreport_email_to | default('') }}"

  # Read-only, account-wide GitHub PAT for the health report. Kept separate
  # from secrets.github.token (the GHCR pull credential) so registry access and
  # security-alert access never share a blast radius.
  github_readonly:
    token: "{{ vault_github_readonly_token | default('') }}"

  grafana:
    admin_user: "{{ vault_grafana_admin_user | default('admin') }}"
    admin_password: "{{ vault_grafana_admin_password | default('') }}"

  crowdsec:
    firewall_bouncer_key: "{{ vault_crowdsec_firewall_bouncer_key | default('') }}"
    web_ui_password: "{{ vault_crowdsec_web_ui_password | default('') }}"
    web_ui_notification_secret: "{{ vault_crowdsec_web_ui_notification_secret | default('') }}"

  netronome:
    admin_password: "{{ vault_netronome_admin_password | default('') }}"
    session_secret: "{{ vault_netronome_session_secret | default('') }}"

  bichon:
    encrypt_password: "{{ vault_bichon_encrypt_password | default('') }}"

  mailarchiver:
    db_password: "{{ vault_mailarchiver_db_password | default('') }}"
    admin_user: "{{ vault_mailarchiver_admin_user | default('admin') }}"
    admin_password: "{{ vault_mailarchiver_admin_password | default('') }}"

  tutabridge:
    keyring_password: "{{ vault_tutabridge_keyring_password | default('') }}"
    tuta_email: "{{ vault_tuta_email | default('') }}"
    tuta_password: "{{ vault_tuta_password | default('') }}"

  sudoku:
    api_user: "{{ vault_sudoku_api_user | default('') }}"
    api_password: "{{ vault_sudoku_api_password | default('') }}"

  homepage:
    strava_client_id: "{{ vault_strava_client_id | default('') }}"
    strava_client_secret: "{{ vault_strava_client_secret | default('') }}"
    strava_refresh_token: "{{ vault_strava_refresh_token | default('') }}"

    umami_website_id: "{{ vault_homepage_umami_website_id | default('') }}"
    contact_to: "{{ vault_homepage_contact_to | default('') }}"
    tailscale_api_key: "{{ vault_homepage_tailscale_api_key | default('') }}"

  umami:
    app_secret: "{{ vault_umami_app_secret | default('') }}"
    postgres_password: "{{ vault_umami_postgres_password | default('') }}"

  forgejo:
    postgres_password: "{{ vault_forgejo_postgres_password | default('') }}"
    runner_secret: "{{ vault_forgejo_runner_secret | default('') }}"

  dockerhub:
    username: "{{ vault_dockerhub_username | default('') }}"
    password: "{{ vault_dockerhub_token | default('') }}"

  github:
    username: "{{ vault_github_username | default('') }}"
    token: "{{ vault_github_token | default('') }}"

  backup:
    pcloud_token: "{{ vault_pcloud_token | default('') }}"
    # Semi-offsite push-only target (moving to the pool house). The rclone
    # `pass` value is already in rclone's own obscured format (not
    # plaintext) - copy vault_wd_cloud_password verbatim from
    # /root/.config/rclone/rclone.conf on nas, don't re-obscure it.
    wd_cloud_user: "{{ vault_wd_cloud_user | default('admin') }}"
    wd_cloud_password: "{{ vault_wd_cloud_password | default('') }}"

  hetrixtools:
    api_token: "{{ vault_hetrixtools_api_token | default('') }}"

  smtp:
    host: "{{ vault_smtp_host | default('') }}"
    port: "{{ vault_smtp_port | default('587') }}"
    user: "{{ vault_smtp_user | default('') }}"
    password: "{{ vault_smtp_password | default('') }}"
    from: "{{ vault_smtp_from | default('notifications@mljr.eu') }}"
