---
# Homelab Inventory
# ============================================================================
# Hosts are organized by management type:
#   - managed: Full Ansible deployment (base, docker, services)
#   - proxy_only: Only used for Caddy reverse proxy configuration
# ============================================================================

all:
  children:
    # ========================================================================
    # Managed Hosts - Full Ansible deployment
    # ========================================================================
    managed:
      children:
        # Rocky Linux hosts - VPS and home servers
        rocky:
          hosts:
            mljr:
              ansible_host: mljr.tail33930.ts.net
              ansible_user: root
            nuc:
              ansible_host: nuc.tail33930.ts.net
              ansible_user: root

        # Unraid NAS - Limited management (containers managed via Unraid UI)
        unraid:
          hosts:
            nas:
              ansible_host: nas.tail33930.ts.net
              ansible_user: root

    # ========================================================================
    # Proxy-Only Hosts - Only referenced in Caddy configuration
    # These hosts run their own services, Ansible just configures the proxy
    # ========================================================================
    proxy_only:
      hosts:
        pi:
          ansible_host: pi.tail33930.ts.net
          # Home Assistant on Raspberry Pi

        monitoring:
          ansible_host: 192.168.50.175
          # Grafana monitoring host
