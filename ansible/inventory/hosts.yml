---
# Homelab Inventory
# ============================================================================
# Hosts are organized by management type:
#   - managed: Full Ansible deployment (base, docker, services)
#   - proxy_only: Only used for Caddy reverse proxy configuration
# ============================================================================

all:
  children:
    # ========================================================================
    # Managed Hosts - Full Ansible deployment
    # ========================================================================
    managed:
      children:
        # Rocky Linux hosts - VPS and home servers
        rocky:
          hosts:
            mljr:
              ansible_host: mljr.tail33930.ts.net
              ansible_user: root
              tailscale_ip: 100.100.20.1
              swap_enabled: true
              public_ip: 157.173.97.107
              ssh_breakglass_port: 2299
              cockpit_console_enabled: true
              # 2026-08-14: this 4vCPU/7.5GB VPS also runs every service it
              # backs up (unlike nas/nuc's on-prem headroom) - the default
              # 8/16 pCloud concurrency saturated it enough that Kuma's 48s
              # timeout tripped on nearly every container, including
              # uptime.mljr.eu itself, for minutes at a time during its own
              # nightly backup. Throttled to match the already-fine
              # ugreen/wd-cloud leg concurrency, capped bandwidth well under
              # the ~180Mbit VPS<->home link, and hard-capped CPU so this
              # can't recur even if pCloud itself gets faster.
              backup_transfers: 2
              backup_checkers: 4
              backup_bwlimit: "8M"
              backup_cpu_quota: "40%"
            nuc:
              ansible_host: nuc.tail33930.ts.net
              ansible_user: root
              tailscale_ip: 100.100.10.1

        # Unraid NAS - Partial management. Most containers are still owned by the
        # Unraid UI; only services explicitly marked `managed: true` in the
        # catalog are deployed from here. See group_vars/unraid.yml.
        unraid:
          hosts:
            nas:
              ansible_host: nas.tail33930.ts.net
              ansible_user: root
              tailscale_ip: 100.100.10.2

    # ========================================================================
    # Ugreen NAS - on-prem backup target + (future) Syncthing node. Real
    # Debian 12 (bookworm) under UGOS, not a special case like Unraid: has
    # systemd, apt, docker already installed. Confirmed via direct SSH
    # 2026-07-29.
    #
    # Deliberately NOT under `managed`: two plays target `hosts: managed`
    # broadly (fact-gathering, Host Facts Endpoint), and the facts-endpoint
    # script's non-Unraid branch assumes dnf, which doesn't exist on Debian.
    # Add ugreen to specific plays explicitly instead of by group nesting
    # until that script grows a real apt-based branch.
    # ========================================================================
    ugreen:
      hosts:
        ugreen:
          ansible_host: ugreen.tail33930.ts.net
          ansible_user: root
          tailscale_ip: 100.100.10.4
          # RE-ENABLED 2026-08-10: btrfs pool rebuilt on new hardware, photorec
          # recovery + external-drive consolidation finished, volume is
          # writable again. Was DISABLED 2026-08-01 after the original
          # filesystem failed beyond repair (recovery ETA at the time was
          # 2026-08-17 - finished well ahead of that).
          ugreen_enabled: true

    # ========================================================================
    # WD My Cloud EX2 Ultra - backup-target-only NAS, BusyBox userland (no
    # systemd, no apt, no os-release). Onboarded 2026-08-07 via Tailscale
    # (manual arm binary install to the persistent partition, see
    # roles/wd-mycloud-tailscale) since it has no other reachable management
    # surface. Deliberately its own group, not `managed`/`unraid`/`ugreen`:
    # it does not run Docker Compose services and nothing here assumes a
    # package manager exists on it.
    # ========================================================================
    wd_mycloud:
      hosts:
        wd-mycloud:
          ansible_host: wd-mycloud.tail33930.ts.net
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          tailscale_ip: 100.100.10.5

    # ========================================================================
    # Proxy-Only Hosts - Only referenced in Caddy configuration
    # These hosts run their own services, Ansible just configures the proxy
    # ========================================================================
    proxy_only:
      hosts:
        homeassistant:
          ansible_host: homeassistant.tail33930.ts.net
          tailscale_ip: 100.100.10.200
          # Home Assistant host
