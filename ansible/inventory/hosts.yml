---
all:
  children:
    # Fully managed hosts - Ansible deploys software and configuration
    rocky:
      hosts:
        mljr:
          ansible_host: mljr.tail33930.ts.net
          ansible_user: root

    # Unraid hosts - managed via custom scripts
    unraid:
      hosts:
        nas:
          ansible_host: nas.tail33930.ts.net
          ansible_user: root

    # Proxy-only hosts - only used for Caddy reverse proxy generation
    # These hosts are NOT managed by Ansible deployment, only referenced in Caddyfile
    proxy_only:
      hosts:
        pi:
          ansible_host: pi.tail33930.ts.net
          # No ansible_user - no SSH access needed
        homeserver:
          ansible_host: nuc.tail33930.ts.net
          # No ansible_user - managed separately
        monitoring:
          ansible_host: 192.168.50.175
          # TODO: Add correct Tailscale domain name when available

    # Convenience group for hosts that run Docker
    docker_hosts:
      children:
        rocky:
        unraid:
