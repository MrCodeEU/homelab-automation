---
# Test inventory — mirrors the production host structure but points to
# local Docker containers exposed on loopback SSH ports.

all:
  children:
    managed:
      children:
        rocky:
          hosts:
            mljr:
              ansible_host: 127.0.0.1
              ansible_port: 2201
              ansible_user: root
              ansible_ssh_private_key_file: "{{ playbook_dir }}/../../tests/ssh/id_ed25519"
              ansible_ssh_common_args: >-
                -o StrictHostKeyChecking=no
                -o UserKnownHostsFile=/dev/null
              tailscale_ip: 127.0.0.1
            nuc:
              ansible_host: 127.0.0.1
              ansible_port: 2202
              ansible_user: root
              ansible_ssh_private_key_file: "{{ playbook_dir }}/../../tests/ssh/id_ed25519"
              ansible_ssh_common_args: >-
                -o StrictHostKeyChecking=no
                -o UserKnownHostsFile=/dev/null
              tailscale_ip: 127.0.0.2
        unraid:
          hosts:
            nas:
              ansible_host: 127.0.0.1
              ansible_port: 2203
              ansible_user: root
              tailscale_ip: 127.0.0.3
    proxy_only:
      hosts:
        homeassistant:
          ansible_host: 127.0.0.1
          tailscale_ip: 127.0.0.10
        monitoring:
          ansible_host: 127.0.0.1
          tailscale_ip: 127.0.0.11
