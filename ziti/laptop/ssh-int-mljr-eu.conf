# Short names over Ziti for SSH (docs/ZERO_TRUST_PLAN.md C10). Installed by
# scripts/ziti-laptop-tunnel.sh to ~/.ssh/config.d/int-mljr-eu.conf and
# included from the top of ~/.ssh/config.
#
# `ssh root@nuc` first tries nuc.int.mljr.eu. That name only resolves while
# the tunneler is up (Ziti intercept; public DNS says NXDOMAIN), so the
# connection goes over Ziti. Otherwise, and for hosts not on Ziti yet,
# CanonicalizeFallbackLocal resolves `nuc` as before (MagicDNS, LAN).
#
# Done in SSH, not as a resolved search domain: resolved sends a short name
# to every link with search domains in parallel (tailscale0, wlan0's
# fritz.box, ziti0) and takes the first positive answer, so Ziti lost the
# race (tested 2026-11-06).
CanonicalizeHostname yes
CanonicalDomains int.mljr.eu
CanonicalizeMaxDots 0
CanonicalizeFallbackLocal yes
