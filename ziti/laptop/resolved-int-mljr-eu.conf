# Search domain for short names over Ziti (docs/ZERO_TRUST_PLAN.md C10).
# Installed by scripts/ziti-laptop-tunnel.sh to
# /etc/systemd/resolved.conf.d/int-mljr-eu.conf.
#
# Global search domains come before per-link ones (tailscale0's
# tail33930.ts.net), so `ssh root@nuc` tries nuc.int.mljr.eu first. With the
# tunneler up, only Ziti answers it (public DNS says NXDOMAIN). With it down,
# resolution falls through to nuc.tail33930.ts.net: Tailscale stays the
# fallback during the parallel run.
[Resolve]
Domains=int.mljr.eu
