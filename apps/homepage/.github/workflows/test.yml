name: Test and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/homepage/backend/go.sum

      - name: Install dependencies
        working-directory: apps/homepage/backend
        run: go mod download

      - name: Run tests
        working-directory: apps/homepage/backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/homepage/backend
          args: --config=../.golangci.yml

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/homepage/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/homepage/frontend
        run: npm ci

      - name: Run linter
        working-directory: apps/homepage/frontend
        run: npm run lint

      - name: Run type check
        working-directory: apps/homepage/frontend
        run: npm run check

      - name: Run tests
        working-directory: apps/homepage/frontend
        run: npm run test

  build-docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: apps/homepage
        run: docker build -t homepage:test .

      - name: Test container starts
        run: |
          docker run -d --name homepage-test -p 8080:8080 homepage:test
          sleep 5
          curl -f http://localhost:8080/api/health || exit 1
          docker stop homepage-test
