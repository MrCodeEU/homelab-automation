# Service Configuration
# This file defines all services for your homelab
# Used to generate Caddyfile, Glance dashboard, and other configs

global:
  domain: "mljr.eu"  # Your base domain
  email: "admin@mljr.eu"  # For Let's Encrypt
  location: "Thaling, Austria"  # For weather widget

# Dashboard configuration
dashboard:
  name: "Homelab Dashboard"
  theme: "dark"  # dark or light
  timezone: "Europe/London"

services:
  # Dashboard (local on VPS)
  - name: glance
    enabled: true
    # skip_deploy: false  # Optional: set true to exclude from generated configs/deploy reloads
    domain: "dash.mljr.eu"
    port: 8080
    host: mljr
    description: "Main dashboard"
    icon: "mdi:view-dashboard"
    # host: localhost  # Optional: defaults to localhost if not specified
  
  # Health Monitoring (local on VPS)
  - name: nightscout
    enabled: true
    # skip_deploy: false
    domain: 
      - "nightscout.mljr.eu"
      - "ns.mljr.eu"
    port: 1337
    host: mljr
    description: "CGM Monitor"
    icon: "mdi:diabetes"
  
  # Monitoring (Uptime Kuma)
  - name: kuma
    enabled: true
    host: mljr
    skip_deploy: false
    domain: "status.mljr.eu"
    port: 3001
    description: "Uptime Monitoring"
    icon: "mdi:heart-pulse"

  # Access Logs (GoAccess)
  - name: goaccess
    enabled: true
    domain: "logs.mljr.eu"
    port: 7890
    host: mljr
    description: "Access Logs"
    icon: "mdi:chart-bar"

  # Home Assistant (external service - not managed by this automation)
  - name: homeassistant
    enabled: true
    managed: false  # Set to false for services deployed elsewhere
    domain: "home.mljr.eu"
    port: 8123
    description: "Home Automation"
    icon: "mdi:home-assistant"
    host: pi

  # Mail archiver (Bichon)
  - name: bichon
    enabled: false
    # skip_deploy: false
    domain: "mail-archive.mljr.eu"
    port: 15630
    description: "Email archiver (Bichon)"
    icon: "mdi:email"
    host: mljr

  # Mailcow (Mail Server)
  - name: mailcow
    enabled: true
    domain: "mail.mljr.eu"
    port: 8081  # Mailcow nginx-mailcow container port (8080 used by Glance)
    description: "Mail Server"
    icon: "mdi:email-server"
    host: mljr
    managed: false  # Deployed via dedicated setup script, not by deploy-service.sh

  # Example: Service with custom upstream (no port needed if already in URL format)
  # - name: custom
  #   enabled: false
  #   domain: "app.mljr.eu"
  #   upstream: "http://192.168.1.100:8080/path"  # Full URL
  #   description: "Custom Service"
  #   icon: "mdi:application"
