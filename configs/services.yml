# Service Configuration
# This file defines all services for your homelab
# Used to generate Caddyfile, Glance dashboard, and other configs

global:
  domain: "mljr.eu"  # Your base domain
  email: "admin@mljr.eu"  # For Let's Encrypt
  location: "Thaling, Austria"  # For weather widget

# Dashboard configuration
dashboard:
  name: "Homelab Dashboard"
  theme: "dark"  # dark or light
  timezone: "Europe/London"

services:
  # Dashboard (local on VPS)
  - name: glance
    enabled: true
    # skip_deploy: false  # Optional: set true to exclude from generated configs/deploy reloads
    domain: "dash.mljr.eu"
    port: 8080
    host: mljr
    description: "Main dashboard"
    icon: "mdi:view-dashboard"
    # host: localhost  # Optional: defaults to localhost if not specified
  
  # Health Monitoring (local on VPS)
  - name: nightscout
    enabled: true
    # skip_deploy: false
    domain: "nightscout.mljr.eu"
    port: 1337
    host: mljr
    description: "CGM Monitor"
    icon: "mdi:diabetes"
    
  # Container Management
  - name: portainer
    enabled: false
    # skip_deploy: false
    domain: "portainer.mljr.eu"
    port: 9000
    host: mljr
    description: "Docker management"
    icon: "si:portainer"
  
  # Monitoring (prepared for future)
  - name: kuma
    enabled: false
    host: mljr
    skip_deploy: false
    domain: "status.mljr.eu"

  # Home Assistant
  - name: homeassistant
    enabled: true
    managed: false
    domain: "home.mljr.eu"
    port: 8123
    description: "Home Automation"
    icon: "mdi:home-assistant"
    host: pi

  # Mail archiver (Bichon)
  - name: bichon
    enabled: false
    # skip_deploy: false
    domain: "mail-archive.mljr.eu"
    port: 15630
    description: "Email archiver (Bichon)"
    icon: "mdi:email"

  # Mailcow (Mail Server)
  - name: mailcow
    enabled: true
    domain: "mail.mljr.eu"
    description: "Mail Server"
    icon: "mdi:email-server"
    host: vps

  # Example: Service with custom upstream (no port needed if already in URL format)
  # - name: custom
  #   enabled: false
  #   domain: "app.mljr.eu"
  #   upstream: "http://192.168.1.100:8080/path"  # Full URL
  #   description: "Custom Service"
  #   icon: "mdi:application"
