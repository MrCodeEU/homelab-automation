# Service Configuration
# This file defines all services for your homelab
# Used to generate Caddyfile, Glance dashboard, and other configs

global:
  domain: "mljr.eu"  # Your base domain
  email: "admin@mljr.eu"  # For Let's Encrypt
  location: "London, United Kingdom"  # For weather widget

# Dashboard configuration
dashboard:
  name: "Homelab Dashboard"
  theme: "dark"  # dark or light
  timezone: "Europe/London"

services:
  # Dashboard (local on VPS)
  - name: glance
    enabled: true
    domain: "dash.mljr.eu"
    port: 8080
    description: "Main dashboard"
    icon: "mdi:view-dashboard"
    # host: localhost  # Optional: defaults to localhost if not specified
  
  # Health Monitoring (local on VPS)
  - name: nightscout
    enabled: true
    domain: "nightscout.mljr.eu"
    port: 1337
    description: "CGM Monitor"
    icon: "mdi:diabetes"
    # host: localhost  # Optional: defaults to localhost
    
  # Container Management
  - name: portainer
    enabled: false
    domain: "portainer.mljr.eu"
    port: 9000
    description: "Docker management"
    icon: "si:portainer"
  
  # Monitoring (prepared for future)
  - name: kuma
    enabled: false
    domain: "status.mljr.eu"
    port: 3001
    description: "Uptime monitoring"
    icon: "mdi:heart-pulse"
    
  # Remote Services Examples:
  
  # Example: Home Assistant on Raspberry Pi (local network via Tailscale exit node)
  - name: homeassistant
    enabled: false
    domain: "home.mljr.eu"
    host: "192.168.50.4"  # Local IP in home network
    port: 8123
    description: "Home Automation"
    icon: "mdi:home-assistant"
  
  # Example: Service on another Tailscale device
  # - name: plex
  #   enabled: false
  #   domain: "plex.mljr.eu"
  #   host: "homeserver.tailnet-xxx.ts.net"  # Tailscale hostname
  #   port: 32400
  #   description: "Media Server"
  #   icon: "mdi:plex"
  
  # Example: Service with custom upstream (no port needed if already in URL format)
  # - name: custom
  #   enabled: false
  #   domain: "app.mljr.eu"
  #   upstream: "http://192.168.1.100:8080/path"  # Full URL
  #   description: "Custom Service"
  #   icon: "mdi:application"
