services:
  fail2ban-exporter:
    image: hectorqin/fail2ban-prometheus-exporter:latest
    container_name: fail2ban-exporter
    restart: unless-stopped
    volumes:
      - /var/run/fail2ban/fail2ban.sock:/var/run/fail2ban/fail2ban.sock:ro
    ports:
      - "9191:9191"
    environment:
      - TZ=${TZ}

  # Fail2Ban UI - Enterprise-grade web-based management platform
  # From: https://github.com/swissmakers/fail2ban-ui
  # Provides centralized ban-control, real-time monitoring and alerting
  
  fail2ban-ui:
    image: registry.swissmakers.ch/infra/fail2ban-ui:latest
    container_name: fail2ban-ui
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/fail2ban-ui:/config:Z
      - /etc/fail2ban:/etc/fail2ban:Z
      - /var/log:/var/log:ro
      - /var/run/fail2ban:/var/run/fail2ban
    environment:
      - TZ=${TZ}
      - PORT=5000
