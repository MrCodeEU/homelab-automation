version: '3.8'

services:
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    ports:
      - "7890:7890"
    volumes:
      - /opt/caddy/logs:/srv/logs:ro
      - ./report:/srv/report
    # Run GoAccess in a loop to update report every 30s
    entrypoint: /bin/sh
    command: >
      -c "mkdir -p /srv/report && 
      echo 'Starting GoAccess loop...' && 
      while true; do 
        if [ -f /srv/logs/access.log ]; then
          goaccess /srv/logs/access.log --log-format=CADDY -o /srv/report/index.html --no-global-config;
        else
          echo 'Waiting for logs...';
        fi;
        sleep 30; 
      done"
