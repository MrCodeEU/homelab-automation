version: '3.8'

services:
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    ports:
      - "7890:7890"
    volumes:
      - /opt/caddy/logs:/var/log/caddy:ro
      - /opt/goaccess/report:/var/www/goaccess:rw
    # Real-time HTML report with WebSocket support
    # Custom format for Caddy JSON logs
    command: >
      /var/log/caddy/access.log 
      --log-format='{"ts":%x.%^,"request":{"remote_ip":"%h","proto":"%H","method":"%m","host":"%v","uri":"%U","headers":{"User-Agent":["%u"]}},"user_id":"%^","duration":%T,"size":%b,"status":%s,"resp_headers":%^}'
      -o /var/www/goaccess/index.html 
      --real-time-html 
      --ws-url=wss://logs.mljr.eu:443/ws 
      --port=7890 
      --no-query-string
