version: '3.8'

services:
  # MongoDB Database for Nightscout
  mongo:
    image: mongo:4.4
    container_name: nightscout-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - nightscout-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nightscout CGM Web Monitor
  nightscout:
    image: nightscout/cgm-remote-monitor:latest
    container_name: nightscout
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      # MongoDB Connection (internal network)
      MONGODB_URI: mongodb://mongo:27017/nightscout
      MONGO_COLLECTION: entries
      
      # API Secret (from .env file)
      API_SECRET: ${API_SECRET}
      
      # Display Settings
      DISPLAY_UNITS: ${DISPLAY_UNITS:-mg/dl}
      TIME_FORMAT: ${TIME_FORMAT:-24}
      THEME: ${THEME:-colors}
      
      # Enable Plugins
      ENABLE: ${ENABLE:-careportal basal dbsize}
      
      # Alarm Settings (optional)
      BG_HIGH: ${BG_HIGH:-260}
      BG_TARGET_TOP: ${BG_TARGET_TOP:-180}
      BG_TARGET_BOTTOM: ${BG_TARGET_BOTTOM:-80}
      BG_LOW: ${BG_LOW:-55}
      ALARM_TYPES: ${ALARM_TYPES:-simple}
      
      # Base URL (will be set by Caddy)
      BASE_URL: https://${NIGHTSCOUT_DOMAIN:-nightscout.example.com}
      
      # Timezone
      TZ: ${TZ:-Europe/Berlin}
      
      # Security
      AUTH_DEFAULT_ROLES: readable
      
    ports:
      - "127.0.0.1:1337:1337"  # Bind to localhost only (system Caddy can reach it)
    networks:
      - nightscout-internal
      - caddy_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LibreLink Up to Nightscout Connector
  librelink-up:
    image: timoschlueter/nightscout-librelink-up:latest
    container_name: nightscout-librelink-up
    restart: unless-stopped
    depends_on:
      - nightscout
    environment:
      # LibreLink Up Credentials (from .env file)
      LINK_UP_USERNAME: ${LINK_UP_USERNAME}
      LINK_UP_PASSWORD: ${LINK_UP_PASSWORD}
      # Region: EU is standard, but try DE if you are in Austria/Germany and EU fails
      LINK_UP_REGION: ${LINK_UP_REGION:-DE}
      LINK_UP_TIME_INTERVAL: ${LINK_UP_TIME_INTERVAL:-5}
      LINK_UP_VERSION: ${LINK_UP_VERSION:-4.16.0}
      
      # Optional: specific patient connection
      LINK_UP_CONNECTION: ${LINK_UP_CONNECTION:-}
      
      # Nightscout Connection (uses internal container name)
      NIGHTSCOUT_URL: nightscout:1337
      NIGHTSCOUT_API_TOKEN: ${NIGHTSCOUT_API_TOKEN}
      NIGHTSCOUT_DISABLE_HTTPS: "true"  # Internal connection doesn't need HTTPS
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Fetch all available data
      ALL_DATA: ${ALL_DATA:-true}
      
      # Timezone
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - nightscout-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nightscout-internal:
    driver: bridge
  caddy_network:
    external: true

volumes:
  mongo-data:
    driver: local
