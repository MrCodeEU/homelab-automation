version: '3.8'

services:
  example-service:
    image: nginx:alpine
    container_name: example-service
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - example-data:/usr/share/nginx/html
    networks:
      - caddy_network
    environment:
      - TZ=Europe/London

volumes:
  example-data:

networks:
  caddy_network:
    external: true
