name: IaC Security Scan

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ansible/**"
      - "services/**/docker-compose*.yml"
      - "services/**/Dockerfile"
      - "services/**/Dockerfile.*"
      - "openvox/**/docker-compose*.yml"
      - "openvox/**/Dockerfile"
      - "openvox/**/Dockerfile.*"
      - ".checkov.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "ansible/**"
      - "services/**/docker-compose*.yml"
      - "services/**/Dockerfile"
      - "services/**/Dockerfile.*"
      - "openvox/**/docker-compose*.yml"
      - "openvox/**/Dockerfile"
      - "openvox/**/Dockerfile.*"
      - ".checkov.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: iac-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --disable-pip-version-check "checkov==3.2.529"

      - name: Run Checkov
        run: |
          mkdir -p reports/checkov
          checkov \
            --directory . \
            --compact \
            --output cli \
            --output sarif \
            --output-file-path console,reports/checkov/checkov.sarif \
            --soft-fail

      - name: Upload Checkov report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report-${{ github.run_id }}
          path: reports/checkov
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Checkov SARIF
        if: always() && hashFiles('reports/checkov/checkov.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov/checkov.sarif
