name: IaC Security Scan

on:
  # Deliberately no `paths:` filter - Checkov scans `--directory .` (the
  # whole repo) regardless of what changed, and it's a required status
  # check on main's ruleset. A path-filtered required check that doesn't
  # run on a given PR (e.g. a docs-only change) sits "expected" forever -
  # GitHub rulesets have no "skip if not triggered" logic - which blocked
  # PR #290 outright, even with --admin (this ruleset has no admin bypass
  # by design). Always running is the only way a full-repo scan can be a
  # required check without occasionally blocking unrelated PRs.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: iac-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Checkov
        run: |
          python -m pip install --disable-pip-version-check "checkov==3.2.529"

      - name: Run Checkov
        run: |
          mkdir -p reports/checkov
          checkov \
            --directory . \
            --compact \
            --output cli \
            --output sarif \
            --output-file-path console,reports/checkov/checkov.sarif

      - name: Upload Checkov report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkov-report-${{ github.run_id }}
          path: reports/checkov
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Checkov SARIF
        if: always() && hashFiles('reports/checkov/checkov.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: reports/checkov/checkov.sarif
