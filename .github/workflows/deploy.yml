name: Deploy Homelab

on:
  # Manual trigger - can be run from ANY branch via GitHub UI
  # Non-main branches automatically deploy to staging environment
  workflow_dispatch:
    inputs:
      limit:
        description: 'Target hosts (all, mljr, rocky)'
        required: false
        default: 'all'
        type: string
      tags:
        description: 'Ansible tags (all, base, caddy, services, backup, security)'
        required: false
        default: 'all'
        type: string
      staging:
        description: 'Deploy staging environment (to nuc)'
        required: false
        default: true
        type: boolean

  # Automatic deploy on main branch
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'services/**'
      - '.github/workflows/deploy.yml'

  # Check mode (dry run) on pull requests - use as required PR check
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'services/**'
      - '.github/workflows/deploy.yml'

  repository_dispatch:
    types: [service-update]

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate service configurations before deployment
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate service configurations
        run: bash ./.githooks/pre-commit

  # Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          IS_STAGING="false"
          CHECK_MODE="false"

          # Pull requests always run in check mode (dry run)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            IS_STAGING="true"
            CHECK_MODE="true"
            echo "Pull request detected - running in CHECK MODE"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch: use the staging input (default: true)
            IS_STAGING="${{ inputs.staging }}"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Push to main: deploy both production AND staging
            IS_STAGING="true"
            echo "Push to main - deploying production + staging"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # External triggers: deploy both production AND staging
            IS_STAGING="true"
            echo "Repository dispatch - deploying production + staging"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Non-main branches: check mode only
            IS_STAGING="true"
            CHECK_MODE="true"
          fi

          echo "is_staging=$IS_STAGING" >> $GITHUB_OUTPUT
          echo "check_mode=$CHECK_MODE" >> $GITHUB_OUTPUT
          echo "Environment: $([ "$IS_STAGING" == "true" ] && echo 'production + staging' || echo 'production only')"
          echo "Check mode: $CHECK_MODE"

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible and Collections
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/pipx
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}-v5
          restore-keys: |
            ansible-${{ runner.os }}-

      - name: Install Ansible with Mitogen
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
            pipx inject ansible-core docker mitogen ansible-mitogen
            echo "✓ Installed Ansible with Mitogen for faster execution"
          else
            echo "Ansible already installed (from cache)"
            # Ensure Mitogen is installed even when restoring from cache
            if ! python -c "import ansible_mitogen" 2>/dev/null; then
              echo "Installing Mitogen..."
              pipx inject ansible-core mitogen ansible-mitogen
              echo "✓ Mitogen installed"
            else
              echo "✓ Mitogen already available"
            fi
          fi

      - name: Install collections
        run: |
          echo "::group::Installing Ansible collections"
          cd ansible && ansible-galaxy collection install -r requirements.yml --force-with-deps
          echo "::endgroup::"

      - name: Detect changed services
        id: changes
        run: |
          echo "::group::Detecting changed services"
          
          # Default: deploy all services
          CHANGED_SERVICES="all"
          
          # On push (not first commit), detect changed services
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # Get changed service directories
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "^services/" | cut -d/ -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            
            if [ -n "$CHANGED" ]; then
              CHANGED_SERVICES="$CHANGED"
              echo "📦 Changed services detected: $CHANGED_SERVICES"
            else
              echo "No service changes detected, checking for ansible changes..."
              # Check if ansible configs changed
              if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^ansible/"; then
                echo "Ansible configuration changed - deploying all services"
                CHANGED_SERVICES="all"
              else
                echo "No relevant changes - skipping service deployment"
                CHANGED_SERVICES="none"
              fi
            fi
          else
            echo "Full deployment (manual trigger, PR, or first commit)"
          fi
          
          echo "changed_services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Run Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Performance optimizations
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_SSH_PIPELINING: "True"
          # Mitogen strategy for 40-70% speed improvement
          ANSIBLE_STRATEGY: "mitogen_linear"
          # Secrets
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
          KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          BESZEL_KEY: ${{ secrets.BESZEL_KEY }}
          BESZEL_TOKEN: ${{ secrets.BESZEL_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          PCLOUD_TOKEN: ${{ secrets.PCLOUD_TOKEN }}
        run: |
          cd ansible

          # Determine limit
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          # Determine tags
          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Extra vars
          EXTRA_VARS="is_staging_deployment=${{ steps.env.outputs.is_staging }}"
          
          # Add changed services if detected
          if [ "${{ steps.changes.outputs.changed_services }}" != "all" ] && [ "${{ steps.changes.outputs.changed_services }}" != "none" ]; then
            EXTRA_VARS="$EXTRA_VARS changed_services=${{ steps.changes.outputs.changed_services }}"
            echo "🎯 Targeted deployment: only changed services will be updated"
          elif [ "${{ steps.changes.outputs.changed_services }}" == "none" ]; then
            echo "⏭️  No services to deploy - skipping ansible run"
            exit 0
          fi

          # Check mode for non-main branches (dry run)
          CHECK_FLAG=""
          if [ "${{ steps.env.outputs.check_mode }}" == "true" ]; then
            CHECK_FLAG="--check --diff"
            echo "Running in CHECK MODE (dry run) - no changes will be made"
          fi

          echo "🚀 Running: ansible-playbook site.yml --limit $LIMIT --tags $TAGS --forks 20 $CHECK_FLAG"
          echo "⚡ Using Mitogen strategy for faster execution"
          echo "::group::Ansible Deployment"
          
          ansible-playbook playbooks/site.yml \
            --limit "$LIMIT" \
            --tags "$TAGS" \
            --forks 20 \
            $CHECK_FLAG \
            --extra-vars "$EXTRA_VARS" \
            2>&1 | tee /tmp/ansible-output.log
          
          ANSIBLE_EXIT_CODE=${PIPESTATUS[0]}
          echo "::endgroup::"
          
          exit $ANSIBLE_EXIT_CODE

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ steps.env.outputs.check_mode == 'true' && '🧪 Dry Run (Check Mode)' || '🎯 Live Deployment' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.is_staging == 'true' && '🔵 Production + Staging' || '🟢 Production Only' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi
          
          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi
          
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Hosts:** \`$LIMIT\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** \`$TAGS\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changes.outputs.changed_services }}" != "all" ] && [ "${{ steps.changes.outputs.changed_services }}" != "" ]; then
            echo "- **Changed Services:** \`${{ steps.changes.outputs.changed_services }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse timing from profile_tasks callback if available
          if [ -f /tmp/ansible-output.log ]; then
            echo "### 📊 Execution Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -n 50 /tmp/ansible-output.log | head -n 30 >> $GITHUB_STEP_SUMMARY || echo "Output not available" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Failure Information" >> $GITHUB_STEP_SUMMARY
            echo "Check the Ansible Deployment section above for detailed error messages." >> $GITHUB_STEP_SUMMARY
            echo "::error::Deployment failed - check logs for details"
          fi

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")

          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Check mode indicator
          MODE=""
          if [ "${{ steps.env.outputs.check_mode }}" == "true" ]; then
            MODE=" [DRY RUN]"
          fi

          # Staging indicator
          STAGING_INFO=""
          if [ "${{ steps.env.outputs.is_staging }}" == "true" ]; then
            STAGING_INFO=" +staging"
          fi

          # Check if ntfy is reachable first (3 second timeout)
          if curl -s --connect-timeout 3 --max-time 3 https://ntfy.mljr.eu/deployment -o /dev/null; then
            echo "Sending notification to ntfy..."
            curl -s \
              --connect-timeout 5 \
              --max-time 10 \
              -H "Title: Deployment $STATUS$MODE" \
              -H "Priority: $PRIORITY" \
              -H "Tags: ansible,homelab" \
              -d "$EMOJI Homelab deployed (limit: $LIMIT, tags: $TAGS$STAGING_INFO)$MODE" \
              https://ntfy.mljr.eu/deployment || echo "Failed to send notification"
          else
            echo "⚠️  Ntfy service is not reachable, skipping notification"
          fi
