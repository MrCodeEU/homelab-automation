name: Deploy Homelab

on:
  # Manual trigger - can be run from ANY branch via GitHub UI
  # Non-main branches automatically deploy to staging environment
  workflow_dispatch:
    inputs:
      limit:
        description: 'Target hosts (all, mljr, rocky)'
        required: false
        default: 'all'
        type: string
      tags:
        description: 'Ansible tags (all, base, caddy, services, backup, security)'
        required: false
        default: 'all'
        type: string
      staging:
        description: 'Deploy staging environment (to nuc)'
        required: false
        default: true
        type: boolean

  # Automatic deploy on main branch
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'services/**'
      - '.github/workflows/deploy.yml'

  # Check mode (dry run) on pull requests - use as required PR check
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'services/**'
      - '.github/workflows/deploy.yml'

  repository_dispatch:
    types: [service-update]

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate service configurations before deployment
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate service configurations
        run: bash ./.githooks/pre-commit

  # Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          IS_STAGING="false"
          CHECK_MODE="false"

          # Pull requests always run in check mode (dry run)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            IS_STAGING="true"
            CHECK_MODE="true"
            echo "Pull request detected - running in CHECK MODE"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch: use the staging input (default: true)
            IS_STAGING="${{ inputs.staging }}"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Push to main: deploy both production AND staging
            IS_STAGING="true"
            echo "Push to main - deploying production + staging"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # External triggers: deploy both production AND staging
            IS_STAGING="true"
            echo "Repository dispatch - deploying production + staging"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Non-main branches: check mode only
            IS_STAGING="true"
            CHECK_MODE="true"
          fi

          echo "is_staging=$IS_STAGING" >> $GITHUB_OUTPUT
          echo "check_mode=$CHECK_MODE" >> $GITHUB_OUTPUT
          echo "Environment: $([ "$IS_STAGING" == "true" ] && echo 'production + staging' || echo 'production only')"
          echo "Check mode: $CHECK_MODE"

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible and Collections
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/pipx
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}-v5
          restore-keys: |
            ansible-${{ runner.os }}-

      - name: Install Ansible with pipx
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            pipx install ansible-core
            pipx inject ansible-core docker
          else
            echo "Ansible already installed (from cache)"
          fi

      - name: Install collections
        run: cd ansible && ansible-galaxy collection install -r requirements.yml --force-with-deps

      - name: Run Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Performance optimizations
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_SSH_PIPELINING: "True"
          # Secrets
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
          KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          BESZEL_KEY: ${{ secrets.BESZEL_KEY }}
          BESZEL_TOKEN: ${{ secrets.BESZEL_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          PCLOUD_TOKEN: ${{ secrets.PCLOUD_TOKEN }}
        run: |
          cd ansible

          # Determine limit
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          # Determine tags
          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Extra vars
          EXTRA_VARS="is_staging_deployment=${{ steps.env.outputs.is_staging }}"

          # Check mode for non-main branches (dry run)
          CHECK_FLAG=""
          if [ "${{ steps.env.outputs.check_mode }}" == "true" ]; then
            CHECK_FLAG="--check --diff"
            echo "Running in CHECK MODE (dry run) - no changes will be made"
          fi

          echo "Running: ansible-playbook site.yml --limit $LIMIT --tags $TAGS --forks 20 $CHECK_FLAG"
          ansible-playbook playbooks/site.yml \
            --limit "$LIMIT" \
            --tags "$TAGS" \
            --forks 20 \
            $CHECK_FLAG \
            --extra-vars "$EXTRA_VARS"

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")

          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Check mode indicator
          MODE=""
          if [ "${{ steps.env.outputs.check_mode }}" == "true" ]; then
            MODE=" [DRY RUN]"
          fi

          # Staging indicator
          STAGING_INFO=""
          if [ "${{ steps.env.outputs.is_staging }}" == "true" ]; then
            STAGING_INFO=" +staging"
          fi

          # Check if ntfy is reachable first (3 second timeout)
          if curl -s --connect-timeout 3 --max-time 3 https://ntfy.mljr.eu/deployment -o /dev/null; then
            echo "Sending notification to ntfy..."
            curl -s \
              --connect-timeout 5 \
              --max-time 10 \
              -H "Title: Deployment $STATUS$MODE" \
              -H "Priority: $PRIORITY" \
              -H "Tags: ansible,homelab" \
              -d "$EMOJI Homelab deployed (limit: $LIMIT, tags: $TAGS$STAGING_INFO)$MODE" \
              https://ntfy.mljr.eu/deployment || echo "Failed to send notification"
          else
            echo "⚠️  Ntfy service is not reachable, skipping notification"
          fi
