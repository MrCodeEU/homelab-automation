name: Deploy Homelab

on:
  # Manual trigger - can be run from ANY branch via GitHub UI
  # Non-main branches automatically run in check mode (noop).
  workflow_dispatch:
    inputs:
      limit:
        description: 'Target hosts (all, mljr, nuc, ugreen)'
        required: false
        default: 'all'
        type: string
      staging_services:
        description: 'Optional comma-separated staging services to deploy on nuc (for example: homepage,speedtest)'
        required: false
        default: ''
        type: string
      docker_prune:
        description: 'Prune unused Docker images/containers during deployment'
        required: false
        default: false
        type: boolean
      reboot_if_needed:
        description: 'Reboot hosts that need it to activate installed updates (gated on needs-restarting)'
        required: false
        default: false
        type: boolean

  # Deliberately no `push` trigger on main: this repo pushes straight to main
  # often (branch protection is bypassable), and every push auto-deploying
  # with LIMIT=all meant even a one-line doc fix ran a full deploy. Deploys
  # are now always a conscious step: `gh workflow run deploy.yml -f
  # limit=...` (or the GitHub UI), scoped to what actually changed. The
  # weekly schedule below remains the untargeted safety net.

  # Pull requests are handled by openvox-pr-check.yml. Keeping PR code out of
  # this deployment workflow prevents its reporting/notification steps from
  # writing to production during a dry run.

  # Weekly full deployment to keep all systems and containers up to date
  schedule:
    # Sunday 00:00 UTC = 02:00 CEST / 01:00 CET. Deliberately not 04:00 UTC:
    # that is 06:00 CEST, in the middle of the Unraid appdata backup window
    # (05:00-07:47 CEST), which stops thirteen containers one at a time - a
    # full deploy and that backup were fighting over the same machine every
    # week. Local midnight is no good either: nas runs Community Applications
    # docker auto-update at 00:00-00:10 CEST daily. 02:00 CEST is clear of both.
    - cron: '0 0 * * 0'

  repository_dispatch:
    types: [service-update]

# Prevent concurrent deployments
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('deploy-svc-{0}', github.event.client_payload.service) || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Validate service configurations before deployment
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python deps for validation
        run: pip install --quiet pyyaml jinja2

      - name: Install Caddy for config syntax validation
        env:
          CADDY_VERSION: "2.11.2"
        run: |
          curl -sSL \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin caddy
          caddy version

      - name: Validate service configurations and Caddy templates
        run: bash ./.githooks/pre-commit

  # Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    env:
      # Keep in sync with Makefile's OPENVOX_HOSTS.
      MLJR_HOST: mljr.tail33930.ts.net
      NUC_HOST: nuc.tail33930.ts.net
      UGREEN_HOST: ugreen.tail33930.ts.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python deps
        # Runs on its own runner, separate from the validate job - needs its
        # own pyyaml for the services_catalog lookups below.
        run: pip install --quiet pyyaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/go.mod

      - name: Build deploy-status tool
        # Built fresh each run rather than vendoring a binary - unlike the
        # host-deployed tools/cmd/* binaries, this one only ever runs here,
        # on the ephemeral runner itself.
        run: |
          cd tools
          go build -o /tmp/build-deploy-status ./cmd/build-deploy-status

      - name: Set environment
        id: env
        # The repository_dispatch payload is untrusted input: anything holding a
        # token with repo write can set these fields to arbitrary strings. They
        # are passed through the environment rather than interpolated into the
        # script, because `VAR="${{ ... }}"` lets a value like `"; curl x | sh; #`
        # execute on a runner that carries Tailscale SSH access to every host.
        # They are also validated below before reaching $GITHUB_OUTPUT, so
        # every later consumer of those outputs is safe by construction.
        env:
          RAW_DISPATCH_SERVICE: ${{ github.event.client_payload.service }}
          RAW_STAGING_SERVICES: ${{ inputs.staging_services }}
        run: |
          CHECK_MODE="false"
          DISPATCH_SERVICE=""
          STAGING_SERVICES=""

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHECK_MODE="true"
            echo "Pull request detected - running in CHECK MODE"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # External triggers: read service from the payload, which is
            # untrusted (see the env: block above). Reject anything that is
            # not a plain identifier rather than trying to escape it - a
            # service name has no legitimate reason to contain a quote, a
            # semicolon or a newline, and a newline alone would let the
            # payload forge extra $GITHUB_OUTPUT entries.
            # Deliberately a shell glob and not `grep -qE`: grep matches per
            # line, so "godrive\nmalicious=1" would satisfy an anchored regex
            # and still smuggle a second line into $GITHUB_OUTPUT. `case`
            # tests the whole string, newlines included.
            case "$RAW_DISPATCH_SERVICE" in
              "" | *[!A-Za-z0-9._-]* )
                echo "::error::repository_dispatch rejected: 'service' must be 1-64 chars of [A-Za-z0-9._-]"
                exit 1
                ;;
            esac
            if [ "${#RAW_DISPATCH_SERVICE}" -gt 64 ]; then
              echo "::error::repository_dispatch rejected: 'service' is longer than 64 characters"
              exit 1
            fi
            DISPATCH_SERVICE="$RAW_DISPATCH_SERVICE"
            echo "Repository dispatch - deploying service: $DISPATCH_SERVICE"
          elif [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            # Non-main branches: check mode only
            CHECK_MODE="true"
          fi

          if [ -n "$RAW_STAGING_SERVICES" ]; then
            case "$RAW_STAGING_SERVICES" in
              *[!A-Za-z0-9,._-]* | ,* | *, | *,,* )
                echo "::error::staging_services must be comma-separated service names"
                exit 1
                ;;
            esac
            if [ "${#RAW_STAGING_SERVICES}" -gt 256 ]; then
              echo "::error::staging_services is longer than 256 characters"
              exit 1
            fi
            STAGING_SERVICES="$RAW_STAGING_SERVICES"
            echo "Staging deployment requested: $STAGING_SERVICES"
          fi

          {
            echo "check_mode=$CHECK_MODE"
            echo "dispatch_service=$DISPATCH_SERVICE"
            echo "staging_services=$STAGING_SERVICES"
          } >> "$GITHUB_OUTPUT"
          echo "Check mode: $CHECK_MODE"
          if [ -n "$DISPATCH_SERVICE" ]; then
            echo "Target service: $DISPATCH_SERVICE"
          fi
          if [ -n "$STAGING_SERVICES" ]; then
            echo "Staging services: $STAGING_SERVICES"
          fi

      - name: Resolve target hosts
        id: hosts
        run: |
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${INPUTS_LIMIT}" != "" ]; then
            LIMIT="${INPUTS_LIMIT}"
          fi

          DISPATCH_SERVICE="${STEPS_ENV_OUTPUTS_DISPATCH_SERVICE}"
          STAGING_SERVICES="${STEPS_ENV_OUTPUTS_STAGING_SERVICES}"
          if [ -n "$DISPATCH_SERVICE" ]; then
            # Puppet applies a whole host catalog idempotently, so there is no
            # equivalent to Ansible's surgical single-service fast path
            # (deploy-service.yml) - resolve the service's host from the
            # catalog and apply that host's full catalog, plus mljr too (if
            # different) so its Caddy snippet for the service stays current.
            SERVICE_HOST=$(DISPATCH_SERVICE="$DISPATCH_SERVICE" python3 -c "import os, yaml; d = yaml.safe_load(open('openvox/data/common.yaml')); m = next((s for s in d['services_catalog'] if s['name'] == os.environ['DISPATCH_SERVICE']), None); print(m.get('host', 'nuc') if m else 'nuc', end='')")
          fi

          case "$LIMIT" in
            all)
              HOSTS="$MLJR_HOST $NUC_HOST $UGREEN_HOST"
              ;;
            mljr) HOSTS="$MLJR_HOST" ;;
            nuc) HOSTS="$NUC_HOST" ;;
            ugreen) HOSTS="$UGREEN_HOST" ;;
            *)
              echo "::error::Unknown limit '$LIMIT' (expected all, mljr, nuc or ugreen)"
              exit 1
              ;;
          esac

          if [ -n "$DISPATCH_SERVICE" ]; then
            case "$SERVICE_HOST" in
              mljr) HOSTS="$MLJR_HOST" ;;
              nuc) HOSTS="$NUC_HOST $MLJR_HOST" ;;
              ugreen) HOSTS="$UGREEN_HOST $MLJR_HOST" ;;
              nas)
                # nas has no Puppet agent - it is reached via proxy-exec from
                # nuc's own catalog (roles::services_nas), so applying nuc
                # covers it. Add mljr too for the Caddy snippet.
                HOSTS="$NUC_HOST $MLJR_HOST"
                ;;
              *) HOSTS="$NUC_HOST $MLJR_HOST" ;;
            esac
            echo "Fast path: service=$DISPATCH_SERVICE resolved host=$SERVICE_HOST -> applying: $HOSTS"
          fi

          if [ -n "$STAGING_SERVICES" ]; then
            STAGING_SERVICES="$STAGING_SERVICES" python3 -c "import os, yaml; requested=os.environ['STAGING_SERVICES'].split(','); catalog=yaml.safe_load(open('openvox/data/common.yaml'))['services_catalog']; allowed={s['name'] for s in catalog if s.get('staging') and s.get('enabled', True) and s.get('managed', True) and not s.get('skip_deploy', False)}; invalid=[name for name in requested if name not in allowed]; (_ for _ in ()).throw(SystemExit('Unknown or non-staging service(s): ' + ', '.join(invalid))) if invalid else None"
            HOSTS="$NUC_HOST"
            echo "Staging target: $STAGING_SERVICES -> applying nuc only"
          fi

          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "Target hosts: $HOSTS"
        env:
          INPUTS_LIMIT: ${{ inputs.limit }}
          STEPS_ENV_OUTPUTS_DISPATCH_SERVICE: ${{ steps.env.outputs.dispatch_service }}
          STEPS_ENV_OUTPUTS_STAGING_SERVICES: ${{ steps.env.outputs.staging_services }}

      - name: Setup Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Notify deployment start
        run: |
          if [ "${STEPS_ENV_OUTPUTS_CHECK_MODE}" == "true" ]; then
            echo "Check mode - skipping start notification"
            exit 0
          fi

          DISPATCH_SERVICE="${STEPS_ENV_OUTPUTS_DISPATCH_SERVICE}"
          if [ -n "$DISPATCH_SERVICE" ]; then
            TITLE="Deployment starting - $DISPATCH_SERVICE"
            MSG="🚀 Deploying service: $DISPATCH_SERVICE (trigger: ${{ github.event_name }})"
          else
            TITLE="Deployment starting"
            SHA="${{ github.sha }}"
            MSG="🚀 Homelab deployment starting (trigger: ${{ github.event_name }}, branch: ${GITHUB_REF_NAME}, commit: ${SHA:0:7})"
          fi

          # Best-effort: don't fail the workflow if ntfy is unreachable
          curl -s --connect-timeout 5 --max-time 10 \
            -H "Title: $TITLE" \
            -H "Priority: low" \
            -H "Tags: openvox,homelab,rocket" \
            -d "$MSG" \
            https://ntfy.mljr.eu/deployment || echo "Start notification failed (non-critical)"
        env:
          STEPS_ENV_OUTPUTS_CHECK_MODE: ${{ steps.env.outputs.check_mode }}
          STEPS_ENV_OUTPUTS_DISPATCH_SERVICE: ${{ steps.env.outputs.dispatch_service }}

      - name: Record deployment start
        id: deploy_start
        run: |
          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run OpenVox
        id: openvox
        continue-on-error: true
        run: |
          set -o pipefail
          MODE="apply"
          if [ "${STEPS_ENV_OUTPUTS_CHECK_MODE}" == "true" ]; then
            MODE="noop"
            echo "Running in CHECK MODE (noop) - no changes will be made"
          fi

          # Weekly maintenance (docker prune / gated reboot) - masterless
          # equivalent of Ansible's docker_prune_enabled/reboot_if_needed
          # extra-vars, see openvox-sync.sh and site.pp's $weekly_maintenance.
          WEEKLY_MAINTENANCE="false"
          if [ "${{ github.event_name }}" == "schedule" ] || \
             [ "${{ inputs.docker_prune }}" == "true" ] || \
             [ "${{ inputs.reboot_if_needed }}" == "true" ]; then
            WEEKLY_MAINTENANCE="true"
            echo "Weekly maintenance enabled: docker prune + gated reboot"
          fi
          export OPENVOX_WEEKLY_MAINTENANCE="$WEEKLY_MAINTENANCE"
          export OPENVOX_STAGING_SERVICES="${STEPS_ENV_OUTPUTS_STAGING_SERVICES}"

          echo "🚀 Running: openvox-sync.sh on [${STEPS_HOSTS_OUTPUTS_HOSTS}] mode=$MODE"
          echo "::group::OpenVox Deployment"

          EXIT_CODE=0
          : > /tmp/openvox-output.log
          for host in ${STEPS_HOSTS_OUTPUTS_HOSTS}; do
            echo "--- $host ---" | tee -a /tmp/openvox-output.log
            if ! ./scripts/openvox-sync.sh "$host" "$MODE" 2>&1 | tee -a /tmp/openvox-output.log; then
              EXIT_CODE=1
            fi
          done

          echo "::endgroup::"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # openvox-sync.sh prefixes every line with "[host] ", so "Error:"
          # no longer starts the line - match past the prefix instead.
          if [ "$EXIT_CODE" -ne 0 ] || grep -qE "^\[[^]]+\] Error:" /tmp/openvox-output.log; then
            echo "::group::Deployment Errors"
            grep -E "^\[[^]]+\] Error:" /tmp/openvox-output.log || true
            echo "::endgroup::"
          fi

          exit "$EXIT_CODE"
        env:
          STEPS_ENV_OUTPUTS_CHECK_MODE: ${{ steps.env.outputs.check_mode }}
          STEPS_HOSTS_OUTPUTS_HOSTS: ${{ steps.hosts.outputs.hosts }}
          STEPS_ENV_OUTPUTS_STAGING_SERVICES: ${{ steps.env.outputs.staging_services }}

      - name: Upload OpenVox apply log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openvox-log-${{ github.run_id }}
          path: /tmp/openvox-output.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Update deployment status page
        if: always()
        env:
          START_TIME: ${{ steps.deploy_start.outputs.start_time }}
          START_EPOCH: ${{ steps.deploy_start.outputs.start_epoch }}
          OPENVOX_EXIT_CODE: ${{ steps.openvox.outputs.exit_code }}
          CHECK_MODE: ${{ steps.env.outputs.check_mode }}
          STEPS_ENV_OUTPUTS_DISPATCH_SERVICE: ${{ steps.env.outputs.dispatch_service }}
          STEPS_HOSTS_OUTPUTS_LIMIT: ${{ steps.hosts.outputs.limit }}
        run: |
          set +e  # Don't exit on errors - status page update is non-critical

          END_EPOCH=$(date +%s)
          START_EPOCH_VAL="${START_EPOCH:-$END_EPOCH}"
          DURATION=$((END_EPOCH - START_EPOCH_VAL))

          if [ "${OPENVOX_EXIT_CODE:-1}" == "0" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null | head -1 | cut -c1-100 || echo "No commit message")
          export COMMIT_MSG
          DISPATCH_SERVICE="${STEPS_ENV_OUTPUTS_DISPATCH_SERVICE}"

          WORKDIR=$(mktemp -d)
          WORKDIR="$WORKDIR" python3 -c "import os, yaml, json; d = yaml.safe_load(open('openvox/data/common.yaml')); json.dump(d['services_catalog'], open(os.path.join(os.environ['WORKDIR'], 'services.json'), 'w'))"
          scp -o StrictHostKeyChecking=accept-new \
            "root@${MLJR_HOST}:/opt/caddy/site/data/deployments.json" \
            "$WORKDIR/deployments.json" 2>/dev/null || \
            echo '{"deployments":[],"services":[],"last_updated":""}' > "$WORKDIR/deployments.json"

          CHECK_MODE_ARGS=()
          if [ "$CHECK_MODE" == "true" ]; then
            CHECK_MODE_ARGS+=(--check-mode)
          fi

          /tmp/build-deploy-status \
            --existing-json "$WORKDIR/deployments.json" \
            --services-json "$WORKDIR/services.json" \
            --ansible-log /tmp/openvox-output.log \
            --output-json "$WORKDIR/deployments-out.json" \
            --output-html "$WORKDIR/index.html" \
            --start-time "$START_TIME" \
            --duration-seconds "$DURATION" \
            --status "$STATUS" \
            --trigger "${{ github.event_name }}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-sha "${{ github.sha }}" \
            --commit-message "$COMMIT_MSG" \
            --actor "${GITHUB_ACTOR}" \
            --limit "${STEPS_HOSTS_OUTPUTS_LIMIT}" \
            --tags "n/a" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --ara-artifact "openvox-log-${{ github.run_id }}" \
            --targeted-service "$DISPATCH_SERVICE" \
            "${CHECK_MODE_ARGS[@]}" \
            || echo "Deployment status build failed"

          ssh -o StrictHostKeyChecking=accept-new "root@${MLJR_HOST}" \
            "mkdir -p /opt/caddy/site/data" || true
          scp -o StrictHostKeyChecking=accept-new \
            "$WORKDIR/deployments-out.json" \
            "root@${MLJR_HOST}:/opt/caddy/site/data/deployments.json" || \
            echo "Failed to upload deployment history"
          scp -o StrictHostKeyChecking=accept-new \
            "$WORKDIR/index.html" \
            "root@${MLJR_HOST}:/opt/caddy/site/index.html" || \
            echo "Failed to upload deployment status page"
          ssh -o StrictHostKeyChecking=accept-new "root@${MLJR_HOST}" \
            "chown -R caddy:caddy /opt/caddy/site" || true

          rm -rf "$WORKDIR"
          echo "Deployment status page updated: https://deploy.mljr.eu"

      - name: Create deployment summary
        if: always()
        run: |
          STATUS="${{ steps.openvox.outputs.exit_code == '0' && 'success' || 'failure' }}"
          {
            echo "## 🚀 Deployment Summary"
            echo ""
            echo "**Status:** $([[ "$STATUS" == "success" ]] && echo "✅ Success" || echo "❌ Failed")"
            echo "**Mode:** ${{ steps.env.outputs.check_mode == 'true' && '🧪 Dry Run (noop)' || '🎯 Live Deployment' }}"
            echo ""
            echo "### Configuration"
            echo "- **Target Hosts:** \`${STEPS_HOSTS_OUTPUTS_HOSTS}\`"
            echo "- **Trigger:** ${{ github.event_name }}"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"

            if [ -n "${STEPS_ENV_OUTPUTS_DISPATCH_SERVICE}" ]; then
              echo "- **Service:** \`${STEPS_ENV_OUTPUTS_DISPATCH_SERVICE}\`"
            fi
            echo ""

            if [ -f /tmp/openvox-output.log ]; then
              echo "### 📊 Execution Details"
              echo "\`\`\`"
              tail -n 50 /tmp/openvox-output.log | head -n 30 || echo "Output not available"
              echo "\`\`\`"
            fi

            if [ "$STATUS" != "success" ]; then
              echo ""
              echo "### ⚠️ Failure Information"
              echo "Check the OpenVox Deployment section above for detailed error messages."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "success" ]; then
            echo "::error::Deployment failed - check logs for details"
          fi
        env:
          STEPS_HOSTS_OUTPUTS_HOSTS: ${{ steps.hosts.outputs.hosts }}
          STEPS_ENV_OUTPUTS_DISPATCH_SERVICE: ${{ steps.env.outputs.dispatch_service }}

      - name: Notify
        if: always()
        run: |
          STATUS="${{ steps.openvox.outputs.exit_code == '0' && 'success' || 'failure' }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")

          MODE=""
          if [ "${STEPS_ENV_OUTPUTS_CHECK_MODE}" == "true" ]; then
            MODE=" [DRY RUN]"
          fi

          DISPATCH_SERVICE="${STEPS_ENV_OUTPUTS_DISPATCH_SERVICE}"

          if curl -s --connect-timeout 3 --max-time 3 https://ntfy.mljr.eu/deployment -o /dev/null; then
            echo "Sending notification to ntfy..."
            if [ -n "$DISPATCH_SERVICE" ]; then
              curl -s \
                --connect-timeout 5 \
                --max-time 10 \
                -H "Title: Deployment $STATUS$MODE - $DISPATCH_SERVICE" \
                -H "Priority: $PRIORITY" \
                -H "Tags: openvox,homelab" \
                -d "$EMOJI Service $DISPATCH_SERVICE deployed$MODE" \
                https://ntfy.mljr.eu/deployment || echo "Failed to send notification"
            else
              curl -s \
                --connect-timeout 5 \
                --max-time 10 \
                -H "Title: Deployment $STATUS$MODE" \
                -H "Priority: $PRIORITY" \
                -H "Tags: openvox,homelab" \
                -d "$EMOJI Homelab deployed (hosts: ${STEPS_HOSTS_OUTPUTS_HOSTS})$MODE" \
                https://ntfy.mljr.eu/deployment || echo "Failed to send notification"
            fi
          else
            echo "⚠️  Ntfy service is not reachable, skipping notification"
          fi
        env:
          STEPS_ENV_OUTPUTS_CHECK_MODE: ${{ steps.env.outputs.check_mode }}
          STEPS_ENV_OUTPUTS_DISPATCH_SERVICE: ${{ steps.env.outputs.dispatch_service }}
          STEPS_HOSTS_OUTPUTS_HOSTS: ${{ steps.hosts.outputs.hosts }}

      - name: Fail workflow when OpenVox failed
        if: steps.openvox.outputs.exit_code != '0'
        run: |
          echo "::error::OpenVox deployment failed with exit code ${STEPS_OPENVOX_OUTPUTS_EXIT_CODE}"
          exit 1
        env:
          STEPS_OPENVOX_OUTPUTS_EXIT_CODE: ${{ steps.openvox.outputs.exit_code }}
