name: Deploy Homelab

on:
  # Manual trigger - can be run from ANY branch via GitHub UI
  # Non-main branches run in check mode: job `check`, a catalog diff from
  # each host's deployed commit, without touching any host. On main: a
  # deploy request per host (job `request`).
  workflow_dispatch:
    inputs:
      limit:
        description: 'Target hosts (all, mljr, nuc, ugreen)'
        required: false
        default: 'all'
        type: string
      staging_services:
        description: 'Optional comma-separated staging services to deploy on nuc (for example: homepage,speedtest)'
        required: false
        default: ''
        type: string
      docker_prune:
        description: 'Prune unused Docker images/containers during deployment'
        required: false
        default: false
        type: boolean
      reboot_if_needed:
        description: 'Reboot hosts that need it to activate installed updates (gated on needs-restarting)'
        required: false
        default: false
        type: boolean

  # Deliberately no `push` trigger on main: every push (i.e. every merged
  # PR) auto-deploying with LIMIT=all meant even a one-line doc fix ran a
  # full deploy. Deploys are now always a conscious step: `gh workflow run
  # deploy.yml -f limit=...` (or the GitHub UI), scoped to what actually
  # changed. The
  # weekly schedule below remains the untargeted safety net.

  # Pull requests are handled by openvox-pr-check.yml. Keeping PR code out of
  # this deployment workflow prevents its reporting/notification steps from
  # writing to production during a dry run.

  # Weekly full deployment to keep all systems on main. No maintenance any
  # more (docker prune, gated reboot): the deploy agents run that in their
  # own window, Sundays from 01:00 local (roles::deploy_agent
  # maintenance_window), on the commit they applied last.
  schedule:
    # Saturday 18:00 UTC = 19:00 CET / 20:00 CEST. GitHub has started these
    # runs up to ~3.5 h late, which still ends before the nas docker
    # auto-update (00:00 local) and before Sunday's maintenance window, so
    # that applies the main this run deployed. The old Sunday 00:00 UTC slot
    # now falls into the maintenance window, and, started 3 h late, into
    # the Nextcloud AIO backup.
    - cron: '0 18 * * 6'

  repository_dispatch:
    types: [service-update]

permissions:
  contents: read

# No concurrency group: a group keeps only one pending run, so a burst of
# service-update dispatches would drop requests. deploy-request.sh is a
# compare-and-swap on deploy/<host> with retries, and each agent applies
# one request at a time.

jobs:
  # Validate service configurations before deployment
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python deps for validation
        run: pip install --quiet pyyaml jinja2

      - name: Install Caddy (custom CrowdSec/AppSec build) for config validation
        env:
          CADDY_RELEASE: caddy-v2.11.7-crowdsec-v0.14.1-17a1e5a5
          CADDY_SHA256: c67e050c3fc66ece9c39332ea2f963b8edfa3e44444b0ff38391ffcfd1a7e6c6
        run: |
          # Bounded retries: release downloads have returned 503/504 from
          # github.com for minutes at a time (2026-11-08). 5xx and timeouts
          # are retried, a 404 is not; the sha256 check below still decides.
          curl -fsSL --retry 4 --retry-delay 10 --retry-max-time 90 --max-time 120 -o caddy \
            "https://github.com/MrCodeEU/homelab-automation/releases/download/${CADDY_RELEASE}/caddy-linux-amd64"
          echo "${CADDY_SHA256}  caddy" | sha256sum -c -
          install -m 755 caddy /usr/local/bin/caddy
          caddy version

      - name: Validate service configurations and Caddy templates
        run: bash ./.githooks/pre-commit

  # Check mode: what deploying this branch would change on each host, as
  # the catalog diff from the commit last requested on deploy/<host>
  # (scripts/catalog-check.sh). No SSH, Tailscale or secrets; replaced the
  # live noop push. staging_services has no effect on a catalog.
  check:
    name: Check (catalog diff)
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The deployed commits are on main, older than this branch.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/go.mod

      - name: Catalog diff per host
        env:
          INPUTS_LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          case "${INPUTS_LIMIT:-all}" in
            all) hosts="nuc mljr ugreen" ;;
            mljr | nuc | ugreen) hosts="$INPUTS_LIMIT" ;;
            *) echo "::error::Unknown limit '$INPUTS_LIMIT' (expected all, mljr, nuc or ugreen)"; exit 1 ;;
          esac
          # shellcheck disable=SC2086 # host list
          scripts/catalog-check.sh $hosts | tee catalog-check.md
          cat catalog-check.md >> "$GITHUB_STEP_SUMMARY"

  # Deploy = a signed request on deploy/<host> per target host
  # (docs/DEPLOY_AGENT.md). The host's deploy-agent applies it within a
  # minute and reports the result itself (ntfy /deployment, mail fallback,
  # metrics, healthreport). This job has no SSH, Tailscale or host access,
  # and does not wait: a failed apply shows up in the agent's
  # notification, not as a red run here.
  request:
    name: Deploy request
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            openvox/data/common.yaml
            scripts/deploy-request.sh
          sparse-checkout-cone-mode: false

      - name: Install Python deps
        run: pip install --quiet pyyaml

      - name: Resolve target hosts
        id: hosts
        # The repository_dispatch payload is untrusted input: anything holding a
        # token with repo write can set these fields to arbitrary strings. They
        # are passed through the environment rather than interpolated into the
        # script, and validated before use. Deliberately a shell glob and not
        # `grep -qE`: grep matches per line, so "godrive\nmalicious=1" would
        # satisfy an anchored regex; `case` tests the whole string, newlines
        # included. deploy-request.sh checks them again.
        env:
          EVENT: ${{ github.event_name }}
          INPUTS_LIMIT: ${{ inputs.limit }}
          RAW_DISPATCH_SERVICE: ${{ github.event.client_payload.service }}
          RAW_STAGING_SERVICES: ${{ inputs.staging_services }}
        run: |
          set -euo pipefail
          SERVICE=""
          STAGING=""
          if [ "$EVENT" = repository_dispatch ]; then
            case "$RAW_DISPATCH_SERVICE" in
              "" | *[!A-Za-z0-9._-]* )
                echo "::error::repository_dispatch rejected: 'service' must be 1-64 chars of [A-Za-z0-9._-]"
                exit 1
                ;;
            esac
            if [ "${#RAW_DISPATCH_SERVICE}" -gt 64 ]; then
              echo "::error::repository_dispatch rejected: 'service' is longer than 64 characters"
              exit 1
            fi
            SERVICE="$RAW_DISPATCH_SERVICE"
          fi
          if [ -n "$RAW_STAGING_SERVICES" ]; then
            case "$RAW_STAGING_SERVICES" in
              *[!A-Za-z0-9,._-]* | ,* | *, | *,,* )
                echo "::error::staging_services must be comma-separated service names"
                exit 1
                ;;
            esac
            if [ "${#RAW_STAGING_SERVICES}" -gt 256 ]; then
              echo "::error::staging_services is longer than 256 characters"
              exit 1
            fi
            STAGING="$RAW_STAGING_SERVICES"
          fi

          LIMIT=all
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$INPUTS_LIMIT" ]; then
            LIMIT="$INPUTS_LIMIT"
          fi
          case "$LIMIT" in
            all) HOSTS="mljr nuc ugreen" ;;
            mljr | nuc | ugreen) HOSTS="$LIMIT" ;;
            *) echo "::error::Unknown limit '$LIMIT' (expected all, mljr, nuc or ugreen)"; exit 1 ;;
          esac

          if [ -n "$SERVICE" ]; then
            # A host's catalog is applied whole: the service's host, plus
            # mljr (if different) so its Caddy snippet stays current. nas has
            # no agent; nuc's catalog reaches it (roles::services_nas).
            SERVICE_HOST=$(DISPATCH_SERVICE="$SERVICE" python3 -c "import os, yaml; d = yaml.safe_load(open('openvox/data/common.yaml')); m = next((s for s in d['services_catalog'] if s['name'] == os.environ['DISPATCH_SERVICE']), None); print(m.get('host', 'nuc') if m else 'nuc', end='')")
            case "$SERVICE_HOST" in
              mljr) HOSTS="mljr" ;;
              ugreen) HOSTS="ugreen mljr" ;;
              *) HOSTS="nuc mljr" ;;
            esac
            echo "Service $SERVICE on $SERVICE_HOST: requests for $HOSTS"
          fi
          if [ -n "$STAGING" ]; then
            STAGING_SERVICES="$STAGING" python3 -c "import os, yaml; requested=os.environ['STAGING_SERVICES'].split(','); catalog=yaml.safe_load(open('openvox/data/common.yaml'))['services_catalog']; allowed={s['name'] for s in catalog if s.get('staging') and s.get('enabled', True) and s.get('managed', True) and not s.get('skip_deploy', False)}; invalid=[name for name in requested if name not in allowed]; (_ for _ in ()).throw(SystemExit('Unknown or non-staging service(s): ' + ', '.join(invalid))) if invalid else None"
            HOSTS="nuc"
            echo "Staging $STAGING: request for nuc only"
          fi
          {
            echo "hosts=$HOSTS"
            echo "service=$SERVICE"
            echo "staging=$STAGING"
          } >> "$GITHUB_OUTPUT"

      - name: Create requests
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTS: ${{ steps.hosts.outputs.hosts }}
          TRIGGER: ${{ github.event_name }}
          DEPLOY_REQUEST_SERVICE: ${{ steps.hosts.outputs.service }}
          DEPLOY_REQUEST_STAGING_SERVICES: ${{ steps.hosts.outputs.staging }}
          DEPLOY_REQUEST_DOCKER_PRUNE: ${{ inputs.docker_prune || 'false' }}
          DEPLOY_REQUEST_REBOOT_IF_NEEDED: ${{ inputs.reboot_if_needed || 'false' }}
          DEPLOY_REQUEST_ID_SUFFIX: ${{ github.run_id }}
        run: |
          set -euo pipefail
          status=0
          for host in $HOSTS; do
            if bash scripts/deploy-request.sh "$host" "$GITHUB_SHA" "$TRIGGER"; then
              echo "- \`$host\`: request created" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$host\`: request FAILED" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          {
            echo ""
            echo "Commit \`${GITHUB_SHA:0:9}\`. Each agent reports its apply on ntfy /deployment."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
