name: Deploy Homelab

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Target hosts (all, mljr, rocky)'
        required: false
        default: 'all'
        type: string
      tags:
        description: 'Ansible tags (all, base, caddy, services, backup, security)'
        required: false
        default: 'all'
        type: string
      staging:
        description: 'Deploy staging environment'
        required: false
        default: false
        type: boolean
      restore:
        description: 'Force restore from backup'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
      - v2
    paths:
      - 'ansible/**'
      - 'services/**'
      - '.github/workflows/deploy.yml'

  repository_dispatch:
    types: [service-update]

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check host connectivity
  check-hosts:
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.check.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check connectivity
        id: check
        run: |
          HOSTS=""
          for host in mljr.tail33930.ts.net nas.tail33930.ts.net; do
            if ping -c 1 -W 3 "$host" &>/dev/null; then
              name="${host%%.*}"
              HOSTS="${HOSTS}${name},"
            fi
          done
          HOSTS="${HOSTS%,}"
          echo "Reachable hosts: $HOSTS"
          echo "hosts=$HOSTS" >> $GITHUB_OUTPUT

  # Detect what changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base: 'ansible/roles/base/**'
            caddy: 'ansible/roles/caddy/**'
            services: ['ansible/roles/services/**', 'services/**']
            backup: 'ansible/roles/backup/**'
            security: 'ansible/roles/fail2ban/**'
            glance: 'ansible/roles/glance/**'
            mailcow: 'ansible/roles/mailcow/**'
            core: ['ansible/inventory/**', 'ansible/playbooks/**']

      - name: Determine tags
        id: tags
        run: |
          # Manual dispatch with specific tags
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "all" ]; then
            echo "tags=${{ inputs.tags }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Repository dispatch (service update)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "tags=services,caddy" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Core changes -> run everything
          if [ "${{ steps.changes.outputs.core }}" == "true" ]; then
            echo "tags=all" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build tag list from changes
          TAGS=""
          [ "${{ steps.changes.outputs.base }}" == "true" ] && TAGS="${TAGS}base,"
          [ "${{ steps.changes.outputs.caddy }}" == "true" ] && TAGS="${TAGS}caddy,"
          [ "${{ steps.changes.outputs.services }}" == "true" ] && TAGS="${TAGS}services,"
          [ "${{ steps.changes.outputs.backup }}" == "true" ] && TAGS="${TAGS}backup,"
          [ "${{ steps.changes.outputs.security }}" == "true" ] && TAGS="${TAGS}security,"
          [ "${{ steps.changes.outputs.glance }}" == "true" ] && TAGS="${TAGS}glance,"
          [ "${{ steps.changes.outputs.mailcow }}" == "true" ] && TAGS="${TAGS}mailcow,"

          TAGS="${TAGS%,}"
          [ -z "$TAGS" ] && TAGS="none"

          echo "Detected tags: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  # Deploy
  deploy:
    needs: [check-hosts, detect-changes]
    if: |
      needs.check-hosts.outputs.reachable != '' &&
      needs.detect-changes.outputs.tags != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          IS_STAGING="false"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.staging }}" == "true" ]; then
            IS_STAGING="true"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            IS_STAGING="true"
          fi
          echo "is_staging=$IS_STAGING" >> $GITHUB_OUTPUT
          echo "Environment: $([ "$IS_STAGING" == "true" ] && echo 'staging' || echo 'production')"

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ansible-${{ runner.os }}-v1

      - name: Install Ansible
        run: pip install --user ansible

      - name: Install collections
        run: cd ansible && ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Secrets
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
          KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          PCLOUD_TOKEN: ${{ secrets.PCLOUD_TOKEN }}
        run: |
          cd ansible

          # Determine limit
          LIMIT="${{ needs.check-hosts.outputs.reachable }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "all" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          # Determine tags
          TAGS="${{ needs.detect-changes.outputs.tags }}"

          # Extra vars
          EXTRA_VARS="is_staging_deployment=${{ steps.env.outputs.is_staging }}"

          echo "Running: ansible-playbook site.yml --limit $LIMIT --tags $TAGS"
          ansible-playbook playbooks/site.yml \
            --limit "$LIMIT" \
            --tags "$TAGS" \
            --extra-vars "$EXTRA_VARS"

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")

          curl -s \
            -H "Title: Deployment $STATUS" \
            -H "Priority: $PRIORITY" \
            -H "Tags: ansible,homelab" \
            -d "$EMOJI Homelab deployed to ${{ needs.check-hosts.outputs.reachable }} (tags: ${{ needs.detect-changes.outputs.tags }})" \
            https://ntfy.mljr.eu/deployment || true
