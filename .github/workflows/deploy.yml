name: Deploy Homelab

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device (all, vps, homeserver, unraid)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vps
          - homeserver
          - unraid
      roles:
        description: 'Roles to deploy (all, base, docker, caddy)'
        required: true
        default: 'all'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts || true
          ssh-keyscan -H ${{ secrets.HOMESERVER_HOST }} >> ~/.ssh/known_hosts || true
          ssh-keyscan -H ${{ secrets.UNRAID_HOST }} >> ~/.ssh/known_hosts || true

      - name: Install Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure deployment
        run: |
          # Update inventory with actual hostnames from secrets
          sed -i "s/vps.tailnet-xxxx.ts.net/${{ secrets.VPS_HOST }}/g" inventory.yml
          sed -i "s/homeserver.tailnet-xxxx.ts.net/${{ secrets.HOMESERVER_HOST }}/g" inventory.yml
          sed -i "s/unraid.tailnet-xxxx.ts.net/${{ secrets.UNRAID_HOST }}/g" inventory.yml

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Deploy to homelab
        run: |
          bash scripts/deploy.sh ${{ github.event.inputs.target }} ${{ github.event.inputs.roles }}
        env:
          SSH_KEY: ~/.ssh/id_rsa
          TARGET: ${{ github.event.inputs.target }}
          ROLES: ${{ github.event.inputs.roles }}

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ github.event.inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Roles**: ${{ github.event.inputs.roles }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
