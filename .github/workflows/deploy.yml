name: Deploy Homelab

on:
  # Manual trigger - can be run from ANY branch via GitHub UI
  # Non-main branches automatically deploy to staging environment
  workflow_dispatch:
    inputs:
      limit:
        description: 'Target hosts (all, mljr, rocky)'
        required: false
        default: 'all'
        type: string
      tags:
        description: 'Ansible tags (all, base, caddy, services, backup, security)'
        required: false
        default: 'all'
        type: string
      staging:
        description: 'Deploy staging environment (to nuc)'
        required: false
        default: true
        type: boolean
      cleanup:
        description: 'Remove services no longer assigned to their host (use after host migrations)'
        required: false
        default: false
        type: boolean

  # Automatic deploy on main branch
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'services/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

  # Check mode (dry run) on pull requests - use as required PR check
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'services/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

  # Weekly full deployment to keep all systems and containers up to date
  schedule:
    - cron: '0 4 * * 0'  # Every Sunday at 04:00 UTC

  repository_dispatch:
    types: [service-update]

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate service configurations before deployment
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate service configurations
        run: bash ./.githooks/pre-commit

  # Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          IS_STAGING="false"
          CHECK_MODE="false"
          DISPATCH_SERVICE=""
          DISPATCH_ENVIRONMENT=""

          # Pull requests always run in check mode (dry run)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            IS_STAGING="true"
            CHECK_MODE="true"
            echo "Pull request detected - running in CHECK MODE"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch: use the staging input (default: true)
            IS_STAGING="${{ inputs.staging }}"
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            # Weekly scheduled deployment: deploy both production AND staging
            IS_STAGING="true"
            echo "Scheduled weekly deployment - deploying production + staging"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Push to main: deploy both production AND staging
            IS_STAGING="true"
            echo "Push to main - deploying production + staging"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # External triggers: read service and environment from payload
            DISPATCH_SERVICE="${{ github.event.client_payload.service }}"
            DISPATCH_ENVIRONMENT="${{ github.event.client_payload.environment }}"

            # Determine staging based on payload environment or default to both
            if [ "$DISPATCH_ENVIRONMENT" == "staging" ]; then
              IS_STAGING="true"
              echo "Repository dispatch - deploying staging only for service: $DISPATCH_SERVICE"
            elif [ "$DISPATCH_ENVIRONMENT" == "production" ]; then
              IS_STAGING="false"
              echo "Repository dispatch - deploying production only for service: $DISPATCH_SERVICE"
            else
              IS_STAGING="true"
              echo "Repository dispatch - deploying production + staging for service: $DISPATCH_SERVICE"
            fi
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Non-main branches: check mode only
            IS_STAGING="true"
            CHECK_MODE="true"
          fi

          echo "is_staging=$IS_STAGING" >> $GITHUB_OUTPUT
          echo "check_mode=$CHECK_MODE" >> $GITHUB_OUTPUT
          echo "dispatch_service=$DISPATCH_SERVICE" >> $GITHUB_OUTPUT
          echo "dispatch_environment=$DISPATCH_ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "Environment: $([ "$IS_STAGING" == "true" ] && echo 'production + staging' || echo 'production only')"
          echo "Check mode: $CHECK_MODE"
          if [ -n "$DISPATCH_SERVICE" ]; then
            echo "Target service: $DISPATCH_SERVICE"
          fi

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible and Collections
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/pipx
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}-v5
          restore-keys: |
            ansible-${{ runner.os }}-

      - name: Install Ansible with Mitogen
        run: |
          if ! command -v ansible-playbook &> /dev/null; then
            echo "Installing Ansible..."
            pipx install ansible-core
            pipx inject ansible-core docker
          else
            echo "Ansible already installed (from cache)"
          fi
          
          # Always ensure Mitogen is installed
          echo "Ensuring Mitogen is available..."
          if ! pipx runpip ansible-core list | grep -q mitogen; then
            echo "Installing Mitogen..."
            pipx inject ansible-core mitogen
          fi
          
          # Find and export Mitogen strategy plugin path
          MITOGEN_PATH=$(pipx runpip ansible-core show mitogen | grep "Location:" | cut -d' ' -f2)
          if [ -n "$MITOGEN_PATH" ]; then
            echo "MITOGEN_STRATEGY_PATH=${MITOGEN_PATH}/ansible_mitogen/plugins/strategy" >> $GITHUB_ENV
            echo "✓ Mitogen successfully installed at: $MITOGEN_PATH"
          else
            echo "⚠ Warning: Could not determine Mitogen path"
          fi

      - name: Install collections
        run: |
          echo "::group::Installing Ansible collections"
          cd ansible

          # Try installing from Ansible Galaxy first
          echo "Attempting to install collections from Ansible Galaxy..."
          if ansible-galaxy collection install -r requirements.yml --force-with-deps 2>&1; then
            echo "✓ Collections installed successfully from Ansible Galaxy"
          else
            echo "⚠ Ansible Galaxy failed, falling back to GitHub sources..."

            # Create fallback requirements with GitHub sources
            # Include all dependencies to avoid Galaxy resolution
            # Using --no-deps to prevent any Galaxy calls
            echo 'collections:' > requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.docker.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.general.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/ansible.posix.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: stable-1' >> requirements-fallback.yml

            echo "Installing collections from GitHub (with --no-deps to skip Galaxy)..."
            if ansible-galaxy collection install -r requirements-fallback.yml --no-deps --force 2>&1; then
              echo "✓ Collections installed successfully from GitHub"
            else
              echo "::error::Failed to install collections from both Galaxy and GitHub"
              exit 1
            fi
          fi

          echo "::endgroup::"

      - name: Record deployment start
        id: deploy_start
        run: |
          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "start_epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Run Ansible
        id: ansible
        continue-on-error: true
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Performance optimizations
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_SSH_PIPELINING: "True"
          # Mitogen strategy plugin path
          ANSIBLE_STRATEGY_PLUGINS: "${{ env.MITOGEN_STRATEGY_PATH }}"
          # Docker Hub (avoid rate limits)
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Secrets
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
          KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          BESZEL_KEY: ${{ secrets.BESZEL_KEY }}
          BESZEL_TOKEN: ${{ secrets.BESZEL_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          PCLOUD_TOKEN: ${{ secrets.PCLOUD_TOKEN }}
          HETRIXTOOLS_API_TOKEN: ${{ secrets.HETRIXTOOLS_API_TOKEN }}
          # Authelia SSO
          AUTHELIA_JWT_SECRET: ${{ secrets.AUTHELIA_JWT_SECRET }}
          AUTHELIA_SESSION_SECRET: ${{ secrets.AUTHELIA_SESSION_SECRET }}
          AUTHELIA_STORAGE_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_STORAGE_ENCRYPTION_KEY }}
          AUTHELIA_ADMIN_PASSWORD: ${{ secrets.AUTHELIA_ADMIN_PASSWORD }}
          # Google OAuth (for Keycloak social login)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # SonarQube
          SONARQUBE_DB_PASSWORD: ${{ secrets.SONARQUBE_DB_PASSWORD }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          # SMTP (for speedtest notifications)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SUDOKU_API_USER: ${{ secrets.SUDOKU_API_USER }}
          SUDOKU_API_PASSWORD: ${{ secrets.SUDOKU_API_PASSWORD }}
        run: |
          cd ansible

          # Determine limit
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          # Determine tags
          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Extra vars
          EXTRA_VARS="is_staging_deployment=${{ steps.env.outputs.is_staging }}"

          # If a specific service was requested via repository_dispatch, add it as changed_services
          DISPATCH_SERVICE="${{ steps.env.outputs.dispatch_service }}"
          if [ -n "$DISPATCH_SERVICE" ]; then
            EXTRA_VARS="$EXTRA_VARS changed_services=$DISPATCH_SERVICE"
            echo "Deploying specific service: $DISPATCH_SERVICE"
          fi

          # Enable cleanup when explicitly requested (use after host migrations)
          if [ "${{ inputs.cleanup }}" == "true" ]; then
            EXTRA_VARS="$EXTRA_VARS cleanup_enabled=true"
            echo "Cleanup enabled: orphaned services will be removed"
          fi

          # Check mode for non-main branches (dry run)
          CHECK_FLAG=""
          if [ "${{ steps.env.outputs.check_mode }}" == "true" ]; then
            CHECK_FLAG="--check --diff"
            echo "Running in CHECK MODE (dry run) - no changes will be made"
          fi

          # Fast path: single-service deploy via repository_dispatch
          if [ -n "$DISPATCH_SERVICE" ]; then
            # Look up the service host from all.yml (single-line to stay in YAML block scalar)
            SERVICE_HOST=$(python3 -c "import yaml,sys;d=yaml.safe_load(open('inventory/group_vars/all/all.yml'));m=next((s for s in d['services'] if s['name']=='$DISPATCH_SERVICE'),None);print(m.get('host','nuc') if m else 'nuc',end='')")
            echo "🚀 Fast deploy: service=$DISPATCH_SERVICE host=$SERVICE_HOST"
            echo "⚡ Using deploy-service.yml (skips base/security/backup/mailcow/authelia)"
            echo "::group::Ansible Deployment"

            ansible-playbook playbooks/deploy-service.yml \
              --forks 20 \
              $CHECK_FLAG \
              --extra-vars "$EXTRA_VARS target_service=$DISPATCH_SERVICE service_host=$SERVICE_HOST" \
              2>&1 | tee /tmp/ansible-output.log
          else
            echo "🚀 Running: ansible-playbook site.yml --limit $LIMIT --tags $TAGS --forks 20 $CHECK_FLAG"
            echo "⚡ Using Mitogen strategy for faster execution"
            echo "::group::Ansible Deployment"

            ansible-playbook playbooks/site.yml \
              --limit "$LIMIT" \
              --tags "$TAGS" \
              --forks 20 \
              $CHECK_FLAG \
              --extra-vars "$EXTRA_VARS" \
              2>&1 | tee /tmp/ansible-output.log
          fi
          
          ANSIBLE_EXIT_CODE=${PIPESTATUS[0]}
          echo "::endgroup::"

          # Output exit code for subsequent steps
          echo "exit_code=$ANSIBLE_EXIT_CODE" >> $GITHUB_OUTPUT

          # Parse and annotate errors/failures
          if [ $ANSIBLE_EXIT_CODE -ne 0 ] || grep -q "FAILED - RETRYING\|fatal:\|failed:" /tmp/ansible-output.log; then
            echo "::group::Deployment Errors"
            # Extract and display failed tasks with context
            grep -A 3 "TASK \[.*\]" /tmp/ansible-output.log | grep -B 1 -A 2 "fatal:\|failed:" || true
            # Extract service deployment failures
            grep -E "Failed: [1-9]|Error when processing image" /tmp/ansible-output.log | while read -r line; do
              echo "::error::$line"
            done || true
            echo "::endgroup::"
          fi

          exit $ANSIBLE_EXIT_CODE

      - name: Update deployment status page
        if: always()
        env:
          START_TIME: ${{ steps.deploy_start.outputs.start_time }}
          START_EPOCH: ${{ steps.deploy_start.outputs.start_epoch }}
          ANSIBLE_EXIT_CODE: ${{ steps.ansible.outputs.exit_code }}
          IS_STAGING: ${{ steps.env.outputs.is_staging }}
          CHECK_MODE: ${{ steps.env.outputs.check_mode }}
        run: |
          set +e  # Don't exit on errors - status page update is non-critical

          # Calculate duration
          END_EPOCH=$(date +%s)
          START_EPOCH_VAL="${START_EPOCH:-$END_EPOCH}"
          DURATION=$((END_EPOCH - START_EPOCH_VAL))

          # Determine overall status
          if [ "${ANSIBLE_EXIT_CODE:-1}" == "0" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi

          # Determine limit and tags (same logic as ansible step)
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Get commit message (truncated)
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null | head -1 | cut -c1-100 || echo "No commit message")

          # Get targeted service from repository_dispatch
          DISPATCH_SERVICE="${{ steps.env.outputs.dispatch_service }}"
          DISPATCH_ENVIRONMENT="${{ steps.env.outputs.dispatch_environment }}"

          # Export vars for Python script (MUST be before the heredoc)
          export DURATION STATUS LIMIT TAGS COMMIT_MSG DISPATCH_SERVICE DISPATCH_ENVIRONMENT

          # Create deployment record
          mkdir -p /tmp/deploy-status/data

          # Parse services from all.yml and create deployment record
          python3 << 'PARSE_SCRIPT'
          import json
          import os
          import re
          import yaml
          from pathlib import Path
          from datetime import datetime

          print("Starting deployment log parsing...")
          # Load services from all.yml
          try:
              with open('ansible/inventory/group_vars/all/all.yml', 'r') as f:
                  config = yaml.safe_load(f)
          except Exception as e:
              print(f"Error loading all.yml: {e}")
              config = {}

          services_config = config.get('services', [])
          print(f"Loaded {len(services_config)} services from config")

          # Parse ansible output for failures
          ansible_log_lines = []
          log_path = Path('/tmp/ansible-output.log')
          if log_path.exists():
              ansible_log_lines = log_path.read_text().splitlines()
          
          print(f"Read {len(ansible_log_lines)} lines from ansible log")

          # Find failed services and capture error messages
          failed_services = {}  # name -> error message
          
          # More efficient parsing: scan the log once and keep track of current task
          current_task_services = []
          
          for line in ansible_log_lines:
              # Identify task headers: TASK [role : Task Name]
              task_match = re.search(r'TASK \[(?:[^:]+ : )?(.*?)\]', line)
              if task_match:
                  task_name = task_match.group(1).lower()
                  # Find which services are mentioned in this task header
                  current_task_services = []
                  for svc in services_config:
                      svc_name = svc.get('name', '').lower()
                      if svc_name and svc_name in task_name:
                          current_task_services.append(svc.get('name'))
              
              # Identify failures
              if any(err in line for err in ['fatal:', 'failed:', 'FAILED!']):
                  error_msg = line.strip()
                  # Clean up the error message
                  error_msg = re.sub(r'\s+', ' ', error_msg)[:200]
                  
                  # Assign failure to all services involved in the current task
                  for svc_name in current_task_services:
                      if svc_name not in failed_services:
                          failed_services[svc_name] = error_msg
                  
                  # Also check if any service name is mentioned directly in the failure line
                  for svc in services_config:
                      svc_name = svc.get('name', '')
                      if svc_name and svc_name.lower() in line.lower():
                          if svc_name not in failed_services:
                              failed_services[svc_name] = error_msg

          print(f"Found {len(failed_services)} failed services")

          # Build service status list
          service_results = []
          for svc in services_config:
              if not svc.get('enabled', True):
                  continue

              name = svc['name']
              host = svc.get('host', 'unknown')

              result = {
                  'name': name,
                  'host': host,
                  'status': 'failed' if name in failed_services else 'ok'
              }

              if name in failed_services:
                  result['error'] = failed_services[name]

              service_results.append(result)

          # Count summary
          summary = {
              'total_services': len(service_results),
              'ok': len([s for s in service_results if s['status'] == 'ok']),
              'failed': len([s for s in service_results if s['status'] == 'failed'])
          }

          # Build deployment record
          start_time = os.environ.get('START_TIME', datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'))
          dispatch_service = os.environ.get('DISPATCH_SERVICE', '')
          dispatch_environment = os.environ.get('DISPATCH_ENVIRONMENT', '')

          deployment = {
              'id': f"{start_time}-{os.environ.get('GITHUB_SHA', '')[:7]}",
              'timestamp': start_time,
              'duration_seconds': int(os.environ.get('DURATION', 0)),
              'status': os.environ.get('STATUS', 'unknown'),
              'trigger': os.environ.get('GITHUB_EVENT_NAME', 'unknown'),
              'branch': os.environ.get('GITHUB_REF_NAME', 'unknown'),
              'commit_sha': os.environ.get('GITHUB_SHA', '')[:7],
              'commit_message': os.environ.get('COMMIT_MSG', '')[:100],
              'actor': os.environ.get('GITHUB_ACTOR', 'unknown'),
              'check_mode': os.environ.get('CHECK_MODE', 'false') == 'true',
              'is_staging': os.environ.get('IS_STAGING', 'false') == 'true',
              'limit': os.environ.get('LIMIT', 'all'),
              'tags': os.environ.get('TAGS', 'all'),
              'services': service_results,
              'summary': summary
          }

          # Add targeted service info if this is a repository_dispatch for a specific service
          if dispatch_service:
              deployment['targeted_service'] = dispatch_service
          if dispatch_environment:
              deployment['target_environment'] = dispatch_environment

          # Build services list
          services_list = []
          for svc in services_config:
              if not svc.get('enabled', True):
                  continue
              domain = svc.get('domain')
              if isinstance(domain, list):
                  domain = domain[0] if domain else None
              services_list.append({
                  'name': svc.get('name'),
                  'domain': domain,
                  'port': svc.get('port'),
                  'host': svc.get('host'),
                  'description': svc.get('description', ''),
                  'icon': svc.get('icon', ''),
                  'enabled': True,
                  'managed': svc.get('managed', True)
              })

          with open('/tmp/new_deployment.json', 'w') as f:
              json.dump(deployment, f)

          with open('/tmp/services_list.json', 'w') as f:
              json.dump(services_list, f)

          print(f"Generated deployment record: {deployment['id']}")
          print(f"Status: {deployment['status']}, Services: {summary['total_services']} (ok: {summary['ok']}, failed: {summary['failed']})")
          PARSE_SCRIPT

          # Try to download existing deployments.json
          echo "Downloading existing deployment data..."
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 \
            root@mljr.tail33930.ts.net:/opt/caddy/site/data/deployments.json \
            /tmp/deploy-status/data/deployments.json 2>/dev/null || \
            echo '{"deployments":[],"services":[],"last_updated":""}' > /tmp/deploy-status/data/deployments.json

          # Merge new deployment
          python3 << 'MERGE_SCRIPT'
          import json
          from datetime import datetime

          with open('/tmp/deploy-status/data/deployments.json', 'r') as f:
              data = json.load(f)

          with open('/tmp/new_deployment.json', 'r') as f:
              new_deployment = json.load(f)

          with open('/tmp/services_list.json', 'r') as f:
              services_list = json.load(f)

          # Prepend new deployment
          if 'deployments' not in data:
              data['deployments'] = []
          
          data['deployments'].insert(0, new_deployment)
          
          # Keep history manageable (last 500 deployments)
          data['deployments'] = data['deployments'][:500]
          
          data['services'] = services_list
          data['last_updated'] = datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          with open('/tmp/deploy-status/data/deployments.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Total deployments in history: {len(data['deployments'])}")
          MERGE_SCRIPT

          # Generate HTML page
          python3 scripts/generate_deploy_page.py \
            /tmp/deploy-status/data/deployments.json \
            /tmp/deploy-status/index.html

          # Upload to server
          echo "Uploading deployment status page..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 \
            root@mljr.tail33930.ts.net "mkdir -p /opt/caddy/site/data && chown -R caddy:caddy /opt/caddy/site" || true

          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 \
            /tmp/deploy-status/data/deployments.json \
            root@mljr.tail33930.ts.net:/opt/caddy/site/data/deployments.json || echo "Failed to upload deployments.json"

          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 \
            /tmp/deploy-status/index.html \
            root@mljr.tail33930.ts.net:/opt/caddy/site/index.html || echo "Failed to upload index.html"

          # Fix ownership
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=30 \
            root@mljr.tail33930.ts.net "chown -R caddy:caddy /opt/caddy/site" || true

          echo "Deployment status page updated: https://deploy.mljr.eu"

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ steps.env.outputs.check_mode == 'true' && '🧪 Dry Run (Check Mode)' || '🎯 Live Deployment' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.is_staging == 'true' && '🔵 Production + Staging' || '🟢 Production Only' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi
          
          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi
          
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Hosts:** \`$LIMIT\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** \`$TAGS\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

          # Show targeted service for repository_dispatch
          if [ -n "${{ steps.env.outputs.dispatch_service }}" ]; then
            echo "- **Service:** \`${{ steps.env.outputs.dispatch_service }}\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ steps.env.outputs.dispatch_environment }}" ]; then
              echo "- **Target Environment:** \`${{ steps.env.outputs.dispatch_environment }}\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse timing from profile_tasks callback if available
          if [ -f /tmp/ansible-output.log ]; then
            echo "### 📊 Execution Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -n 50 /tmp/ansible-output.log | head -n 30 >> $GITHUB_STEP_SUMMARY || echo "Output not available" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Failure Information" >> $GITHUB_STEP_SUMMARY
            echo "Check the Ansible Deployment section above for detailed error messages." >> $GITHUB_STEP_SUMMARY
            echo "::error::Deployment failed - check logs for details"
          fi

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")

          LIMIT="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.limit }}" != "" ]; then
            LIMIT="${{ inputs.limit }}"
          fi

          TAGS="all"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TAGS="services,caddy"
          fi

          # Check mode indicator
          MODE=""
          if [ "${{ steps.env.outputs.check_mode }}" == "true" ]; then
            MODE=" [DRY RUN]"
          fi

          # Staging indicator
          STAGING_INFO=""
          if [ "${{ steps.env.outputs.is_staging }}" == "true" ]; then
            STAGING_INFO=" +staging"
          fi

          # Service indicator for repository_dispatch
          SERVICE_INFO=""
          DISPATCH_SERVICE="${{ steps.env.outputs.dispatch_service }}"
          if [ -n "$DISPATCH_SERVICE" ]; then
            SERVICE_INFO=" service: $DISPATCH_SERVICE"
          fi

          # Check if ntfy is reachable first (3 second timeout)
          if curl -s --connect-timeout 3 --max-time 3 https://ntfy.mljr.eu/deployment -o /dev/null; then
            echo "Sending notification to ntfy..."
            if [ -n "$DISPATCH_SERVICE" ]; then
              # Simplified notification for single service deployment
              curl -s \
                --connect-timeout 5 \
                --max-time 10 \
                -H "Title: Deployment $STATUS$MODE - $DISPATCH_SERVICE" \
                -H "Priority: $PRIORITY" \
                -H "Tags: ansible,homelab" \
                -d "$EMOJI Service $DISPATCH_SERVICE deployed$STAGING_INFO$MODE" \
                https://ntfy.mljr.eu/deployment || echo "Failed to send notification"
            else
              curl -s \
                --connect-timeout 5 \
                --max-time 10 \
                -H "Title: Deployment $STATUS$MODE" \
                -H "Priority: $PRIORITY" \
                -H "Tags: ansible,homelab" \
                -d "$EMOJI Homelab deployed (limit: $LIMIT, tags: $TAGS$STAGING_INFO)$MODE" \
                https://ntfy.mljr.eu/deployment || echo "Failed to send notification"
            fi
          else
            echo "⚠️  Ntfy service is not reachable, skipping notification"
          fi
