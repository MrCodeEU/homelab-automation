name: Sync LibreLink to Public Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/nightscout-librelink-up-go/**'
      - '.github/workflows/sync-librelink-to-public.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/mrcodeeu/nightscout-librelink-up-go.git public-repo

      - name: Sync source code
        run: |
          # Remove old files (except .git)
          cd public-repo
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +

          # Copy all source files including .github
          cp -r ../apps/nightscout-librelink-up-go/. .

          # Remove private .env file if it exists
          rm -f .env

          # Replace README.md with public version if it exists
          if [ -f "README.public.md" ]; then
            mv README.public.md README.md
          fi

          # Ensure .env.example exists
          if [ ! -f ".env.example" ]; then
            cat > .env.example << 'EOF'
          LINK_UP_USERNAME=your@email.com
          LINK_UP_PASSWORD=yourpassword
          LINK_UP_REGION=EU
          LINK_UP_TIME_INTERVAL=5
          NIGHTSCOUT_URL=http://nightscout:1337
          NIGHTSCOUT_API_TOKEN=your-api-secret-here-change-this
          EOF
          fi

      - name: Remove sync temp files
        run: |
          cd public-repo
          # Remove any syncthing temp files
          find . -name '.syncthing.*.tmp' -delete

      - name: Commit and push changes
        working-directory: public-repo
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          # Get the latest commit message from the private repo
          COMMIT_MSG=$(cd .. && git log -1 --pretty=%B)

          git commit -m "Sync from private repo: ${COMMIT_MSG}"
          git push origin main

      - name: Send notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ LibreLink-Up synced to public repository successfully"
            PRIORITY="default"
          else
            MESSAGE="❌ LibreLink-Up sync to public repository failed"
            PRIORITY="high"
          fi

          curl -H "Priority: ${PRIORITY}" \
               -H "Tags: github,sync,librelink" \
               -d "${MESSAGE}" \
               https://ntfy.mljr.eu/deployment || true
