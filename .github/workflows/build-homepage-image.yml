name: Build Homepage Image

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - '*dev*'  # Build dev images for any branch containing 'dev'
    paths:
      - 'apps/homepage/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag and repository
        id: tag
        run: |
          # Convert repository owner to lowercase
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT

          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/homepage
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.repo_owner }}/homepage:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Send notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            PRIORITY="default"
            TITLE="Image Build Successful"
          else
            EMOJI="❌"
            PRIORITY="high"
            TITLE="Image Build Failed"
          fi

          MESSAGE="${EMOJI} Homepage Docker image build (${{ steps.tag.outputs.tag }}) - ${TITLE}"

          curl -H "Title: ${TITLE}" \
               -H "Priority: ${PRIORITY}" \
               -H "Tags: docker,homepage" \
               -d "${MESSAGE}" \
               https://ntfy.mljr.eu/deployment || true
