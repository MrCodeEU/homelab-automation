name: Deploy Homelab (Parallel)

# This is an alternative deployment workflow that runs host deployments in parallel
# Use this for faster deployments when you want to deploy to all hosts simultaneously
# Each host gets its own job for better visibility and parallel execution

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Ansible tags (all, base, caddy, services, backup, security)'
        required: false
        default: 'all'
        type: string
      staging:
        description: 'Deploy staging environment (to nuc)'
        required: false
        default: true
        type: boolean
      cleanup:
        description: 'Remove services no longer assigned to their host (use after host migrations)'
        required: false
        default: false
        type: boolean
      docker_prune:
        description: 'Prune unused Docker images/containers during deployment'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-parallel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate before deploying
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate service configurations
        run: bash ./.githooks/pre-commit

  # Detect changes for intelligent deployment
  detect-changes:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      changed_services: ${{ steps.changes.outputs.changed_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          CHANGED_SERVICES="all"
          
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "^services/" | cut -d/ -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            
            if [ -n "$CHANGED" ]; then
              CHANGED_SERVICES="$CHANGED"
              echo "📦 Changed services: $CHANGED_SERVICES"
            fi
          fi
          
          echo "changed_services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT

  # Deploy to mljr (production host)
  deploy-mljr:
    runs-on: ubuntu-latest
    needs: [validate, detect-changes]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Ansible with Mitogen
        run: |
          pipx install ansible-core
          pipx inject ansible-core docker mitogen ansible-mitogen

      - name: Install collections
        run: |
          cd ansible
          # Try installing from Ansible Galaxy first
          if ansible-galaxy collection install -r requirements.yml --force-with-deps 2>&1; then
            echo "✓ Collections installed from Ansible Galaxy"
          else
            echo "⚠ Galaxy failed, falling back to GitHub..."
            echo 'collections:' > requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.docker.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.general.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/ansible.posix.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: stable-1' >> requirements-fallback.yml
            ansible-galaxy collection install -r requirements-fallback.yml --no-deps --force 2>&1 || exit 1
            echo "✓ Collections installed from GitHub"
          fi

      - name: Deploy to mljr
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_STRATEGY: "mitogen_linear"
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          VAULT_PASS_FILE=$(mktemp)
          chmod 600 "$VAULT_PASS_FILE"
          echo "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASS_FILE"
          export ANSIBLE_VAULT_PASSWORD_FILE="$VAULT_PASS_FILE"
          trap "rm -f '$VAULT_PASS_FILE'" EXIT

          cd ansible
          TAGS="${{ inputs.tags }}"
          EXTRA_VARS="is_staging_deployment=false"
          
          if [ "${{ needs.detect-changes.outputs.changed_services }}" != "all" ]; then
            EXTRA_VARS="$EXTRA_VARS changed_services=${{ needs.detect-changes.outputs.changed_services }}"
          fi

          if [ "${{ inputs.docker_prune }}" == "true" ]; then
            EXTRA_VARS="$EXTRA_VARS docker_prune_enabled=true"
          fi
          
          echo "🚀 Deploying to mljr with tags: $TAGS"
          ansible-playbook playbooks/site.yml \
            --limit mljr \
            --tags "$TAGS" \
            --extra-vars "$EXTRA_VARS"

  # Deploy staging to nuc
  deploy-nuc-staging:
    runs-on: ubuntu-latest
    needs: [validate, detect-changes]
    if: ${{ inputs.staging == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Ansible with Mitogen
        run: |
          pipx install ansible-core
          pipx inject ansible-core docker mitogen ansible-mitogen

      - name: Install collections
        run: |
          cd ansible
          # Try installing from Ansible Galaxy first
          if ansible-galaxy collection install -r requirements.yml --force-with-deps 2>&1; then
            echo "✓ Collections installed from Ansible Galaxy"
          else
            echo "⚠ Galaxy failed, falling back to GitHub..."
            echo 'collections:' > requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.docker.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.general.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/ansible.posix.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: stable-1' >> requirements-fallback.yml
            ansible-galaxy collection install -r requirements-fallback.yml --no-deps --force 2>&1 || exit 1
            echo "✓ Collections installed from GitHub"
          fi

      - name: Deploy staging to nuc
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_STRATEGY: "mitogen_linear"
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          VAULT_PASS_FILE=$(mktemp)
          chmod 600 "$VAULT_PASS_FILE"
          echo "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASS_FILE"
          export ANSIBLE_VAULT_PASSWORD_FILE="$VAULT_PASS_FILE"
          trap "rm -f '$VAULT_PASS_FILE'" EXIT

          cd ansible
          TAGS="${{ inputs.tags }}"
          EXTRA_VARS="is_staging_deployment=true"

          if [ "${{ inputs.docker_prune }}" == "true" ]; then
            EXTRA_VARS="$EXTRA_VARS docker_prune_enabled=true"
          fi
          
          echo "🔵 Deploying staging environment to nuc"
          ansible-playbook playbooks/site.yml \
            --limit nuc \
            --tags "$TAGS" \
            --extra-vars "$EXTRA_VARS"

  # Cleanup orphaned services - runs AFTER both hosts are deployed to avoid downtime
  # Only triggered when cleanup=true is passed; safe to run since new host is already up
  cleanup:
    runs-on: ubuntu-latest
    needs: [validate, detect-changes, deploy-mljr, deploy-nuc-staging]
    if: |
      always() &&
      inputs.cleanup == true &&
      needs.deploy-mljr.result == 'success' &&
      (needs.deploy-nuc-staging.result == 'success' || needs.deploy-nuc-staging.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Ansible with Mitogen
        run: |
          pipx install ansible-core
          pipx inject ansible-core docker mitogen ansible-mitogen

      - name: Install collections
        run: |
          cd ansible
          if ansible-galaxy collection install -r requirements.yml --force-with-deps 2>&1; then
            echo "Collections installed from Ansible Galaxy"
          else
            echo 'collections:' > requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.docker.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.general.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/ansible.posix.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: main' >> requirements-fallback.yml
            echo '  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git' >> requirements-fallback.yml
            echo '    type: git' >> requirements-fallback.yml
            echo '    version: stable-1' >> requirements-fallback.yml
            ansible-galaxy collection install -r requirements-fallback.yml --no-deps --force 2>&1 || exit 1
          fi

      - name: Cleanup orphaned services on all hosts
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_STRATEGY: "mitogen_linear"
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          VAULT_PASS_FILE=$(mktemp)
          chmod 600 "$VAULT_PASS_FILE"
          echo "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASS_FILE"
          export ANSIBLE_VAULT_PASSWORD_FILE="$VAULT_PASS_FILE"
          trap "rm -f '$VAULT_PASS_FILE'" EXIT

          cd ansible
          echo "Removing orphaned services (services no longer assigned to each host)"
          ansible-playbook playbooks/site.yml \
            --limit all \
            --tags services \
            --extra-vars "is_staging_deployment=false cleanup_enabled=true"

  # Summary
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [deploy-mljr, deploy-nuc-staging, cleanup]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Parallel Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**mljr (production):** ${{ needs.deploy-mljr.result == 'success' && 'Success' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**nuc (staging):** ${{ needs.deploy-nuc-staging.result == 'success' && 'Success' || (needs.deploy-nuc-staging.result == 'skipped' && 'Skipped' || 'Failed') }}" >> $GITHUB_STEP_SUMMARY
          echo "**cleanup:** ${{ needs.cleanup.result == 'success' && 'Success' || (needs.cleanup.result == 'skipped' && 'Skipped' || 'Failed') }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ inputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.changed_services }}" != "all" ]; then
            echo "**Changed Services:** \`${{ needs.detect-changes.outputs.changed_services }}\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify
        if: always()
        run: |
          STATUS="${{ (needs.deploy-mljr.result == 'success' && needs.deploy-nuc-staging.result != 'failure') && 'success' || 'failure' }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          
          if curl -s --connect-timeout 3 --max-time 3 https://ntfy.mljr.eu/deployment -o /dev/null; then
            curl -s \
              -H "Title: Parallel Deployment $STATUS" \
              -H "Priority: $([[ "$STATUS" == "success" ]] && echo 'default' || echo 'high')" \
              -H "Tags: ansible,homelab,parallel" \
              -d "$EMOJI Parallel deployment completed (tags: ${{ inputs.tags }})" \
              https://ntfy.mljr.eu/deployment
          fi
