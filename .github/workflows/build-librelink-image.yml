name: Build LibreLink Up Go Image

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nightscout-librelink-up-go
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/nightscout-librelink-up-go
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Send notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            PRIORITY="default"
            TITLE="Image Build Successful"
          else
            EMOJI="❌"
            PRIORITY="high"
            TITLE="Image Build Failed"
          fi
          
          MESSAGE="${EMOJI} LibreLink Up Go Docker image build - ${TITLE}"
          
          curl -H "Title: ${TITLE}" \
               -H "Priority: ${PRIORITY}" \
               -H "Tags: docker,librelink" \
               -d "${MESSAGE}" \
               https://ntfy.mljr.eu/deployment || true
