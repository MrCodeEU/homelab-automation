name: Deploy VPS

on:
  workflow_dispatch:
      inputs:
        roles:
          description: 'Roles to deploy (all, base, docker, caddy, bichon)'
          required: true
          default: 'all'
          type: choice
          options:
            - all
            - base
            - docker
            - caddy
            - bichon

permissions:
  contents: read

jobs:
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Test SSH connectivity
        id: test-ssh
        continue-on-error: true
        run: |
          echo "======================================"
          echo "🔌 Testing SSH Connectivity"
          echo "======================================"
          if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo '✓ VPS connection successful'"; then
            echo "SSH_STATUS=✅ Success" >> $GITHUB_ENV
            echo "✅ SSH connection established"
          else
            echo "SSH_STATUS=❌ Failed" >> $GITHUB_ENV
            echo "❌ SSH connection failed"
            exit 1
          fi

      - name: Prepare secrets for injection
        run: |
          # Export secrets as environment variables for the inject-secrets.sh script
          echo "NIGHTSCOUT_API_SECRET=${{ secrets.NIGHTSCOUT_API_SECRET }}" >> secrets.env
          echo "LINK_UP_USERNAME=${{ secrets.LINK_UP_USERNAME }}" >> secrets.env
          echo "LINK_UP_PASSWORD=${{ secrets.LINK_UP_PASSWORD }}" >> secrets.env
          echo "NIGHTSCOUT_API_TOKEN=${{ secrets.NIGHTSCOUT_API_TOKEN }}" >> secrets.env
          echo "NIGHTSCOUT_DOMAIN=${{ secrets.NIGHTSCOUT_DOMAIN }}" >> secrets.env
          echo "BICHON_ENCRYPT_PASSWORD=${{ secrets.BICHON_ENCRYPT_PASSWORD }}" >> secrets.env

      - name: Copy deployment scripts
        id: copy-scripts
        continue-on-error: true
        run: |
          echo ""
          echo "======================================"
          echo "📦 Copying Deployment Files"
          echo "======================================"
          if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /tmp/homelab-deploy" && \
             tar czf - scripts/ configs/ secrets.env inventory.yml | tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd /tmp/homelab-deploy && tar xzf -"; then
            echo "COPY_STATUS=✅ Success" >> $GITHUB_ENV
            echo "✅ Scripts and configs deployed to /tmp/homelab-deploy"
          else
            echo "COPY_STATUS=❌ Failed" >> $GITHUB_ENV
            echo "❌ Failed to copy deployment files"
            exit 1
          fi

      - name: Execute base setup
        id: base-setup
        if: contains(github.event.inputs.roles, 'base') || github.event.inputs.roles == 'all'
        continue-on-error: true
        run: |
          echo ""
          echo "======================================"
          echo "🔧 Base System Setup"
          echo "======================================"
          if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash /tmp/homelab-deploy/scripts/01-base-setup.sh"; then
            echo "BASE_STATUS=✅ Success" >> $GITHUB_ENV
            echo "✅ Base setup completed"
          else
            echo "BASE_STATUS=❌ Failed" >> $GITHUB_ENV
            echo "❌ Base setup failed"
            exit 1
          fi

      - name: Execute Docker setup
        id: docker-setup
        if: contains(github.event.inputs.roles, 'docker') || github.event.inputs.roles == 'all'
        continue-on-error: true
        run: |
          echo ""
          echo "======================================"
          echo "🐳 Docker Installation"
          echo "======================================"
          if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash /tmp/homelab-deploy/scripts/02-docker-setup.sh"; then
            echo "DOCKER_STATUS=✅ Success" >> $GITHUB_ENV
            echo "✅ Docker setup completed"
          else
            echo "DOCKER_STATUS=❌ Failed" >> $GITHUB_ENV
            echo "❌ Docker setup failed"
            exit 1
          fi

      - name: Generate configurations
        id: generate-configs
        if: contains(github.event.inputs.roles, 'caddy') || github.event.inputs.roles == 'all'
        continue-on-error: true
        run: |
          echo ""
          echo "======================================"
          echo "⚙️  Generating Configurations"
          echo "======================================"
          echo "Checking if config file exists..."
          tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "ls -la /tmp/homelab-deploy/configs/services.yml || echo 'Config file not found!'"
          echo ""
          echo "Creating output directories..."
          tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /opt/caddy /opt/glance"
          echo ""
          echo "Running generate-configs.sh..."
          if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash -x /tmp/homelab-deploy/scripts/generate-configs.sh /tmp/homelab-deploy/configs/services.yml"; then
            echo "CONFIG_STATUS=✅ Success" >> $GITHUB_ENV
            echo ""
            echo "✅ Configurations generated (Caddyfile, Glance config)"
            echo ""
            echo "Verifying generated files..."
            tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo '=== Caddyfile ===' && cat /opt/caddy/Caddyfile && echo '' && echo '=== Glance Config ===' && ls -la /opt/glance/"
          else
            echo "CONFIG_STATUS=❌ Failed" >> $GITHUB_ENV
            echo "❌ Configuration generation failed"
            exit 1
          fi

      - name: Deploy Services
        id: deploy-services
        if: contains(github.event.inputs.roles, 'caddy') || github.event.inputs.roles == 'all'
        continue-on-error: true
        run: |
          echo ""
          echo "======================================"
          echo "🚀 Deploying All Services"
          echo "======================================"
          if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash /tmp/homelab-deploy/scripts/03-docker-compose-deploy.sh rocky"; then
            echo "DEPLOY_STATUS=✅ Success" >> $GITHUB_ENV
            echo "✅ Services deployed successfully"
          else
            echo "DEPLOY_STATUS=❌ Failed" >> $GITHUB_ENV
            echo "❌ Service deployment failed"
            exit 1
          fi
      
      - name: Validate deployment
        id: validate-deployment
        if: contains(github.event.inputs.roles, 'caddy') || github.event.inputs.roles == 'all'
        continue-on-error: true
        run: |
          echo ""
          echo "======================================"
          echo "🔍 Validating Deployment"
          echo "======================================"
          echo ""
          echo "=== Checking Caddyfile contains services ==="
          CADDYFILE_OK=true
          for service in "dash.mljr.eu" "nightscout.mljr.eu"; do
            if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "grep -q '$service' /opt/caddy/Caddyfile"; then
              echo "✅ $service found in Caddyfile"
            else
              echo "❌ $service NOT found in Caddyfile"
              CADDYFILE_OK=false
            fi
          done
          echo ""
          echo "=== Checking running Docker containers ==="
          CONTAINERS_OK=true
          for container in "caddy" "glance" "nightscout"; do
            if tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker ps --format '{{.Names}}' | grep -q '^$container$'"; then
              echo "✅ $container is running"
            else
              echo "⚠️  $container is NOT running"
              CONTAINERS_OK=false
            fi
          done
          echo ""
          if [ "$CADDYFILE_OK" = true ] && [ "$CONTAINERS_OK" = true ]; then
            echo "VALIDATION_STATUS=✅ Success" >> $GITHUB_ENV
            echo "✅ All validations passed"
          else
            echo "VALIDATION_STATUS=⚠️ Issues" >> $GITHUB_ENV
            echo "⚠️  Some validations failed (check above)"
          fi

      - name: Cleanup secrets
        if: always()
        run: |
          tailscale ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "rm -f /tmp/homelab-deploy/secrets.env" || true
          rm -f secrets.env || true

      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "📋 DEPLOYMENT SUMMARY"
          echo "======================================"
          echo ""
          
          # Console summary
          echo "Device: VPS (${{ secrets.VPS_HOST }})"
          echo "Roles: ${{ github.event.inputs.roles }}"
          echo ""
          echo "Component Status:"
          echo "  SSH Connection:      ${SSH_STATUS:-⏭️  Skipped}"
          echo "  File Transfer:       ${COPY_STATUS:-⏭️  Skipped}"
          echo "  Base Setup:          ${BASE_STATUS:-⏭️  Skipped}"
          echo "  Docker Setup:        ${DOCKER_STATUS:-⏭️  Skipped}"
          echo "  Config Generation:   ${CONFIG_STATUS:-⏭️  Skipped}"
          echo "  Service Deployment:  ${DEPLOY_STATUS:-⏭️  Skipped}"
          echo "  Deployment Validation: ${VALIDATION_STATUS:-⏭️  Skipped}"
          echo ""
          
          # GitHub step summary
          echo "## 🚀 VPS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** VPS (\`${{ secrets.VPS_HOST }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Roles:** \`${{ github.event.inputs.roles }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 Component Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SSH Connection | ${SSH_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| File Transfer | ${COPY_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Setup | ${BASE_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Setup | ${DOCKER_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| Config Generation | ${CONFIG_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service Deployment | ${DEPLOY_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Validation | ${VALIDATION_STATUS:-⏭️ Skipped} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All requested components were deployed successfully." >> $GITHUB_STEP_SUMMARY
          elif [[ "${SSH_STATUS}" == *"Failed"* ]] || [[ "${COPY_STATUS}" == *"Failed"* ]]; then
            echo "### ❌ Deployment Failed - Connection Error" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed to connect to VPS or transfer files. Check Tailscale connection and credentials." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Deployment Completed with Warnings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some components failed to deploy. Check the status table above and logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Check container status: \`docker ps\`" >> $GITHUB_STEP_SUMMARY
          echo "- View service logs: \`docker logs <container>\`" >> $GITHUB_STEP_SUMMARY
          echo "- Access Glance: \`https://dash.mljr.eu\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${NIGHTSCOUT_STATUS}" == *"Success"* ]]; then
            echo "- Access Nightscout: \`https://nightscout.mljr.eu\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Determine final exit code
           if [[ "${SSH_STATUS}" == *"Failed"* ]] || [[ "${COPY_STATUS}" == *"Failed"* ]] || \
             [[ "${BASE_STATUS}" == *"Failed"* ]] || [[ "${DOCKER_STATUS}" == *"Failed"* ]] || \
             [[ "${CADDY_STATUS}" == *"Failed"* ]] || [[ "${GLANCE_STATUS}" == *"Failed"* ]] || [[ "${BICHON_STATUS}" == *"Failed"* ]]; then
            echo ""
            echo "❌ Deployment had failures"
            exit 1
          else
            echo ""
            echo "✅ Deployment completed successfully"
          fi
