name: Ansible Deploy

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit to specific hosts (e.g., mljr, pi, rocky)'
        required: false
        default: 'all'
        type: string
      tags:
        description: 'Run specific tags/roles (e.g., caddy, docker, services)'
        required: false
        default: 'all'
        type: string
      build_librelink:
        description: 'Force build LibreLink Up Go image'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - '*dev*'  # Enable dev environment deployments for any branch containing 'dev'
    paths:
      - 'ansible/**'
      - 'apps/**'
      - 'configs/**'
      - '.github/workflows/ansible-deploy.yml'

jobs:
  # 1. Validate branch configuration
  validate-branch:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for dev configurations in main branch
        run: |
          echo "Checking for dev configuration folders in main branch..."
          DEV_FOLDERS=$(find configs -type d -name "dev" 2>/dev/null || true)

          if [ -n "$DEV_FOLDERS" ]; then
            echo "ERROR: Dev configuration folders found in main branch!"
            echo "The following dev folders should not exist in main:"
            echo "$DEV_FOLDERS"
            echo ""
            echo "Dev configurations should only exist in feature branches."
            echo "Please remove these folders before merging to main."
            exit 1
          fi

          echo "✓ No dev configurations found in main branch."

  # 2. Check which hosts are online
  check-hosts:
    needs: [validate-branch]
    if: always() && (needs.validate-branch.result == 'success' || needs.validate-branch.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      reachable_hosts: ${{ steps.get-hosts.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Ansible
        run: pip install ansible

      - name: Install Ansible collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Check host connectivity
        id: get-hosts
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "0"
        run: |
          cd ansible
          echo "Checking connectivity to managed hosts..."

          # Get hosts from managed groups (rocky and unraid)
          # proxy_only group is excluded - those hosts are only for Caddy config
          MANAGED_HOSTS=$(ansible-inventory --list | jq -r '.rocky.hosts + .unraid.hosts | .[]?' | tr '\n' ' ')

          if [ -z "$MANAGED_HOSTS" ]; then
            echo "No managed hosts found in inventory."
            echo "hosts=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Managed hosts: $MANAGED_HOSTS"

          REACHABLE_HOSTS=""
          for host in $MANAGED_HOSTS; do
            # Get ansible_host (IP or DNS) for this host
            TARGET=$(ansible-inventory --host "$host" | jq -r '.ansible_host // .inventory_hostname')
            if ping -c 1 -W 2 "$TARGET" > /dev/null 2>&1; then
              REACHABLE_HOSTS+="$host,"
            else
              echo "Host $host ($TARGET) is not reachable - skipping"
            fi
          done
          REACHABLE_HOSTS=$(echo "$REACHABLE_HOSTS" | sed 's/,$//')

          if [ -z "$REACHABLE_HOSTS" ]; then
            echo "No hosts are reachable."
          else
            echo "Reachable hosts: $REACHABLE_HOSTS"
          fi

          echo "hosts=$REACHABLE_HOSTS" >> $GITHUB_OUTPUT

  # 3. Detect changes to determine what to run
  detect-changes:
    needs: [validate-branch]
    if: always() && (needs.validate-branch.result == 'success' || needs.validate-branch.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.set-tags.outputs.tags }}
      build_librelink: ${{ steps.set-builds.outputs.librelink }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ansible_core:
              - 'ansible/*.cfg'
              - 'ansible/inventory/hosts.yml'
              - 'ansible/playbooks/**'
              - 'ansible/requirements.yml'
            roles_caddy:
              - 'ansible/roles/caddy/**'
              - 'configs/caddy/**'
              - 'ansible/inventory/group_vars/all.yml'
            roles_docker:
              - 'ansible/roles/docker/**'
              - 'configs/docker/**'
            roles_fail2ban:
              - 'ansible/roles/fail2ban/**'
              - 'configs/fail2ban/**'
            roles_glance:
              - 'ansible/roles/glance/**'
              - 'configs/glance/**'
            roles_mailcow:
              - 'ansible/roles/mailcow/**'
              - 'configs/mailcow/**'
            roles_backup:
              - 'ansible/roles/backup/**'
            roles_unraid:
              - 'ansible/roles/unraid/**'
              - 'scripts/03-unraid-deploy.sh'
            roles_services:
              - 'ansible/roles/services/**'
              - 'configs/**'
              - 'ansible/inventory/group_vars/all.yml'
            app_librelink:
              - 'apps/nightscout-librelink-up-go/**'

      - name: Determine Tags
        id: set-tags
        run: |
          TAGS=""
          
          # If manual dispatch with tags specified, use those
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.tags }}" != "all" ]; then
            TAGS="${{ inputs.tags }}"
          elif [ "${{ steps.changes.outputs.ansible_core }}" == "true" ]; then
            # Core ansible changes -> run everything
            TAGS="all"
          else
            # Build dynamic tag list
            [ "${{ steps.changes.outputs.roles_caddy }}" == "true" ] && TAGS="${TAGS},caddy"
            [ "${{ steps.changes.outputs.roles_docker }}" == "true" ] && TAGS="${TAGS},docker"
            [ "${{ steps.changes.outputs.roles_fail2ban }}" == "true" ] && TAGS="${TAGS},fail2ban"
            [ "${{ steps.changes.outputs.roles_glance }}" == "true" ] && TAGS="${TAGS},glance"
            [ "${{ steps.changes.outputs.roles_mailcow }}" == "true" ] && TAGS="${TAGS},mailcow"
            [ "${{ steps.changes.outputs.roles_backup }}" == "true" ] && TAGS="${TAGS},backup"
            [ "${{ steps.changes.outputs.roles_unraid }}" == "true" ] && TAGS="${TAGS},unraid"
            
            # Services is a catch-all for configs
            # If app_librelink changes, we also want to run services to redeploy it
            if [ "${{ steps.changes.outputs.roles_services }}" == "true" ] || [ "${{ steps.changes.outputs.app_librelink }}" == "true" ]; then
              TAGS="${TAGS},services"
            fi
            
            # Clean up commas
            TAGS=$(echo "$TAGS" | sed 's/^,//')
            
            if [ -z "$TAGS" ]; then
              TAGS="none"
            fi
          fi
          
          echo "Calculated tags: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Determine Builds
        id: set-builds
        run: |
          BUILD_LIBRELINK="false"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.build_librelink }}" == "true" ]; then
            BUILD_LIBRELINK="true"
          elif [ "${{ steps.changes.outputs.app_librelink }}" == "true" ]; then
            BUILD_LIBRELINK="true"
          fi
          
          echo "Build LibreLink: $BUILD_LIBRELINK"
          echo "librelink=$BUILD_LIBRELINK" >> $GITHUB_OUTPUT

  # 4. Build LibreLink if needed
  build-librelink:
    needs: detect-changes
    if: needs.detect-changes.outputs.build_librelink == 'true'
    uses: ./.github/workflows/build-librelink-image.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # 5. Deploy
  deploy:
    needs: [check-hosts, detect-changes, build-librelink]
    # Run if we have reachable hosts AND (tags are not none OR we built something)
    if: |
      always() &&
      needs.check-hosts.outputs.reachable_hosts != '' &&
      (needs.detect-changes.outputs.tags != 'none' || needs.detect-changes.outputs.build_librelink == 'true') &&
      (needs.build-librelink.result == 'success' || needs.build-librelink.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Environment
        id: detect-env
        run: |
          # Determine environment based on branch
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV_SUFFIX=""
            ENVIRONMENT="production"
          else
            ENV_SUFFIX=".dev"
            ENVIRONMENT="development"
          fi

          echo "Environment: $ENVIRONMENT"
          echo "Domain suffix: $ENV_SUFFIX"
          echo "env_suffix=$ENV_SUFFIX" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Set up Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible
        uses: actions/cache@v4
        id: ansible-cache
        with:
            path: |
              ~/.local/bin/ansible*
              ~/.local/lib/python*/site-packages/ansible*
            key: ansible-${{ runner.os }}-v2

      - name: Install Ansible
        if: steps.ansible-cache.outputs.cache-hit != 'true'
        run: pip install --user ansible

      - name: Install Ansible collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Environment configuration
          ENV_SUFFIX: ${{ steps.detect-env.outputs.env_suffix }}
          ENVIRONMENT: ${{ steps.detect-env.outputs.environment }}
          # Secrets for Ansible lookup
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
          KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          cd ansible
          
          # Calculate Limit
          LIMIT_ARG=""
          REACHABLE="${{ needs.check-hosts.outputs.reachable_hosts }}"
          INPUT_LIMIT="${{ inputs.limit }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$INPUT_LIMIT" ] && [ "$INPUT_LIMIT" != "all" ]; then
            LIMIT_ARG="--limit $INPUT_LIMIT"
          else
            LIMIT_ARG="--limit $REACHABLE"
          fi
          
          # Calculate Tags
          TAGS_ARG=""
          DETECTED_TAGS="${{ needs.detect-changes.outputs.tags }}"
          
          if [ "$DETECTED_TAGS" != "none" ]; then
             TAGS_ARG="--tags $DETECTED_TAGS"
          fi
          
          echo "Running Ansible with: $LIMIT_ARG $TAGS_ARG"
          
          if [ -n "$TAGS_ARG" ]; then
            ansible-playbook playbooks/site.yml $LIMIT_ARG $TAGS_ARG
          else
            echo "No tags to run. Skipping playbook."
          fi

      - name: Send deployment notification
        if: always()
        run: |
          # Determine deployment status
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            PRIORITY="default"
            TITLE="Deployment Successful"
          else
            EMOJI="❌"
            PRIORITY="high"
            TITLE="Deployment Failed"
          fi
          
          # Construct message
          MESSAGE="${EMOJI} Homelab deployment"
          
          # Add details
          REACHABLE="${{ needs.check-hosts.outputs.reachable_hosts }}"
          TAGS="${{ needs.detect-changes.outputs.tags }}"
          ENVIRONMENT="${{ steps.detect-env.outputs.environment }}"

          MESSAGE="${MESSAGE} to ${REACHABLE}"
          MESSAGE="${MESSAGE} (env: ${ENVIRONMENT}, tags: ${TAGS})"
          MESSAGE="${MESSAGE} - ${TITLE}"
          
          # Send to ntfy
          curl -H "Title: ${TITLE}" \
               -H "Priority: ${PRIORITY}" \
               -H "Tags: ansible,homelab" \
               -d "${MESSAGE}" \
               https://ntfy.mljr.eu/deployment || true
