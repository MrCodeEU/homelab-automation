name: Ansible Deploy

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit to specific hosts (e.g., mljr, pi, rocky)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mljr
          - homeserver
          - unraid
      tags:
        description: 'Run specific tags/roles (e.g., caddy, docker, services)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - base
          - docker
          - caddy
          - security
          - fail2ban
          - services
      build_librelink:
        description: 'Build LibreLink Up Go image before deploying'
        required: false
        default: false
        type: boolean

jobs:
  build-librelink:
    if: ${{ inputs.build_librelink == true }}
    uses: ./.github/workflows/build-librelink-image.yml
    secrets: inherit    
    permissions:
      contents: read
      packages: write
  deploy:
    runs-on: ubuntu-latest
    needs: [build-librelink]
    if: always() && (needs.build-librelink.result == 'success' || needs.build-librelink.result == 'skipped')
    steps:
      - name: Wait for image to be available
        if: ${{ inputs.build_librelink == true }}
        run: |
          echo "Waiting 30 seconds for image to be fully available in registry..."
          sleep 30
          echo "Image should now be available for deployment"
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible
        uses: actions/cache@v4
        id: ansible-cache
        with:
            path: |
              ~/.local/bin/ansible*
              ~/.local/lib/python*/site-packages/ansible*
            key: ansible-${{ runner.os }}-v2

      - name: Install Ansible
        if: steps.ansible-cache.outputs.cache-hit != 'true'
        run: |
            pip install --user ansible

      - name: Install Ansible collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Secrets for Ansible lookup
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
          KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
          KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          cd ansible
          
          # Construct arguments
          ARGS=""
          if [ "${{ inputs.limit }}" != "all" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          
          if [ "${{ inputs.tags }}" != "all" ] && [ -n "${{ inputs.tags }}" ]; then
            ARGS="$ARGS --tags ${{ inputs.tags }}"
          fi
          
          ansible-playbook playbooks/site.yml $ARGS

      - name: Send deployment notification
        if: always()
        run: |
          # Determine deployment status
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            PRIORITY="default"
            TITLE="Deployment Successful"
          else
            EMOJI="❌"
            PRIORITY="high"
            TITLE="Deployment Failed"
          fi
          
          # Construct message
          MESSAGE="${EMOJI} Homelab deployment to ${{ inputs.limit || 'all' }} hosts"
          if [ "${{ inputs.tags }}" != "all" ] && [ -n "${{ inputs.tags }}" ]; then
            MESSAGE="${MESSAGE} (tags: ${{ inputs.tags }})"
          fi
          MESSAGE="${MESSAGE} - ${TITLE}"
          
          # Send to ntfy
          curl -H "Title: ${TITLE}" \
               -H "Priority: ${PRIORITY}" \
               -H "Tags: ansible,homelab" \
               -d "${MESSAGE}" \
               https://ntfy.mljr.eu/deployment || true
