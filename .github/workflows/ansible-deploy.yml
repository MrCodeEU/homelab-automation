name: Ansible Deploy

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit to specific hosts (e.g., mljr, pi, rocky)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mljr
          - homeserver
          - unraid
      tags:
        description: 'Run specific tags/roles (e.g., caddy, docker, services)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - base
          - docker
          - caddy
          - services

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cache Ansible
        uses: actions/cache@v4
        id: ansible-cache
        with:
            path: /usr/bin/ansible*
            key: ansible-${{ runner.os }}-${{ hashFiles('.github/workflows/ansible-deploy.yml') }}

      - name: Install Ansible
        if: steps.ansible-cache.outputs.cache-hit != 'true'
        run: |
            sudo apt-get update
            sudo apt-get install -y ansible

      - name: Install Ansible collections
        run: |
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Secrets for Ansible lookup
          NIGHTSCOUT_API_SECRET: ${{ secrets.NIGHTSCOUT_API_SECRET }}
          LINK_UP_USERNAME: ${{ secrets.LINK_UP_USERNAME }}
          LINK_UP_PASSWORD: ${{ secrets.LINK_UP_PASSWORD }}
          NIGHTSCOUT_API_TOKEN: ${{ secrets.NIGHTSCOUT_API_TOKEN }}
          NIGHTSCOUT_DOMAIN: ${{ secrets.NIGHTSCOUT_DOMAIN }}
          BICHON_ENCRYPT_PASSWORD: ${{ secrets.BICHON_ENCRYPT_PASSWORD }}
          CADDY_AUTH_PASSWORD_HASH: ${{ secrets.CADDY_AUTH_PASSWORD_HASH }}
          CADDY_AUTH_USER: ${{ secrets.CADDY_AUTH_USER }}
        run: |
          cd ansible
          
          # Construct arguments
          ARGS=""
          if [ "${{ inputs.limit }}" != "all" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          
          if [ "${{ inputs.tags }}" != "all" ] && [ -n "${{ inputs.tags }}" ]; then
            ARGS="$ARGS --tags ${{ inputs.tags }}"
          fi
          
          ansible-playbook playbooks/site.yml $ARGS
