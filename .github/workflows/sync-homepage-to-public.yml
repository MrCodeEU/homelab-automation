name: Sync Homepage to Public Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/homepage/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/mrcodeeu/homepage.git public-repo

      - name: Sync source code
        run: |
          cd public-repo

          # Remove old files (except .git and .github)
          find . -maxdepth 1 -not -name '.git' -not -name '.github' -not -name '.' -not -name '..' -exec rm -rf {} +

          # Copy all source files from apps/homepage
          cp -r ../apps/homepage/* .

          # Remove sensitive files
          rm -f .env 2>/dev/null || true
          rm -rf data/ 2>/dev/null || true

      - name: Create .github directory structure
        run: |
          cd public-repo
          mkdir -p .github/workflows

      - name: Create build workflow for public repo
        run: |
          cd public-repo
          cat > .github/workflows/build.yml << 'EOF'
          name: Build and Push Docker Image

          on:
            workflow_dispatch:
            push:
              branches:
                - main
                - '*dev*'
            repository_dispatch:
              types: [sync-complete]

          jobs:
            build-and-push:
              runs-on: ubuntu-latest
              permissions:
                contents: read
                packages: write

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Determine image tag
                  id: tag
                  run: |
                    # Convert repository owner to lowercase
                    REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                    echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT

                    if [ "${{ github.ref }}" == "refs/heads/main" ]; then
                      echo "tag=latest" >> $GITHUB_OUTPUT
                      echo "environment=production" >> $GITHUB_OUTPUT
                    else
                      echo "tag=dev" >> $GITHUB_OUTPUT
                      echo "environment=development" >> $GITHUB_OUTPUT
                    fi

                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v3

                - name: Log in to GitHub Container Registry
                  uses: docker/login-action@v3
                  with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

                - name: Build and push Docker image
                  uses: docker/build-push-action@v5
                  with:
                    context: .
                    push: true
                    tags: ghcr.io/${{ steps.tag.outputs.repo_owner }}/homepage:${{ steps.tag.outputs.tag }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    platforms: linux/amd64

                - name: Image built successfully
                  run: |
                    echo "✅ Docker image built and pushed: ghcr.io/${{ steps.tag.outputs.repo_owner }}/homepage:${{ steps.tag.outputs.tag }}"
          EOF

      - name: Create public README
        run: |
          cd public-repo
          cat > README.md << 'EOF'
          # Personal Homepage

          A modern personal homepage showcasing portfolio projects, CV, and activity stats.

          ## Features

          - 🎨 **Auto-discovery** of portfolio projects from GitHub repositories
          - 📊 **Dynamic content** from multiple data sources (GitHub, Strava, LinkedIn)
          - 🐳 **Containerized** deployment with Docker
          - 🔄 **Real-time updates** via background scrapers
          - 🎯 **Portfolio markers** - Flag repos with `.portfolio` file or README markers

          ## Architecture

          - **Frontend**: SvelteKit with TypeScript
          - **Backend**: Go with embedded static files
          - **Storage**: File-based cache with TTL
          - **Deployment**: Single Docker container (~15MB)

          ## Quick Start

          ### Using Docker (Recommended)

          ```bash
          docker run -d \
            -p 8080:8080 \
            -e GITHUB_USERNAME=your-username \
            -e GITHUB_TOKEN=your-github-token \
            -v homepage-data:/data \
            ghcr.io/mrcodeeu/homepage:latest
          ```

          Visit http://localhost:8080

          ### Using Docker Compose

          ```yaml
          services:
            homepage:
              image: ghcr.io/mrcodeeu/homepage:latest
              ports:
                - "8080:8080"
              environment:
                - GITHUB_USERNAME=your-username
                - GITHUB_TOKEN=your-github-token
              volumes:
                - homepage-data:/data

          volumes:
            homepage-data:
          ```

          ## Environment Variables

          | Variable | Required | Description |
          |----------|----------|-------------|
          | `GITHUB_USERNAME` | Yes | Your GitHub username for project discovery |
          | `GITHUB_TOKEN` | Yes | GitHub Personal Access Token (read-only) |
          | `CACHE_DIR` | No | Cache directory (default: `./data/cache`) |

          ## Portfolio Markers

          To feature a repository on your homepage, add one of:

          ### Method 1: `.portfolio` file (Recommended)

          Create `.portfolio` in your repository root:

          ```json
          {
            "description": "Custom description for your project",
            "featured": true,
            "tags": ["golang", "web", "automation"],
            "images": [
              "https://example.com/screenshot.png",
              "./assets/demo.gif"
            ]
          }
          ```

          ### Method 2: README Marker

          Add to your README.md:
          ```markdown
          <!-- PORTFOLIO -->
          ```

          Or use the emoji marker:
          ```markdown
          🎨
          ```

          See [PORTFOLIO.md](./PORTFOLIO.md) for detailed documentation.

          ## Development

          ### Local Setup

          **Frontend**:
          ```bash
          cd frontend
          npm install
          npm run dev  # http://localhost:5173
          ```

          **Backend**:
          ```bash
          cd backend
          go run cmd/server/main.go  # http://localhost:8080
          ```

          ### Building

          ```bash
          docker build -t homepage .
          ```

          ## Docker Images

          Images are automatically built and published:

          - **Production**: `ghcr.io/mrcodeeu/homepage:latest`
          - **Development**: `ghcr.io/mrcodeeu/homepage:dev`

          ## Contributing

          Contributions are welcome! Please:

          1. Fork this repository
          2. Create a feature branch
          3. Make your changes
          4. Submit a pull request

          ## License

          MIT License - see [LICENSE](LICENSE) file

          ## Credits

          Built with:
          - [SvelteKit](https://kit.svelte.dev/)
          - [Go](https://golang.org/)
          - [Docker](https://www.docker.com/)

          ---

          🤖 This repository is automatically synced from a private monorepo.
          EOF

      - name: Create LICENSE
        run: |
          cd public-repo
          cat > LICENSE << 'EOF'
          MIT License

          Copyright (c) 2024 MrCodeEU

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF

      - name: Commit and push
        working-directory: public-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          git commit -m "sync: update from private repo ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push origin main

      - name: Trigger build in public repository
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          # Trigger the build workflow in the public repo using repository_dispatch
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${PUBLIC_REPO_TOKEN}" \
            https://api.github.com/repos/mrcodeeu/homepage/dispatches \
            -d '{"event_type":"sync-complete"}'

      - name: Send notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            MESSAGE="Homepage synced to public repository"
          else
            EMOJI="❌"
            MESSAGE="Failed to sync homepage to public repository"
          fi

          curl -H "Title: Repository Sync" \
               -H "Tags: github,sync" \
               -d "${EMOJI} ${MESSAGE}" \
               https://ntfy.mljr.eu/deployment || true
