name: Ziti C4 (GitHub OIDC)

# docs/ZERO_TRUST_PLAN.md C4: this job reaches nuc's Alloy over Ziti with
# nothing but its own OIDC token. No secret is involved. The controller
# accepts the token only for this file on main (identity ci-ziti-c4,
# matched by job_workflow_ref), and that identity may dial nuc-alloy only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ziti/c4/go.mod
          cache-dependency-path: ziti/c4/go.sum

      - name: Log in to Ziti and dial nuc-alloy
        working-directory: ziti/c4
        run: go run .
