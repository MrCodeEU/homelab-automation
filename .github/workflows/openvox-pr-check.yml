name: OpenVox PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "openvox/**"
      - "services/**"
      - "scripts/**"
      - "tools/**"
      - "Makefile"
      - "renovate.json"
      - ".githooks/pre-commit"
      - ".github/workflows/openvox-pr-check.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: openvox-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo gem install --no-document openvox --version 8.28.1
          pip install --quiet pyyaml jinja2

      - name: Install Caddy (custom CrowdSec/AppSec build) for config validation
        env:
          CADDY_RELEASE: caddy-v2.11.7-crowdsec-v0.14.1-b38ae651
          CADDY_SHA256: ebd5a88596a13c4aa6148e679fa08e1814789131e0349a53631219884b0431c9
        run: |
          curl -fsSL -o caddy \
            "https://github.com/MrCodeEU/homelab-automation/releases/download/${CADDY_RELEASE}/caddy-linux-amd64"
          echo "${CADDY_SHA256}  caddy" | sha256sum -c -
          sudo install -m 755 caddy /usr/local/bin/caddy
          caddy version

      - name: Validate OpenVox, services, and scripts
        run: |
          ./scripts/openvox-modules.sh validate
          module_dir=/tmp/openvox-modules
          mkdir -p "$module_dir"
          sed -nE "s/^[[:space:]]*mod[[:space:]]+'([a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+)',[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'[[:space:]]*$/\1 \2/p" openvox/Puppetfile |
            while read -r module version; do
              puppet module install "$module" --version="$version" \
                --target-dir="$module_dir" --force --ignore-dependencies
            done
          puppet module list --color=false --modulepath="$module_dir"
          puppet parser validate openvox/manifests/site.pp openvox/modules/role/manifests/*.pp openvox/modules/roles/manifests/*.pp openvox/modules/roles/manifests/services/*.pp openvox/modules/roles/manifests/services_nas/*.pp
          find openvox/modules/roles/templates -type f -name '*.epp' -print0 | xargs -0 -n1 puppet epp validate
          find scripts openvox/modules/roles/files -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          make test

  openvox-unit:
    name: OpenVox catalog tests
    needs: offline-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile catalog specs in pinned VoxBox
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/openvox:/repo" \
            ghcr.io/voxpupuli/voxbox@sha256:704dfe406a3f2f16d0b2a4d71fb4de4b72a9768df1e1cda06134240e5f01dc3c \
            spec SPEC=spec/classes

  openvox-caddy-render:
    name: OpenVox Caddy render test
    needs: openvox-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Render and validate fixture Caddy configuration
        run: ./scripts/test-openvox-caddy-render.sh

  live-noop:
    name: Live production noop
    needs: [offline-validation, openvox-unit, openvox-caddy-render]
    # Only the repository owner's same-repository PRs may receive the
    # production-check environment's Tailscale credentials.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'MrCodeEU'
    runs-on: ubuntu-latest
    environment: production-check
    env:
      MLJR_HOST: mljr.tail33930.ts.net
      NUC_HOST: nuc.tail33930.ts.net
      UGREEN_HOST: ugreen.tail33930.ts.net
      OPENVOX_ENV_DIR: /tmp/openvox-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run isolated live noop
        run: |
          set -o pipefail
          rc=0
          : > /tmp/openvox-output.log
          for host in "$MLJR_HOST" "$NUC_HOST" "$UGREEN_HOST"; do
            if ! ./scripts/openvox-sync.sh "$host" noop 2>&1 | tee -a /tmp/openvox-output.log; then
              rc=1
            fi
          done
          exit "$rc"

      - name: Upload noop log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openvox-pr-noop-${{ github.run_id }}
          path: /tmp/openvox-output.log
          if-no-files-found: ignore
          retention-days: 14
