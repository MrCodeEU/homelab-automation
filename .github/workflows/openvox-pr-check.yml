name: OpenVox PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "openvox/**"
      - "services/**"
      - "scripts/**"
      - "tools/**"
      - "Makefile"
      - "renovate.json"
      - ".githooks/pre-commit"
      - ".github/workflows/openvox-pr-check.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: openvox-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    env:
      CADDY_RELEASE: caddy-v2.11.9-crowdsec-v0.15.0-5b1be5e7
      CADDY_SHA256: c632c9554c78b5aa81609b84c7b5e5ad71fb63d66b80fab33129c9ae26f1676b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo gem install --no-document openvox --version 8.28.1
          pip install --quiet pyyaml jinja2

      # Cached per release and checksum. The cache is per PR (this workflow
      # never runs on main, so there is no main cache to share): the first
      # run of a PR downloads, its re-runs and later pushes restore. A
      # restored binary still goes through the sha256 check in the next step.
      - name: Restore cached Caddy build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caddy
          key: ${{ env.CADDY_RELEASE }}-${{ env.CADDY_SHA256 }}

      - name: Install Caddy (custom CrowdSec/AppSec build) for config validation
        run: |
          if [ ! -s caddy ]; then
            # Bounded retries: release downloads have returned 503/504 from
            # github.com for minutes at a time (2026-11-08). 5xx and timeouts
            # are retried, a 404 is not; the sha256 check below still decides.
            curl -fsSL --retry 4 --retry-delay 10 --retry-max-time 90 --max-time 120 -o caddy \
              "https://github.com/MrCodeEU/homelab-automation/releases/download/${CADDY_RELEASE}/caddy-linux-amd64"
          fi
          echo "${CADDY_SHA256}  caddy" | sha256sum -c -
          sudo install -m 755 caddy /usr/local/bin/caddy
          caddy version

      - name: Validate OpenVox, services, and scripts
        run: |
          ./scripts/openvox-modules.sh validate
          module_dir=/tmp/openvox-modules
          mkdir -p "$module_dir"
          sed -nE "s/^[[:space:]]*mod[[:space:]]+'([a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+)',[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'[[:space:]]*$/\1 \2/p" openvox/Puppetfile |
            while read -r module version; do
              puppet module install "$module" --version="$version" \
                --target-dir="$module_dir" --force --ignore-dependencies
            done
          puppet module list --color=false --modulepath="$module_dir"
          puppet parser validate openvox/manifests/site.pp openvox/modules/role/manifests/*.pp openvox/modules/roles/manifests/*.pp openvox/modules/roles/manifests/services/*.pp openvox/modules/roles/manifests/services_nas/*.pp
          find openvox/modules/roles/templates -type f -name '*.epp' -print0 | xargs -0 -n1 puppet epp validate
          find scripts openvox/modules/roles/files -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          make test

  openvox-unit:
    name: OpenVox catalog tests
    needs: offline-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile catalog specs in pinned VoxBox
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/openvox:/repo" \
            ghcr.io/voxpupuli/voxbox@sha256:704dfe406a3f2f16d0b2a4d71fb4de4b72a9768df1e1cda06134240e5f01dc3c \
            spec SPEC=spec/classes

  # Catalog of every host before and after this PR, compiled without hosts
  # or secrets (scripts/catalog-diff.sh), as the job summary. Runs for fork
  # PRs too. It replaced the live noop over Tailscale (docs/DEPLOY_AGENT.md).
  catalog-diff:
    name: Catalog diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: head/tools/go.mod
          cache-dependency-path: head/tools/go.sum

      - name: Compile and diff catalogs
        run: |
          set -o pipefail
          head/scripts/catalog-diff.sh base/openvox head/openvox | tee catalog-diff.md
          cat catalog-diff.md >> "$GITHUB_STEP_SUMMARY"

  openvox-caddy-render:
    name: OpenVox Caddy render test
    needs: openvox-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Render and validate fixture Caddy configuration
        run: ./scripts/test-openvox-caddy-render.sh
