compact: true
quiet: true
skip-path:
  - .git
  - .githooks/.venv
  # Puppet spec fixtures ship deliberately fake test secrets (e.g.
  # "test-jwt-secret") that Checkov's entropy-based secrets scanner
  # misflags as CKV_SECRET_6 "Base64 High Entropy String". Not real
  # infrastructure data - test-only, never deployed.
  - openvox/spec/fixtures
