# OpenZiti private edge router on ugreen (docs/ZERO_TRUST_PLAN.md Phase 3).
# Static config, not generated by the image bootstrap.
#
# Outbound only: control channel to ctrl.ziti.mljr.eu:8441, link dialed to
# mljr's router. The edge listener binds the LAN address only (UGOS's
# firewall has no drop rule for it), so home clients connect here and LAN
# traffic never goes through mljr (C6). Host-mode tunnel binding: this router hosts ugreen's
# services itself, no separate tunneler.
v: 3

identity:
  cert:        /ziti-router/ugreen.cert
  server_cert: /ziti-router/ugreen.server.chain.cert
  key:         /ziti-router/ugreen.key
  ca:          /ziti-router/ugreen.cas

ctrl:
  endpoint:      tls:ctrl.ziti.mljr.eu:8441
  endpointsFile: /ziti-router/endpoints.yml

# Dial-only: links go out to mljr's router, nothing listens for links here.
link:
  dialers:
    - binding: transport

listeners:
  - binding: edge
    address: tls:192.168.50.86:8442
    options:
      advertise: 192.168.50.86:8442
      connectTimeoutMs: 5000
      getSessionTimeout: 60
  - binding: tunnel
    options:
      mode: host

edge:
  csr:
    organization: homelab
    sans:
      dns:
        - localhost
      ip:
        - "127.0.0.1"
        - "::1"
        - "192.168.50.86"

forwarder:
  latencyProbeInterval: 0
  xgressDialQueueLength: 1000
  xgressDialWorkerCount: 128
  linkDialQueueLength: 1000
  linkDialWorkerCount: 32

metrics:
  reportInterval: 1m
  messageQueueSize: 10
