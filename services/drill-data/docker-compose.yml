# Test data for the DR drill (docs/DISASTER_RECOVERY.md): round 1 writes a
# marker file into the volume and backs it up (roles::backup, drill-data),
# round 2 restores it onto the rebuilt VM from ugreen. Removed with the
# drill host.
services:
  drill-data:
    image: alpine:3.24
    container_name: drill-data
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - data:/data

volumes:
  data:
