services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: ${COMPOSE_PROJECT_NAME:-forgejo}-app
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: git.mljr.eu
      FORGEJO__server__SSH_DOMAIN: git.mljr.eu
      FORGEJO__server__ROOT_URL: https://git.mljr.eu/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__SSH_LISTEN_PORT: 22
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__admin__DISABLE_REGULAR_ORG_CREATION: "true"
      FORGEJO__security__GLOBAL_TWO_FACTOR_REQUIREMENT: admin
    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3300:3000"
      - "2222:22"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forgejo-internal

  runner-dind:
    image: docker@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
    container_name: ${COMPOSE_PROJECT_NAME:-forgejo}-runner-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - -H
      - tcp://0.0.0.0:2375
      - --tls=false
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - runner-control
      - runner-egress

  runner-dind-cleanup:
    image: docker@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
    container_name: ${COMPOSE_PROJECT_NAME:-forgejo}-runner-dind-cleanup
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://runner-dind:2375
      DOCKER_TLS_CERTDIR: ""
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          sleep 6h
          docker system prune --all --force --volumes --filter "until=24h"
        done
    depends_on:
      runner-dind:
        condition: service_healthy
    networks:
      - runner-control

  runner:
    image: data.forgejo.org/forgejo/runner:12.13.2@sha256:eb6e7bc21973382d261e6eb883dbd27b8cb56939d33a3bfd79a1352b7f9a33a0
    container_name: ${COMPOSE_PROJECT_NAME:-forgejo}-runner
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DOCKER_HOST: tcp://runner-dind:2375
    volumes:
      - ./runner-data:/data
    command:
      - /bin/sh
      - -c
      - |
        while [ ! -s /data/runner-config.yml ]; do
          echo "Waiting for /data/runner-config.yml"
          sleep 5
        done
        exec forgejo-runner daemon --config /data/runner-config.yml
    depends_on:
      forgejo:
        condition: service_started
      runner-dind:
        condition: service_healthy
    networks:
      - forgejo-internal
      - runner-control

  db:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-forgejo}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - forgejo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forgejo-internal

networks:
  forgejo-internal:
    driver: bridge
  runner-control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.254.250.0/29
  runner-egress:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 10.254.250.8/29

volumes:
  forgejo-data:
    driver: local
    name: forgejo-data
  forgejo-db-data:
    driver: local
    name: forgejo-db-data
