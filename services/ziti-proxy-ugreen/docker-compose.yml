# Ziti client for apps on ugreen that cannot dial Ziti themselves (Grafana
# Alloy, DefectDojo imports): `ziti-tcp-proxy` opens one listener per service, published on
# 127.0.0.1 only, as identity m2m-ugreen (ziti/tofu/m2m.tf). That identity may
# dial only the services listed there.
#
# Enrolment: scripts/ziti-enroll-proxy.sh m2m-ugreen ugreen ziti-proxy-ugreen writes
# data/m2m-ugreen.json (uid 2171, 0600). Without it the container restarts
# until the file exists; Alloy buffers in its WAL meanwhile.
services:
  ziti-proxy-ugreen:
    image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    container_name: ziti-proxy-ugreen
    restart: unless-stopped
    user: "2171:2171"
    labels:
      # restarted by roles::ziti_tcp_proxy when the binary changes
      homelab.ziti-tcp-proxy: "true"
    entrypoint: ["/opt/ziti-tcp-proxy/ziti-tcp-proxy"]
    command:
      - -identity
      - /identity/m2m-ugreen.json
      - grafana-victoriametrics:19090
      - grafana-loki:3100
      - defectdojo:19101
    ports:
      - "127.0.0.1:19090:19090"
      - "127.0.0.1:3100:3100"
      # Trivy imports -> DefectDojo on nuc (roles::vuln_scan; same port as
      # on mljr)
      - "127.0.0.1:19101:19101"
    volumes:
      - ./data:/identity
      - /usr/local/libexec/ziti-tcp-proxy:/opt/ziti-tcp-proxy:ro
    environment:
      - TZ=${TZ}
