# AppSec (WAF) alerts report only. Log-only vhosts (roles::caddy `appsec: log`,
# docs/APPSEC_POC_PLAN.md) would otherwise still end in a 4h host-wide firewall
# ban of the client through the default profile below: found live 2026-10-25
# when a test request to a log-only vhost banned the sending host. A false
# positive must cost at most one 403, never every service on the host.
# Scanners are still banned by the ordinary http-* scenarios.
name: appsec_alert_only
filters:
 - Alert.GetScenario() startsWith "crowdsecurity/appsec-"
decisions: []
on_success: break
---
name: default_ip_remediation
#debug: true
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
 - type: ban
   # duration_expr is rejected by the installed crowdsecurity/crowdsec:latest
   # (v1.7.8) - "field duration_expr not found in type models.Decision",
   # confirmed live on mljr (crash-looped the container). This schema
   # version only accepts a flat `duration`; left the expr commented out
   # as a marker for revisiting progressive-duration once the image
   # supports it, not as something currently in effect.
   duration: 4h
#duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
# notifications:
#   - slack_default  # Set the webhook in /etc/crowdsec/notifications/slack.yaml before enabling this.
#   - splunk_default # Set the splunk url and token in /etc/crowdsec/notifications/splunk.yaml before enabling this.
#   - http_default   # Set the required http parameters in /etc/crowdsec/notifications/http.yaml before enabling this.
#   - email_default  # Set the required email parameters in /etc/crowdsec/notifications/email.yaml before enabling this.
on_success: break
---
name: default_range_remediation
#debug: true
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
 - type: ban
   duration: 4h
#duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
# notifications:
#   - slack_default  # Set the webhook in /etc/crowdsec/notifications/slack.yaml before enabling this.
#   - splunk_default # Set the splunk url and token in /etc/crowdsec/notifications/splunk.yaml before enabling this.
#   - http_default   # Set the required http parameters in /etc/crowdsec/notifications/http.yaml before enabling this.
#   - email_default  # Set the required email parameters in /etc/crowdsec/notifications/email.yaml before enabling this.
on_success: break
