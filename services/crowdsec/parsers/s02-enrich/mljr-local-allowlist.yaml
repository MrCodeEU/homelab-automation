name: mljr/local-allowlist
description: "Ignore trusted owner/Tailscale sources and known app-specific false positives"
whitelist:
  reason: "Owner IP, Tailscale network, and Nocturne auth and Actual Budget static-asset false positives are trusted"
  ip:
    - "145.40.45.14"
  cidr:
    - "100.64.0.0/10"
  expression:
    - "evt.Meta.log_type == 'http_access-log' && evt.Meta.target_fqdn == 'nc.mljr.eu'"
    # Actual Budget's web client fetches dozens of /data/migrations/*.sql and
    # default-db.sqlite files on first load, which trips
    # http-sensitive-files and http-crawl-non_statics for a real user.
    - "evt.Meta.log_type == 'http_access-log' && evt.Meta.target_fqdn == 'budget.mljr.eu'"
