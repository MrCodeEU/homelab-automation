name: mljr/local-allowlist
description: "Ignore known app-specific false positives"
whitelist:
  reason: "Nocturne auth and Nextcloud client preview/upload-check false positives are trusted"
  # The home connection is not listed here: it changes, so home-ip sync
  # (roles::home_ip) keeps it in the centralized allowlist "home"
  # (cscli allowlists inspect home). Tailscale's 100.64.0.0/10 left with
  # the tailnet (Phase 5); Ziti traffic arrives from loopback, which
  # crowdsecurity/whitelists already covers.
  expression:
    - "evt.Meta.log_type == 'http_access-log' && evt.Meta.target_fqdn == 'nc.mljr.eu'"
    # Nextcloud clients after an upload: a preview is 404 until Nextcloud has
    # generated it, and each upload starts with a HEAD of the not yet
    # existing file. A batch of photos tripped http-probing and
    # http-admin-interface-probing and banned the uploader (2026-11-17).
    # Only these two 404s; other paths on cloud.mljr.eu still count.
    - "evt.Meta.log_type == 'http_access-log' && evt.Meta.target_fqdn == 'cloud.mljr.eu' && evt.Meta.http_status == '404' && ((evt.Meta.http_verb == 'GET' && evt.Meta.http_path startsWith '/index.php/core/preview') || (evt.Meta.http_verb == 'HEAD' && evt.Meta.http_path startsWith '/remote.php/dav/files/'))"
