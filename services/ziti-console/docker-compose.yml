# Ziti's web console (ZAC), read-only, at https://ziti.mljr.eu: mljr's
# Caddy with Authelia (two factors, group admins) in front of
# tools/cmd/ziti-console-proxy on 127.0.0.1:8446, which proxies to the
# controller's admin listener (ZAC at /zac/ plus the APIs). The proxy
# refuses every write, answers the dashboard's admin-only summary itself
# and logs in as zac-readonly (admin_readonly) for anyone Authelia let
# through. A script the proxy adds to ZAC's page does that login before
# ZAC starts, so after the Authelia login ZAC opens on the dashboard.
services:
  ziti-console:
    build: .
    image: ziti-console-proxy:local
    container_name: ziti-console
    restart: unless-stopped
    # The admin listener and this proxy are on mljr's loopback.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - TZ=${TZ}
      - ZAC_PASSWORD=${ZITI_ZAC_PASSWORD}
      - ZAC_UPSTREAM_SECRET=${ZITI_CONSOLE_UPSTREAM_SECRET}
      - ZAC_LISTEN=127.0.0.1:8446
    volumes:
      - /opt/ziti-controller/data/pki/root/certs/root.cert:/ca/root.cert:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
