services:
  wud:
    image: fmartinou/whats-up-docker:latest
    container_name: ${COMPOSE_PROJECT_NAME:-wud}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - wud-data:/store
    environment:
      # Watch all containers on this host
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "true"
      
      # Notification configuration (using ntfy)
      WUD_TRIGGER_NTFY_URL: ${NTFY_URL:-https://ntfy.mljr.eu}
      WUD_TRIGGER_NTFY_TOPIC: ${NTFY_TOPIC:-docker-updates}
      WUD_TRIGGER_NTFY_PRIORITY: ${NTFY_PRIORITY:-default}
      
      # UI Configuration
      WUD_LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Vienna}
      
      # Auth (optional - can be added if needed)
      # WUD_AUTH_BASIC_USER: ${WUD_USER}
      # WUD_AUTH_BASIC_PASSWORD: ${WUD_PASSWORD}
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wud-data:

networks:
  default:
    driver: bridge
