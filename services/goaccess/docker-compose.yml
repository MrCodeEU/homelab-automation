services:
  # Python converter that reads Caddy JSON logs and converts to GoAccess format
  log-converter:
    image: python:3.11-alpine
    container_name: goaccess-converter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/log/caddy:/logs:ro,z
      - /opt/goaccess:/goaccess:rw
      - /opt/goaccess/caddyLog.py:/app/caddyLog.py:ro
    working_dir: /app
    command: python3 caddyLog.py -i /logs/access.log -t 10 -g /goaccess/access.goaccess.log
  
  # GoAccess reads the converted log file
  goaccess:
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    depends_on:
      - log-converter
    env_file:
      - .env
    ports:
      - "0.0.0.0:7890:7890"
    volumes:
      - /opt/goaccess:/goaccess:ro
      - /opt/goaccess/report:/var/www/goaccess:rw
    command: >
      /goaccess/access.goaccess.log
      --log-format="%d %t %v %h %m %U %H %s %b %^ %R \"%u\""
      --date-format="%Y-%m-%d"
      --time-format="%H:%M:%S"
      -o /var/www/goaccess/index.html
      --real-time-html
      --ws-url=wss://logs.mljr.eu:443/ws
      --port=7890
