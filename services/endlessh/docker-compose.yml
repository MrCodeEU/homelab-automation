services:
  endlessh:
    image: shizunge/endlessh-go:latest
    container_name: endlessh
    restart: unless-stopped
    # Binds the public interface's port 22. Real sshd is scoped off the public
    # interface (see ansible/roles/base sshd ListenAddress task) so this is
    # the only thing answering SSH on the public IP.
    ports:
      - "0.0.0.0:22:2222"
    command: ["-logtostderr", "-v=1"]
    mem_limit: 32m
    cpus: 0.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
