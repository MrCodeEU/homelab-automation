services:
  homepage:
    image: ghcr.io/mrcodeeu/homepage:dev
    container_name: ${COMPOSE_PROJECT_NAME:-homepage-staging}
    restart: unless-stopped
    ports:
      - "18082:8080"  # Staging port (+10000 offset)
    environment:
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CACHE_DIR=/data/cache
    volumes:
      - homepage-data:/data
    networks:
      - homepage

networks:
  homepage:
    driver: bridge

volumes:
  homepage-data:
    driver: local
