services:
  homepage:
    image: ghcr.io/mrcodeeu/homepage:${IMAGE_TAG:-latest}
    container_name: homepage
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CACHE_DIR=/data/cache
    volumes:
      - homepage-data:/data
    networks:
      - homepage

networks:
  homepage:
    driver: bridge

volumes:
  homepage-data:
    driver: local
