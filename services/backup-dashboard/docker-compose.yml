services:
  collector:
    build: .
    image: backup-dashboard-collector:local
    container_name: backup-dashboard-collector
    # One-shot, invoked by a systemd timer via `docker compose run --profile
    # cron --rm collector`. Unlike services/healthreport (a single-service
    # project, where a profile makes `docker compose up -d` fail outright
    # with "no service selected"), this project has a second, unprofiled
    # service (web) that `up -d` selects by default - so collector can use a
    # real profile instead of healthreport's --noop-default-command
    # workaround, and simply never starts at deploy time.
    profiles: ["cron"]
    restart: "no"
    # Reaches VictoriaMetrics on nuc's own interface, plus the Tailscale
    # addresses of nas/mljr/nuc over SSH, with no port plumbing.
    network_mode: host
    env_file:
      - .env
    volumes:
      # Deliberately not /opt/<service>: the services role rsyncs into that
      # path with delete: true, which wipes anything it does not know about
      # - same reasoning as roles/healthreport for /var/lib.
      - /var/lib/backup-dashboard/state:/state
      - /var/lib/backup-dashboard/backup_catalog.json:/catalog/backup_catalog.json:ro
      # Reuses healthreport's own SSH key rather than minting a new one -
      # already forced-command-restricted and authorized on every host via
      # host-facts-endpoint.
      - /var/lib/healthreport/ssh:/ssh:ro
      - backup-dashboard-html:/output
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # Built locally (trivial one-line Dockerfile.web), not a bare `image:`
    # reference - the deploy pipeline skips its image-pull step entirely for
    # any service with build_from_source: true (correct for collector, which
    # really is locally built), so a bare nginx image reference here was
    # never pulled and this container never got created on a real deploy.
    # Building it, even trivially, puts it on the same --build path the
    # pipeline does invoke for this service.
    build:
      context: .
      dockerfile: Dockerfile.web
    image: backup-dashboard-web:local
    container_name: backup-dashboard-web
    restart: unless-stopped
    # Port is hardcoded, not Jinja-templated: docker-compose.yml files in
    # this repo are copied raw by the services role (rsync, no templating -
    # only .env/env.j2 goes through Ansible), so it must match the
    # `port: 8092` set on the "backup-dashboard" entry in
    # ansible/inventory/group_vars/all/all.yml exactly. Internal side is
    # 8080, not 80 - nginx-unprivileged (see Dockerfile.web) listens there
    # since it runs as a non-root user and can't bind a port below 1024.
    ports:
      - "127.0.0.1:8092:8080"
    volumes:
      - backup-dashboard-html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backup-dashboard-html:
