services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      # Loopback only: nas's Ziti router (host network) dials it for the
      # health report on nuc (ollama service, m2m-nuc port 2428), and the
      # post-deploy health check runs on nas against http://localhost:11434.
      - "127.0.0.1:11434:11434"
    environment:
      - TZ=${TZ:-Europe/Vienna}
      # The health report explicitly unloads its model after each run. This is
      # the backstop: if the reporter crashes mid-run, the model still cannot
      # stay resident in NAS RAM.
      - OLLAMA_KEEP_ALIVE=30s
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      # Explicit array path, not a named volume: models are several GB and
      # Unraid users expect them under appdata.
      - /mnt/user/appdata/ollama:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
