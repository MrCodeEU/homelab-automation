services:
  bichon:
    # Pinned deliberately: `:latest` pulled 2.0.0-alpha.1 the day it was
    # published and crash-looped forever ("Legacy data layout detected") on
    # data written by 1.x. 1.6.2 is the current stable release.
    image: rustmailer/bichon:1.6.2
    container_name: bichon
    restart: unless-stopped
    ports:
      - "0.0.0.0:15630:15630"
    environment:
      - BICHON_ROOT_DIR=/data
      - BICHON_ENABLE_ACCESS_TOKEN=true
      - BICHON_LOG_LEVEL=${BICHON_LOG_LEVEL:-info}
    env_file:
      - .env
    volumes:
      - bichon-data:/data
    dns:
      - 8.8.8.8

volumes:
  bichon-data:
    driver: local
