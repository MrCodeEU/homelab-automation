services:
  template:
    image: ghcr.io/mrcodeeu/service-template:dev
    container_name: ${COMPOSE_PROJECT_NAME:-template-staging}
    restart: unless-stopped
    ports:
      - "18181:18181"  # Staging port (+10000 offset)
    environment:
      # Server Configuration
      PORT: ${PORT:-18181}
      DISPLAY_MESSAGE: ${DISPLAY_MESSAGE:-🛠️ Development/Staging Environment - Testing in Progress}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      VERSION: ${VERSION:-1.0.0-dev}

      # Timezone
      TZ: ${TZ:-Europe/Vienna}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
