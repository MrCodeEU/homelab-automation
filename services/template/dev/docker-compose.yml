services:
  template:
    image: ghcr.io/mrcodeu/service-template:dev
    container_name: ${COMPOSE_PROJECT_NAME:-template-staging}
    restart: unless-stopped
    environment:
      # Server Configuration
      PORT: ${PORT:-18181}
      DISPLAY_MESSAGE: ${DISPLAY_MESSAGE:-🛠️ Development/Staging Environment - Testing in Progress}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      VERSION: ${VERSION:-1.0.0-dev}
      
      # Timezone
      TZ: ${TZ:-Europe/Vienna}

    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: ${NETWORK_NAME:-caddy}
