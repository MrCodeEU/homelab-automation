services:
  homey-shs:
    image: ghcr.io/athombv/homey-shs:latest
    container_name: ${COMPOSE_PROJECT_NAME:-homey-shs}
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ:-Europe/Vienna}
      # Optional environment variables for Homey
      # PORT_SERVER_HTTP: 4859 (default)
      # PORT_SERVER_HTTPS: 4860 (default)
      # PORT_SERVER_BRIDGE_V1: 4861 (default)
      # PORT_SERVER_BRIDGE_V2: 4862 (default)
      # HOMEY_LOCAL_ADDRESS: null (auto-detect)
    volumes:
      - homey-data:/homey/user
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homey-data:
    driver: local
