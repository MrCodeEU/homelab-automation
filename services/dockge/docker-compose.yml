services:
  dockge:
    image: louislam/dockge:1
    container_name: ${COMPOSE_PROJECT_NAME:-dockge}
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge-data:/app/data
      # Mount the directory where your docker-compose files are stored
      - /opt:/opt
    environment:
      # Optional: Change the data directory
      DOCKGE_STACKS_DIR: /opt
      TZ: ${TZ:-Europe/Vienna}
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dockge-data:

networks:
  default:
    driver: bridge
