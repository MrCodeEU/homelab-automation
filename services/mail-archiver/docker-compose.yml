services:
  mail-archiver:
    image: s1t5/mailarchiver:latest
    container_name: ${COMPOSE_PROJECT_NAME:-mail-archiver}-app
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5000:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=MailArchiver;Username=mailuser;Password=${MAILARCHIVER_DB_PASSWORD}"
      Authentication__Username: ${MAILARCHIVER_ADMIN_USER}
      Authentication__Password: ${MAILARCHIVER_ADMIN_PASSWORD}
      TimeZone__DisplayTimeZoneId: ${TZ:-Europe/Vienna}
      LocalImport__AllowedPaths__0: /data/import
    volumes:
      - mail-archiver-dp-keys:/app/DataProtection-Keys
      - mail-archiver-logs:/app/logs
      # Zipped snapshots of TutaBridge's .eml export (see
      # ansible/roles/tutabridge-cli), read-only - mail-archiver's
      # --import-eml only reads from here, never writes.
      - /data/tuta-import:/data/import/tuta:ro
      # One-time MBox import of the two legacy mail exports found in
      # nas's raid-backup (2026-08-17) - not an ongoing sync like tuta,
      # just needs to be reachable for the Local Import UI. Left in
      # place afterward (harmless) rather than removed, matching the
      # tuta mount's always-present pattern.
      - /opt/mail-archiver-legacy-import:/data/import/legacy:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mail-archiver-internal

  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mail-archiver}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: MailArchiver
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: ${MAILARCHIVER_DB_PASSWORD}
    volumes:
      - mail-archiver-pgdata-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailuser -d MailArchiver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mail-archiver-internal

networks:
  mail-archiver-internal:
    driver: bridge

volumes:
  mail-archiver-pgdata-v18:
    driver: local
  mail-archiver-dp-keys:
    driver: local
  mail-archiver-logs:
    driver: local
