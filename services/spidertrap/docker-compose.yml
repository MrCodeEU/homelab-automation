services:
  spidertrap:
    # network: host - mljr's default-bridge build containers inherit the host's
    # MagicDNS resolver (100.100.100.100), which is unreachable from the
    # bridge, so `apk add` inside the build failed with "DNS: transient error"
    # (found 2026-10-30; same cause as the trivy DNS failures on mljr).
    build:
      context: .
      network: host
    image: local/spidertrap:latest
    container_name: spidertrap
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8080"
    command:
      - "--min-links=8"
      - "--max-links=20"
      - "--min-length=4"
      - "--max-length=24"
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
