services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: ${COMPOSE_PROJECT_NAME:-oauth2-proxy}
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --provider-display-name=Homelab SSO
      - --oidc-issuer-url=https://${KEYCLOAK_HOSTNAME:-auth.mljr.eu}/realms/${KEYCLOAK_REALM:-homelab}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-domain=.${DOMAIN:-mljr.eu}
      - --cookie-samesite=lax
      - --whitelist-domain=.${DOMAIN:-mljr.eu}
      - --email-domain=*
      - --upstream=static://202
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --pass-user-headers=true
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --cookie-refresh=1h
      - --cookie-expire=24h
    ports:
      - "4180:4180"
    environment:
      TZ: ${TZ:-Europe/Vienna}
    extra_hosts:
      - "${KEYCLOAK_HOSTNAME:-auth.mljr.eu}:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4180/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
