# ntfy server configuration
# Documentation: https://docs.ntfy.sh/config/

# Public facing base URL of the service
base-url: "https://ntfy.mljr.eu"

# Listen address for the web server
listen-http: ":80"

# Cache settings for message persistence
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "12h"

# Attachment settings
attachment-cache-dir: "/var/cache/ntfy/attachments"
attachment-total-size-limit: "5G"
attachment-file-size-limit: "15M"
attachment-expiry-duration: "3h"

# Keepalive interval for long-polling
keepalive-interval: "45s"

# Enable web app
enable-web: true

# Visitor limits (adjust as needed)
visitor-subscription-limit: 100
visitor-request-limit-burst: 60
visitor-request-limit-replenish: "5s"
visitor-message-daily-limit: 0

# Behind proxy configuration (since we're using Caddy)
behind-proxy: true

# Log level (info, debug, warn, error)
log-level: "info"

# Access control: deny everything by default, then hooks/post-deploy.sh
# grants `everyone <topic> read-write` per topic in ntfy_topic_whitelist
# (openvox/data/common.yaml) via `ntfy access`. Closes the server to
# arbitrary internet clients using it as a free relay for their own topics
# - the actual concern this was built for, not message confidentiality.
# auth.db lives on the existing ntfy-data volume, survives restarts.
# New topic workflow: add the name to ntfy_topic_whitelist, deploy - the
# hook re-grants idempotently on every apply.
auth-file: "/var/lib/ntfy/auth.db"
auth-default-access: "deny-all"
