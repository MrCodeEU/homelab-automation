# Grafana alerting as code: OpenZiti overlay (docs/ZERO_TRUST_PLAN.md C11).
# Metrics: mljr's Alloy scrapes the controller's /metrics (job
# ziti-controller), which also carries every router's reported metrics
# (source_id = router id). Events: mljr's Alloy tails the controller's
# events.log into Loki (job ziti-events, label namespace).
#
# Notifications go to ntfy topic homelab-security; ntfy's built-in grafana
# template formats Grafana's webhook payload. Grafana had no alerting set up
# before this file, so the notification policy tree below is the whole tree.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy-homelab-security
    receivers:
      - uid: ntfy-homelab-security
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://ntfy.mljr.eu/homelab-security?template=grafana
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ntfy-homelab-security
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

groups:
  - orgId: 1
    name: ziti
    folder: Zero trust
    interval: 1m
    rules:
      # Controller down, or its metrics no longer reach VictoriaMetrics.
      - uid: ziti-controller-down
        title: Ziti controller down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(up{job="ziti-controller"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: OpenZiti controller on mljr is down or not scraped.
          description: >-
            Check `docker logs ziti-controller` on mljr and Alloy's
            prometheus.scrape "ziti". Routers keep existing circuits but no
            new sessions or enrolments work.
        labels:
          severity: critical

      # A router's reported metrics disappear while it is disconnected from
      # the controller. Routers are listed by id (stable across
      # --reenroll; a recreated router gets a new id, update it here):
      # "seen in the last 24 h" also caught every deleted test router.
      # Only while the controller itself is scraped, so a dead controller
      # raises one alert, not three.
      - uid: ziti-router-offline
        title: Ziti router offline
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                (
                  label_replace(vector(1) unless on() group(ziti_edge_connections{source_id="TxITxNDzp"}),
                    "router", "mljr.int.mljr.eu", "", "")
                  or
                  label_replace(vector(1) unless on() group(ziti_edge_connections{source_id="9UoZxNDzp"}),
                    "router", "nuc.int.mljr.eu", "", "")
                )
                and on() (max(up{job="ziti-controller"}) == 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Ziti router {{ $labels.router }} is offline.'
          description: >-
            {{ $labels.router }} stopped reporting to the controller. Check
            `docker logs` of its ziti-router container. Services it hosts
            are unreachable over Ziti.
        labels:
          severity: critical

      # The nuc -> mljr link (nuc dials, mljr listens on 8442) while both
      # routers stay up, e.g. 8442 blocked or the home uplink dropping TCP
      # while the control channel (8441) survives. Its metrics vanish when
      # the link closes. Same id pinning and controller guard as above.
      - uid: ziti-link-down
        title: Ziti link down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                label_replace(
                  vector(1) unless on() group(ziti_link_tx_msgrate{sourceRouterId="9UoZxNDzp",targetRouterId="TxITxNDzp"}),
                  "link", "nuc.int.mljr.eu -> mljr.int.mljr.eu", "", "")
                and on() (max(up{job="ziti-controller"}) == 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Ziti link {{ $labels.link }} is down.'
          description: >-
            No link between the home router and mljr: services hosted at
            home are unreachable from mljr over Ziti. Check
            `ziti fabric list links` and nuc's router log.
        labels:
          severity: critical

      # New identities (including a new router's) and completed enrolments
      # (an authenticator is created when an identity enrols).
      - uid: ziti-identity-change
        title: Ziti identity created or enrolled
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              expr: >-
                sum by (entityType) (count_over_time({job="ziti-events", namespace="entityChange"}
                | json eventType="eventType", entityType="entityType"
                | eventType="created" | entityType=~"identities|authenticators" [5m]))
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'New Ziti {{ $labels.entityType }} created.'
          description: >-
            Expected only when you run an enrolment script. Details in Loki:
            {job="ziti-events", namespace="entityChange"} | json.
        labels:
          severity: warning

      # Failed logins (password or certificate) against the controller.
      - uid: ziti-auth-failures
        title: Ziti authentication failures
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              expr: >-
                sum(count_over_time({job="ziti-events", namespace="authentication"}
                | json event_type="event_type" | event_type="fail" [15m]))
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $values.A }} failed Ziti logins in 15 minutes.'
          description: >-
            Reason and remote address in Loki:
            {job="ziti-events", namespace="authentication"} | json | event_type="fail".
        labels:
          severity: warning

      # Circuits the fabric refused or could not build: no terminator, router
      # not allowed for the session, hosting service down.
      - uid: ziti-circuit-failures
        title: Ziti circuit failures
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              expr: >-
                sum(count_over_time({job="ziti-events", namespace="circuit"}
                | json event_type="event_type" | event_type="failed" [10m]))
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $values.A }} failed Ziti circuits in 10 minutes.'
          description: >-
            failure_cause and service_id in Loki:
            {job="ziti-events", namespace="circuit"} | json | event_type="failed".
        labels:
          severity: warning
