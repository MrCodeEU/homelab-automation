# Grafana alerting as code: OpenZiti overlay (docs/ZERO_TRUST_PLAN.md C11).
# Metrics: mljr's Alloy scrapes the controller's /metrics (job
# ziti-controller), which also carries every router's reported metrics
# (source_id = router id). Events: mljr's Alloy tails the controller's
# events.log into Loki (job ziti-events, label namespace).
#
# Notifications go to ntfy topic homelab-security. The URL carries an ntfy
# message template (title + one summary line per alert) instead of ntfy's
# built-in grafana template, which dumped labels and query values. Grafana
# had no alerting set up before this file, so the notification policy tree
# below is the whole tree.
#
# Only alerts that must work while the controller is down live here.
# Enrolments, configuration changes, failed logins and failing services come
# from tools/cmd/ziti-notify (roles::ziti_notify), which reads the event log
# and names identities and services.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy-homelab-security
    receivers:
      - uid: ntfy-homelab-security
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://ntfy.mljr.eu/homelab-security?template=yes&title=%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20ne%20.status%20%22firing%22%7D%7D%3A%20resolved%7B%7Bend%7D%7D&message=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20ne%20.status%20%22firing%22%7D%7DWas%3A%20%7B%7Bend%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7Bend%7D%7D
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ntfy-homelab-security
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

# Rules removed from this file stay in Grafana until listed here (moved to
# ziti-notify, 2026-11-17). Deleting an absent uid is a no-op.
deleteRules:
  - orgId: 1
    uid: ziti-identity-change
  - orgId: 1
    uid: ziti-auth-failures
  - orgId: 1
    uid: ziti-circuit-failures

groups:
  - orgId: 1
    name: ziti
    folder: Zero trust
    interval: 1m
    rules:
      # Controller down, or its metrics no longer reach VictoriaMetrics.
      - uid: ziti-controller-down
        title: Ziti controller down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(up{job="ziti-controller"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: OpenZiti controller on mljr is down or not scraped.
          description: >-
            Check `docker logs ziti-controller` on mljr and Alloy's
            prometheus.scrape "ziti". Routers keep existing circuits but no
            new sessions or enrolments work.
        labels:
          severity: critical

      # A router's reported metrics disappear while it is disconnected from
      # the controller. Routers are listed by id (stable across
      # --reenroll; a recreated router gets a new id, update it here):
      # "seen in the last 24 h" also caught every deleted test router.
      # Only while the controller itself is scraped, so a dead controller
      # raises one alert, not three.
      - uid: ziti-router-offline
        title: Ziti router offline
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                (
                  label_replace(vector(1) unless on() group(ziti_edge_connections{source_id="TxITxNDzp"}),
                    "router", "mljr.int.mljr.eu", "", "")
                  or
                  label_replace(vector(1) unless on() group(ziti_edge_connections{source_id="9UoZxNDzp"}),
                    "router", "nuc.int.mljr.eu", "", "")
                  or
                  label_replace(vector(1) unless on() group(ziti_edge_connections{source_id="6mzqty60F"}),
                    "router", "ugreen.int.mljr.eu", "", "")
                )
                and on() (max(up{job="ziti-controller"}) == 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Ziti router {{ $labels.router }} is offline.'
          description: >-
            {{ $labels.router }} stopped reporting to the controller. Check
            `docker logs` of its ziti-router container. Services it hosts
            are unreachable over Ziti.
        labels:
          severity: critical

      # The home routers' links to mljr (they dial, mljr listens on 8442) while both
      # routers stay up, e.g. 8442 blocked or the home uplink dropping TCP
      # while the control channel (8441) survives. Its metrics vanish when
      # the link closes. Same id pinning and controller guard as above.
      - uid: ziti-link-down
        title: Ziti link down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: >-
                (
                  label_replace(
                    vector(1) unless on() group(ziti_link_tx_msgrate{sourceRouterId="9UoZxNDzp",targetRouterId="TxITxNDzp"}),
                    "link", "nuc.int.mljr.eu -> mljr.int.mljr.eu", "", "")
                  or
                  label_replace(
                    vector(1) unless on() group(ziti_link_tx_msgrate{sourceRouterId="6mzqty60F",targetRouterId="TxITxNDzp"}),
                    "link", "ugreen.int.mljr.eu -> mljr.int.mljr.eu", "", "")
                )
                and on() (max(up{job="ziti-controller"}) == 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Ziti link {{ $labels.link }} is down.'
          description: >-
            No link between the home router and mljr: services hosted at
            home are unreachable from mljr over Ziti. Check
            `ziti fabric list links` and nuc's router log.
        labels:
          severity: critical
