apiVersion: 1

prune: true

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # VictoriaMetrics is PromQL-compatible; keeping name/uid "prometheus" so
  # existing dashboards keep working unchanged.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # dmarc-monitor's Postgres lives in its own compose project on nuc, not
  # this one, so it can't be reached by container name like victoriametrics/
  # loki above - reached over Tailscale via its published port instead, same
  # cross-project pattern healthreport already uses for its VictoriaMetrics
  # queries (HEALTHREPORT_VM_URL).
  - name: DMARC Postgres
    uid: dmarc-postgres
    type: postgres
    access: proxy
    url: 100.100.10.1:5432
    user: parsedmarc
    secureJsonData:
      # Grafana's own provisioning-file expansion syntax is $__env{VAR},
      # not shell-style ${VAR} - docker-compose only substitutes vars in
      # the compose YAML itself, never in files it mounts, so ${VAR} here
      # was being sent to Postgres as the literal password (confirmed
      # live 2026-09-08: dashboard panels all "No data", grafana still
      # had the unexpanded string in its mounted copy of this file).
      password: $__env{DMARC_POSTGRES_PASSWORD}
    jsonData:
      # Grafana 13 dropped the legacy top-level `database:` field for the
      # Postgres provider - it now requires the database name here, in
      # jsonData, or every panel fails with "You do not currently have a
      # default database configured for this data source" even though
      # the connection itself (auth, host, port) is fine (confirmed live
      # 2026-09-08: every panel query worked fine through Grafana's own
      # /api/ds/query when called directly, only the dashboard UI failed).
      database: parsedmarc
      sslmode: disable
      postgresVersion: 1600
    editable: true
