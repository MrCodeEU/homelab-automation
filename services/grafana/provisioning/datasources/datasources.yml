apiVersion: 1

prune: true

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # VictoriaMetrics is PromQL-compatible; keeping name/uid "prometheus" so
  # existing dashboards keep working unchanged.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
