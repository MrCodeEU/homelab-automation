auth_enabled: false

server:
  http_listen_port: 3100
  # The querier hands results to the query frontend over gRPC, 4 MiB by
  # default. healthreport's 5000-line error sample is larger when lines are
  # long (ziti-controller JSON during the 2026-11-22 nuc router outage):
  # the frontend never got an answer and the query hit its 60s timeout.
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 30d
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
