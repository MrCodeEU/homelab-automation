# OpenZiti controller config. Static, not generated by the image bootstrap
# (ZITI_BOOTSTRAP_CONFIG=false in docker-compose.yml).
# Port 8441 (public, firewalld): router control channel, client API, OIDC.
# Port 8440 (loopback only): management + fabric API, health checks and
# metrics. Reach it with `ssh -L 8440:127.0.0.1:8440 root@mljr.tail33930.ts.net`, then
# `ziti edge login localhost:8440 -u admin` (localhost is a SAN of the server
# cert). Password: `scripts/eyaml-get.sh mljr vault_ziti_admin_password`.
# The CLI logs in via OIDC, so the admin listener needs edge-oidc too.
#
# Trust domain (spiffe://ziti.mljr.eu) comes from the intermediate CA's URI
# SAN; it must never change, enrolled identities depend on it.
v: 3

cluster:
  dataDir: /ziti-controller/raft

identity:
  cert:        /ziti-controller/pki/intermediate/certs/client.chain.pem
  server_cert: /ziti-controller/pki/intermediate/certs/server.chain.pem
  key:         /ziti-controller/pki/intermediate/keys/server.key
  ca:          /ziti-controller/pki/root/certs/root.cert

ctrl:
  options:
    advertiseAddress: tls:ctrl.ziti.mljr.eu:8441
  listener: tls:0.0.0.0:8441

healthChecks:
  boltCheck:
    interval: 30s
    timeout: 20s
    initialDelay: 30s

edge:
  api:
    sessionTimeout: 30m
    address: ctrl.ziti.mljr.eu:8441
  enrollment:
    signingCert:
      cert: /ziti-controller/pki/intermediate/certs/intermediate.cert
      key:  /ziti-controller/pki/intermediate/keys/intermediate.key
    edgeIdentity:
      duration: 180m
    edgeRouter:
      duration: 180m

web:
  - name: client
    bindPoints:
      - interface: 0.0.0.0:8441
        address: ctrl.ziti.mljr.eu:8441
    options: &web_options
      idleTimeout: 5000ms
      readTimeout: 5000ms
      writeTimeout: 100000ms
      minTLSVersion: TLS1.2
      maxTLSVersion: TLS1.3
    apis:
      - binding: edge-client
      - binding: edge-oidc

  - name: admin
    bindPoints:
      - interface: 127.0.0.1:8440
        address: localhost:8440
    options: *web_options
    apis:
      - binding: edge-management
      - binding: fabric
      - binding: health-checks
      - binding: edge-oidc
      # Prometheus /metrics, controller plus the metrics every router
      # reports (source_id = router id). Unauthenticated without a
      # scrapeCert, which is why it stays on this loopback listener; mljr's
      # Alloy scrapes it (C11).
      - binding: metrics

# Event stream for alerts (C11): mljr's Alloy tails it into Loki (job
# ziti-events). Rotated by the controller itself.
events:
  jsonLogger:
    subscriptions:
      - type: entityChange
      - type: authentication
      - type: router
      - type: circuit
      - type: sdk
    handler:
      type: file
      format: json
      path: /ziti-controller/events.log
      maxsizemb: 10
      maxbackups: 3
