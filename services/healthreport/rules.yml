---
# Severity rules for the homelab health report.
#
# Severity is decided HERE, deterministically, before the LLM is ever called.
# The model groups and explains; it never decides whether something is a
# problem. Thresholds are config so they can be tuned against real data
# without touching code.
#
# Each entry maps an observation `kind` to a rule. Supported rule types:
#
#   threshold  - numeric. `crit`/`warn` are compared with `direction`
#                (above|below). Missing level means that level never fires.
#   equals     - `crit_values`/`warn_values` list; compares str(value).
#   not_equals - inverse: any value NOT in `ok_values` escalates.
#   truthy     - a truthy value escalates to `level`.
#   falsy      - a falsy value escalates to `level`.
#   present    - the observation existing at all escalates to `level`.
#   new_only   - `present`, but only when the diff marks it new. Used for
#                things that are normal in steady state and only interesting
#                when they first appear.
#
# `subjects` optionally limits a rule to specific hosts.

rules:
  # --- capacity ------------------------------------------------------------
  disk_usage:
    type: threshold
    direction: above
    warn: 85
    crit: 90

  disk_fill_projection:
    type: present
    level: crit

  memory_usage:
    type: threshold
    direction: above
    warn: 90

  load_per_core:
    type: threshold
    direction: above
    warn: 2.0

  cpu_steal:
    type: threshold
    direction: above
    warn: 10

  docker_image_usage:
    type: threshold
    direction: above
    warn: 80
    crit: 90

  # --- availability --------------------------------------------------------
  monitor_status:
    type: equals
    crit_values: ["down"]
    # "pending" is Kuma mid-retry, not yet a confirmed outage.
    warn_values: ["pending"]

  cert_expiry:
    type: threshold
    direction: below
    warn: 21
    crit: 7

  metrics_missing:
    type: present
    level: crit

  metrics_stale:
    type: threshold
    direction: above
    # Alloy scrapes every 15s; two hours of silence means the agent is gone.
    warn: 900
    crit: 7200

  container_missing:
    type: present
    level: crit

  container_new:
    type: present
    level: info

  container_restarts:
    type: threshold
    direction: above
    warn: 3
    crit: 10

  container_oom:
    type: present
    level: crit

  recent_reboot:
    type: threshold
    direction: below
    # Under an hour of uptime on a run means the host rebooted overnight.
    warn: 3600

  systemd_failed:
    type: present
    level: crit

  # --- backups -------------------------------------------------------------
  backup_age:
    type: threshold
    direction: above
    warn: 30
    crit: 36

  backup_failures:
    type: threshold
    direction: above
    crit: 0

  backup_service_failed:
    type: present
    level: warn

  backup_incomplete:
    type: present
    level: crit

  backup_missing:
    type: present
    level: crit

  # --- security ------------------------------------------------------------
  security_updates:
    type: threshold
    direction: above
    # Pending advisories are normal between patch windows; the diff surfaces
    # growth, and the count only escalates when it gets genuinely stale.
    warn: 1

  crowdsec_absent:
    type: present
    level: crit
    subjects: [mljr]

  crowdsec_bouncer:
    type: falsy
    level: crit

  crowdsec_decisions:
    type: threshold
    direction: above
    # Informational: a spike is interesting, a baseline is not.
    warn: 500

  auth_failures:
    type: threshold
    direction: above
    warn: 100

  firewall_rules:
    type: threshold
    direction: below
    # A collapsed ruleset means the bouncer stopped enforcing.
    crit: 1

  # --- storage health (Unraid) --------------------------------------------
  array_state:
    type: not_equals
    ok_values: ["STARTED"]
    level: crit

  parity_sync_errors:
    type: threshold
    direction: above
    crit: 0

  parity_check_age:
    type: threshold
    direction: above
    warn: 35

  array_disk:
    type: equals
    crit_values: ["DISK_INVALID", "DISK_DSBL", "DISK_NP", "DISK_DSBL_NP"]

  smart_health:
    type: falsy
    level: crit

  disk_temperature:
    type: threshold
    direction: above
    warn: 45
    crit: 55

  reallocated_sectors:
    type: threshold
    direction: above
    warn: 0

  pending_sectors:
    type: threshold
    direction: above
    crit: 0

  unraid_notification:
    type: equals
    crit_values: ["alert"]
    warn_values: ["warning"]

  # --- logs ----------------------------------------------------------------
  log_signature:
    # Steady-state error noise is not news. A signature never seen before is.
    type: new_only
    level: warn

  log_error_rate:
    type: threshold
    direction: above
    warn: 500

  caddy_5xx:
    type: threshold
    direction: above
    warn: 50

  # --- pipeline ------------------------------------------------------------
  facts_unreachable:
    type: present
    level: crit

  facts_section_failed:
    type: present
    level: warn

  collector_failed:
    type: present
    level: warn

  image_updates:
    type: threshold
    direction: above
    warn: 1000   # effectively informational

  # --- GitHub --------------------------------------------------------------
  workflow_failed:
    type: present
    level: warn

  workflow_failed_default_branch:
    type: present
    level: crit

  dependabot_alert:
    type: equals
    crit_values: ["critical"]
    warn_values: ["high", "medium"]

  code_scanning_alert:
    type: equals
    crit_values: ["critical"]
    warn_values: ["high"]

  github_token_expiry:
    type: threshold
    direction: below
    warn: 14
    crit: 3
