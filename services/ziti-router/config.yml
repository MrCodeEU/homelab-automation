# OpenZiti public edge router on mljr (docs/ZERO_TRUST_PLAN.md Phase 3).
# Static config, not generated by the image bootstrap.
#
# 8442 (public, firewalld) carries both the edge listener (clients) and the
# link listener (nuc's router dials in), the router multiplexes them. The
# tunnel binding (host mode) lets this router host services itself.
v: 3

identity:
  cert:        /ziti-router/mljr.cert
  server_cert: /ziti-router/mljr.server.chain.cert
  key:         /ziti-router/mljr.key
  ca:          /ziti-router/mljr.cas

ctrl:
  endpoint:      tls:ctrl.ziti.mljr.eu:8441
  endpointsFile: /ziti-router/endpoints.yml

# Link and edge listeners share 8442 (the router multiplexes them).
link:
  dialers:
    - binding: transport
  listeners:
    - binding:   transport
      bind:      tls:0.0.0.0:8442
      advertise: tls:router.ziti.mljr.eu:8442
      options:
        outQueueSize: 4

listeners:
  - binding: edge
    address: tls:0.0.0.0:8442
    options:
      advertise: router.ziti.mljr.eu:8442
      connectTimeoutMs: 5000
      getSessionTimeout: 60
  - binding: tunnel
    options:
      mode: host

edge:
  csr:
    organization: homelab
    sans:
      dns:
        - localhost
        - router.ziti.mljr.eu
      ip:
        - "127.0.0.1"
        - "::1"

forwarder:
  latencyProbeInterval: 0
  xgressDialQueueLength: 1000
  xgressDialWorkerCount: 128
  linkDialQueueLength: 1000
  linkDialWorkerCount: 32

metrics:
  reportInterval: 1m
  messageQueueSize: 10
