services:
  speedtest:
    image: openspeedtest/latest:latest
    container_name: ${COMPOSE_PROJECT_NAME:-speedtest}
    restart: unless-stopped
    ports:
      - "8090:3000"
    environment:
      TZ: ${TZ:-Europe/Vienna}
    networks:
      - speedtest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  speedtest:
    driver: bridge
