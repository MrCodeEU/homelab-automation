services:
  speedtest:
    image: ghcr.io/mrcodeeu/homelab-speedtest:latest
    container_name: ${COMPOSE_PROJECT_NAME:-speedtest}
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - speedtest-data:/app/data
      - ./id_rsa:/app/id_rsa:ro
    environment:
      TZ: ${TZ:-Europe/Vienna}
      SSH_KEY_PATH: /app/id_rsa
      # ntfy notifications
      NTFY_ENABLED: "true"
      NTFY_SERVER: "https://ntfy.mljr.eu"
      NTFY_TOPIC: "speedtest"
      NTFY_TOKEN: ""
      # SMTP notifications (via mailcow)
      SMTP_ENABLED: "true"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM:-speedtest@mljr.eu}"
    networks:
      - speedtest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/devices"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  speedtest:
    driver: bridge

volumes:
  speedtest-data:
    driver: local