services:
  crowdsec-nuc:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec-nuc
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - COLLECTIONS=LePresidente/gitea
      # Agent-only: no local API, no bouncer, no web UI on nuc. Detections
      # push to mljr's LAPI (the actual enforcement point - firewall
      # bouncer runs there) via these agent credentials, registered as
      # machine "nuc" by mljr's own crowdsec post-deploy.sh.
      - DISABLE_LOCAL_API=true
      - LOCAL_API_URL=${CROWDSEC_LOCAL_API_URL}
      - AGENT_USERNAME=${CROWDSEC_AGENT_USERNAME}
      - AGENT_PASSWORD=${CROWDSEC_AGENT_PASSWORD}
    volumes:
      - crowdsec-nuc-config:/etc/crowdsec
      - crowdsec-nuc-data:/var/lib/crowdsec/data
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Read-only, scoped to exactly the container acquis.yaml names
      # (forgejo-app) - same precedent as mljr's crowdsec docker.sock
      # grant for mailcow/authelia.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Ziti client for LOCAL_API_URL: `ziti tunnel proxy` as identity
  # crowdsec-nuc (ziti/tofu/m2m.tf), which may dial mljr's LAPI only.
  # Reachable from this compose network only, no published port.
  # Enrolment: scripts/ziti-enroll-proxy.sh crowdsec-nuc nuc crowdsec-nuc
  # writes ziti/crowdsec-nuc.json (uid 2171, 0600).
  ziti-proxy:
    image: openziti/ziti-router:2.0.8@sha256:540e5450f2ecd72cdc0db94bb7d969814f826e19d3bd4bbde192483c38bb5423
    container_name: crowdsec-nuc-ziti-proxy
    restart: unless-stopped
    user: "2171:2171"
    entrypoint: ["ziti"]
    command:
      - tunnel
      - proxy
      - crowdsec-lapi:8088
      - --identity
      - /identity/crowdsec-nuc.json
    volumes:
      - ./ziti:/identity
    environment:
      - TZ=${TZ}

volumes:
  crowdsec-nuc-config:
    name: crowdsec-nuc-config
  crowdsec-nuc-data:
    name: crowdsec-nuc-data
