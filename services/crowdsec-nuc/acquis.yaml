---
# type: gitea (not type: docker + program:) - crowdsec's docker source
# reads via the Docker Engine API log stream, which is already
# demultiplexed plain text, not the raw json-file {"log":...} wrapper.
# type: docker routes through crowdsecurity/docker-logs.yaml expecting to
# JSON-decode that wrapper, silently breaking on already-plain-text input.
# type: gitea instead hits crowdsecurity/non-syslog's fallback, which
# copies Line.Raw straight into Parsed.message - correct for this source.
# See mljr's services/crowdsec/acquis.yaml for the full writeup (this same
# mistake was made and reverted there first).
source: docker
container_name:
  - forgejo-app
labels:
  type: gitea
