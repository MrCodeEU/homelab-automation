services:
  godrive-demo:
    image: ghcr.io/mrcodeeu/godrive-demo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-godrive-demo}
    restart: unless-stopped
    ports:
      - "3605:8121"
    environment:
      GODRIVE_ADDR: "0.0.0.0:8121"
      GODRIVE_COOKIE_SECURE: "true"
      GODRIVE_HSTS: "true"
      TZ: ${TZ:-Europe/Vienna}
    read_only: true
    tmpfs:
      - /data
      - /appdata
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
