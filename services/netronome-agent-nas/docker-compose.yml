services:
  netronome-agent:
    image: ghcr.io/autobrr/netronome:latest
    container_name: netronome-agent
    restart: unless-stopped
    network_mode: host
    command: ["agent", "--tailscale", "--tailscale-method", "host"]
    environment:
      NETRONOME__AGENT_HOST: 0.0.0.0
      NETRONOME__AGENT_PORT: 8200
      # nas has ~35 interfaces (docker bridges, bond0, unused eth1-3,
      # tunl0, ...) - vnstat's own auto-pick landed on tunl0 (always
      # zero traffic), confirmed live. br0 is nas's real LAN-facing
      # Unraid bridge, mljr/nuc/ugreen don't need this override since
      # they have a single unambiguous primary interface.
      NETRONOME__AGENT_INTERFACE: br0
    dns:
      - 100.100.100.100
    volumes:
      - /var/run/tailscale:/var/run/tailscale:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
