---
services_catalog:
  - name: local-authelia
    enabled: true
    host: mljr
    port: 8080
    domain: local.example.test
    caddy_auth: authelia
    staging: true
  - name: remote-https
    enabled: true
    host: nuc
    port: 8443
    domain: [app.example.test, alt.example.test]
    https_backend: true
  - name: custom-upstream
    enabled: true
    host: nuc
    port: 9000
    domain: custom.example.test
    caddy_extra_config: |
      handle /health {
        reverse_proxy __TARGET_HOST__:__TARGET_PORT__
      }
    upstream: http://custom-backend:9000
  - name: dns-elsewhere
    enabled: true
    host: mljr
    port: 0
    domain: elsewhere.example.test
    caddy_vhost: false
  - name: disabled
    enabled: false
    host: mljr
    port: 9999
    domain: disabled.example.test
  # AppSec opt-in is only rendered when roles::caddy::appsec_enabled is true.
  - name: appsec-log
    enabled: true
    host: nuc
    port: 7001
    domain: log.example.test
    appsec: log
  - name: appsec-block
    enabled: true
    host: nuc
    port: 7002
    domain: block.example.test
    appsec: block
    appsec_exclude_paths: ['/upload/*', '/dav/*']
  # Over Ziti only when roles::caddy::ziti_transport is true; otherwise the
  # usual Tailscale upstream (so the stock-Caddy render test validates it).
  - name: ziti-upstream
    enabled: true
    domain: ziti.example.test
    port: 3001
    host: nuc
    staging: true
    ziti_via_caddy: true
  # Prod next to Caddy on mljr; only the staging vhost goes over Ziti.
  - name: ziti-staging-only
    enabled: true
    domain: zstage.example.test
    port: 3002
    host: mljr
    staging: true
    ziti_staging: true
  # `reverse_proxy catalog:<name>` resolves to that entry's upstream.
  - name: catalog-ref
    enabled: true
    domain: ref.example.test
    port: 3003
    host: mljr
    caddy_extra_config: |
      handle_path /zu* {
          reverse_proxy catalog:ziti-upstream
      }
