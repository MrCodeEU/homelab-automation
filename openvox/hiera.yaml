# Hiera 5 config for host-scoped secret lookups. Every agent resolves only
# its own encrypted file with its own private key. The temporary legacy layer
# below provides rollback while the new hierarchy is validated on all hosts.
version: 5

defaults:
  datadir: data

hierarchy:
  - name: "Per-node data"
    data_hash: yaml_data
    path: "nodes/%{trusted.certname}.yaml"

  - name: "Common data"
    data_hash: yaml_data
    path: "common.yaml"

  - name: "Host eyaml secrets"
    lookup_key: eyaml_lookup_key
    path: "secrets/%{trusted.certname}.eyaml"
    options:
      pkcs7_private_key: "/etc/puppetlabs/puppet/eyaml/hosts/%{trusted.certname}/private_key.pkcs7.pem"
      pkcs7_public_key: "/etc/puppetlabs/puppet/eyaml/hosts/%{trusted.certname}/public_key.pkcs7.pem"
