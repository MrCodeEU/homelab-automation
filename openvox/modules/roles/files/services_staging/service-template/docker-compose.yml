services:
  template:
    image: ghcr.io/mrcodeeu/service-template:dev
    container_name: ${COMPOSE_PROJECT_NAME:-service-template-staging}
    restart: unless-stopped
    ports:
      - "18181:18181"
    environment:
      PORT: ${PORT:-18181}
      DISPLAY_MESSAGE: ${DISPLAY_MESSAGE:-Development staging service running}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      VERSION: ${VERSION:-1.0.0-dev}
      TZ: ${TZ:-Europe/Vienna}
    # The dev image carries a 8080 probe, but this staging service listens on
    # 18181 (see PORT above).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18181/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
