services:
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Public URL behind Caddy + Authelia. Grafana builds alert notification
      # links (ntfy) and redirects from it; unset it says localhost:3000.
      - GF_SERVER_ROOT_URL=https://grafana.mljr.eu/
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
      # Login through Authelia (OIDC client "grafana", authelia_oidc_clients in
      # common.yaml). Auto login: behind Authelia's forward auth there is
      # already a session, so the Grafana login page is skipped. The local
      # admin stays as the fallback: /login?disableAutoLogin=true.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authelia
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:?}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.mljr.eu/api/oidc/authorization
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.mljr.eu/api/oidc/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.mljr.eu/api/oidc/userinfo
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      # Authelia group admins -> Grafana server admin; anyone else is refused
      # (role_attribute_strict) rather than becoming a Viewer.
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'admins') && 'GrafanaAdmin'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_OAUTH_AUTO_LOGIN=true
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.mljr.eu/logout
      # Consumed by provisioning/datasources/datasources.yml's ${DMARC_POSTGRES_PASSWORD}
      # substitution - kept out of the checked-in datasource YAML.
      - DMARC_POSTGRES_PASSWORD=${DMARC_POSTGRES_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics
      - loki

  # VictoriaMetrics replaces Prometheus: accepts the same remote_write
  # (/api/v1/write) and PromQL (/api/v1/query) APIs. Host port 19090 is kept
  # so the Alloy agents' remote-write URL needs no change.
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=10y
      - -selfScrapeInterval=30s
    ports:
      - "19090:8428"
    volumes:
      - victoriametrics-data:/storage

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

volumes:
  grafana-data:
    name: grafana-data
  victoriametrics-data:
    name: victoriametrics-data
  loki-data:
    name: loki-data
