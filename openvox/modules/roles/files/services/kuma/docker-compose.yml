services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim@sha256:4837e2b531b118d2fad24430fabed1488b14542f03b2bebf035497271b3a1ee8
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # BIND_ADDR resolves to the host's Tailscale IP on nuc, so Caddy on mljr
      # still reaches it while the LAN/public interfaces do not.
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
      # Loopback as well: the services role's Kuma health check and monitor
      # provisioning both talk to http://localhost:3001. Binding Tailscale-only
      # silently skipped provisioning. Safe because kuma is pinned to host: nuc,
      # where BIND_ADDR is never 127.0.0.1 (that would be a duplicate bind).
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-sqlite:/app/data
    environment:
      - TZ=${TZ:-Europe/Vienna}
      # 2-slim ships no MariaDB server and no Chromium (about 230 fewer
      # image CVEs); SQLite is plenty for ~55 monitors.
      - UPTIME_KUMA_DB_TYPE=sqlite

  # Checks over Ziti instead of the tailnet (identity kuma-nuc, ziti/tofu
  # m2m.tf): the CrowdSec LAPI on mljr and mljr's inbound SMTP, which nuc's
  # home network cannot reach on port 25. Kuma reaches it by name on the
  # compose network. Only protocol checks go through it (provision-kuma:
  # kumaZitiProxy): the proxy accepts every TCP connection itself.
  kuma-ziti-proxy:
    image: openziti/ziti-router:2.0.8@sha256:540e5450f2ecd72cdc0db94bb7d969814f826e19d3bd4bbde192483c38bb5423
    container_name: kuma-ziti-proxy
    restart: unless-stopped
    user: "2171:2171"
    entrypoint: ["ziti"]
    command:
      - tunnel
      - proxy
      - crowdsec-lapi:8088
      - mail-smtp-mljr:2525
      - --identity
      - /identity/kuma-nuc.json
    volumes:
      - ./ziti:/identity
    environment:
      - TZ=${TZ:-Europe/Vienna}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  # New volume for the SQLite database. The old MariaDB volume
  # (kuma_uptime-kuma-data) is kept until the migration is confirmed.
  uptime-kuma-sqlite:
