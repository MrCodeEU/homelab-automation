services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim@sha256:4837e2b531b118d2fad24430fabed1488b14542f03b2bebf035497271b3a1ee8
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # Loopback (BIND_ADDR): Caddy on mljr reaches it over Ziti (nuc's
      # router dials 127.0.0.1), and the services role's health check and
      # monitor provisioning use http://localhost:3001.
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    volumes:
      - uptime-kuma-sqlite:/app/data
    environment:
      - TZ=${TZ:-Europe/Vienna}
      # 2-slim ships no MariaDB server and no Chromium (about 230 fewer
      # image CVEs); SQLite is plenty for ~55 monitors.
      - UPTIME_KUMA_DB_TYPE=sqlite

  # Checks over Ziti instead of the tailnet (identity kuma-nuc, ziti/tofu
  # m2m.tf): the CrowdSec LAPI on mljr and mljr's inbound SMTP, which nuc's
  # home network cannot reach on port 25. Kuma reaches it by name on the
  # compose network. Only protocol checks go through it (provision-kuma:
  # kumaZitiProxy): the proxy accepts every TCP connection itself.
  kuma-ziti-proxy:
    image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    container_name: kuma-ziti-proxy
    restart: unless-stopped
    user: "2171:2171"
    labels:
      # restarted by roles::ziti_tcp_proxy when the binary changes
      homelab.ziti-tcp-proxy: "true"
    entrypoint: ["/opt/ziti-tcp-proxy/ziti-tcp-proxy"]
    command:
      - -identity
      - /identity/kuma-nuc.json
      - crowdsec-lapi:8088
      - mail-smtp-mljr:2525
      - defectdojo:8101
    volumes:
      - ./ziti:/identity
      - /usr/local/libexec/ziti-tcp-proxy:/opt/ziti-tcp-proxy:ro
    environment:
      - TZ=${TZ:-Europe/Vienna}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  # New volume for the SQLite database. The old MariaDB volume
  # (kuma_uptime-kuma-data) is kept until the migration is confirmed.
  uptime-kuma-sqlite:
