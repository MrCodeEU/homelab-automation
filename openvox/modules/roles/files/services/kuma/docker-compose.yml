services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim@sha256:4837e2b531b118d2fad24430fabed1488b14542f03b2bebf035497271b3a1ee8
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # BIND_ADDR resolves to the host's Tailscale IP on nuc, so Caddy on mljr
      # still reaches it while the LAN/public interfaces do not.
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
      # Loopback as well: the services role's Kuma health check and monitor
      # provisioning both talk to http://localhost:3001. Binding Tailscale-only
      # silently skipped provisioning. Safe because kuma is pinned to host: nuc,
      # where BIND_ADDR is never 127.0.0.1 (that would be a duplicate bind).
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-sqlite:/app/data
    environment:
      - TZ=${TZ:-Europe/Vienna}
      # 2-slim ships no MariaDB server and no Chromium (about 230 fewer
      # image CVEs); SQLite is plenty for ~55 monitors.
      - UPTIME_KUMA_DB_TYPE=sqlite

volumes:
  # New volume for the SQLite database. The old MariaDB volume
  # (kuma_uptime-kuma-data) is kept until the migration is confirmed.
  uptime-kuma-sqlite:
