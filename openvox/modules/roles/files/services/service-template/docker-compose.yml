services:
  template:
    image: ghcr.io/mrcodeeu/service-template:latest
    container_name: ${COMPOSE_PROJECT_NAME:-service-template}
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      PORT: ${PORT:-8181}
      DISPLAY_MESSAGE: ${DISPLAY_MESSAGE:-Production service running}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      VERSION: ${VERSION:-1.0.0}
      TZ: ${TZ:-Europe/Vienna}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
