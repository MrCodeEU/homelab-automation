# Non-secret parsedmarc config. IMAP/Postgres credentials come entirely
# from PARSEDMARC_{SECTION}_{KEY} env vars (see .env, rendered from
# openvox's vault_dmarcmonitor_* secrets) - env vars override config file
# settings, so nothing sensitive needs to live in this checked-in file.
[general]
save_aggregate = True
save_failure = True
save_smtp_tls = False
silent = False
debug = False
offline = False

[imap]
port = 993
ssl = True

[mailbox]
reports_folder = INBOX
archive_folder = Archive
watch = True
delete = False
batch_size = 10
check_timeout = 30

[postgresql]
port = 5432
database = parsedmarc
