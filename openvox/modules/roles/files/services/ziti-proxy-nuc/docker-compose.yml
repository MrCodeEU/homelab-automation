# Ziti client for host processes on nuc that cannot dial Ziti themselves
# (rclone in roles::backup; ssh in healthreport and backup-dashboard, both
# host-network containers): `ziti-tcp-proxy` opens one listener per
# service, published on 127.0.0.1 only, as identity m2m-nuc
# (ziti/tofu/m2m.tf). That identity may dial only the services listed there.
# Apps in their own compose project have their own proxy (speedtest-metrics,
# crowdsec-nuc).
#
# Enrolment: scripts/ziti-enroll-proxy.sh m2m-nuc nuc ziti-proxy-nuc writes
# data/m2m-nuc.json (uid 2171, 0600). Without it the container restarts
# until the file exists.
services:
  ziti-proxy:
    image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    container_name: ziti-proxy-nuc
    restart: unless-stopped
    user: "2171:2171"
    labels:
      # restarted by roles::ziti_tcp_proxy when the binary changes
      homelab.ziti-tcp-proxy: "true"
    entrypoint: ["/opt/ziti-tcp-proxy/ziti-tcp-proxy"]
    command:
      - -identity
      - /identity/m2m-nuc.json
      - backup-sftp-ugreen:2422
      - facts-ssh-mljr:2423
      - facts-ssh-ugreen:2424
      - wd-mycloud-ssh:2425
      - wd-mycloud-exporter:2426
      - nas-ssh:2427
      - ollama:2428
    ports:
      # SFTP to ugreen for roles::backup (2222 is taken on nuc)
      - "127.0.0.1:2422:2422"
      # SSH facts (HEALTHREPORT_SSH_HOSTS, BACKUP_DASHBOARD_SSH_HOSTS)
      - "127.0.0.1:2423:2423"
      - "127.0.0.1:2424:2424"
      - "127.0.0.1:2425:2425"
      - "127.0.0.1:2426:2426"
      # nas: management SSH and the facts endpoint (both keys)
      - "127.0.0.1:2427:2427"
      # healthreport -> ollama on nas
      - "127.0.0.1:2428:2428"
    volumes:
      - ./data:/identity
      - /usr/local/libexec/ziti-tcp-proxy:/opt/ziti-tcp-proxy:ro
    environment:
      - TZ=${TZ}
