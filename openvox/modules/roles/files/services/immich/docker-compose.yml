services:
  immich:
    image: ghcr.io/imagegenius/immich:latest@sha256:44429b30189301d45d05349fc50b394e90163415c6a2e203f191d16047671374
    container_name: immich
    restart: unless-stopped
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-valkey:
        condition: service_healthy
    networks:
      # default: internet for the app (map tiles, ML models); backend:
      # its database and cache, which have no route out.
      - default
      - immich-backend
    ports:
      # immich.mljr.eu reaches it through the nas router (Ziti, 127.0.0.1).
      # The phones use the domain, not a LAN URL.
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      - TZ=${TZ:-Europe/Vienna}
      # From eyaml (vault_immich_db_password) via the generated .env.
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      # The cache has no auth.
      - REDIS_PASSWORD=
      - PUID=99
      - PGID=100
      - UMASK=022
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOSTNAME=immich-postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-valkey
      - REDIS_PORT=6379
      - MACHINE_LEARNING_HOST=0.0.0.0
      - MACHINE_LEARNING_PORT=3003
      - MACHINE_LEARNING_WORKERS=7
      - MACHINE_LEARNING_WORKER_TIMEOUT=120
    devices:
      # Intel iGPU for hardware transcoding.
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/user/appdata/immich/data:/photos
      - /mnt/user/Fotos/Fotos:/libraries
      - /mnt/user/appdata/immich:/config
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  immich-postgres:
    image: ghcr.io/immich-app/postgres:16-vectorchord1.1.1-pgvector0.8.5@sha256:0446995e2b4713ae45d25de7c81c745a63180491018ded84cf13ef4d3c0c5cc9
    container_name: Immich_PostgreSQL
    restart: unless-stopped
    # Internal network only (Phase 7). It ran on the host network until
    # 2026-11-27, which put 5432 on the LAN (192.168.50.80).
    networks:
      - immich-backend
    environment:
      - TZ=${TZ:-Europe/Vienna}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
    volumes:
      # fastpool (SSD), not the array.
      - /mnt/fastpool/appdata/postgresql_immich:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

  immich-valkey:
    image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    container_name: immich-valkey
    restart: unless-stopped
    networks:
      - immich-backend
    command: ["valkey-server", "--maxmemory", "0", "--appendonly", "yes", "--tcp-keepalive", "60"]
    environment:
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      - /mnt/user/appdata/immich-valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"

networks:
  immich-backend:
    internal: true
