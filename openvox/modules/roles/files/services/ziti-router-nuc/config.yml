# OpenZiti private edge router on nuc (docs/ZERO_TRUST_PLAN.md Phase 3).
# Static config, not generated by the image bootstrap.
#
# Control channel to ctrl.ziti.mljr.eu:8441, link dialed to mljr's router.
# The edge listener is LAN-only (192.168.50.0/24 is in the trusted zone), so
# home clients connect here and LAN traffic never goes through mljr (C6).
# On the same LAN port a link listener in group "lan": ugreen's router dials
# it, so nuc <-> ugreen traffic takes the LAN instead of going out to mljr
# and back (measured 2026-11-09: 13-44 Mbit/s that way, 900 direct). Host-mode tunnel binding: this router hosts nuc's
# services itself, no separate tunneler.
v: 3

identity:
  cert:        /ziti-router/nuc.cert
  server_cert: /ziti-router/nuc.server.chain.cert
  key:         /ziti-router/nuc.key
  ca:          /ziti-router/nuc.cas

ctrl:
  endpoint:      tls:ctrl.ziti.mljr.eu:8441
  endpointsFile: /ziti-router/endpoints.yml

# The dialer (group default) dials mljr's router. The listener is in group
# "lan" only: mljr's dialer (default) never tries this LAN address, ugreen's
# (default + lan) does. It shares the edge listener's port, as on mljr.
link:
  dialers:
    - binding: transport
  listeners:
    - binding:   transport
      bind:      tls:192.168.50.30:8442
      advertise: tls:192.168.50.30:8442
      groups:
        - lan

listeners:
  - binding: edge
    address: tls:192.168.50.30:8442
    options:
      advertise: 192.168.50.30:8442
      connectTimeoutMs: 5000
      getSessionTimeout: 60
  - binding: tunnel
    options:
      mode: host

edge:
  csr:
    organization: homelab
    sans:
      dns:
        - localhost
      ip:
        - "127.0.0.1"
        - "::1"
        - "192.168.50.30"

forwarder:
  latencyProbeInterval: 0
  xgressDialQueueLength: 1000
  xgressDialWorkerCount: 128
  linkDialQueueLength: 1000
  linkDialWorkerCount: 32

metrics:
  reportInterval: 1m
  messageQueueSize: 10
