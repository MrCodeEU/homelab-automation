filenames:
  - /var/log/secure
labels:
  type: syslog

---
filenames:
  - /var/log/caddy/*.log
labels:
  type: caddy

---
# netfilter-mailcow (mailcow's own internal fail2ban) never writes to a
# file under /var/log - it only logs bans to its container's stdout. This
# is the only way to see them: docker.sock read access, scoped to exactly
# this one container name.
#
# type: <app-name> (not type: docker + program:) is deliberate - crowdsec's
# docker source reads via the Docker Engine API log stream (dlog.Reader +
# bufio.Scanner in cmd/crowdsec/acquisition/docker), which is already
# demultiplexed plain text, NOT the raw json-file {"log":...,"stream":...}
# wrapper. type: docker routes the line through crowdsecurity/docker-logs.yaml
# expecting to JSON-decode that wrapper - on already-plain-text input this
# silently produces an empty Parsed.message, breaking every downstream s01
# parser. type: mailcow-f2b instead hits crowdsecurity/non-syslog's fallback
# (any type not in [syslog, unifi]), which copies Line.Raw straight into
# Parsed.message - correct for this source. Verified live 2026-09-07 via
# `cscli explain --log "<real plain-text line>" --type docker --labels
# program:authelia` (fails) vs `--type authelia` (succeeds, matching
# LePresidente/authelia-logs' own filter on Parsed.program).
source: docker
container_name:
  - mailcowdockerized-netfilter-mailcow-1
labels:
  type: mailcow-f2b

---
# Authelia logs auth attempts (including failures/brute-force) to stdout
# only - no log_file_path configured, nothing under /var/log to tail.
# See the mailcow block above for why this is type: authelia, not
# type: docker + program: authelia.
source: docker
container_name:
  - authelia
labels:
  type: authelia
