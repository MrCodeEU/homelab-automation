services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    ports:
      # 8080 (LAPI) is intentionally NOT ${BIND_ADDR} - that shared var
      # also drives crowdsec-web-ui's port below, and mljr's other
      # services stay loopback-only by design (Caddy+Authelia is the
      # only gate meant to reach them). The LAPI needs to be tailnet-
      # reachable specifically so remote agents (nuc's forgejo agent,
      # see services/crowdsec-nuc/) can register and push detections -
      # a narrower, deliberate exception, not a blanket exposure.
      # 100.100.20.1 is mljr's own tailscale IP - already a hardcoded
      # non-secret literal elsewhere in this repo (see
      # openvox/data/common.yaml's tailscale_hosts and
      # openvox/data/nodes/mljr.tail33930.ts.net.yaml).
      #
      # 127.0.0.1:8088 is ALSO still required alongside the tailnet one -
      # docker's -p/ports binds only the given IP, it does not also imply
      # loopback. crowdsec-firewall-bouncer-nftables' own config
      # (/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml, outside
      # this repo) talks to api_url: http://127.0.0.1:8088/ - dropping
      # this binding silently breaks the bouncer's LAPI polling. Found
      # live 2026-09-07: right after this port moved to a single
      # tailnet-only mapping, the bouncer stopped pulling new decisions
      # (existing nftables sets stayed enforced, but nothing new was
      # added) until this second binding was restored.
      - "100.100.20.1:8088:8080"
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:6060:6060"
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors Guezli/mailcow LePresidente/authelia
      - BOUNCER_KEY_firewall=${CROWDSEC_FIREWALL_BOUNCER_KEY}
      # NOT extended for the LAPI's new tailnet exposure below:
      # TRUSTED_IPS grants admin API access, which a remote agent must
      # not have - machine username/password auth (scoped, revocable
      # per-host) is the correct mechanism for that, not IP trust.
      - TRUSTED_IPS=127.0.0.1,::1,172.16.0.0/12
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./parsers/s02-enrich/mljr-local-allowlist.yaml:/etc/crowdsec/parsers/s02-enrich/mljr-local-allowlist.yaml:ro
      - /var/log:/var/log:ro
      # Read-only, for the docker-source acquisitions in acquis.yaml below
      # (netfilter-mailcow's F2B bans, Authelia's own auth log) - neither
      # writes to a file under /var/log, both are stdout-only. This is a
      # real privilege grant (docker.sock read access is close to
      # host-root), scoped ro and to exactly the two containers acquis.yaml
      # names, not a blanket "watch everything" configuration.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    container_name: crowdsec-web-ui
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8089:3000"
    environment:
      - CROWDSEC_URL=http://crowdsec:8080
      - CROWDSEC_USER=crowdsec-web-ui
      - CROWDSEC_PASSWORD=${CROWDSEC_WEB_UI_PASSWORD}
      - CROWDSEC_LOOKBACK_PERIOD=168h
      - CONFIG_INSTANCE_METRICS_URL=http://crowdsec:6060/metrics
      - CROWDSEC_REFRESH_INTERVAL=30s
      - CROWDSEC_SIMULATIONS_ENABLED=false
      - NOTIFICATION_SECRET_KEY=${CROWDSEC_WEB_UI_NOTIFICATION_SECRET}
    volumes:
      - crowdsec-web-ui-data:/app/data
    depends_on:
      - crowdsec

volumes:
  crowdsec-config:
    name: crowdsec-config
  crowdsec-data:
    name: crowdsec-data
  crowdsec-web-ui-data:
    name: crowdsec-web-ui-data
