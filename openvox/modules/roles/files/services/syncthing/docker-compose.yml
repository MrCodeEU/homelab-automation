services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest@sha256:92fd6eb29759439225c166a3fc0e6b9500208b8d617a6fd0ae67cc125d1b1b86
    container_name: syncthing
    restart: unless-stopped
    ports:
      # GUI: sync.mljr.eu is proxied to nas:8384 by Caddy (Authelia in front).
      - "8384:8384"
      # Sync protocol and local discovery, used directly by peers on the LAN
      # and over Tailscale.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    environment:
      - TZ=${TZ:-Europe/Vienna}
      - PUID=99
      - PGID=100
      - UMASK=022
    volumes:
      # Device identity (cert.pem/key.pem), config.xml and the index live here;
      # reusing the directory keeps the device ID and all peer pairings.
      - /mnt/user/appdata/syncthing:/config
      - /mnt/user/Sync:/data1
      - /mnt/user/Fotos:/data2
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "2"
