# OpenZiti edge router "drill" on the DR drill VM (docs/DISASTER_RECOVERY.md,
# Phase 5 gate). Same pattern as services/ziti-router-nuc: host networking,
# our own config.yml, ./data as ZITI_HOME. Removed with the drill host.
#
# Enrolment: scripts/ziti-enroll-router.sh drill (round 2 of the drill:
# --reenroll). ZITI_ROUTER_NAME must match the cert file name in config.yml.
services:
  ziti-router-drill:
    image: openziti/ziti-router:2.0.9@sha256:7680cf38b77a4b0302bfa74b9973d9a9afb44a74a48d383a3264a19b8641b73d
    container_name: ziti-router-drill
    restart: unless-stopped
    network_mode: host
    user: "2171:2171"
    command: run config.yml
    volumes:
      - ./data:/ziti-router
      - ./config.yml:/ziti-router/config.yml:ro
    environment:
      - TZ=${TZ}
      - ZITI_BOOTSTRAP_CONFIG=false
      - ZITI_ROUTER_NAME=drill
      - ZITI_ENROLL_TOKEN=/ziti-router/enroll.jwt
