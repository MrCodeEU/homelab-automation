# OpenZiti edge router on the DR drill VM (docs/DISASTER_RECOVERY.md).
# Static config, like services/ziti-router-nuc/config.yml, without the LAN
# link listener: the VM sits behind nuc's libvirt NAT (192.168.122.0/24),
# so it only dials mljr's router. The edge listener is for the VM's own
# m2m proxy (ziti-proxy-drill); no other client can reach that address, and
# the roaming edge-router policy leaves this router out (#drill).
v: 3

identity:
  cert:        /ziti-router/drill.cert
  server_cert: /ziti-router/drill.server.chain.cert
  key:         /ziti-router/drill.key
  ca:          /ziti-router/drill.cas

ctrl:
  endpoint:      tls:ctrl.ziti.mljr.eu:8441
  endpointsFile: /ziti-router/endpoints.yml

link:
  heartbeats:
    sendInterval:             10s
    checkInterval:            1s
    closeUnresponsiveTimeout: 3m
  dialers:
    - binding: transport

listeners:
  - binding: edge
    address: tls:192.168.122.50:8442
    options:
      advertise: 192.168.122.50:8442
      connectTimeoutMs: 5000
      getSessionTimeout: 60
  - binding: tunnel
    options:
      mode: host

edge:
  csr:
    organization: homelab
    sans:
      dns:
        - localhost
      ip:
        - "127.0.0.1"
        - "::1"
        - "192.168.122.50"

forwarder:
  latencyProbeInterval: 0
  xgressDialQueueLength: 1000
  xgressDialWorkerCount: 128
  linkDialQueueLength: 1000
  linkDialWorkerCount: 32

metrics:
  reportInterval: 1m
  messageQueueSize: 10
