# Ugreen on-prem backup target.
# Managed by OpenVox (roles::unraid_backup_proxy, proxy-exec from nuc) - do not edit manually
#
# Deliberately a SEPARATE config file from /root/.config/rclone/rclone.conf,
# which was configured manually (pcloud, wd-cloud remotes) before this repo
# touched the NAS. Keeping this out of that file means nothing here ever has
# to read or merge a hand-edited config.
#
# This connection goes over Tailscale (RunSSH=true on ugreen). See
# ansible/roles/backup-remote-target for why that means ugreen's sshd_config
# and ChrootDirectory are not actually what protects this path - Tailscale
# ACL policy and Unix permissions on the target account are.
[ugreen]
type = sftp
host = 100.100.10.4
user = rclone-backup
key_file = /mnt/user/appdata/homelab/backup-remote/ssh/id_ed25519
shell_type = unix
md5sum_command = none
sha1sum_command = none
