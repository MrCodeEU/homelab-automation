# Ugreen on-prem backup target.
# Managed by OpenVox (roles::unraid_backup_proxy, proxy-exec from nuc) - do not edit manually
#
# Deliberately a SEPARATE config file from /root/.config/rclone/rclone.conf,
# which was configured manually (pcloud, wd-cloud remotes) before this repo
# touched the NAS. Keeping this out of that file means nothing here ever has
# to read or merge a hand-edited config.
#
# Over Ziti (services/ziti-proxy-nas: backup-sftp-ugreen on 127.0.0.1:2422),
# like mljr and nuc (roles::backup): ugreen's real sshd answers, with the
# rclone-backup chroot and the key's from="127.0.0.1" (roles::
# backup_remote_target). Its ed25519 host key is pinned in
# rclone-ugreen-known_hosts (= backup_sftp_ugreen_hostkey in common.yaml).
# host_key_algorithms: Go's SSH client prefers ECDSA otherwise, and rclone
# then reports a mismatch against the pinned ed25519 key.
[ugreen]
type = sftp
host = 127.0.0.1
port = 2422
known_hosts_file = /mnt/user/appdata/homelab/backup-remote/rclone-ugreen-known_hosts
host_key_algorithms = ssh-ed25519
user = rclone-backup
key_file = /mnt/user/appdata/homelab/backup-remote/ssh/id_ed25519
shell_type = unix
md5sum_command = none
sha1sum_command = none
