# Per-host data for role::drill, the DR drill VM on nuc
# (docs/DISASTER_RECOVERY.md). Removed with the drill.
---
# libvirt NAT on nuc; the VM has nothing it should trust.
roles::base::trusted_zone_sources: []

roles::services::hostname: 'drill'

roles::backup::services:
  - drill-data
roles::backup::hostname: 'drill'
# SFTP to ugreen over Ziti: services/ziti-proxy-drill on 127.0.0.1:2422.
roles::backup::ugreen_host: '127.0.0.1'
roles::backup::ugreen_port: 2422

roles::ssh_hardening::disable_passwords: true

# SSH login through Authelia (roles::opkssh), same subject as on nuc.
roles::opkssh::auth_ids:
  - user: root
    identity: '4a76133b-3e28-4917-b53e-5f46367f23bc'
    issuer: 'https://auth.mljr.eu'
roles::base::cockpit_disabled: true
