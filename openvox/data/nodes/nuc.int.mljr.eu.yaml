# Per-host data for role::nuc (see modules/role/manifests/nuc.pp).
# Values here are ported verbatim from the site.pp literal class{} args
# they replaced - zero behavior change, see docs/OPENVOX_BACKLOG.md.
---
# The trusted zone is empty (roles::base default): nuc's LAN
# (192.168.50.0/24) was in it until Phase 7, which opened every host port
# to the whole LAN. The public zone now holds what the LAN needs: ssh and
# the Ziti router (8442, roles::services).
# No container on nuc has to be reachable from outside, so firewalld also
# drops anything Docker DNATs from outside (StrictForwardPorts).
roles::firewalld::strict_forward_ports: true

roles::iperf3::base_path: '/opt'
# Loopback only: the local Ziti router (host network) publishes it
roles::iperf3::bind: '127.0.0.1'


roles::backup::services:
  - kuma
  - forgejo
  - mail-archiver
  - umami
  - grafana
  - nocturne
  - glucava
  - sure
  - defectdojo
roles::backup::hostname: 'nuc'
# SFTP to ugreen over Ziti: services/ziti-proxy-nuc on 127.0.0.1:2422 (the role's
# default address).
roles::backup::verification_integrity_schedule: 'Sun *-*-* 06:30:00'
roles::backup::verification_restore_schedule: 'Sun *-*-01..07 10:30:00'

roles::services::hostname: 'nuc'

# Dockhand (nas) -> Hawser on nuc and mljr over ziti-proxy-nas's docker0
# listeners (roles::dockhand_environments). Names as created in Dockhand.
roles::dockhand_environments::environments:
  'NUC':
    host: '172.17.0.1'
    port: 2376
    token_key: 'vault_hawser_token_nuc'
  'MLJR - VPS':
    host: '172.17.0.1'
    port: 2377
    token_key: 'vault_hawser_token_mljr'
# Login provider "Authelia" in Dockhand (Authelia client "dockhand").
roles::dockhand_environments::oidc_secret_key: 'vault_dockhand_oidc_client_secret'

roles::host_facts_endpoint::os_family: 'rocky'
roles::host_facts_endpoint::hostname: 'nuc'
roles::host_facts_endpoint::dest: '/usr/local/bin/homelab-facts'

roles::grafana_alloy::hostname: 'nuc'

roles::canary_decoys::hostname: 'nuc'

# Docker's default address pools (172.17-172.31.0.0/16, ~30 possible
# per-project networks) ran out live on 2026-09-03: csp-reports' first
# deploy failed with "all predefined address pools have been fully
# subnetted" - nuc runs 56 services deep, most with their own
# Compose-allocated bridge network. base=172.16.0.0/12,size=24 gives 4096
# possible /24 networks instead, well clear of nuc's own LAN
# (192.168.50.0/24) and Tailscale's CGNAT range (100.64.0.0/10). Applying
# this restarts the docker service (via puppetlabs-docker's own systemd
# override management), which briefly stops every running container on
# nuc - scoped to nuc only, not the whole fleet, since mljr/ugreen aren't
# anywhere near this limit yet.
docker::extra_parameters:
  - '--default-address-pool base=172.16.0.0/12,size=24'

# DefectDojo is published on nuc's Tailscale IP only (services/defectdojo).
roles::vuln_scan::dojo_url: 'http://127.0.0.1:8101'
# Remote hosts that push Trivy scans here; each needs
# vault_dojo_import_<name>_password in this file and vault_dojo_import_password
# in its own.
roles::vuln_scan::importers:
  - mljr
  - ugreen
# EPSS + CISA KEV enrichment of the findings (dd-enrich.sh), DefectDojo host only.
roles::vuln_scan::enrich_enabled: true
# Hosts scanned from nuc through their Docker daemon over SSH (Unraid has no
# agent and a tmpfs root, so nothing is installed there). nas-mgmt is the Ziti
# path (roles::nas_mgmt_key).
roles::vuln_scan::remote_docker_scans:
  nas: 'ssh://nas-mgmt'

# Recovery key login tested from the LAN 2026-10-25; password login is now off.
roles::ssh_hardening::disable_passwords: true

# SSH login through Authelia (roles::opkssh, C14): the OIDC sub of the
# Authelia user `admin` (owner's choice 2026-11-07) may log in as root.
roles::opkssh::auth_ids:
  - user: root
    identity: '4a76133b-3e28-4917-b53e-5f46367f23bc'
    issuer: 'https://auth.mljr.eu'
# Cockpit (OS default on *:9090) is unused since nuc-webui was removed
roles::base::cockpit_disabled: true

# Weekly updates + gated reboot (roles::deploy_agent), before mljr's 01:30.
roles::deploy_agent::maintenance_window: 'Sun 01:00 30m'

# Ziti certificate renewal and expiry watch (roles::ziti_renew).
roles::ziti_renew::identities:
  - file: '/opt/kuma/ziti/kuma-nuc.json'
    restart: 'docker restart kuma-ziti-proxy'
  - file: '/opt/crowdsec-nuc/ziti/crowdsec-nuc.json'
    restart: 'docker restart crowdsec-nuc-ziti-proxy'
  - file: '/opt/speedtest-metrics/ziti/speedtest-nuc.json'
    restart: 'docker restart speedtest-metrics-ziti-proxy'
  - file: '/opt/ziti-proxy-nuc/data/m2m-nuc.json'
    restart: 'docker restart ziti-proxy-nuc'
  - file: '/opt/ziti-router-nuc/data/nuc.cert'

# firewalld owns the input side on nuc; roles::lan_firewall only keeps
# containers off the LAN here (HOMELAB-FORWARD in DOCKER-USER).
roles::lan_firewall::input_chain: false
