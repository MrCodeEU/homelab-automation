# Per-host data for role::mljr (see modules/role/manifests/mljr.pp).
# Values here are ported verbatim from the site.pp literal class{} args
# they replaced - zero behavior change, see docs/OPENVOX_BACKLOG.md.
---
roles::base::swap_enabled: true
roles::base::public_ip: '157.173.97.107'
roles::base::ssh_breakglass_port: 2299
roles::base::tailscale_ip: '100.100.20.1'

# Break-glass keys for the public port above. roles::ssh_hardening took
# 00-openvox-hardening.conf over from roles::base and keeps its settings
# (no passwords, root by key only).
roles::ssh_hardening::disable_passwords: true
roles::ssh_hardening::permit_root_login: 'prohibit-password'
roles::base::cockpit_console_enabled: true
roles::base::domain: 'mljr.eu'

# Caddy built by .github/workflows/caddy-build.yml (CrowdSec bouncer + AppSec
# plugins, docs/APPSEC_POC_PLAN.md). The sha256 is the release asset's; a
# mismatch aborts the install. Rollback = remove this key (back to the COPR rpm).
roles::caddy::custom_build:
  tag: 'caddy-v2.11.7-crowdsec-v0.14.1-17a1e5a5'
  sha256: 'c67e050c3fc66ece9c39332ea2f963b8edfa3e44444b0ff38391ffcfd1a7e6c6'
# CrowdSec AppSec (WAF) in Caddy. Vhosts opt in per catalog entry with
# `appsec: log|block`; first wave is log-only (docs/APPSEC_POC_PLAN.md).
# Off switch: set to false (Caddy then drops the block on the next apply).
roles::caddy::appsec_enabled: true
# Catalog entries with ziti_via_caddy are proxied over OpenZiti (needs the
# custom build above and /etc/caddy/ziti/caddy-mljr.json from
# scripts/ziti-enroll-caddy.sh). Off switch: false, back to Tailscale.
roles::caddy::ziti_transport: true

roles::iperf3::base_path: '/opt'

roles::netronome_agent::base_path: '/opt'
roles::netronome_agent::interface: 'eth0'

# Must match ansible/inventory's inventory_hostname exactly, not this
# VPS's real OS hostname - see roles::backup's own $hostname param doc.
roles::backup::services:
  - authelia
  - mailcow
  - ntfy
  - goaccess
  - crowdsec
  - newsletter
  - canarytokens
  - ziti-controller
# Public half of the age key for sensitive_paths (ziti-controller's PKI);
# the private key is only in Bitwarden: "homelab ziti backup age key"
# (docs/ZITI_DR.md).
roles::backup::sensitive_age_recipient: 'age18uzzj6whg55jteq03xf7wxph0swrj4t8lu9qkjwxhqtqra45ffkqukj0z0'
roles::backup::hostname: 'mljr'
# This 4vCPU/7.5GB VPS also runs every service it backs up - the default
# 8/16 pCloud concurrency saturated it enough that Kuma's 48s timeout
# tripped on nearly every container during its own nightly backup
# (2026-08-14). Matches the real, already-live Ansible override exactly.
roles::backup::transfers: 2
roles::backup::checkers: 4
roles::backup::bwlimit: '8M'
roles::backup::cpu_quota: '40%'
roles::backup::verification_integrity_schedule: 'Sun *-*-* 04:30:00'
roles::backup::verification_restore_schedule: 'Sun *-*-01..07 08:30:00'

roles::services::hostname: 'mljr'

roles::hawser_agent::tailscale_ip: '100.100.20.1'

roles::host_facts_endpoint::os_family: 'rocky'
roles::host_facts_endpoint::hostname: 'mljr'
roles::host_facts_endpoint::dest: '/usr/local/bin/homelab-facts'

roles::grafana_alloy::hostname: 'mljr'

roles::canary_decoys::hostname: 'mljr'

# Trivy scan of this VPS (containers + host packages), pushed to the
# DefectDojo on nuc over the tailnet as a least-privilege importer account
# (created on nuc from roles::vuln_scan::importers). The outside-view Nuclei
# scan runs on nuc only.
roles::vuln_scan::dojo_url: 'http://100.100.10.1:8101'
roles::vuln_scan::dojo_user: 'import-mljr'
# The DefectDojo product the importer account is allowed to write to. Not the
# VPS's real hostname (vmi2945702), which is the class default.
roles::vuln_scan::product: 'mljr'
roles::vuln_scan::nuclei_enabled: false
