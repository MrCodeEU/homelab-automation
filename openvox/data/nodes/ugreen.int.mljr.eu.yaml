# Per-host data for role::ugreen (see modules/role/manifests/ugreen.pp).
# Values here are ported verbatim from the site.pp literal class{} args
# they replaced - zero behavior change, see docs/OPENVOX_BACKLOG.md.
# ugreen has no roles::base (UGOS, not dnf-managed) - see role::ugreen.
---
roles::iperf3::base_path: '/volume1/homelab'
# Loopback only: the local Ziti router (host network) publishes it
roles::iperf3::bind: '127.0.0.1'
roles::iperf3::manage_firewall: false

roles::netronome_agent::base_path: '/volume1/homelab'
roles::netronome_agent::manage_firewall: false
roles::netronome_agent::interface: 'eth0'

roles::services::hostname: 'ugreen'
roles::services::base_path: '/volume1/homelab'
roles::services::tailscale_ip: '100.100.10.4'
# Matches ansible/inventory/group_vars/ugreen.yml's cleanup_enabled: false.
roles::services::cleanup_enabled: false

roles::host_facts_endpoint::os_family: 'ugreen'
roles::host_facts_endpoint::hostname: 'ugreen'
roles::host_facts_endpoint::dest: '/volume1/homelab/bin/homelab-facts'
roles::host_facts_endpoint::needs_symlink: true
roles::host_facts_endpoint::dest_dir: '/volume1/homelab/bin'
roles::host_facts_endpoint::base_path: '/volume1/homelab'

roles::grafana_alloy::hostname: 'ugreen'
# To VictoriaMetrics and Loki on nuc over Ziti, through
# services/ziti-proxy-ugreen (127.0.0.1 only). Rollback: drop both lines.
roles::grafana_alloy::prometheus_remote_write_url: 'http://127.0.0.1:19090/api/v1/write'
roles::grafana_alloy::loki_push_url: 'http://127.0.0.1:3100/loki/api/v1/push'
roles::grafana_alloy::docker_root: '/volume1/@docker'

roles::canary_decoys::hostname: 'ugreen'
roles::grafana_alloy::manage_docker_sdk: true

# Trivy scan of this NAS (containers + host packages), pushed to the
# DefectDojo on nuc as the import-ugreen account (created on nuc from
# roles::vuln_scan::importers). Same setup as mljr.
roles::vuln_scan::dojo_url: 'http://100.100.10.1:8101'
roles::vuln_scan::dojo_user: 'import-ugreen'
roles::vuln_scan::product: 'ugreen'
roles::vuln_scan::nuclei_enabled: false

# UGOS: root SSH login stays off and /home is immutable, so the recovery key
# belongs to the admin user, read from /etc/ssh/authorized_keys.d.
roles::ssh_hardening::recovery_user: 'mrcode'
roles::ssh_hardening::disable_passwords: true
