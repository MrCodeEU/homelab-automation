    icon: "mdi:docker"

  - name: hellpot
    enabled: true
    port: 8098
    host: mljr
    description: "HellPot - endless honeypot for robots.txt-ignoring bots"
    icon: "mdi:fire"

  - name: endlessh
    enabled: true
    port: 0
    host: mljr
    description: "Endlessh - SSH tarpit for scanners hitting the public port"
    icon: "mdi:ssh"

  - name: spidertrap
    enabled: true
    port: 8099
    host: mljr
    description: "Spidertrap - infinite link maze for robots.txt-ignoring crawlers"
    icon: "mdi:spider-web"
    build_from_source: true

  - name: homepage
    enabled: true
    domain: "mljr.eu"
    port: 8082
    host: mljr
    staging: true
    # services/homepage/dev/docker-compose.yml exists - Caddy also stages a
    # dev.<domain> vhost pointing at staging_host:<port+10000> for this
    # service. Mirrors ansible/roles/caddy/templates/service_snippet.caddy.j2's
    # `has_dev_folder` fileglob check (a live filesystem lookup at ansible
    # render time) as static catalog data instead, since Puppet's compiler
    # has no equivalent of Ansible's controller-side `lookup('fileglob', ...)`
    # against a path outside anything it manages.
    dev_deploy: true
    description: "Personal Homepage (Go + Templ + HTMX)"
    icon: "mdi:account-circle"
    caddy_extra_config: |
      handle_path /umami* {
          reverse_proxy nuc.tail33930.ts.net:3606
      }

      # robots.txt disallows a handful of decoy paths that no real route on
      # mljr.eu ever uses. Bots that respect it never touch them. Bots that
      # don't get routed straight into HellPot instead of the real backend.
      respond /robots.txt 200 {
          body "User-agent: *
      Disallow: /wp-admin/
      Disallow: /wp-login.php
      Disallow: /xmlrpc.php
      Disallow: /.env
      Disallow: /.git/
      Disallow: /admin-panel/
      Disallow: /archive-2019/
      "
      }

      @hellbait path /wp-admin/* /wp-login.php /xmlrpc.php /.env /.git/* /admin-panel/*
      handle @hellbait {
          reverse_proxy localhost:8098
      }

      # Unlinked path, only exists in robots.txt's Disallow list above. Bots
      # that ignore it fall into an infinite generated link maze.
      handle_path /archive-2019/* {
          reverse_proxy localhost:8099
      }

