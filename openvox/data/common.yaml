# Non-secret common data, looked up via lookup('services_catalog') etc.
# Ported 1:1 from ansible/inventory/group_vars/all/all.yml's `services:`
# catalog (as of 2026-08-22) - the single source of truth every
# catalog-driven role (roles::glance, and eventually roles::caddy and
# roles::services) reads from, so the catalog only needs updating in one
# place instead of once per role's own copy of it.
---
services_catalog:
  - name: authelia
    enabled: true
    domain: "auth.mljr.eu"
    port: 9091
    host: mljr
    description: "Authelia SSO"
